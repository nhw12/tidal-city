<script>
/* 渲染器：每帧把世界画到一张低分辨率的小画布上，再整数倍放大到屏幕。
 * 顺序：海面 → 漂浮物 → 远处的去处（沉船、小岛……）和小船 → 平台工地 → 浮城地面层 → 泡沫 →
 *       建筑和居民（按前后排序）→ 绳和钓线 → 头顶标记和进度条 → 放置虚影和选中框 → 粒子 → 雨 → 光照 →
 *       指针提示和屏幕边上的去处指示 → 输出。
 * 渲染器只读模拟状态，从不改它。 */
(function (TC) {
  'use strict';

  const T = TC.TILE, SUB = TC.SUB, N = TC.GRID, K = T / SUB, FACE = 5;
  const DIRN = ['d', 'u', 'r', 'l'];
  // 屏幕边上指示去处用的小图标
  const MARK = { wreck: 'm_wreck', ruin: 'm_ruins', tower: 'm_tower', islet: 'm_islet', reef: 'm_reef', plant: 'm_works', merchant: 'm_merchant', lighthouse: 'm_lighthouse', camp: 'm_flare', den: 'm_den', boss: 'm_boss', village: 'm_village', fort: 'm_fort' };

  const R = TC.render = {
    canvas: null, ctx: null,     // 屏幕上的画布（物理像素大小）
    buf: null, bctx: null,       // 低分辨率缓冲
    seaX: 0, seaY: 0,            // 海面纹理累计滚动（世界像素）
    prevX: new Map(), prevY: new Map(),   // 上一步的漂浮物位置，用于插值
    reachable: new Set(),        // 当前够得着的漂浮物
    fpos: new Map(),             // 这一帧各漂浮物在缓冲里的位置
    rpos: new Map(),             // 这一帧各居民脚底的世界坐标（点选用）
    hoverId: 0,
    view: { ghosts: [], sel: null, pad: [0, 0, 0, 0] },   // 界面层交给渲染器的东西：放置虚影 [{def,x,y,ok}]、选中 {b:id}、{r:id} 或 {s:id}、界面占掉的四边（CSS 像素：上右下左）
    marks: [],                   // 这一帧画在屏幕边上的去处指示：[{sid, x, y}]（缓冲坐标），点它就把镜头移过去
    wake: 0,
    demo: null,                  // 美术样张里额外摆放的东西
    items: [],
    draws: 0,

    init(canvas) {
      R.canvas = canvas;
      R.ctx = canvas.getContext('2d', { alpha: false });
      R.buf = document.createElement('canvas');
      R.bctx = R.buf.getContext('2d', { alpha: false });
      TC.water.init(R.bctx);
      TC.layers.init();
      TC.light.init();
    },

    /* 画布的物理像素尺寸变了 */
    resize(devW, devH, dpr) {
      if (R.canvas.width !== devW) R.canvas.width = devW;
      if (R.canvas.height !== devH) R.canvas.height = devH;
      TC.cam.setViewport(devW, devH, dpr);
    },

    /* 换了一局：清掉上一局留下的画面状态 */
    reset() {
      R.prevX.clear();
      R.prevY.clear();
      R.reachable.clear();
      R.fpos.clear();
      R.rpos.clear();
      R.hoverId = 0;
      R.view.ghosts = [];
      R.view.sel = null;
      R.marks.length = 0;
      TC.layers.ver = -1;
      TC.fx.parts.length = 0;
      TC.fx.pops.length = 0;
      TC.fx.stamps.length = 0;
      TC.critters.reset();
      TC.fx.shots.length = 0;
    },

    /* 模拟每走一步之前调用：记下漂浮物位置，累计海面滚动 */
    beforeStep(S) {
      R.prevX.clear();
      R.prevY.clear();
      const fs = S.sea.floaters;
      for (let i = 0; i < fs.length; i++) { R.prevX.set(fs[i].id, fs[i].x); R.prevY.set(fs[i].id, fs[i].y); }
      const d = TC.sea.drift(S);
      R.seaX += d[0] * K;
      R.seaY += d[1] * K;
    },

    /* 模拟每走一步之后调用：刷新“够得着”的集合 */
    afterStep(S, C) {
      R.reachable.clear();
      const fs = S.sea.floaters;
      for (let i = 0; i < fs.length; i++) {
        if (!fs[i].claim && !fs[i].tag && TC.sea.inReach(S, fs[i], C)) R.reachable.add(fs[i].id);
      }
    },

    /* 离世界像素 (wx, wy) 最近、且在 radius 像素内的还没人管的漂浮物；优先够得着的 */
    pickFloater(S, wx, wy, radius) {
      let best = null, bd = radius * radius;
      const fs = S.sea.floaters;
      for (let i = 0; i < fs.length; i++) {
        const f = fs[i];
        if (f.claim || f.tag) continue;
        const dx = f.x * K - wx, dy = f.y * K - wy;
        let d = dx * dx + dy * dy;
        if (!R.reachable.has(f.id)) d = d * 1.6 + 16;   // 够不着的排后面
        if (d < bd) { bd = d; best = f; }
      }
      return best;
    },

    /* 世界像素 (wx, wy) 点中的去处（沉船、小岛……）；pad 是放宽的像素 */
    pickSite(S, wx, wy, pad) {
      const ss = TC.voyage.sites(S), A = TC.atlas;
      for (let i = 0; i < ss.length; i++) {
        const s = ss[i], fr = s.kind === 'boss' ? (A.f[R.bossSite(S, s, 0)] || A.f.site_boss_kraken) : A.f[s.kind === 'fort' && s.dead ? 'site_boss_dead' : 'site_' + s.kind];      // Boss 被引出来以后，老窝那儿照样点得中
        if (!fr) continue;
        const cx = s.x * K, by = s.y * K + 4;
        if (wx >= cx - fr.w / 2 - pad && wx <= cx + fr.w / 2 + pad && wy >= by - fr.h - pad && wy <= by + pad) return s;
      }
      return null;
    },

    /* 缓冲坐标 (bx, by) 点中的屏幕边上的去处指示 */
    pickMark(bx, by) {
      for (let i = 0; i < R.marks.length; i++) {
        const m = R.marks[i];
        if (Math.abs(bx - m.x) <= 9 && Math.abs(by - m.y) <= 9) return m;
      }
      return null;
    },

    /* 世界像素 (wx, wy) 点中的居民（按上一帧画出来的位置判断） */
    pickResident(S, wx, wy, pad) {
      let best = null, bd = 1e9;
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i], p = R.rpos.get(r.id);
        if (!p) continue;
        const dx = wx - p[0], dy = wy - (p[1] - 6);
        if (Math.abs(dx) > 5 + pad || Math.abs(dy) > 7 + pad) continue;
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = r; }
      }
      return best;
    },

    line(ctx, x0, y0, x1, y1) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy, n = 0;
      for (;;) {
        ctx.fillRect(x0, y0, 1, 1);
        if ((x0 === x1 && y0 === y1) || n++ > 400) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
    },

    /* 四个角标，围住一个矩形 */
    brackets(ctx, x, y, w, h, color) {
      const x0 = x - 2, y0 = y - 2, x1 = x + w + 1, y1 = y + h + 1;
      ctx.fillStyle = color;
      ctx.fillRect(x0, y0, 3, 1); ctx.fillRect(x0, y0, 1, 3);
      ctx.fillRect(x1 - 2, y0, 3, 1); ctx.fillRect(x1, y0, 1, 3);
      ctx.fillRect(x0, y1, 3, 1); ctx.fillRect(x0, y1 - 2, 1, 3);
      ctx.fillRect(x1 - 2, y1, 3, 1); ctx.fillRect(x1, y1 - 2, 1, 3);
    },

    /* 一个朝下的小箭头，尖端在 (x, y + 3) */
    arrow(ctx, x, y) {
      ctx.fillStyle = '#181425';
      ctx.fillRect(x - 3, y - 1, 7, 3); ctx.fillRect(x - 2, y + 2, 5, 1); ctx.fillRect(x - 1, y + 3, 3, 1);
      ctx.fillStyle = '#feae34';
      ctx.fillRect(x - 2, y, 5, 1); ctx.fillRect(x - 1, y + 1, 3, 1); ctx.fillRect(x, y + 2, 1, 1);
    },

    bar(ctx, x, y, frac, color) {
      ctx.fillStyle = '#181425';
      ctx.fillRect(x - 1, y - 1, 14, 4);
      ctx.fillStyle = '#3a4466';
      ctx.fillRect(x, y, 12, 2);
      ctx.fillStyle = color || '#feae34';
      ctx.fillRect(x, y, Math.max(1, Math.round(12 * Math.min(1, frac))), 2);
    },

    /* 会动的建筑这一帧用哪张图：篝火的火苗一直跳；风车有风、通着就转，风越大转得越快；旗子有风才飘 */
    animName(S, b, def, time) {
      const sp = def.sprite;
      if (sp === 'b_campfire') return 'b_campfire' + (Math.floor(time * 6 + b.id) & 1);
      if (b.st !== 'on') return sp;
      const ws = S.weather.ws;
      if (sp === 'b_windmill') return b.on && ws > 0 && (Math.floor(time * (2 + ws * 2) + b.id) & 1) ? 'b_windmill1' : sp;
      if (sp === 'b_flag') return ws > 0 && (Math.floor(time * (1.5 + ws) + b.id) & 1) ? 'b_flag1' : sp;
      return sp;
    },

    /* Boss 的去处画哪张图：打死了是一堆战利品；被引出来了，老窝就空着；否则是它潜伏的样子 */
    bossSite(S, s, time) {
      if (s.dead) return 'site_boss_dead';
      if (S.threat.boss && S.threat.boss.sid === s.id) return '';
      return s.boss === 'kraken' ? 'site_boss_kraken' : s.boss === 'megashark' ? 'boss_megashark' + (Math.floor(time * 1.5) & 1) : 'boss_flagship';
    },

    frame(S, C, alpha, time, dt) {
      const cam = TC.cam, A = TC.atlas, ctx = R.bctx, BD = TC.data.buildings;
      if (R.buf.width !== cam.bw || R.buf.height !== cam.bh) { R.buf.width = cam.bw; R.buf.height = cam.bh; }
      const bw = cam.bw, bh = cam.bh, o = cam.origin(), ox = o.x, oy = o.y;
      const tau = S.tick - 1 + alpha;       // 画面比模拟慢一步，用来在两步之间插值
      let draws = 0;

      // ── 海面
      const d = TC.sea.drift(S), lag = 1 - alpha;
      TC.water.draw(ctx, bw, bh, ox, oy, time, Math.round(R.seaX - d[0] * K * lag), Math.round(R.seaY - d[1] * K * lag));

      // ── 水下的鱼影
      if (dt > 0) TC.critters.update(S, C, dt, ox, oy, bw, bh);
      TC.critters.drawUnder(ctx, ox, oy);

      // ── 漂浮物
      const fs = S.sea.floaters;
      let hover = null;
      R.fpos.clear();
      for (let i = 0; i < fs.length; i++) {
        const f = fs[i], name = 'fl_' + f.kind, fr = A.f[name];
        if (!fr) continue;
        const px = R.prevX.get(f.id), py = R.prevY.get(f.id);
        const wx = (px === undefined ? f.x : px + (f.x - px) * alpha) * K;
        const wy = (py === undefined ? f.y : py + (f.y - py) * alpha) * K;
        const cx = Math.round(wx - ox), cy = Math.round(wy - oy);
        if (f.claim) R.fpos.set(f.id, [cx, cy]);
        if (cx < -16 || cy < -16 || cx > bw + 16 || cy > bh + 16) continue;
        const sx = cx - (fr.w >> 1), sy = cy - (fr.h >> 1);
        const bob = f.pull ? 0 : (Math.floor(time * 1.5 + f.id * 0.618) & 1);
        A.draw(ctx, (Math.floor(time * 2.5 + f.id) & 1) ? 'ripple1' : 'ripple0', cx - 6, sy + fr.h - 1);
        A.draw(ctx, name, sx, sy + bob);
        draws += 2;
        if (f.kind === 'survivor' && !f.pull) R.arrow(ctx, cx, sy - 6 + (Math.floor(time * 3) & 1));
        if (f.tag && !f.pull) R.brackets(ctx, sx, sy + bob, fr.w, fr.h, '#feae34');    // 点了名、等人来钩
        else if (R.reachable.has(f.id)) {
          const ph = Math.floor(time * 4 + f.id * 1.7) % 6;      // 够得着的右上角有颗小星闪烁
          if (ph < 2) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(sx + fr.w - 1, sy - 2 + bob, 1, 1);
            if (ph === 1) { ctx.fillRect(sx + fr.w - 2, sy - 2 + bob, 3, 1); ctx.fillRect(sx + fr.w - 1, sy - 3 + bob, 1, 3); }
          }
          if (f.id === R.hoverId) hover = [sx, sy + bob, fr.w, fr.h];
        }
      }

      // ── 远处的去处：沉船、废墟、小岛……（航行途中没有）
      const sites = TC.voyage.sites(S), lights = [], offs = [];
      const sel0 = R.view.sel;
      for (let i = 0; i < sites.length; i++) {
        const s = sites[i], name = s.kind === 'boss' ? R.bossSite(S, s, time) : s.kind === 'fort' && s.dead ? 'site_boss_dead' : 'site_' + s.kind, fr = A.f[name];
        if (!fr) continue;
        const cx = Math.round(s.x * K - ox), by = Math.round(s.y * K - oy) + 4;
        const left = TC.voyage.remains(s) > 0 || !!s.deals || !!s.market || ((s.kind === 'boss' || s.kind === 'fort') && !s.dead);
        if (cx < -fr.w || by < -4 || cx > bw + fr.w || by - fr.h > bh) { if (left) offs.push(s); continue; }
        const bob = s.kind === 'merchant' || s.kind === 'camp' ? (Math.floor(time * 1.2 + s.id) & 1) : 0;    // 漂着的会随浪起伏
        A.draw(ctx, name, cx - (fr.w >> 1), by - fr.h + bob);
        draws++;
        if (s.kind === 'lighthouse') lights.push('glow_l', cx, by - fr.h + 8);
        else if (s.kind === 'camp' && s.surv > 0) lights.push('glow_s', cx + 3, by - fr.h + 4);
        else if (s.kind === 'merchant') lights.push('glow_m', cx - 6, by - 10);
        else if (s.kind === 'tower') lights.push('glow_s', cx, by - fr.h + 2);
        if (s.surv > 0) R.arrow(ctx, cx, by - fr.h - 7 + (Math.floor(time * 3) & 1));                         // 有人等着接
        if (sel0 && sel0.s === s.id) R.brackets(ctx, cx - (fr.w >> 1), by - fr.h, fr.w, fr.h, '#ffffff');
      }

      // ── 小船：停在船坞边上的，和正在外面的
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i];
        if (!BD[b.def].boat || b.st !== 'on') continue;
        const out = b.w ? TC.people.byId(S, b.w) : null;
        if (out && out.task && out.task.k === 'boat' && out.task.ph > 0) continue;        // 这条船出去了
        const p = TC.voyage.launch(S, C, b);
        A.draw(ctx, 'boat', Math.round(p[0] * K - ox) - 9, Math.round(p[1] * K - oy) - 3 + (Math.floor(time * 1.3 + b.id) & 1));
        draws++;
      }
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i], t = r.task;
        if (!t || t.k !== 'boat' || t.ph < 1) continue;
        const bx = Math.round(t.bx * K - ox), by = Math.round(t.by * K - oy) + (Math.floor(time * 2 + r.id) & 1);
        const site = TC.voyage.site(S, t.sid);
        const right = t.ph === 3 ? (site ? site.x < t.bx : false) : (site ? site.x > t.bx : true);
        if (t.ph === 2 && t.act === 'dive') {
          // 潜下去了：船上没人，水面冒泡
          ctx.fillStyle = '#ffffff';
          const ph = Math.floor(time * 5 + r.id) % 4;
          ctx.fillRect(bx + 11, by - 2 - ph, 1, 1);
          ctx.fillRect(bx + 13, by + 1 - ((ph + 2) % 4), 1, 1);
        } else A.draw(ctx, 'p' + r.look + (right ? '_r' : '_l') + (t.ph === 2 ? 0 : 1 + (Math.floor(time * 4 + r.id) & 1)), bx - 4, by - 12);
        if (t.ph === 3 && t.cargo) {
          let n = 0;
          for (const k in t.cargo.loot) n += t.cargo.loot[k];
          if (n > 0) A.draw(ctx, 'boat_cargo', bx + (right ? -8 : 3), by - 4);
          if (t.cargo.surv) A.draw(ctx, 'p' + ((r.look + 3) % TC.data.LOOKS) + (right ? '_r0' : '_l0'), bx + (right ? -9 : 2), by - 11);
        }
        A.draw(ctx, 'boat', bx - 9, by - 3);
        draws += 2;
      }

      // ── 鲨鱼的背鳍、海盗船
      const cs = S.sea.creatures;
      for (let i = 0; i < cs.length; i++) {
        const c = cs[i], cx = Math.round(c.x * K - ox), cy = Math.round(c.y * K - oy);
        if (cx < -16 || cy < -16 || cx > bw + 16 || cy > bh + 16) continue;
        A.draw(ctx, 'shark' + (Math.floor(time * 3 + c.id) & 1), cx - 6, cy - 5);
        draws++;
      }
      // ── 正在打的 Boss：本体和头顶的血条
      const boss = S.threat.boss;
      if (boss) {
        const name = boss.id === 'kraken' ? 'boss_kraken' + (Math.floor(time * 2.5) & 1) : boss.id === 'megashark' ? 'boss_megashark' + (Math.floor(time * 3) & 1) : 'boss_flagship';
        const fr = A.f[name], cx = Math.round(boss.x * K - ox), cy = Math.round(boss.y * K - oy) + (Math.floor(time * 2) & 1);
        if (fr && cx > -40 && cy > -10 && cx < bw + 40 && cy < bh + 50) {
          A.draw(ctx, name, cx - (fr.w >> 1), cy - fr.h + 7);
          const x0 = cx - 13, y0 = cy - fr.h + 2;
          ctx.fillStyle = '#181425';
          ctx.fillRect(x0 - 1, y0 - 1, 28, 5);
          ctx.fillStyle = '#3a4466';
          ctx.fillRect(x0, y0, 26, 3);
          ctx.fillStyle = '#e43b44';
          ctx.fillRect(x0, y0, Math.max(1, Math.round(26 * Math.max(0, boss.hp) / boss.max)), 3);
          draws += 2;
        }
      }
      // ── 攻打据点：守军的船、寨子的血条
      const siege = S.threat.siege;
      if (siege) {
        for (let i = 0; i < siege.boats.length; i++) {
          const b = siege.boats[i], cx = Math.round(b.x * K - ox), cy = Math.round(b.y * K - oy) + (Math.floor(time * 2 + b.id) & 1);
          if (cx < -30 || cy < -24 || cx > bw + 30 || cy > bh + 24) continue;
          A.draw(ctx, 'pirate', cx - 12, cy - 12);
          for (let h = 0; h < b.hp; h++) { ctx.fillStyle = '#e43b44'; ctx.fillRect(cx - 5 + h * 4, cy - 16, 3, 2); }
          draws++;
        }
        const fs2 = TC.voyage.site(S, siege.sid);
        if (fs2) {
          const cx = Math.round(fs2.x * K - ox), cy = Math.round(fs2.y * K - oy) - 30;
          ctx.fillStyle = '#181425';
          ctx.fillRect(cx - 15, cy - 1, 32, 5);
          ctx.fillStyle = '#3a4466';
          ctx.fillRect(cx - 14, cy, 30, 3);
          ctx.fillStyle = '#e43b44';
          ctx.fillRect(cx - 14, cy, Math.max(1, Math.round(30 * Math.max(0, siege.hp) / siege.max)), 3);
        }
      }
      // ── 出了港的战船和来助战的船
      const fleet = S.threat.fleet;
      for (let i = 0; i < fleet.length; i++) {
        const f = fleet[i], cx = Math.round(f.x * K - ox), cy = Math.round(f.y * K - oy) + (Math.floor(time * 2 + f.id) & 1);
        if (cx < -30 || cy < -24 || cx > bw + 30 || cy > bh + 24) continue;
        A.draw(ctx, f.kind === 'ally' ? 'allyboat' : 'warboat', cx - 12, cy - 13);
        for (let h = 0; h < f.hp; h++) { ctx.fillStyle = '#63c74d'; ctx.fillRect(cx - 9 + h * 4, cy - 17, 3, 2); }
        draws++;
      }
      const raid = S.threat.raid;
      if (raid && raid.ph === 'fight') {
        for (let i = 0; i < raid.boats.length; i++) {
          const b = raid.boats[i], cx = Math.round(b.x * K - ox), cy = Math.round(b.y * K - oy) + (Math.floor(time * 2 + b.id) & 1);
          if (cx < -30 || cy < -24 || cx > bw + 30 || cy > bh + 24) continue;
          A.draw(ctx, 'pirate', cx - 12, cy - 12);
          for (let h = 0; h < b.hp; h++) { ctx.fillStyle = '#e43b44'; ctx.fillRect(cx - 5 + h * 4, cy - 16, 3, 2); }      // 还能挨几下
          draws++;
        }
      }

      // ── 还没盖好的平台（画在水面上、地面层下面）
      const bs = S.buildings;
      for (let i = 0; i < bs.length; i++) {
        const b = bs[i];
        if (BD[b.def].place !== 'water') continue;
        A.draw(ctx, 'site_tile', b.x * T - ox, b.y * T - oy);
        draws++;
      }

      // ── 浮城地面层
      TC.layers.sync(S, C);
      ctx.drawImage(TC.layers.ground, -ox, -oy);
      draws++;

      // ── 打坏了的平台上的裂纹
      const dm = TC.hazard.damaged(S, C), HP = TC.grid.TILE_HP;
      for (let i = 0; i < dm.length; i++) {
        const idx = dm[i], x = idx % N, y = (idx - x) / N;
        A.draw(ctx, S.grid.hp[idx] < HP[S.grid.t[idx]] * 0.4 ? 'crack2' : 'crack1', x * T - ox, y * T - oy);
        draws++;
      }

      // ── 贴着船体的泡沫
      const edge = C.edge, t = S.grid.t, ff = Math.floor(time * 3);
      for (let i = 0; i < edge.length; i++) {
        const idx = edge[i], x = idx % N, y = (idx - x) / N;
        const sx = x * T - ox, sy = y * T - oy;
        if (sx < -20 || sy < -24 || sx > bw + 4 || sy > bh + 4) continue;
        const f4 = (ff + ((x * 7 + y * 13) & 3)) & 3;
        if (y === 0 || !t[idx - N]) { A.draw(ctx, 'foam_n' + f4, sx, sy - 2); draws++; }
        if (y === N - 1 || !t[idx + N]) { A.draw(ctx, 'foam_s' + ((f4 + 1) & 3), sx, sy + T + FACE); draws++; }
        if (x === 0 || !t[idx - 1]) { A.draw(ctx, 'foam_w' + ((f4 + 2) & 3), sx - 2, sy); draws++; }
        if (x === N - 1 || !t[idx + 1]) { A.draw(ctx, 'foam_e' + ((f4 + 3) & 3), sx + T, sy); draws++; }
      }

      // ── 航行时的尾迹：背着航向的那一侧，船沿不断翻出白沫
      if (S.voyage.flow > 0 && dt > 0) {
        R.wake += dt * (6 + S.voyage.flow * 0.5);
        const hd = TC.DIR16[S.voyage.head];
        while (R.wake >= 1 && edge.length) {
          R.wake -= 1;
          const idx = edge[(Math.random() * edge.length) | 0], x = idx % N, y = (idx - x) / N;
          // 只在“背风”的边上出沫：这一格背着航向的那一侧是水
          const bx = hd[0] > 30 ? -1 : hd[0] < -30 ? 1 : 0, by2 = hd[1] > 30 ? -1 : hd[1] < -30 ? 1 : 0;
          const wet = (bx && !TC.grid.isDeck(S, x + bx, y)) || (by2 && !TC.grid.isDeck(S, x, y + by2));
          if (!wet) continue;
          TC.fx.splash(x * T + 8 + bx * 9, y * T + 10 + by2 * 9, 2, ['#ffffff', '#93dcf7', '#2ce8f5']);
        }
      }

      // ── 建筑和居民：收集起来按脚底的 y 排序，靠后的先画
      const items = R.items;
      items.length = 0;
      for (let i = 0; i < bs.length; i++) {
        const b = bs[i], def = BD[b.def];
        if (def.place === 'water') continue;
        items.push({ y: b.y * T + 8, b, def, r: null });
        if (def.light && b.st === 'on') lights.push(def.light, b.x * T + 8 - ox, b.y * T + 6 - oy);
      }
      R.rpos.clear();
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i];
        const p = r.mn ? Math.max(0, Math.min(1, (tau - r.mt) / r.mn)) : 1;
        const wx = (r.px + (r.x - r.px) * p) * T + 8 + ((r.id * 7) % 5) - 2;
        const wy = (r.py + (r.y - r.py) * p) * T + 13 + ((r.id * 3) % 3) - 1;
        R.rpos.set(r.id, [wx, wy]);
        const inBed = TC.people.asleep(r) && r.task.bed;
        const home = inBed && r.home ? C.byId.get(r.home) : null;
        const indoors = !!home && BD[home.def].beds > 1;                 // 睡在窝棚、板房里：人在屋里，不画出来
        if (indoors) { R.rpos.set(r.id, [r.x * T + 8, r.y * T + 4]); continue; }
        if (r.task && r.task.k === 'boat' && r.task.ph > 0) { R.rpos.set(r.id, [r.task.bx * K, r.task.by * K + 2]); continue; }   // 划船出去了
        if (r.task && r.task.k === 'shelter' && r.task.ph === 1 && r.task.in) { R.rpos.set(r.id, [r.x * T + 8, r.y * T + 4]); continue; }   // 躲在屋里
        items.push({ y: inBed ? r.y * T + 9 : wy, b: null, def: null, r, wx, wy, moving: p < 1 });
      }
      if (R.demo) for (const it of R.demo) items.push({ y: it.y, demo: it });
      items.sort((a, b) => a.y - b.y);

      const ropes = [];
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        if (it.b) {
          const b = it.b, def = it.def, sx = b.x * T - ox, sy = b.y * T - oy;
          if (sx < -32 || sy < -40 || sx > bw + 16 || sy > bh + 16) continue;
          const name = R.animName(S, b, def, time);
          const fr = A.f[name], dy = fr ? T - fr.h : 0;           // 高出一格的建筑往上画，脚底对齐这一格
          if (b.st === 'site') { ctx.globalAlpha = 0.45; A.draw(ctx, name, sx, sy + dy); ctx.globalAlpha = 1; }
          else if (!b.on) { ctx.globalAlpha = 0.6; A.draw(ctx, name, sx, sy + dy); ctx.globalAlpha = 1; }
          else A.draw(ctx, name, sx, sy + dy);
          draws++;
        } else if (it.r) {
          const r = it.r, look = 'p' + r.look + '_', tk = r.task, k = tk ? tk.k : '';
          const sx = Math.round(it.wx - ox), sy = Math.round(it.wy - oy);
          if (sx < -16 || sy < -8 || sx > bw + 16 || sy > bh + 24) continue;
          if (k === 'sleep' && tk.ph === 1) {
            if (tk.bed) A.draw(ctx, look + 'lie', r.x * T - ox + 2, r.y * T - oy + 3);
            else { A.draw(ctx, 'shadow8', sx - 5, sy - 3); A.draw(ctx, look + 'lie', sx - 6, sy - 8); }
          } else {
            const busy = (k === 'build' || k === 'work' || k === 'duty' || k === 'repair') && tk.ph === 1;
            const frame = it.moving ? 1 + (Math.floor(time * 8 + r.id) & 1) : 0;
            const bob = busy ? (Math.floor(time * 5 + r.id) & 1) : 0;
            A.draw(ctx, 'shadow8', sx - 4, sy - 2);
            A.draw(ctx, look + DIRN[r.dir] + frame, sx - 4, sy - 12 + bob);
            if (k === 'hook' && tk.ph === 1) ropes.push(sx, sy - 6, tk.fid, 0, 0);
            else if (busy && k === 'work') {
              const b = C.byId.get(tk.bid);
              if (b && b.def === 'fishing') ropes.push(sx, sy - 7, b.x, b.y, 1);
            }
          }
          draws += 2;
        } else {
          const it2 = it.demo, name = typeof it2.name === 'function' ? it2.name(time) : it2.name, fr = A.f[name];
          if (!fr) continue;
          const sx = Math.round(it2.x - ox - fr.w / 2), sy = Math.round(it2.y - oy - fr.h);
          draws++;
          if (it2.shadow) A.draw(ctx, 'shadow8', sx, sy + fr.h - 2);
          A.draw(ctx, name, sx, sy);
          if (it2.glow) lights.push(it2.glow, it2.x - ox, it2.y - oy - 8);
        }
      }

      // ── 钩绳和钓线（每条记录五个数：起点 x、y，两个参数，种类）
      for (let i = 0; i < ropes.length; i += 5) {
        if (ropes[i + 4] === 1) {
          // 钓线：从人手伸向朝水的一侧，末端一个上下浮动的浮标
          const bx = ropes[i + 2], by = ropes[i + 3], side = TC.bld.waterSide(S, C, bx, by);
          if (side >= 0) {
            const ex = bx * T + 8 + TC.bld.NB[side][0] * 13 - ox, ey = by * T + 10 + TC.bld.NB[side][1] * 13 - oy + (Math.floor(time * 2) & 1);
            ctx.fillStyle = '#733e39';
            R.line(ctx, ropes[i], ropes[i + 1], (ropes[i] + ex) / 2, ropes[i + 1] - 5);
            ctx.fillStyle = '#c0cbdc';
            R.line(ctx, (ropes[i] + ex) / 2, ropes[i + 1] - 5, ex, ey);
            ctx.fillStyle = '#e43b44';
            ctx.fillRect(Math.round(ex) - 1, Math.round(ey), 2, 2);
          }
        } else {
          const p = R.fpos.get(ropes[i + 2]);
          if (p) {
            ctx.fillStyle = '#ead4aa';
            R.line(ctx, ropes[i], ropes[i + 1], p[0], p[1]);
          }
        }
      }

      // ── 头顶的状态标记
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i], p = R.rpos.get(r.id);
        const sx = Math.round(p[0] - ox), sy = Math.round(p[1] - oy);
        if (sx < -8 || sy < -8 || sx > bw + 8 || sy > bh + 30) continue;
        let mark = null;
        if (r.task && (r.task.k === 'boat' || r.task.k === 'shelter') && r.task.ph > 0) continue;
        if (TC.people.asleep(r)) mark = 'st_tired';
        else if (r.thirst < 2500) mark = 'st_thirst';
        else if (r.hunger < 2500) mark = 'st_hunger';
        else if (r.sick) mark = 'st_sick';
        else if (r.health < 3500) mark = 'st_hurt';
        else if (r.rest < 1500) mark = 'st_tired';
        if (!mark) continue;
        const asleep = mark === 'st_tired' && TC.people.asleep(r);
        if (!asleep && (Math.floor(time * 2 + r.id) & 1)) continue;      // 告急的标记一闪一闪
        const up = asleep ? (Math.floor(time * 1.5 + r.id) % 3) : 0;      // 打呼噜的“Z”慢慢往上飘
        A.draw(ctx, mark, sx - 4, sy - (asleep ? 16 : 23) - up);
        draws++;
      }

      // ── 工地和生产的进度条
      for (let i = 0; i < bs.length; i++) {
        const b = bs[i], def = BD[b.def];
        let frac = -1;
        if (b.st === 'site') { if (b.work > 0) frac = b.work / def.work; }
        else if (b.batch === 1 && b.w) frac = b.prog / TC.data.recipes[b.rec].work;
        else if (b.batch === 2) frac = 1 - Math.max(0, b.wait - S.tick) / TC.data.recipes[b.rec].wait;
        else if (def.duty === 'lab' && b.w && S.progress.tech.cur) frac = TC.duty.lab.frac(S);
        if (frac >= 0) R.bar(ctx, b.x * T + 2 - ox, b.y * T - 4 - oy, frac, b.batch === 2 ? '#63c74d' : def.duty ? '#2ce8f5' : null);
        // 该用电却没电：头顶一道闪着的闪电
        if (def.power && !def.optional && b.st === 'on' && b.on && !b.pw && (Math.floor(time * 2 + b.id) & 1) && TC.power.needs(S, C, b, def)) {
          A.draw(ctx, 'st_nopower', b.x * T + 4 - ox, b.y * T - 9 - oy);
        }
      }

      // ── 放置虚影
      const ghosts = R.view.ghosts;
      for (let i = 0; i < ghosts.length; i++) {
        const g = ghosts[i], sx = g.x * T - ox, sy = g.y * T - oy;
        if (g.def === 'unraft') {
          ctx.fillStyle = g.ok ? 'rgba(228, 59, 68, 0.5)' : 'rgba(24, 20, 37, 0.5)';
          ctx.fillRect(sx, sy, T, T);
          ctx.fillStyle = '#ffffff';
          for (let k = 3; k < 13; k++) { ctx.fillRect(sx + k, sy + k, 1, 1); ctx.fillRect(sx + 15 - k, sy + k, 1, 1); }
          R.brackets(ctx, sx + 1, sy + 1, T - 2, T - 2, g.ok ? '#e43b44' : '#8b9bb4');
          continue;
        }
        const def = BD[g.def];
        const gname = def.place === 'water' ? 'site_tile' : (def.sprite === 'b_campfire' ? 'b_campfire0' : def.sprite);
        ctx.globalAlpha = 0.7;
        A.draw(ctx, gname, sx, sy + (A.f[gname] ? T - A.f[gname].h : 0));
        ctx.globalAlpha = 1;
        if (!g.ok) { ctx.fillStyle = 'rgba(228, 59, 68, 0.45)'; ctx.fillRect(sx, sy, T, T); }
        R.brackets(ctx, sx + 1, sy + 1, T - 2, T - 2, g.ok ? '#63c74d' : '#e43b44');
      }

      // ── 选中框
      const sel = R.view.sel;
      if (sel && sel.b) {
        const b = C.byId.get(sel.b);
        if (b) R.brackets(ctx, b.x * T + 1 - ox, b.y * T + 1 - oy, T - 2, T - 2, '#ffffff');
      } else if (sel && sel.r) {
        const p = R.rpos.get(sel.r);
        if (p) {
          const sx = Math.round(p[0] - ox), sy = Math.round(p[1] - oy) - 26 + (Math.floor(time * 3) & 1);
          R.arrow(ctx, sx, sy);
        }
      }

      // ── 烟和海鸥
      TC.critters.drawOver(ctx, ox, oy);
      draws += TC.critters.n;

      // ── 粒子和飘字
      TC.fx.draw(ctx, ox, oy);

      // ── 雨
      TC.weatherfx.update(dt || 0, S.weather.kind, S.weather.heat > S.tick);
      TC.weatherfx.drawRain(ctx, bw, bh, time);

      // ── 光照
      const amb = TC.weatherfx.tint(TC.light.ambient(TC.clock.hourF(S)));
      if (!TC.light.isDay(amb)) {
        TC.light.begin(bw, bh, amb);
        for (let i = 0; i < lights.length; i += 3) {
          const flick = (Math.floor(time * 6 + i) % 5 === 0) ? 1 : 0;   // 火光偶尔跳一下
          TC.light.glow(lights[i], lights[i + 1], lights[i + 2] + flick);
        }
        TC.light.apply(ctx);
        draws++;
      }

      // ── 雾和闪电（不受光照影响，盖在最上面）
      TC.weatherfx.drawFog(ctx, bw, bh, time);
      TC.weatherfx.drawFlash(ctx, bw, bh);

      // ── 指针指着的漂浮物
      if (hover) R.brackets(ctx, hover[0], hover[1], hover[2], hover[3], '#ffffff');

      // ── 画面外还有东西可拿的去处：在屏幕边上放一个小图标指过去
      R.marks.length = 0;
      if (offs.length) {
        const s2b = cam.dpr / cam.k, pad = R.view.pad;
        const x0 = pad[3] * s2b + 9, x1 = bw - pad[1] * s2b - 9, y0 = pad[0] * s2b + 9, y1 = bh - pad[2] * s2b - 9;
        for (let i = 0; i < offs.length; i++) {
          const s = offs[i], icon = MARK[s.kind], fr = A.f[icon];
          if (!fr) continue;
          const mx = Math.round(Math.max(x0, Math.min(x1, s.x * K - ox))), my = Math.round(Math.max(y0, Math.min(y1, s.y * K - oy - 8)));
          ctx.fillStyle = 'rgba(24, 20, 37, 0.78)';
          ctx.fillRect(mx - 8, my - 8, 17, 17);
          A.draw(ctx, icon, mx - (fr.w >> 1), my - (fr.h >> 1));
          R.brackets(ctx, mx - 7, my - 7, 15, 15, s.surv > 0 && (Math.floor(time * 2) & 1) ? '#ff0044' : '#feae34');
          R.marks.push({ sid: s.id, x: mx, y: my });
          draws += 2;
        }
      }

      // ── 整数倍放大到屏幕
      R.ctx.imageSmoothingEnabled = false;
      R.ctx.drawImage(R.buf, 0, 0, bw, bh, 0, 0, bw * cam.k, bh * cam.k);
      R.draws = draws;
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 声音：全部用 WebAudio 现场合成，不带音频文件。
 * 浏览器规定要等玩家第一次点击之后才能出声，所以由界面层在第一次点击时调用 init 和 resume。
 * 合成方法沿用旧作《怒海孤舟》。 */
(function (TC) {
  'use strict';

  const Sfx = TC.sfx = {
    ctx: null, master: null, amb: null, rainGain: null, waveGain: null, noiseBuf: null,
    on: true,
    volume: 0.22,

    init() {
      if (Sfx.ctx) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        Sfx.ctx = new AC();
        Sfx.master = Sfx.ctx.createGain();
        Sfx.master.gain.value = Sfx.on ? Sfx.volume : 0;
        Sfx.master.connect(Sfx.ctx.destination);
        const n = Sfx.ctx.sampleRate * 2;
        Sfx.noiseBuf = Sfx.ctx.createBuffer(1, n, Sfx.ctx.sampleRate);
        const d = Sfx.noiseBuf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { Sfx.ctx = null; }
    },

    resume() { try { if (Sfx.ctx && Sfx.ctx.state === 'suspended') Sfx.ctx.resume(); } catch (e) { /* 忽略 */ } },

    state() { return Sfx.ctx ? Sfx.ctx.state : 'none'; },

    setOn(v) {
      Sfx.on = v;
      if (Sfx.master) Sfx.master.gain.setTargetAtTime(v ? Sfx.volume : 0, Sfx.ctx.currentTime, 0.05);
    },

    tone(freq, dur, type, vol, slide, delay) {
      if (!Sfx.ctx || !Sfx.on) return;
      const t = Sfx.ctx.currentTime + (delay || 0);
      const o = Sfx.ctx.createOscillator(), g = Sfx.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(Sfx.master);
      o.start(t);
      o.stop(t + dur + 0.02);
    },

    noise(dur, vol, freq, type, delay, q) {
      if (!Sfx.ctx || !Sfx.on) return;
      const t = Sfx.ctx.currentTime + (delay || 0);
      const s = Sfx.ctx.createBufferSource();
      s.buffer = Sfx.noiseBuf;
      const f = Sfx.ctx.createBiquadFilter();
      f.type = type || 'lowpass';
      f.frequency.value = freq || 800;
      f.Q.value = q || 0.7;
      const g = Sfx.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f);
      f.connect(g);
      g.connect(Sfx.master);
      s.start(t, Math.random());
      s.stop(t + dur + 0.05);
    },

    play(name) {
      if (!Sfx.ctx || !Sfx.on) return;
      switch (name) {
        case 'click': Sfx.tone(660, 0.05, 'square', 0.06); break;
        case 'hook': Sfx.noise(0.12, 0.1, 2600, 'highpass'); Sfx.tone(420, 0.08, 'triangle', 0.08, 260); break;
        case 'pickup': Sfx.tone(523, 0.08, 'square', 0.1); Sfx.tone(784, 0.1, 'square', 0.1, 0, 0.07); break;
        case 'splash': Sfx.noise(0.4, 0.18, 1400, 'bandpass', 0, 0.6); break;
        case 'deny': Sfx.tone(180, 0.12, 'square', 0.07, -40); break;
        case 'build': Sfx.noise(0.06, 0.15, 2400, 'highpass'); Sfx.noise(0.06, 0.15, 2400, 'highpass', 0.12); Sfx.tone(440, 0.1, 'square', 0.08, 0, 0.24); break;
        case 'good': [523, 659, 784].forEach((f, i) => Sfx.tone(f, 0.12, 'triangle', 0.14, 0, i * 0.08)); break;
        case 'bad': Sfx.tone(220, 0.25, 'sawtooth', 0.12, -120); Sfx.noise(0.2, 0.08, 400); break;
        case 'thunder': Sfx.noise(1.8, 0.45, 220, 'lowpass', 0, 0.4); Sfx.noise(1.2, 0.2, 90, 'lowpass', 0.2); break;
        case 'alarm': for (let i = 0; i < 3; i++) { Sfx.tone(880, 0.12, 'square', 0.08, 0, i * 0.3); Sfx.tone(660, 0.12, 'square', 0.08, 0, i * 0.3 + 0.15); } break;
        case 'tick': Sfx.tone(1200, 0.02, 'square', 0.04); break;
      }
    },

    /* 海浪和雨声环境音：两路循环的噪声，各过一个滤波器 */
    startAmbient() {
      if (!Sfx.ctx || Sfx.amb) return;
      try {
        const s = Sfx.ctx.createBufferSource();
        s.buffer = Sfx.noiseBuf;
        s.loop = true;
        const f = Sfx.ctx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = 420;
        Sfx.waveGain = Sfx.ctx.createGain();
        Sfx.waveGain.gain.value = 0.05;
        const lfo = Sfx.ctx.createOscillator();
        lfo.frequency.value = 0.12;
        const lg = Sfx.ctx.createGain();
        lg.gain.value = 0.035;
        lfo.connect(lg);
        lg.connect(Sfx.waveGain.gain);
        lfo.start();
        s.connect(f);
        f.connect(Sfx.waveGain);
        Sfx.waveGain.connect(Sfx.master);
        s.start();
        const r = Sfx.ctx.createBufferSource();
        r.buffer = Sfx.noiseBuf;
        r.loop = true;
        const rf = Sfx.ctx.createBiquadFilter();
        rf.type = 'highpass';
        rf.frequency.value = 2500;
        Sfx.rainGain = Sfx.ctx.createGain();
        Sfx.rainGain.gain.value = 0;
        r.connect(rf);
        rf.connect(Sfx.rainGain);
        Sfx.rainGain.connect(Sfx.master);
        r.start(0, 0.7);
        Sfx.amb = { s, r, lfo };
      } catch (e) { /* 忽略 */ }
    },

    setWeather(kind) {
      if (!Sfx.rainGain) return;
      const t = Sfx.ctx.currentTime;
      Sfx.rainGain.gain.setTargetAtTime(kind === 'storm' ? 0.07 : kind === 'rain' ? 0.035 : 0, t, 1.2);
      Sfx.waveGain.gain.setTargetAtTime(kind === 'storm' ? 0.12 : 0.05, t, 1.2);
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 背景音乐：现场生成的一段慢悠悠的五声音阶小曲，不带音频文件。
 * 白天明亮些，夜里稀疏、低沉些，航行时轻快些；风暴里停下来，让给风雨声。
 * 主循环每帧调用 frame()，把接下来半秒要响的音排进 WebAudio 的时间线。 */
(function (TC) {
  'use strict';

  const SCALE = [0, 2, 4, 7, 9];                 // 大调五声音阶（相对主音的半音数）
  const C4 = 261.63;
  /* 每种气氛：step 一个八分音符多少秒；prog 四小节一轮的和弦根音；fill 每个八分音符出旋律音的概率；
   * oct 旋律整体移几个八度；pad 铺底和弦的音量 */
  const MOODS = {
    day: { step: 0.4, prog: [0, 9, 5, 7], fill: 0.5, oct: 0, pad: 0.03 },
    night: { step: 0.52, prog: [9, 5, 0, 7], fill: 0.28, oct: -1, pad: 0.036 },
    sail: { step: 0.34, prog: [0, 7, 9, 5], fill: 0.62, oct: 0, pad: 0.028 },
  };

  const hz = semi => C4 * Math.pow(2, semi / 12);

  const Mu = TC.music = {
    on: true,
    gain: null,
    nextT: 0,
    step: 0,          // 这一小节的第几个八分音符（0–7）
    bar: 0,
    mood: 'day',
    deg: 4,           // 旋律现在在音阶的第几级（跨两个八度：0–9）
    rest: 0,          // 刚响过一个音：歇几拍再出下一个

    setOn(v) {
      Mu.on = v;
      if (Mu.gain) Mu.gain.gain.setTargetAtTime(v ? 1 : 0, TC.sfx.ctx.currentTime, 0.2);
    },

    /* 眼下该是哪种气氛；风暴里返回 ''（不出声） */
    pick(S) {
      if (S.weather.kind === 'storm' || S.over) return '';
      const h = TC.clock.hourF(S);
      if (h >= 20.5 || h < 5.5) return 'night';
      return S.voyage.to >= 0 ? 'sail' : 'day';
    },

    /* 一个音：type 波形，f 频率，t 开始的时刻，dur 多长，vol 音量，attack 起音多快 */
    note(type, f, t, dur, vol, attack) {
      const ctx = TC.sfx.ctx, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(Mu.gain);
      o.start(t);
      o.stop(t + dur + 0.05);
    },

    /* 排好时刻 t 的这一个八分音符 */
    schedule(t) {
      const m = MOODS[Mu.mood], root = m.prog[Mu.bar % 4], s = Mu.step;
      if (s === 0) {
        // 铺底：根音和五度，慢慢起、慢慢收
        const len = m.step * 8;
        Mu.note('sine', hz(root - 12), t, len * 1.05, m.pad, len * 0.3);
        Mu.note('sine', hz(root - 5), t, len * 1.05, m.pad * 0.7, len * 0.35);
      }
      if (s === 0 || (s === 4 && Mu.mood !== 'night')) Mu.note('triangle', hz(root - 24), t, m.step * 2.4, 0.07, 0.02);      // 低音
      if (Mu.rest > 0) { Mu.rest--; return; }
      if (s !== 0 && Math.random() > m.fill) return;
      // 旋律：在音阶上一级一级地游走；小节的头一拍落在和弦音上
      let d = Mu.deg + [-2, -1, -1, 1, 1, 2, 0][(Math.random() * 7) | 0];
      if (d < 0) d = 1;
      if (d > 9) d = 8;
      if (s === 0) {
        const want = ((root % 12) + 12) % 12;
        for (let k = 0; k < 5; k++) {
          const up = d + k, dn = d - k;
          if (up <= 9 && SCALE[up % 5] === want) { d = up; break; }
          if (dn >= 0 && SCALE[dn % 5] === want) { d = dn; break; }
        }
      }
      Mu.deg = d;
      const semi = SCALE[d % 5] + 12 * Math.floor(d / 5) + 12 * m.oct;
      const long = s % 2 === 0 && Math.random() < 0.4;
      Mu.note('triangle', hz(semi), t, m.step * (long ? 3.2 : 1.8), 0.075, 0.012);
      Mu.note('sine', hz(semi + 12), t, m.step * 1.2, 0.02, 0.01);                // 高八度的一点泛音，像拨片琴
      if (long) Mu.rest = 1;
    },

    frame(S) {
      const ctx = TC.sfx.ctx;
      if (!ctx || !Mu.on || !TC.sfx.on || ctx.state !== 'running') return;
      if (!Mu.gain) {
        Mu.gain = ctx.createGain();
        Mu.gain.gain.value = 1;
        Mu.gain.connect(TC.sfx.master);
      }
      const now = ctx.currentTime;
      if (Mu.nextT < now) Mu.nextT = now + 0.15;            // 落后了（刚启动、从后台切回来）：从现在重新排
      let guard = 0;
      while (Mu.nextT < now + 0.5 && guard++ < 8) {
        if (Mu.step === 0) Mu.mood = Mu.pick(S) || '';
        const m = MOODS[Mu.mood];
        if (!m) { Mu.nextT += 2; Mu.step = 0; continue; }   // 风暴里：歇着，过两秒再看
        Mu.schedule(Mu.nextT);
        Mu.nextT += m.step;
        if (++Mu.step >= 8) { Mu.step = 0; Mu.bar++; }
      }
    },
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 画面上的小动静：水下的鱼影和偶尔路过的鲸影，天上的海鸥（会落在桅杆、旗杆上歇脚），灶台冒的烟。
 * 纯画面效果，不影响模拟；数量都封顶，每帧多出来的贴图不过几十次。 */
(function (TC) {
  'use strict';

  const def = TC.art.def, T = TC.TILE;
  const SH = { map: { x: '#10204468' } };       // 水下的影子：半透明的深蓝

  def('gull0', ['6.....6', '.66.66.', '...5...']);       // 翅膀扬起
  def('gull1', ['.......', '.66566.', '6.....6']);       // 翅膀压下
  def('gull_sit', ['.66..', '.66m.', '6665.', '.55..']);
  def('fishsh_r', ['x..xx.', '.xxxxx', 'x..xx.'], SH);
  def('fishsh_l', ['.xx..x', 'xxxxx.', '.xx..x'], SH);

  // 鲸影：一个长椭圆加一片尾鳍，头朝左；朝右的是它的镜像
  (function () {
    const w = 30, h = 9, rows = [];
    for (let y = 0; y < h; y++) {
      let s = '';
      for (let x = 0; x < w; x++) {
        const dx = (x - 12) / 12.5, dy = (y - 4) / 4.6, a = Math.abs(y - 4);
        const body = dx * dx + dy * dy <= 1;
        const tail = x >= 24 && a <= (x - 23) * 0.62 && a >= (x - 27) * 1.2;
        s += body || tail ? 'x' : '.';
      }
      rows.push(s);
    }
    def('whalesh_l', rows, SH);
    def('whalesh_r', rows.map(r => r.split('').reverse().join('')), SH);
  })();

  const PERCH = { sail: 1, flag: 1, watchtower: 1, radio: 1 };      // 海鸥爱落的地方
  const SMOKE = { campfire: 0, kitchen: 1, smithy: 1, pyro: 1, still: 1 };      // 冒烟的建筑：1 表示有人在干活时才冒
  const GREY = ['rgba(192,203,220,0.85)', 'rgba(139,155,180,0.7)', 'rgba(90,105,136,0.5)'];
  const rnd = (a, b) => a + Math.random() * (b - a);

  const Cr = TC.critters = {
    fish: [],       // {x, y, vx, vy, big, life}
    gulls: [],      // {x, y, vx, st 0 飞着 1 正往落脚点飞 2 歇着, bid, tx, ty, t, ph}
    smoke: [],      // {x, y, vx, vy, age, life}
    tFish: 2, tGull: 5, tSmoke: 0, tWhale: 70,
    n: 0,           // 上一帧画了几个（计入每帧贴图次数）

    reset() {
      Cr.fish.length = Cr.gulls.length = Cr.smoke.length = 0;
      Cr.tFish = 2; Cr.tGull = 5; Cr.tSmoke = 0; Cr.tWhale = 70;
    },

    /* 从画面一侧放进来一群鱼（或者一头鲸） */
    school(x0, y0, x1, y1, whale) {
      const right = Math.random() < 0.5, sp = whale ? rnd(5, 8) : rnd(9, 17);
      const x = right ? x0 - 30 : x1 + 30, y = rnd(y0 + 10, y1 - 10), vy = rnd(-2.5, 2.5);
      const n = whale ? 1 : 3 + ((Math.random() * 4) | 0);
      for (let i = 0; i < n && Cr.fish.length < 28; i++) {
        Cr.fish.push({ x: x - (right ? 1 : -1) * rnd(0, 26), y: y + rnd(-12, 12), vx: (right ? sp : -sp) * rnd(0.9, 1.1), vy, big: whale, life: whale ? 120 : 60 });
      }
    },

    /* 建筑的精灵顶上那一点（世界像素） */
    top(b) {
      const fr = TC.atlas.f[TC.data.buildings[b.def].sprite];
      return [b.x * T + 8, b.y * T + T - (fr ? fr.h : T)];
    },

    update(S, C, dt, ox, oy, bw, bh) {
      const K = T / TC.SUB, d = TC.sea.drift(S), W = S.weather;
      const fx = d[0] * K * TC.TPS, fy = d[1] * K * TC.TPS;       // 水流过画面的速度（像素/秒）：鱼在水里，跟着一起漂
      const x0 = ox, y0 = oy, x1 = ox + bw, y1 = oy + bh;
      const moored = S.voyage.to < 0, kind = moored ? S.chart.nodes[S.voyage.at].kind : '';
      const h = TC.clock.hourF(S), day = h >= 6 && h < 19.5, calm = W.kind !== 'storm' && W.kind !== 'rain';

      // ── 鱼影
      Cr.tFish -= dt;
      if (Cr.tFish <= 0) {
        Cr.tFish = kind === 'reef' || kind === 'lighthouse' ? rnd(2, 5) : rnd(6, 14);
        if (kind !== 'works') Cr.school(x0, y0, x1, y1, false);            // 工厂那片脏水里没有鱼
      }
      Cr.tWhale -= dt;
      if (Cr.tWhale <= 0) {
        Cr.tWhale = rnd(150, 320);
        if (kind !== 'works' && calm) Cr.school(x0, y0, x1, y1, true);
      }
      for (let i = Cr.fish.length - 1; i >= 0; i--) {
        const f = Cr.fish[i];
        f.x += (f.vx + fx) * dt;
        f.y += (f.vy + fy) * dt;
        f.life -= dt;
        if (f.life <= 0 || f.x < x0 - 80 || f.x > x1 + 80 || f.y < y0 - 80 || f.y > y1 + 80) { Cr.fish[i] = Cr.fish[Cr.fish.length - 1]; Cr.fish.pop(); }
      }

      // ── 海鸥：白天、不刮风下雨的时候才有
      Cr.tGull -= dt;
      if (Cr.tGull <= 0) {
        Cr.tGull = rnd(9, 22);
        if (day && calm && Cr.gulls.length < 3) {
          const right = Math.random() < 0.5;
          const g = { x: right ? x0 - 8 : x1 + 8, y: rnd(y0 + 14, y1 - 30), vx: right ? rnd(24, 32) : -rnd(24, 32), st: 0, bid: 0, tx: 0, ty: 0, t: 0, ph: Math.random() * 6 };
          if (Math.random() < 0.4) {
            // 这一只打算找个高处歇一会儿
            const perches = S.buildings.filter(b => PERCH[b.def] && b.st === 'on' && !Cr.gulls.some(o => o.bid === b.id));
            if (perches.length) { const b = perches[(Math.random() * perches.length) | 0], p = Cr.top(b); g.st = 1; g.bid = b.id; g.tx = p[0]; g.ty = p[1] - 3; }
          }
          Cr.gulls.push(g);
        }
      }
      for (let i = Cr.gulls.length - 1; i >= 0; i--) {
        const g = Cr.gulls[i];
        g.ph += dt;
        if (g.st === 1) {
          const dx = g.tx - g.x, dy = g.ty - g.y, dist = Math.sqrt(dx * dx + dy * dy), sp = Math.abs(g.vx);
          if (!C.byId.get(g.bid)) g.st = 0;                                  // 落脚的地方没了
          else if (dist < sp * dt + 0.5) { g.x = g.tx; g.y = g.ty; g.st = 2; g.t = rnd(7, 18); }
          else { g.x += dx / dist * sp * dt; g.y += dy / dist * sp * dt; }
        } else if (g.st === 2) {
          g.t -= dt;
          if (g.t <= 0 || !C.byId.get(g.bid) || !calm) { g.st = 0; g.bid = 0; }
        } else {
          g.x += g.vx * dt;
          g.y += Math.sin(g.ph * 1.7) * 5 * dt - 1.5 * dt;                  // 一边飞一边缓缓升高
          if (g.x < x0 - 40 || g.x > x1 + 40 || g.y < y0 - 40 || !day) { Cr.gulls[i] = Cr.gulls[Cr.gulls.length - 1]; Cr.gulls.pop(); }
        }
      }

      // ── 烟：每隔一小会儿，每座烧着火的建筑冒一小团
      Cr.tSmoke -= dt;
      if (Cr.tSmoke <= 0) {
        Cr.tSmoke = 0.28;
        const wd = TC.DIR16[W.wd], wx = wd[0] / 100 * W.ws * 2.2, wy = wd[1] / 100 * W.ws * 0.8;
        for (let i = 0; i < S.buildings.length && Cr.smoke.length < 90; i++) {
          const b = S.buildings[i], need = SMOKE[b.def];
          if (need === undefined || b.st !== 'on' || !b.on) continue;
          if (need ? !(b.w && b.batch === 1) : Math.random() < 0.35) continue;
          const sx = b.x * T, sy = b.y * T;
          if (sx < x0 - 20 || sx > x1 + 4 || sy < y0 - 8 || sy > y1 + 40) continue;
          const p = Cr.top(b);
          Cr.smoke.push({ x: p[0] + rnd(-2, 2), y: p[1] + (need ? 1 : 3), vx: wx + rnd(-1.5, 1.5), vy: wy - rnd(7, 11), age: 0, life: rnd(1.3, 2.2) });
        }
      }
      for (let i = Cr.smoke.length - 1; i >= 0; i--) {
        const p = Cr.smoke[i];
        p.age += dt;
        if (p.age >= p.life) { Cr.smoke[i] = Cr.smoke[Cr.smoke.length - 1]; Cr.smoke.pop(); continue; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    },

    /* 水面以下：画在海面之后、漂浮物之前 */
    drawUnder(ctx, ox, oy) {
      const A = TC.atlas;
      for (let i = 0; i < Cr.fish.length; i++) {
        const f = Cr.fish[i], right = f.vx > 0;
        if (f.big) A.draw(ctx, right ? 'whalesh_r' : 'whalesh_l', Math.round(f.x - ox) - 15, Math.round(f.y - oy) - 4);
        else A.draw(ctx, right ? 'fishsh_r' : 'fishsh_l', Math.round(f.x - ox) - 3, Math.round(f.y - oy) - 1);
      }
      Cr.n = Cr.fish.length;
    },

    /* 浮城之上：烟和海鸥 */
    drawOver(ctx, ox, oy) {
      const A = TC.atlas;
      for (let i = 0; i < Cr.smoke.length; i++) {
        const p = Cr.smoke[i], k = p.age / p.life, s = k < 0.55 ? 2 : 1;
        ctx.fillStyle = GREY[k < 0.3 ? 0 : k < 0.65 ? 1 : 2];
        ctx.fillRect(Math.round(p.x - ox), Math.round(p.y - oy), s, s);
      }
      for (let i = 0; i < Cr.gulls.length; i++) {
        const g = Cr.gulls[i], sx = Math.round(g.x - ox), sy = Math.round(g.y - oy);
        if (g.st === 2) A.draw(ctx, 'gull_sit', sx - 2, sy - 1);
        else A.draw(ctx, (Math.floor(g.ph * 5) & 1) ? 'gull1' : 'gull0', sx - 3, sy - 1);
      }
      Cr.n += Cr.gulls.length + (Cr.smoke.length >> 2);
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 本地存储的包装：任何一步出错都不影响游戏运行。
 * 存储不可用时（无痕窗口、被禁用、某些内嵌环境）退回到内存，只在当前这次打开期间有效。 */
(function (TC) {
  'use strict';

  const mem = {};
  let ok = null;

  const St = TC.store = {
    forceOff: false,   // 测试用：假装存储不可用

    available() {
      if (ok !== null) return ok;
      if (St.forceOff) { ok = false; return ok; }
      try {
        const k = '__tidalcity_probe__';
        localStorage.setItem(k, '1');
        localStorage.removeItem(k);
        ok = true;
      } catch (e) { ok = false; }
      return ok;
    },

    read(k) {
      if (St.available()) {
        try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) { /* 落到内存 */ }
      }
      return mem[k] === undefined ? null : mem[k];
    },

    /* 返回是否真的写进了浏览器存储 */
    write(k, str) {
      mem[k] = str;
      if (!St.available()) return false;
      try { localStorage.setItem(k, str); return true; } catch (e) { return false; }
    },

    del(k) {
      delete mem[k];
      if (St.available()) { try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ } }
    },

    get(k) {
      const v = St.read(k);
      if (v === null) return null;
      try { return JSON.parse(v); } catch (e) { return null; }
    },

    set(k, obj) { return St.write(k, JSON.stringify(obj)); },
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/ui/store.js
</script>
<script>
/* 网页元素的小工具 */
(function (TC) {
  'use strict';

  const D = TC.dom = {
    $(sel) { return document.querySelector(sel); },

    /* el('div', {class:'x', text:'…', onclick: fn}, [子元素…]) */
    el(tag, props, kids) {
      const e = document.createElement(tag);
      if (props) {
        for (const k in props) {
          const v = props[k];
          if (v === undefined || v === null) continue;
          if (k === 'class') e.className = v;
          else if (k === 'text') e.textContent = v;
          else if (k === 'style') Object.assign(e.style, v);
          else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v);
        }
      }
      if (kids) for (const c of [].concat(kids)) if (c !== null && c !== undefined) e.append(c);
      return e;
    },

    /* 只有内容变了才动 DOM，顶栏每秒刷新几次也不会引起多余的重排 */
    setText(node, s) {
      if (node.__text !== s) { node.__text = s; node.textContent = s; }
    },

    /* 把图集里的精灵做成 <img>，按整数倍放大 */
    icon(name, scale) {
      const f = TC.atlas.src[name];
      const img = document.createElement('img');
      img.className = 'px';
      img.alt = '';
      img.draggable = false;
      if (f) {
        img.src = TC.atlas.url(name, 1);
        img.width = f.w * (scale || 1);
        img.height = f.h * (scale || 1);
      }
      return img;
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 输入：把鼠标、触屏、滚轮、键盘统一成几种手势，交给上层处理。
 *   tap(x, y, p)        点一下（鼠标左键或单指轻触，没有移动）
 *   longPress(x, y, p)  按住不动约半秒
 *   pan(dx, dy, p)      拖动（单指、鼠标任意键）
 *   pinch(scale, x, y)  双指捏合，scale 是相对捏合开始时的比例
 *   zoomStep(dir, x, y) 滚轮或触控板：放大一档（+1）或缩小一档（−1）
 *   hover(x, y)         鼠标悬停移动（移出画布时是 -1, -1）
 *   rightTap(x, y, p)   鼠标右键单击
 *   key(key, e)         按键
 * 坐标都是相对画布左上角的 CSS 像素。 */
(function (TC) {
  'use strict';

  const TAP_MOVE_MOUSE = 6, TAP_MOVE_TOUCH = 12, LONG_MS = 450;

  const In = TC.input = {
    el: null,
    h: {},
    pointers: new Map(),
    keys: new Set(),
    gesture: null,      // null | 'tap' | 'pan' | 'pinch' | 'long'
    longTimer: 0,
    pinch0: 0,
    lastCx: 0, lastCy: 0,
    wheelAcc: 0, wheelT: 0,

    init(el, handlers) {
      In.el = el;
      In.h = handlers || {};
      el.addEventListener('pointerdown', In.down);
      el.addEventListener('pointermove', In.move);
      el.addEventListener('pointerup', e => In.up(e, false));
      el.addEventListener('pointercancel', e => In.up(e, true));
      el.addEventListener('pointerleave', e => {
        if ((e.pointerType || 'mouse') === 'mouse' && !In.pointers.has(e.pointerId) && In.h.hover) In.h.hover(-1, -1);
      });
      el.addEventListener('wheel', In.wheel, { passive: false });
      el.addEventListener('contextmenu', e => e.preventDefault());
      window.addEventListener('keydown', In.keydown);
      window.addEventListener('keyup', e => In.keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
      window.addEventListener('blur', () => In.keys.clear());
    },

    pos(e) {
      const r = In.el.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    },

    clearLong() { if (In.longTimer) { clearTimeout(In.longTimer); In.longTimer = 0; } },

    two() {
      const it = In.pointers.values();
      const a = it.next().value, b = it.next().value;
      return { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    },

    down(e) {
      const [x, y] = In.pos(e);
      try { In.el.setPointerCapture(e.pointerId); } catch (err) { /* 有的环境不支持 */ }
      const p = { id: e.pointerId, x, y, x0: x, y0: y, type: e.pointerType || 'mouse', button: e.button, moved: false };
      In.pointers.set(e.pointerId, p);
      if (In.h.anyDown) In.h.anyDown(p);
      if (In.pointers.size === 1) {
        In.gesture = 'tap';
        In.clearLong();
        if (p.button === 0) {
          In.longTimer = setTimeout(() => {
            In.longTimer = 0;
            if (In.gesture === 'tap' && In.pointers.size === 1 && !p.moved) {
              In.gesture = 'long';
              if (In.h.longPress) In.h.longPress(p.x, p.y, p);
            }
          }, LONG_MS);
        }
      } else if (In.pointers.size === 2) {
        In.clearLong();
        In.gesture = 'pinch';
        const t = In.two();
        In.pinch0 = t.d || 1;
        In.lastCx = t.cx;
        In.lastCy = t.cy;
        if (In.h.pinchStart) In.h.pinchStart(t.cx, t.cy);
      }
      if (e.cancelable) e.preventDefault();
    },

    move(e) {
      const [x, y] = In.pos(e);
      const p = In.pointers.get(e.pointerId);
      if (!p) {
        if ((e.pointerType || 'mouse') === 'mouse' && In.h.hover) In.h.hover(x, y);
        return;
      }
      const dx = x - p.x, dy = y - p.y;
      p.x = x;
      p.y = y;
      if (In.gesture === 'pinch' && In.pointers.size >= 2) {
        const t = In.two();
        if (In.h.pan) In.h.pan(t.cx - In.lastCx, t.cy - In.lastCy, p);
        In.lastCx = t.cx;
        In.lastCy = t.cy;
        if (In.h.pinch) In.h.pinch(t.d / In.pinch0, t.cx, t.cy);
        return;
      }
      if (In.pointers.size !== 1) return;
      if (!p.moved) {
        const th = p.type === 'mouse' ? TAP_MOVE_MOUSE : TAP_MOVE_TOUCH;
        if (Math.hypot(x - p.x0, y - p.y0) <= th) return;
        p.moved = true;
        In.clearLong();
        if (In.gesture !== 'long') In.gesture = 'pan';
        if (In.gesture === 'pan' && In.h.pan) In.h.pan(x - p.x0, y - p.y0, p);   // 把越过门槛之前攒下的位移一次补上
        return;
      }
      if (In.gesture === 'pan' && In.h.pan) In.h.pan(dx, dy, p);
      if (p.type === 'mouse' && In.h.hover) In.h.hover(x, y);
    },

    up(e, cancelled) {
      const p = In.pointers.get(e.pointerId);
      if (!p) return;
      In.pointers.delete(e.pointerId);
      In.clearLong();
      if (In.pointers.size === 0) {
        if (!cancelled && In.gesture === 'tap' && !p.moved) {
          if (p.button === 0 && In.h.tap) In.h.tap(p.x, p.y, p);
          else if (p.button === 2 && In.h.rightTap) In.h.rightTap(p.x, p.y, p);
        }
        if (In.gesture === 'pinch' && In.h.pinchEnd) In.h.pinchEnd();
        In.gesture = null;
      } else if (In.pointers.size === 1) {
        // 双指变单指：接着当拖动，不会误触发点击
        if (In.h.pinchEnd) In.h.pinchEnd();
        In.gesture = 'pan';
        In.pointers.values().next().value.moved = true;
      }
    },

    wheel(e) {
      e.preventDefault();
      const [x, y] = In.pos(e);
      const now = performance.now();
      if (now - In.wheelT > 220) In.wheelAcc = 0;
      In.wheelT = now;
      const unit = e.deltaMode === 1 ? 40 : 1;   // 有的鼠标按“行”报告
      In.wheelAcc += e.deltaY * unit * (e.ctrlKey ? 3 : 1);   // 触控板捏合的数值小，放大一些
      if (Math.abs(In.wheelAcc) >= 60) {
        if (In.h.zoomStep) In.h.zoomStep(In.wheelAcc < 0 ? 1 : -1, x, y);
        In.wheelAcc = 0;
      }
    },

    keydown(e) {
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      In.keys.add(k);
      if (In.h.key && !e.repeat && In.h.key(k, e)) e.preventDefault();
      else if (k === ' ' || k.slice(0, 5) === 'Arrow') e.preventDefault();   // 别让空格和方向键滚动页面
    },
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 面板：同一时间只开一个。电脑上停在右侧，手机上从底部升起（样式见 panels.css）。
 * 各面板用 register 登记：{title, open(body, arg), update(S, C), close()}。
 * update 每秒调用几次，只应改动变化了的元素，不要整块重建——否则会吞掉正在进行的点击。 */
(function (TC) {
  'use strict';

  const Pn = TC.panel = {
    defs: {},
    cur: null,
    arg: null,

    init(host) {
      const el = TC.dom.el;
      Pn.title = el('span', { text: '' });
      Pn.closeBtn = el('button', { class: 'btn', type: 'button', id: 'panel-close', 'aria-label': '关闭', onclick: () => Pn.close() }, [TC.dom.icon('ui_close', 2)]);
      Pn.body = el('div', { class: 'panel-body' });
      Pn.el = el('section', { class: 'panel', id: 'panel', hidden: '' }, [el('div', { class: 'panel-head' }, [Pn.title, Pn.closeBtn]), Pn.body]);
      // 面板上的滚轮和触摸只滚动面板自己
      Pn.el.addEventListener('wheel', e => e.stopPropagation(), { passive: true });
      host.append(Pn.el);
    },

    register(id, def) { Pn.defs[id] = def; },

    open(id, arg) {
      const def = Pn.defs[id];
      if (!def) return;
      if (Pn.cur && Pn.defs[Pn.cur].close) Pn.defs[Pn.cur].close();
      Pn.cur = id;
      Pn.arg = arg;
      Pn.title.textContent = typeof def.title === 'function' ? def.title(arg) : def.title;
      Pn.body.replaceChildren();
      Pn.body.scrollTop = 0;
      def.open(Pn.body, arg);
      Pn.el.hidden = false;
      Pn.update();
    },

    close() {
      if (!Pn.cur) return;
      const def = Pn.defs[Pn.cur];
      Pn.cur = null;
      Pn.arg = null;
      Pn.el.hidden = true;
      Pn.body.replaceChildren();
      if (def.close) def.close();
    },

    toggle(id, arg) {
      if (Pn.cur === id) Pn.close();
      else Pn.open(id, arg);
    },

    update() {
      const app = TC.app;
      if (!Pn.cur || !app.S) return;
      const def = Pn.defs[Pn.cur];
      if (def.update) def.update(app.S, app.C, Pn.arg);
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 顶栏（物资、人口、心情、天气和时钟、变速、声音、菜单）和底栏（建造、居民）。
 * 物资只显示见过的；手机上地方小，食物合成一格、加工品收进“仓储”面板（点任意一格物资打开）。 */
(function (TC) {
  'use strict';

  const SPEEDS = [[0, 'ui_pause', '暂停'], [1, 'ui_play', '正常速度'], [2, 'ui_ff2', '两倍速'], [3, 'ui_ff3', '三倍速']];
  const WX = { clear: ['w_clear', '晴'], cloudy: ['w_cloudy', '多云'], rain: ['w_rain', '雨'], storm: ['w_storm', '风暴'], fog: ['w_fog', '雾'] };
  const PHONE = { wood: 1, plastic: 1, scrap: 1, cloth: 1, kelp: 1, water: 1 };   // 手机顶栏上单独占一格的

        const chip = el('span', { class: 'chip' + (RES[r].cat !== lastCat ? ' sep' : ''), id: 'res-' + r, hidden: '', onclick: openStock }, [D.icon('i_' + r, 2), num]);
        lastCat = RES[r].cat;
        H.chips[r] = { chip, num, v: null, cls: '', shown: false };
        H.res.append(chip);
      }
      H.popNum = el('b', { text: '0' });
      H.pop = el('span', { class: 'chip sep', id: 'chip-pop', title: '居民人数', onclick: () => { TC.sfx.play('click'); TC.panel.toggle('people'); } }, [D.icon('ui_people', 2), H.popNum]);
      H.moodNum = el('b', { text: '0' });
      H.mood = el('span', {
        class: 'chip', id: 'chip-mood', title: '平均心情',

      }, [D.icon('i_mood', 2), H.moodNum]);

      const speed = el('span', { class: 'speed', role: 'group', 'aria-label': '游戏速度' });
      for (const [v, ico, label] of SPEEDS) {
        const b = el('button', {

      }
      H.soundBtn = el('button', {

      H.menuBtn = el('button', {

        onclick: () => TC.panel.toggle('menu'),
      }, [D.icon('ui_menu', 2)]);

      // 电力：发了多少、用了多少、存着多少（有了发电或用电的建筑才出现）

      H.power = el('span', { class: 'chip', id: 'chip-power', hidden: '', onclick: () => app.toast('电力：发电 / 用电，括号里是蓄电池存着的。发的不够用，净水机、探照灯会停', '', true) }, [D.icon('i_power', 2), H.powerNum]);
      // 警钟：有了警钟才出现。敲一下大家进屋，再敲一下解除

        TC.hud.update(app.S, app.C, app);
      } }, [D.icon('ui_bell', 2)]);
      H.ctl = el('div', { class: 'ctl' }, [H.clock, H.alertBtn, speed, H.soundBtn, H.menuBtn]);
      H.bar = el('div', { class: 'topbar' }, [H.res, H.ctl]);

      H.buildBtn = el('button', { class: 'btn', type: 'button', id: 'btn-build', onclick: () => TC.panel.toggle('build') }, [D.icon('ui_build', 2), '建造']);
      H.peopleBtn = el('button', { class: 'btn', type: 'button', id: 'btn-people', onclick: () => TC.panel.toggle('people') }, [D.icon('ui_people', 2), '居民']);
      H.labBtn = el('button', { class: 'btn', type: 'button', id: 'btn-research', hidden: '', onclick: () => TC.panel.toggle('research') }, [D.icon('ui_lab', 2), '研究']);
      H.chartBtn = el('button', { class: 'btn', type: 'button', id: 'btn-chart', hidden: '', onclick: () => { TC.sfx.play('click'); TC.chartui.toggle(); } }, [D.icon('ui_chart', 2), '海图']);
      H.skillNum = el('b', { class: 'badge', hidden: '' });
      H.skillBtn = el('button', { class: 'btn', type: 'button', id: 'btn-skills', hidden: '', onclick: () => TC.panel.toggle('skills') }, [D.icon('ui_skill', 2), '技能', H.skillNum]);
      H.factionBtn = el('button', { class: 'btn', type: 'button', id: 'btn-factions', hidden: '', onclick: () => TC.panel.toggle('factions') }, [D.icon('ui_flag', 2), '势力']);
      H.bottom = el('div', { class: 'bottombar' }, [H.buildBtn, H.peopleBtn, H.labBtn, H.skillBtn, H.factionBtn, H.chartBtn]);
      root.append(H.bar);
    },

    update(S, C, app) {
      const D = TC.dom, RES = TC.data.res, pop = S.residents.length, phone = app.layout === 'phone';
      const compact = phone || app.short;        // 地方小：顶栏只留最要紧的几样物资，食物合成一格
      const noFood = !TC.stock.bestFood(S);
      if (H.placed !== app.layout) {
        // 人口、心情、电力：手机上跟在物资后面，电脑上放到右边那一排
        H.placed = app.layout;
        if (phone) H.res.append(H.pop, H.mood, H.power);
        else H.ctl.prepend(H.pop, H.mood, H.power);
      }
      let food = 0;
      for (const r of TC.data.resOrder) {
        const c = H.chips[r], v = S.stock[r] || 0, cap = TC.stock.cap(C, r), cat = RES[r].cat;
        if (cat === 'food') food += v;
        const show = !!S.seen[r] && (!compact || !!PHONE[r]);
        if (show !== c.shown) { c.shown = show; c.chip.hidden = !show; }
        if (c.v !== v) {
          if (c.v !== null && v > c.v && show) {
            c.chip.classList.remove('gain');
            void c.chip.offsetWidth;        // 让动画从头再放一遍
            c.chip.classList.add('gain');
          }
          c.v = v;
          c.num.textContent = v;
        }
        const cls = v >= cap ? 'full' : (cat === 'water' && v < pop) || (cat === 'food' && noFood) ? 'low' : '';
        if (cls !== c.cls) {
          if (c.cls) c.chip.classList.remove(c.cls);
          if (cls) c.chip.classList.add(cls);
          c.cls = cls;
        }
        const tip = cat === 'key' ? RES[r].name + ' ' + v : RES[r].name + ' ' + v + ' / ' + cap;
        if (c.tip !== tip) { c.tip = tip; c.chip.title = tip; }
      }
      if (compact && !H.stockHint && !app.noSave) {
        for (const r of TC.data.resOrder) {
          if (!S.seen[r] || PHONE[r] || RES[r].cat !== 'mat') continue;
          H.stockHint = true;
          if (!TC.store.get('tidalcity.hint.stock')) {
            TC.store.set('tidalcity.hint.stock', 1);
            app.toast('有了' + RES[r].name + '。点顶栏任意一格物资，可以看全部库存');
          }
          break;
        }
      }
      if (H.food.hidden !== !compact) H.food.hidden = !compact;
      D.setText(H.foodNum, String(food));
      H.food.classList.toggle('low', noFood);
      const popCap = TC.data.balance.levels.pop[S.progress.level];
      D.setText(H.popNum, phone ? String(pop) : pop + '/' + popCap);
      if (H.popTip !== popCap) { H.popTip = popCap; H.pop.title = '居民人数（这一级最多 ' + popCap + ' 人）'; }
      let mood = 0;
      for (const r of S.residents) mood += r.mood;
      D.setText(H.moodNum, pop ? String(Math.round(mood / pop / 100)) : '–');

      const h = TC.clock.hourF(S), hot = S.weather.kind === 'clear' && S.weather.heat > S.tick, wx = hot ? ['w_heat', '酷热'] : WX[S.weather.kind] || WX.clear;
      const ico = S.weather.kind === 'clear' && !hot && (h >= 19.5 || h < 5.5) ? 'w_night' : wx[0];
      if (H.wxName !== ico) { H.wxName = ico; H.wxIcon.src = TC.atlas.url(ico, 1); H.clock.title = wx[1]; }
      // 电力和警钟
      const hasPower = C.n.windmill + C.n.solar + C.n.battery + C.n.purifier + C.n.searchlight > 0;
      if (H.power.hidden !== !hasPower) H.power.hidden = !hasPower;
      if (hasPower) {
        const P = S.power, cap = TC.power.cap(C);
        D.setText(H.powerNum, P.gen + '/' + P.use + (cap ? '(' + P.e + ')' : ''));
        H.power.classList.toggle('low', P.gen + P.e < P.use || (P.use === 0 && C.n.purifier > 0 && P.gen === 0 && P.e === 0));
        H.power.title = '发电 ' + P.gen + '，用电 ' + P.use + (cap ? '，蓄电 ' + P.e + ' / ' + cap : '');
      }
      const hasBell = C.n.bell > 0 || !!S.alert;
      if (H.alertBtn.hidden !== !hasBell) H.alertBtn.hidden = !hasBell;
      H.alertBtn.classList.toggle('danger', !!S.alert);
      H.alertBtn.title = S.alert ? '警报响着：大家都躲在屋里。点一下解除' : '敲钟：让大家进屋躲避';
      D.setText(H.clockText, '第 ' + TC.clock.day(S) + ' 天 ' + TC.clock.hhmm(S));
      for (const [v, b] of H.speedBtns) b.classList.toggle('on', app.speed === v);
      H.soundBtn.classList.toggle('off', !TC.sfx.on);
      H.buildBtn.classList.toggle('on', TC.panel.cur === 'build' || !!app.tool);
      H.peopleBtn.classList.toggle('on', TC.panel.cur === 'people' || TC.panel.cur === 'person');
      H.labBtn.classList.toggle('on', TC.panel.cur === 'research');
      // 技能：得过第一点才出现；有没花的点，按钮上挂着数字
      const showSkill = S.skills.got > 0;
      if (H.skillBtn.hidden !== !showSkill) H.skillBtn.hidden = !showSkill;
      H.skillBtn.classList.toggle('on', TC.panel.cur === 'skills');
      if (H.skillNum.hidden !== !S.skills.pts) H.skillNum.hidden = !S.skills.pts;
      D.setText(H.skillNum, String(S.skills.pts));
      // 势力：到了 3 级、或者已经和哪一家打过交道，才出现
      const B0 = TC.data.balance.war.rep0, showFaction = S.progress.level >= 3 || S.factions.tide.rep !== B0 || S.factions.guild.rep !== B0 || C.n.wardock > 0;
      if (H.factionBtn.hidden !== !showFaction) H.factionBtn.hidden = !showFaction;
      H.factionBtn.classList.toggle('on', TC.panel.cur === 'factions');
      // 研究和海图：等到用得上了再出现，免得一开局就一排按钮
      const showLab = S.progress.level >= 3 || C.n.lab > 0, showChart = S.progress.level >= 2 || S.voyage.legs > 0;
      if (H.labBtn.hidden !== !showLab) H.labBtn.hidden = !showLab;
      if (H.chartBtn.hidden !== !showChart) H.chartBtn.hidden = !showChart;
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 心愿栏：左上角显示城镇等级、繁荣度、主线眼下的一步，以及进行中的心愿和进度，兼作新手引导 */
(function (TC) {
  'use strict';

  const Tr = TC.tracker = {
    rows: new Map(),
    key: '',

    init(host) {
      const el = TC.dom.el;
      Tr.lvName = el('span', { text: '' });
      Tr.lvNum = el('span', { class: 'num' });
      Tr.lvFill = el('span', { class: 'fill' });
      Tr.level = el('button', {
        class: 'wish level', type: 'button', id: 'level', title: '点一下收起或展开心愿', 'aria-expanded': 'true',
        onclick: () => {
          const folded = Tr.el.classList.toggle('folded');
          Tr.level.setAttribute('aria-expanded', folded ? 'false' : 'true');
          TC.sfx.play('click');
        },
      }, [el('span', { class: 'row' }, [Tr.lvName, Tr.lvNum]), el('span', { class: 'track' }, [Tr.lvFill])]);
      // 主线：现在走到哪一章、眼下该做什么。点一下打开主线面板
      Tr.storyHead = el('span', { class: 'head', text: '' });
      Tr.storyText = el('span', { class: 'goal', text: '' });
      Tr.story = el('button', {
        class: 'wish story', type: 'button', id: 'mainline', title: '点一下看主线',
        onclick: () => { TC.sfx.play('click'); TC.panel.toggle('story'); },
      }, [el('span', { class: 'row' }, [Tr.storyHead, el('span', { class: 'num', text: '▸' })]), Tr.storyText]);
      Tr.voyName = el('span', { text: '' });
      Tr.voyNum = el('span', { class: 'num' });
      Tr.voyFill = el('div', { class: 'fill' });
      Tr.voy = el('div', { class: 'wish voyage', id: 'voyage', hidden: '' }, [el('div', { class: 'row' }, [Tr.voyName, Tr.voyNum]), el('div', { class: 'track' }, [Tr.voyFill])]);
      Tr.dangerText = el('span', { text: '' });
      Tr.danger = el('div', { class: 'wish danger', id: 'danger', hidden: '' }, [el('div', { class: 'row' }, [Tr.dangerText])]);
      Tr.list = el('div', { class: 'wishes', id: 'wishes' });
      Tr.el = el('div', { class: 'tracker', id: 'tracker', 'aria-live': 'polite' }, [Tr.level, Tr.story, Tr.danger, Tr.voy, Tr.list]);
      host.append(Tr.el);
    },

    reset() {
      Tr.rows.clear();
      Tr.key = '';
      Tr.list.replaceChildren();
    },

    update(S, C) {
      const el = TC.dom.el, D = TC.dom, P = S.progress, L = TC.data.balance.levels;
      // 等级和繁荣度
      const next = TC.progress.nextNeed(S), base = L.need[P.level];
      D.setText(Tr.lvName, P.level + ' 级 · ' + L.names[P.level]);
      D.setText(Tr.lvNum, next === null ? '繁荣 ' + P.prosperity : '繁荣 ' + P.prosperity + ' / ' + next);
      const lp = next === null ? 100 : Math.round(100 * (P.prosperity - base) / (next - base));
      if (lp !== Tr.lp) { Tr.lp = lp; Tr.lvFill.style.width = Math.max(0, Math.min(100, lp)) + '%'; }

      // 主线
      const ln = TC.storyui.line(S, C);
      D.setText(Tr.storyHead, ln.head);
      D.setText(Tr.storyText, ln.text);
      if (ln.ready !== Tr.ready) { Tr.ready = ln.ready; Tr.story.classList.toggle('ready', ln.ready); }

      // 眼前的危险：风暴要来了、正刮着；海盗靠近了、在等回话、在抢
      const st = S.weather.storm, raid = S.threat.raid, hrs = n => TC.chartui.span(Math.max(0, n) / TC.DAY);
      let warn = '';
      const boss = S.threat.boss;
      const siege = S.threat.siege;
      if (siege && !boss) warn = '战船正在攻打据点：寨子还要打 ' + Math.max(0, siege.hp) + ' 下，守军还剩 ' + siege.boats.length + ' 条船';
      else if (boss) warn = TC.data.bosses[boss.id].short + '来了！还要射中 ' + Math.max(0, boss.hp) + ' 下' + (C.n.harpoon ? '' : '（没有鱼叉架）');
      else if (!warn && S.weather.kind === 'storm' && st) warn = '风暴正刮着，还有约 ' + hrs(st.end - S.tick) + (S.alert ? '' : C.n.bell ? '。敲钟让大家进屋' : '');
      else if (raid && raid.ph === 'fight') warn = '海盗在抢东西！还有 ' + raid.boats.length + ' 条船';
      else if (raid && raid.ph === 'ask') warn = '海盗开口要东西，等你回话';
      else if (raid && raid.ph === 'warn') warn = '海盗船正在靠近，约 ' + hrs(raid.at - S.tick) + '后到';
      else if (st && st.warned) warn = '要起风暴了，约 ' + hrs(st.at - S.tick) + '后到' + (st.sev >= 3 ? '，来势很猛' : '');
      else if (S.sea.creatures.length) warn = '有鲨鱼在附近转悠' + (C.n.harpoon ? '' : '，小船出去要当心');
      if (Tr.danger.hidden !== !warn) Tr.danger.hidden = !warn;
      D.setText(Tr.dangerText, warn);

      // 航行：驶向哪里、走了多少、还要多久
      const v = S.voyage, sailing = v.to >= 0;
      if (Tr.voy.hidden !== !sailing) Tr.voy.hidden = !sailing;
      if (sailing) {
        const node = S.chart.nodes[v.to], p = TC.voyage.power(S, C), left = v.dist - v.done;
        D.setText(Tr.voyName, '驶向 ' + TC.chartui.title(node));
        D.setText(Tr.voyNum, v.ev ? '等你拿主意' : v.hold > 0 ? '耽搁中' : !p.manned ? '没人掌舵' : '约 ' + TC.chartui.span(left / Math.max(1, p.speed)));
        const vp = Math.round(100 * v.done / Math.max(1, v.dist));
        if (vp !== Tr.vp) { Tr.vp = vp; Tr.voyFill.style.width = vp + '%'; }
      }

      // 心愿
      const list = TC.progress.active(S, C);
      const key = list.map(w => w.id).join(',');
      if (key !== Tr.key) {
        Tr.key = key;
        Tr.rows.clear();
        Tr.list.replaceChildren();
        for (const w of list) {
          const num = el('span', { class: 'num' }), fill = el('div', { class: 'fill' });
          const row = el('div', { class: 'wish', id: 'wish-' + w.id }, [
            el('div', { class: 'row' }, [el('span', { text: w.text }), num]),
            w.hint ? el('div', { class: 'hint2', text: w.hint }) : null,
            el('div', { class: 'track' }, [fill]),
          ]);
          Tr.rows.set(w.id, { num, fill, w: -1 });
          Tr.list.append(row);
        }
      }
      for (const w of list) {
        const r = Tr.rows.get(w.id);
        D.setText(r.num, w.cur + ' / ' + w.need);
        const pct = Math.round(100 * w.cur / w.need);
        if (pct !== r.w) { r.w = pct; r.fill.style.width = pct + '%'; }
      }
    },
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/ui/tracker.js
</script>
<script>
/* 建造菜单：按类别列出当前能建的建筑，点一下进入放置模式。
 * 最后有一项“拆平台”，下一级要解锁的建筑列在末尾当预告。 */
(function (TC) {
  'use strict';

  const Bu = TC.buildui = {
    rows: {},
    level: 0,
    body: null,

    /* 建筑在菜单里用的图 */
    spriteOf(id) {
      const def = TC.data.buildings[id];
      if (def.place === 'water') return 'deck' + def.tile + '_0';
      if (TC.atlas.f[def.sprite] && TC.atlas.f[def.sprite].h > 16) return def.sprite;
      return def.sprite === 'b_campfire' ? 'b_campfire0' : def.sprite;
    },

    open(body) {
      Bu.body = body;
      Bu.level = 0;       // 让 update 来填内容（升级后也靠它重排）
    },

    fill(S) {
      const D = TC.dom, el = D.el, B = TC.data.buildings, app = TC.app, body = Bu.body, lvl = S.progress.level;
      Bu.rows = {};
      Bu.level = lvl + ':' + TC.tech.count(S);
      body.replaceChildren();
      body.append(el('p', { class: 'note', text: app.layout === 'phone' ? '选一样，再点地图上要放的位置。' : '选一样，再点地图上要放的位置。右键或 Esc 取消。' }));
      for (const [cat, title] of TC.data.buildCats) {
        const ids = TC.data.buildOrder.filter(id => B[id].cat === cat && B[id].level <= lvl && (!B[id].tech || TC.tech.has(S, B[id].tech)));
        if (!ids.length) continue;
        body.append(el('h4', { text: title }));
        for (const id of ids) {
          const def = B[id], costs = {}, cost = el('span', { class: 'cost' });
          for (const k in def.cost) {
            costs[k] = el('span', { title: TC.data.res[k].name }, [D.icon('i_' + k, 1), String(def.cost[k])]);
            cost.append(costs[k]);
          }
          const fresh = (def.level === lvl || def.tech) && lvl > 1 && !S.stats.built[id] && !def.tile;
          const row = el('button', { class: 'item', type: 'button', id: 'build-' + id, onclick: () => Bu.pick(id) }, [
            el('span', { class: 'pic' }, [D.icon(Bu.spriteOf(id), 2)]),
            el('span', { class: 'top' }, [el('span', { class: 'name' }, [def.name, fresh ? el('i', { class: 'new', text: '新' }) : null]), cost]),
            el('span', { class: 'desc', text: def.desc }),
          ]);
          Bu.rows[id] = { row, costs, lack: null, sel: null };
          body.append(row);
        }
        if (cat === 'deck') {
          const row = el('button', { class: 'item', type: 'button', id: 'build-unraft', onclick: () => { TC.sfx.play('click'); app.setTool('unraft'); if (app.layout === 'phone') TC.panel.close(); } }, [
            el('span', { class: 'pic' }, [D.icon('ui_close', 3)]),
            el('span', { class: 'top' }, [el('span', { class: 'name', text: '拆平台' })]),
            el('span', { class: 'desc', text: '拆掉一格空着的平台，退回一半材料。' }),
          ]);
          Bu.rows.unraft = { row, costs: {}, lack: false, sel: null };
          body.append(row);
        }
      }
      const next = TC.data.buildOrder.filter(id => B[id].level === lvl + 1 && !B[id].tech).map(id => B[id].name);
      if (next.length) body.append(el('p', { class: 'note', id: 'build-next', text: '升到 ' + (lvl + 1) + ' 级解锁：' + next.join('、') }));
    },

    pick(id) {
      const app = TC.app, def = TC.data.buildings[id];
      if (!TC.stock.has(app.S, def.cost)) {
        TC.sfx.play('deny');
        app.toast('材料不够：' + Bu.lackText(app.S, def.cost), 'bad', true);
        return;
      }
      TC.sfx.play('click');
      app.setTool(id);
      if (app.layout === 'phone') TC.panel.close();     // 手机上把抽屉收起来，露出地图
    },

    lackText(S, cost) {
      const parts = [];
      for (const k in cost) {
        const lack = cost[k] - (S.stock[k] || 0);
        if (lack > 0) parts.push(TC.data.res[k].name + '还差 ' + lack);
      }
      return parts.join('、');
    },

    update(S) {
      const B = TC.data.buildings, app = TC.app;
      if (Bu.level !== S.progress.level + ':' + TC.tech.count(S)) Bu.fill(S);
      for (const id in Bu.rows) {
        const r = Bu.rows[id], def = B[id];
        if (def) {
          let lack = false;
          for (const k in def.cost) {
            const no = (S.stock[k] || 0) < def.cost[k];
            lack = lack || no;
            r.costs[k].classList.toggle('lack', no);
          }
          if (lack !== r.lack) { r.lack = lack; r.row.classList.toggle('lack', lack); }
        }
        const sel = !!app.tool && app.tool === id;
        if (sel !== r.sel) { r.sel = sel; r.row.classList.toggle('sel', sel); }
      }
    },
  };

  TC.panel.register('build', { title: '建造', open: Bu.open, update: Bu.update });
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/ui/build.js
</script>
<script>
/* 仓储面板：所有见过的物资，现有多少、能放多少；加工品可以在这里调“库存目标”
 * （居民把某样东西做到目标数量就停手，去干别的）。建筑详情里用的也是这里的加减按钮。 */
(function (TC) {
  'use strict';

  const Sk = TC.stockui = {
    rows: {},
    key: '',
    body: null,
    defaults: null,

    /* 哪些资源有可调的库存目标：资源 → 默认目标 */
    targets() {
      if (!Sk.defaults) {
        Sk.defaults = {};
        for (const id in TC.data.recipes) {
          const rec = TC.data.recipes[id];
          if (rec.keepN !== undefined) for (const k in rec.out) Sk.defaults[k] = rec.keepN;
        }
      }
      return Sk.defaults;
    },

    targetOf(S, res) {
      const t = S.targets[res];
      return t !== undefined ? t : Sk.targets()[res];
    },

    /* 库存目标的加减按钮。返回 {el, num}：num 里的字由调用方每次刷新时填 */
    stepper(res, prefix) {
      const el = TC.dom.el, name = TC.data.res[res].name, app = TC.app;
      const num = el('span', { class: 'tnum' });
      const step = d => () => {
        app.flush();                          // 连点时，上一次的改动先生效
        app.queue.push({ type: 'setTarget', res, n: Math.max(0, Math.min(300, Sk.targetOf(app.S, res) + d)) });
        app.flush();
        TC.sfx.play('click');
        TC.panel.update();
      };
      return {
        num,
        el: el('span', { class: 'stepper', title: '库存目标：做到这个数就停手' }, [
          el('button', { class: 'btn', type: 'button', id: prefix + '-' + res + '-down', 'aria-label': name + '的库存目标减少', onclick: step(-2) }, ['−']),
          num,
          el('button', { class: 'btn', type: 'button', id: prefix + '-' + res + '-up', 'aria-label': name + '的库存目标增加', onclick: step(2) }, ['+']),
        ]),
      };
    },

    open(body) {
      Sk.body = body;
      Sk.key = '';
    },

    fill(S) {
      const D = TC.dom, el = D.el, RES = TC.data.res, tg = Sk.targets();
      Sk.rows = {};
      Sk.body.replaceChildren();
      let any = false;
      for (const cat of TC.data.catOrder) {
        const ids = TC.data.resOrder.filter(r => RES[r].cat === cat && S.seen[r]);
        if (!ids.length) continue;
        Sk.body.append(el('h4', { text: TC.data.catNames[cat] }));
        for (const r of ids) {
          const num = el('span', { class: 'val' }), o = { num, tnum: null };
          const kids = [D.icon('i_' + r, 1), el('span', { text: RES[r].name }), num];
          if (tg[r] !== undefined) {
            const st = Sk.stepper(r, 'target');
            o.tnum = st.num;
            kids.push(st.el);
            any = true;
          }
          Sk.rows[r] = o;
          Sk.body.append(el('div', { class: 'stockrow' + (tg[r] !== undefined ? ' has-target' : ''), id: 'stock-' + r }, kids));
        }
      }
      Sk.body.append(el('p', { class: 'note', text: '左边是现有的数量，斜杠后面是放得下的数量。放不下的东西捞上来也会丢掉，多搭物资堆和仓库。' }));
      if (any) Sk.body.append(el('p', { class: 'note', text: '带加减号的是“库存目标”：居民把这样东西做到这个数就停手，去干别的。调到 0 就是不做。' }));
    },

    update(S, C) {
      const D = TC.dom;
      const key = TC.data.resOrder.filter(r => S.seen[r]).join(',');
      if (key !== Sk.key) { Sk.key = key; Sk.fill(S); }
      for (const r in Sk.rows) {
        const o = Sk.rows[r];
        D.setText(o.num, TC.data.res[r].cat === 'key' ? String(S.stock[r] || 0) : (S.stock[r] || 0) + ' / ' + TC.stock.cap(C, r));
        if (o.tnum) D.setText(o.tnum, '目标 ' + Sk.targetOf(S, r));
      }
    },
  };

  TC.panel.register('stock', { title: '仓储', open: Sk.open, update: Sk.update });
})(globalThis.TC = globalThis.TC || {});
