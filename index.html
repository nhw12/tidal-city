<script>
/* 模拟主干：重建缓存、走一步、状态哈希 */
(function (TC) {
  'use strict';

  /* C：由 S 推导出来的缓存，不进存档；读档或新开局后调用一次 */
  TC.sim.rebuild = function (S) {
    const C = { topoVer: 0, jobsDirty: true, dmgDirty: true };
    TC.grid.rebuild(S, C);
    TC.bld.reindex(S, C);
    return C;
  };

  /* 走一步。各系统的先后顺序是固定的 */
  TC.sim.step = function (S, C, out) {
    if (S.over) return;
    S.tick++;
    TC.sys.world(S, C, out);        // 时钟、风、天气
    TC.sys.voyage(S, C, out);       // 航行
    TC.sys.hazard(S, C, out);       // 风暴的破坏、污染
    TC.sys.threats(S, C, out);      // 鲨鱼、海盗、鱼叉
    TC.sys.boss(S, C, out);         // 正在打的 Boss
    TC.sys.war(S, C, out);          // 战船、盟友、攻打据点
    TC.sys.sea(S, C, out);          // 漂浮物
    TC.sys.power(S, C, out);        // 电力
    TC.sys.jobs(S, C, out);         // 分配任务
    TC.sys.residents(S, C, out);    // 居民的需求和行为
    TC.sys.production(S, C, out);   // 无人值守的产出
    TC.sys.market(S, C, out);       // 集市补货、行商上门
    TC.sys.progress(S, C, out);     // 心愿
    TC.sys.story(S, C, out);        // 主线
  };

  /* 连走 n 步，丢弃事件（测试和快进用） */
  TC.sim.run = function (S, C, n) {
    const out = { events: [] };
    for (let i = 0; i < n; i++) {
      TC.sim.step(S, C, out);
      out.events.length = 0;
    }
  };

  /* 状态哈希（FNV-1a）：用来验证“同种子同命令结果一致” */
  TC.sim.hash = function (S) {
    const s = JSON.stringify(S);
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/sim.js
</script>
<script>
/* 脚本玩家：用来自动跑局测平衡，也用来在浏览器里做长时间的性能测试。
 * 它只通过命令操作游戏，和真人玩家能做的事完全一样。
 *   idle     什么都不做（用来确认“不管就会出事”）
 *   default  勤快的新手：白天大约每秒点一个漂浮物，按心愿的顺序把该建的都建起来；
 *            有了舵和帆、这片海捞得差不多了就起航，一路向东；有研究台就挨个研究；
 *            搭警钟、鱼叉架、防浪板、医务棚，风暴和海盗来了就敲钟，鱼叉架够了就不给海盗东西；
 *            该有的建筑一时买不起，就替它攒着料，排在后面的不许先花掉；主线要动手的一步，做得了就做；
 *            到了集市（或者行商上门），把多得快放不下的卖掉，缺的木板、铁件、绳索、种子、药、资料买进；
 *            技能点到手就花（先后次序按种子错开）；鱼叉架够三座、有警钟，路过 Boss 就在上午把它引出来打，两回打不下来就算了；
 *            4 级起搭战船坞；停在潮民、行商会的地方就把富余的东西送一些，直到结成同盟；
 *            战船够三条（或者两条再加潮民助战），路过海盗的据点就在上午攻打，两回打不下来就算了
 *   lazy     和 default 一样勤快，只是从不设防（用来确认“没准备会吃亏，但不会卡死”）
 *   nonavy   和 default 一样，只是不搭战船坞、不送礼、不打据点（用来确认“不理会势力和军事也照样通关”） */
(function (TC) {
  'use strict';

  const N = TC.GRID;

  // 各等级想要的建筑：[种类, 数量]，按顺序补齐
  const PLAN = {
    1: [['rainbarrel', 1], ['fishing', 1], ['campfire', 1], ['still', 1], ['stockpile', 1], ['rainbarrel', 2]],
    2: [['sawbench', 1], ['ropewalk', 1], ['drying', 1], ['warehouse', 1], ['net', 1], ['plant', 1], ['flag', 1], ['shack', 1], ['helm', 1], ['sail', 1]],
    3: [['press', 1], ['smithy', 1], ['tank', 1], ['kitchen', 1], ['garden', 1], ['lights', 1], ['fishing', 2], ['net', 2],
      ['dock', 1], ['lab', 1], ['sail', 2], ['watchtower', 1], ['bell', 1], ['infirmary', 1], ['harpoon', 2],
      ['divingrack', 1], ['solarstill', 1], ['pyro', 1], ['engine', 1], ['windmill', 2], ['purifier', 1], ['battery', 1], ['solar', 1], ['searchlight', 1]],
    4: [['cabin', 1], ['teahouse', 1], ['statue', 1], ['tradepost', 1], ['garden', 2], ['plant', 2], ['radio', 1], ['wardock', 1], ['dock', 2], ['sail', 3], ['harpoon', 3], ['wardock', 2]],
    5: [['cabin', 2], ['warehouse', 2], ['sail', 4], ['harpoon', 4], ['wardock', 3]],
  };
  const GUARD = { bell: 1, infirmary: 1, harpoon: 1, breakwater: 1, searchlight: 1, wardock: 1 };      // 设防用的建筑：lazy 策略不造
  // 研究的先后：前几项人人都先做；后面的按种子错开，这样各局合起来每项技术都有人做
  const RESEARCH = ['diving', 'bigsail', 'tools', 'solarstill', 'windmill', 'reinforce'];
  const LATER = ['purifier', 'bignet', 'fastboat', 'solar', 'filter', 'battery', 'pyro', 'hull', 'charts', 'engine', 'searchlight', 'compost'];
  const BEACON = ['battery', 'searchlight'];        // 想“点亮拂晓”的那三分之一种子：这两项提前研究
  const HOMES = ['cabin', 'shack', 'hammock'];      // 住处从好到差
  const SELL = ['plastic', 'kelp', 'cloth', 'scrap', 'ewaste', 'fish', 'wood'];      // 多得快放不下时拿去卖的
  const BUY = [['plank', 8], ['parts', 6], ['rope', 4], ['seed', 3], ['medicine', 3], ['data', 6]];      // 不够这个数就买
  const FOOD = { fish: 1, dried: 1, grilled: 1, veg: 1, meal: 1 };
  const STORY = { tower: ['lab', 'dock', 'divingrack'], core: ['lab', 'dock', 'divingrack'] };      // 主线走到这一步时，这几座建筑排在最前面

  const Bot = TC.bot = {
    /* 一格空着的平台（没有建筑、没有工地）。edge 为真时要求挨着水。挑离城中心最近的 */
    freeDeck(S, C, edge) {
      const b = C.bbox, cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
      let best = null, bd = 1e9;
      for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
        const i = y * N + x;
        if (!S.grid.t[i] || C.occ[i]) continue;
        const side = TC.bld.waterSide(S, C, x, y);
        if (edge && side < 0) continue;
        // 普通建筑尽量往里放，把临水的格子留给钓鱼台和渔网架
        const d = Math.abs(x - cx) + Math.abs(y - cy) + (!edge && side >= 0 ? 0.5 : 0);
        if (d < bd) { bd = d; best = [x, y]; }
      }
      return best;
    },

    /* 一格适合扩建的水面：挨着平台，离城中心最近 */
    expandSpot(S, C, def) {
      const b = C.bbox, cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
      let best = null, bd = 1e9;
      for (let y = b.y0 - 1; y <= b.y1 + 1; y++) for (let x = b.x0 - 1; x <= b.x1 + 1; x++) {
        if (TC.bld.canPlace(S, C, def || 'raft', x, y) !== null) continue;
        const d = Math.abs(x - cx) + Math.abs(y - cy);
        if (d < bd) { bd = d; best = [x, y]; }
      }
      return best;
    },

    /* 立防浪板最划算的位置：一格空着的、临水的平台，能护住最多还没护住的边缘格（至少三格才值得） */
    breakSpot(S, C) {
      const edge = C.edge, cover = C.cover.slice();
      for (const b of S.buildings) {
        if (b.def !== 'breakwater') continue;                       // 还在盖的也算上
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (TC.util.inb(b.x + dx, b.y + dy)) cover[(b.y + dy) * N + b.x + dx] = 1;
      }
      let best = null, bs = 2;
      for (let i = 0; i < edge.length; i++) {
        const idx = edge[i], x = idx % N, y = (idx - x) / N;
        if (C.occ[idx] || TC.bld.waterSide(S, C, x, y) < 0) continue;
        let n = 0;
        for (let j = 0; j < edge.length; j++) {
          const e = edge[j], ex = e % N, ey = (e - ex) / N;
          if (!cover[e] && S.grid.t[e] !== 3 && Math.abs(ex - x) <= 2 && Math.abs(ey - y) <= 2) n++;
        }
        if (n > bs) { bs = n; best = [x, y]; }
      }
      return best;
    },

    /* 鱼叉架放哪儿：临水的空格里，离已有的鱼叉架最远的那一格（把四面都守住）；还没有鱼叉架就随便挑一格临水的 */
    guardSpot(S, C) {
      const have = S.buildings.filter(b => b.def === 'harpoon'), bb = C.bbox;
      if (!have.length) return Bot.freeDeck(S, C, true);
      let best = null, bd = -1;
      for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) {
        const i = y * N + x;
        if (!S.grid.t[i] || C.occ[i] || TC.bld.waterSide(S, C, x, y) < 0) continue;
        let near = 1e9;
        for (const h of have) near = Math.min(near, Math.abs(h.x - x) + Math.abs(h.y - y));
        if (near > bd) { bd = near; best = [x, y]; }
      }
      return best;
    },

    /* 这种建筑有几座（包括还在盖的） */
    countAll(S, id) {
      let n = 0;
      for (const b of S.buildings) if (b.def === id) n++;
      return n;
    },

    /* 买不买得起：hold 是替别的建筑攒着的料，不能算进来 */
    afford(S, cost, hold) {
      for (const k in cost) if ((S.stock[k] || 0) < cost[k] + ((hold && hold[k]) || 0)) return false;
      return true;
    },

    /* 这座建筑现在能不能造（等级够、技术有） */
    open(S, id) {
      const def = TC.data.buildings[id];
      return def.level <= S.progress.level && (!def.tech || TC.tech.has(S, def.tech));
    },

    /* 把一座建筑放到合适的空格上；没有空格就先扩一格。返回是否下了单 */
    tryBuild(S, C, id, cmds, hold) {
      const B = TC.data.buildings, def = B[id];
      if (!Bot.open(S, id) || !Bot.afford(S, def.cost, hold)) return false;
      const spot = id === 'harpoon' ? Bot.guardSpot(S, C) : Bot.freeDeck(S, C, def.place === 'edge');
      if (spot) { cmds.push({ type: 'build', def: id, x: spot[0], y: spot[1] }); return true; }
      if ((S.stock.wood || 0) >= (def.cost.wood || 0) + B.raft.cost.wood) {
        const e = Bot.expandSpot(S, C);
        if (e) { cmds.push({ type: 'build', def: 'raft', x: e[0], y: e[1] }); return true; }
      }
      return false;
    },

    policies: {
      idle() { return []; },

      default(S, C) { return Bot.run(S, C, true, true); },
      lazy(S, C) { return Bot.run(S, C, false, false); },
      nonavy(S, C) { return Bot.run(S, C, true, false); },
    },

    /* 勤快新手的做法。defend：设不设防；navy：理不理会势力和军事（战船坞、送礼、打据点） */
    run(S, C, defend, navy) {
        const cmds = [], B = TC.data.buildings, L = TC.data.balance.levels, lvl = S.progress.level;
        if (S.over) return cmds;

        // 海盗开口要东西：鱼叉架够两座就不给，不够就给
        const raid = S.threat.raid;
        if (raid && raid.ph === 'ask') { cmds.push({ type: 'raidAnswer', pay: defend && C.n.harpoon >= 2 ? 0 : 1 }); return cmds; }
        // 风暴或者海盗动手了：敲钟进屋；过去了就解除
        const danger = S.weather.kind === 'storm' || (raid && raid.ph === 'fight');
        if (defend && C.n.bell && danger && !S.alert) cmds.push({ type: 'alert', on: 1 });
        else if (S.alert && !danger) cmds.push({ type: 'alert', on: 0 });

        // 主线里要动手的一步：做得了就做；到了拂晓，按种子轮着选一种做得到的结局
        const story = TC.story.cur(S);
        if (story && story.act && TC.story.canAct(S, C) === null) {
          if (!story.act.ending) { cmds.push({ type: 'story' }); return cmds; }
          const order = TC.data.story.endingOrder, k = S.seed % order.length;
          for (let i = 0; i < order.length; i++) {
            const id = order[(k + order.length - i) % order.length];
            if (TC.data.story.endings[id].ok(S, C) === null) { cmds.push({ type: 'ending', id }); return cmds; }
          }
        }

        // 技能点：到手就花，哪项级数最低先学哪项；从哪一项数起按种子错开，各局合起来每项都有人学
        if (S.skills.pts > 0) {
          const order = TC.data.skillOrder, k = S.seed % order.length;
          let best = null, low = 99;
          for (let i = 0; i < order.length; i++) {
            const id = order[(k + i) % order.length], lv = TC.skill.lv(S, id);
            if (lv < TC.data.balance.skill.max && lv < low) { low = lv; best = id; }
          }
          if (best) cmds.push({ type: 'skill', id: best });
        }
        // Boss：备好了就在上午把它引出来
        const lair = TC.boss.site(S);
        if (defend && lair && Bot.wantsBoss(S, C, lair) && TC.clock.hourF(S) >= 6 && TC.clock.hourF(S) < 10 && S.weather.kind !== 'storm' && !S.weather.storm &&
          TC.boss.can(S, C, lair.id) === null) { cmds.push({ type: 'boss', sid: lair.id }); return cmds; }

        // 据点：战船够了就在上午去打
        const fort = TC.war.fortHere(S);
        // （仗在远处打，风暴只要眼下没在刮就行；上午到中午都可以出发，天黑前打得完）
        if (navy && fort && Bot.wantsFort(S, C, fort) && TC.clock.hourF(S) >= 6 && TC.clock.hourF(S) < 12 && S.weather.kind !== 'storm' &&
          TC.war.canAssault(S, C, fort.id) === null) { cmds.push({ type: 'assault', sid: fort.id }); return cmds; }
        // 送礼：停在潮民或行商会的地方，把富余的东西送一些
        const gift = navy ? Bot.gift(S, C) : null;
        if (gift) { cmds.push(gift); return cmds; }

        // 集市：多得快放不下的卖掉换旧币，缺的拿旧币买（一次一笔）
        const deal = Bot.trade(S, C);
        if (deal) { cmds.push(deal); return cmds; }

        // 航行途中遇到事：选第一个办法（捞、救、绕行、划桨）
        if (S.voyage.ev) { cmds.push({ type: 'choose', opt: 0 }); return cmds; }
        // 研究：按顺序挑第一项做得了的
        if (C.n.lab && !S.progress.tech.cur) {
          const k = S.seed % LATER.length, order = RESEARCH.concat(S.seed % 3 === 2 ? BEACON : [], LATER.slice(k), LATER.slice(0, k));
          for (let id of order) {
            if (TC.tech.has(S, id)) continue;
            while (TC.tech.can(S, C, id) === 'req') id = TC.data.tech[id].req;       // 缺前置的，先做前置
            if (TC.tech.can(S, C, id) === null) cmds.push({ type: 'research', tech: id });
            break;                                                                   // 资料不够就攒着，不跳去做后面的
          }
        }
        // 商船：换得起就换旧世界资料和铁件
        for (const s of TC.voyage.sites(S)) {
          if (!s.deals) continue;
          for (let i = 0; i < s.deals.length; i++) {
            const d = s.deals[i];
            // 换出去的东西这一轮别的命令可能正要用，所以换完这一轮就到此为止
            if ((d.get.data || d.get.parts || d.get.ewaste) && TC.voyage.canTrade(S, C, s, i) === null) { cmds.push({ type: 'trade', sid: s.id, deal: i }); return cmds; }
          }
        }
        // 起航：有舵有帆、吃喝备足；这片海捞得差不多了，或者停得够久、小船也没事可做了
        const sail = Bot.nextStop(S, C, defend, navy);
        if (sail >= 0) { cmds.push({ type: 'sail', to: sail }); return cmds; }

        // 打捞：白天每次点一个够得着、放得下的；漂来的人随时都拉
        const day = TC.clock.workTime(S);
        for (const f of S.sea.floaters) {
          if (f.tag || f.claim) continue;
          const def = TC.data.floaters[f.kind];
          if (!def.survivor && (!day || TC.stock.room(S, C, def.main) <= 0)) continue;
          if (!TC.sea.inReach(S, f, C)) continue;
          cmds.push({ type: 'hook', id: f.id });
          break;
        }

        // 建造：同时最多两个工地
        let sites = 0, beds = 0;
        for (const b of S.buildings) {
          if (b.st === 'site') sites++;
          beds += B[b.def].beds || 0;
        }
        if (sites >= 2) return cmds;
        const pop = S.residents.length;

        // 引导要求先铺 3 格
        if (S.stats.tiles + Bot.countAll(S, 'raft') < 3 && TC.stock.has(S, B.raft.cost)) {
          const e = Bot.expandSpot(S, C);
          if (e) { cmds.push({ type: 'build', def: 'raft', x: e[0], y: e[1] }); return cmds; }
        }

        // 床位：比人口多一张（给漂来的人留着），不超过这一级的人口上限
        if (beds < Math.min(pop + 1, L.pop[lvl]) && Bot.countAll(S, 'campfire') > 0) {
          for (const id of HOMES) if (Bot.tryBuild(S, C, id, cmds)) return cmds;
        }

        // 该有的建筑按顺序排好：主线眼下要用的在最前面，然后是各等级的计划
        const want = [];
        if (S.voyage.legs >= 1) want.push(['helm', 1], ['sail', 1]);      // 出过海的城，舵和帆没了要最先补上
        for (const id of (story && STORY[story.id]) || []) want.push([id, 1]);
        for (let l = 1; l <= lvl; l++) for (const it of PLAN[l] || []) want.push(it);
        // 攒料：第一座解锁了却买不起的建筑要什么，排在它后面的就得给它留着
        let hold = null;
        for (const [id, n] of want) {
          if (Bot.countAll(S, id) >= n || (!defend && GUARD[id]) || (!navy && id === 'wardock') || !Bot.open(S, id)) continue;
          if (!TC.stock.has(S, B[id].cost)) { hold = B[id].cost; break; }
        }

        // 防浪板：出了垃圾海以后，哪一段边缘还没护住就往哪儿立一块（刚出门那两段先紧着要紧的建筑）
        if (defend && lvl >= 3 && S.voyage.legs >= 1 && Bot.afford(S, B.breakwater.cost, S.voyage.legs < 3 ? hold : null)) {
          const spot = Bot.breakSpot(S, C);
          if (spot) { cmds.push({ type: 'build', def: 'breakwater', x: spot[0], y: spot[1] }); return cmds; }
        }

        // 淡水：人多了就多搭蒸馏器和雨水桶（会日晒蒸馏了就搭日晒棚）
        if (Bot.countAll(S, 'still') < Math.ceil(pop / 5) && Bot.tryBuild(S, C, 'still', cmds)) return cmds;
        if (Bot.countAll(S, 'solarstill') < Math.ceil(pop / 4) && Bot.tryBuild(S, C, 'solarstill', cmds)) return cmds;
        if (lvl >= 2 && Bot.countAll(S, 'rainbarrel') < Math.ceil(pop / 3) && Bot.tryBuild(S, C, 'rainbarrel', cmds)) return cmds;

        // 吃的：人多了，钓鱼台、渔网架、菜园箱、篝火灶跟着添
        if (lvl >= 2) {
          if (Bot.countAll(S, 'fishing') < Math.ceil(pop / 5) && Bot.tryBuild(S, C, 'fishing', cmds)) return cmds;
          if (Bot.countAll(S, 'net') < Math.ceil(pop / 5) && Bot.tryBuild(S, C, 'net', cmds)) return cmds;
          if (Bot.countAll(S, 'campfire') < Math.ceil(pop / 9) && Bot.tryBuild(S, C, 'campfire', cmds)) return cmds;
          if (lvl >= 3 && Bot.countAll(S, 'garden') < Math.ceil(pop / 6) && Bot.tryBuild(S, C, 'garden', cmds)) return cmds;
          if (Bot.countAll(S, 'drying') < Math.ceil(pop / 8) && Bot.tryBuild(S, C, 'drying', cmds)) return cmds;
        }

        // 把该有的建筑补齐：排在“正在攒料的那座”前面的随便花，后面的得给它留着
        let saving = null;
        for (const [id, n] of want) {
          if (Bot.countAll(S, id) >= n || (!defend && GUARD[id]) || (!navy && id === 'wardock') || !Bot.open(S, id)) continue;
          if (Bot.tryBuild(S, C, id, cmds, saving)) return cmds;
          if (!saving && !TC.stock.has(S, B[id].cost)) saving = B[id].cost;
        }

        // 浮筒平台：有材料就铺两格
        if (lvl >= 3 && S.stats.pontoons < 2 && Bot.afford(S, B.pontoon.cost, hold)) {
          const e = Bot.expandSpot(S, C, 'pontoon');
          if (e) { cmds.push({ type: 'build', def: 'pontoon', x: e[0], y: e[1] }); return cmds; }
        }

        // 浮木有富余就继续往外扩（等级 3 起有“扩到多少格”的心愿）
        // 浮木先紧着锯木板：木板不缺、或者浮木多到锯不过来了，才拿去铺板
        const goal = lvl >= 5 ? 80 : lvl >= 4 ? 50 : lvl >= 3 ? 30 : 0;
        const spare = Math.max(14, TC.jobs.reserve(S, 'wood') + 8) + ((hold && hold.wood) || 0);
        if (C.deckN + C.siteAt.size < goal && (S.stock.wood || 0) >= spare && ((S.stock.plank || 0) >= 8 || (S.stock.wood || 0) >= spare + 8)) {
          const e = Bot.expandSpot(S, C);
          if (e) cmds.push({ type: 'build', def: 'raft', x: e[0], y: e[1] });
        }
        return cmds;
    },

    /* 眼前的集市（和自家的贸易站）有没有该做的买卖：返回一条命令，没有返回 null */
    trade(S, C) {
      const Mk = TC.market, list = [];
      if (S.voyage.to < 0) for (const s of TC.voyage.sites(S)) if (s.market) list.push(s.id);
      if (S.post && C.n.tradepost > 0) list.push(Mk.POST);
      const coin = S.stock.coin || 0;
      for (const sid of list) {
        const at = Mk.at(S, C, sid);
        if (!at || Mk.open(S, at)) continue;
        // 卖：超过容量八成的，卖到六成为止，一次最多 5 份
        for (const res of SELL) {
          const have = S.stock[res] || 0, cap = TC.stock.cap(C, res);
          if (have < cap * 0.8) continue;
          for (let k = Math.min(5, have - Math.floor(cap * 0.6)); k >= 1; k--) if (Mk.canSell(S, C, sid, res, k) === null) return { type: 'sell', sid, res, n: k };
        }
        // 买：缺什么买什么，留 20 个旧币压箱底
        for (const [res, want] of BUY) {
          const have = S.stock[res] || 0;
          if (have >= want || !(at.m.goods[res] > 0)) continue;
          for (let k = Math.min(want - have, at.m.goods[res], 5); k >= 1; k--) {
            if (coin - Mk.buyPrice(S, at, res) * k >= 20 && Mk.canBuy(S, C, sid, res, k) === null) return { type: 'buy', sid, res, n: k };
          }
        }
      }
      return null;
    },

    /* 送礼：还没结成同盟、正停在他们的地方，就把存得多的东西送 5 份（挑最讨好的）。吃的喝的要留够自己用的 */
    gift(S, C) {
      if (S.voyage.to >= 0) return null;
      const pop = S.residents.length;
      for (const id of TC.data.factionOrder) {
        if (TC.faction.tier(S, id) >= 2 || !TC.faction.here(S, id)) continue;
        let best = null, bv = 0;
        for (const res of TC.data.marketOrder) {
          const have = S.stock[res] || 0, cap = TC.stock.cap(C, res);
          if (have < 5 || have < cap * 0.6) continue;
          if (FOOD[res] && TC.stock.foodDays(S) < pop * 6) continue;
          if (res === 'water' && have < pop * 8) continue;
          if (res === 'plank' || res === 'parts' || res === 'rope' || res === 'data' || res === 'medicine' || res === 'seed') continue;      // 自己还缺着的不送
          const v = TC.faction.giftValue(id, res, 5);
          if (v > bv && TC.faction.canGift(S, C, id, res, 5) === null) { bv = v; best = res; }
        }
        if (best) return { type: 'gift', id, res: best, n: 5 };
        // 东西没有富余的，旧币有：留够买东西的，剩下的送
        const pack = TC.data.balance.war.coinGift;
        if ((S.stock.coin || 0) >= 300 + pack && TC.faction.canGift(S, C, id, 'coin', pack) === null) return { type: 'gift', id, res: 'coin', n: pack };
      }
      return null;
    },

    /* 这处据点打不打：出得了港的战船够三条，或者两条再加潮民助战；而且还没试够两回 */
    wantsFort(S, C, s) {
      if (s.dead || (s.tries || 0) >= 2) return false;
      const ready = TC.war.docksReady(S).length, ally = TC.faction.tier(S, 'tide') >= 2 && C.n.radio > 0;
      return ready >= 3 || (ready >= 2 && ally);
    },

    /* 这个 Boss 打不打：鱼叉架够三座（旗舰要四座）、有警钟，而且还没试够两回 */
    wantsBoss(S, C, s) {
      return !s.dead && C.n.harpoon >= (s.boss === 'flagship' ? 4 : 3) && C.n.bell > 0 && (s.tries || 0) < 2;
    },

    /* 该不该起航，去哪儿；不走返回 -1。defend：设不设防（设防的才打 Boss） */
    nextStop(S, C, defend, navy) {
      const V = TC.voyage, v = S.voyage, pop = S.residents.length;
      if (V.sailing(S) || !C.n.helm || !C.n.sail) return -1;
      const here = V.node(S), days = (S.tick - v.since) / TC.DAY, bare = TC.sea.richness(S) < 0.12;
      if (TC.stock.foodDays(S) < pop * 2 || (S.stock.water || 0) < pop * (bare ? 2 : 4)) return -1;
      const woodOk = (S.stock.wood || 0) >= Math.min(16, pop + 4);
      const dry = days >= 2.5 && !woodOk;                                    // 待了几天浮木还是攒不起来：这里木头少，再等也没用
      if (!bare && !dry && !woodOk) return -1;                               // 否则先攒够浮木再走
      let todo = false;
      for (const s of here.sites) if (C.n.dock && s.order && V.todo(S, C, s, 0)) todo = true;
      // 主线要在这儿办的事还没办完：先不走（信号塔要潜水取芯子，灯塔要送补给），实在等太久才作罢
      const st = TC.story.cur(S);
      if (st && days < 9 && ((st.id === 'core' && here.kind === 'tower') || (st.id === 'supply' && here.kind === 'lighthouse'))) return -1;
      // 这儿有个想打的 Boss：打完（或者试够了）再走
      const lair = TC.boss.site(S);
      if (S.threat.boss || (defend && lair && Bot.wantsBoss(S, C, lair) && days < 6)) return -1;
      // 这儿有处想打的据点：也是打完再走
      const fort = TC.war.fortHere(S);
      if (S.threat.siege || (navy && fort && Bot.wantsFort(S, C, fort) && days < 6)) return -1;
      // 潮民或者行商会的地方：还差一点就能结盟，多待一天接着送
      if (navy && days < 2 && Bot.gift(S, C)) return -1;
      const leave = bare || dry || (v.at === 0 ? (TC.sea.richness(S) < 0.4 || days >= 6) : (days >= 3 || (days >= 1 && !todo)));
      if (!leave) return -1;
      // 往东走：优先去有人求救的地方，其次按种子挑一个
      const next = V.links(S, v.at).map(l => S.chart.nodes[l[0]]).filter(n => n.layer > here.layer).sort((a, b) => a.id - b.id);
      if (!next.length) return -1;
      const flare = next.find(n => n.sites.some(s => s.spec));
      const boss = defend && C.n.harpoon >= 3 && C.n.bell > 0 ? next.find(n => n.seen >= 1 && n.sites.some(s => s.kind === 'boss' && !s.dead)) : null;
      const fortAt = navy && C.n.wardock >= 2 ? next.find(n => n.seen >= 1 && n.sites.some(s => s.kind === 'fort' && !s.dead && (s.tries || 0) < 2)) : null;
      const to = flare || boss || fortAt || next[(S.seed + here.layer) % next.length];
      return TC.sim.check(S, C, { type: 'sail', to: to.id }) === null ? to.id : -1;
    },

    /* 用某个策略跑 ticks 步，返回这一局的摘要 */
    play(S, C, ticks, policy, every) {
      const out = { events: [] }, fn = Bot.policies[policy || 'default'];
      const sum = { firstDeath: null, deaths: [], wishes: [], levels: {}, joined: 0, left: 0, rejects: 0, legs: [], techs: [], quests: 0, voyev: 0, evs: {}, hurt: 0, sick: 0, story: {}, ending: '', endDay: 0, boss: [], siege: [], gifts: 0, ally: {} };
      every = every || 10;
      for (let i = 0; i < ticks && !S.over; i++) {
        if (S.tick % every === 0) TC.sim.applyCommands(S, C, fn(S, C), out);
        TC.sim.step(S, C, out);
        for (const e of out.events) {
          const day = +(S.tick / TC.DAY + 1).toFixed(2);
          if (e.t === 'death') { sum.deaths.push({ day, name: e.name, why: e.why }); if (sum.firstDeath === null) sum.firstDeath = S.tick / TC.DAY + 1; }
          else if (e.t === 'wish') sum.wishes.push({ id: e.id, day });
          else if (e.t === 'level') sum.levels[e.level] = day;
          else if (e.t === 'joined') sum.joined++;
          else if (e.t === 'left') sum.left++;
          else if (e.t === 'reject') sum.rejects++;
          else if (e.t === 'arrive') sum.legs.push({ day, kind: e.kind });
          else if (e.t === 'tech') sum.techs.push({ id: e.id, day, how: e.how });
          else if (e.t === 'quest' && e.done) sum.quests++;
          else if (e.t === 'voyev') { sum.voyev++; sum.evs[e.id] = (sum.evs[e.id] || 0) + 1; }
          else if (e.t === 'hurt') sum.hurt++;
          else if (e.t === 'story') sum.story[e.id] = day;
          else if (e.t === 'ending') { sum.ending = e.id; sum.endDay = day; }
          else if (e.t === 'sick') sum.sick++;
          else if (e.t === 'siege') sum.siege.push({ day, boats: S.threat.fleet.length, docks: TC.war.docksReady(S).length, res: '' });
          else if ((e.t === 'fortwin' || e.t === 'siegeend') && sum.siege.length) { const f = sum.siege[sum.siege.length - 1]; f.res = e.t === 'fortwin' ? 'win' : e.why; f.end = day; f.left = e.hp || 0; }
          else if (e.t === 'gift') sum.gifts++;
          else if (e.t === 'faction') { if (e.tier >= 2) sum.ally[e.id] = day; }
          else if (e.t === 'bossfight') sum.boss.push({ id: e.id, day, hp0: S.threat.boss.hp, res: '' });
          else if ((e.t === 'bosswin' || e.t === 'bossaway') && sum.boss.length) { const f = sum.boss[sum.boss.length - 1]; f.res = e.t === 'bosswin' ? 'win' : e.why; f.end = day; f.left = e.hp || 0; }
        }
        out.events.length = 0;
      }
      sum.day = TC.clock.day(S);
      sum.alive = S.residents.length;
      sum.over = !!S.over;
      return sum;
    },
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 调色板：Endesga 32。字符画里一个字符代表一种颜色。 */
(function (TC) {
  'use strict';

  const HEX = {
    '0': '#181425', '1': '#262b44', '2': '#3a4466', '3': '#5a6988', '4': '#8b9bb4', '5': '#c0cbdc', '6': '#ffffff',
    '7': '#124e89', '8': '#0099db', '9': '#2ce8f5', 'a': '#193c3e', 'b': '#265c42', 'c': '#3e8948', 'd': '#63c74d',
    'e': '#ead4aa', 'f': '#e4a672', 'g': '#b86f50', 'h': '#733e39', 'i': '#3e2731', 'j': '#a22633', 'k': '#e43b44',
    'l': '#f77622', 'm': '#feae34', 'n': '#fee761', 'o': '#be4a2f', 'p': '#d77643', 'q': '#68386c', 'r': '#b55088',
    's': '#f6757a', 't': '#e8b796', 'u': '#c28569', 'v': '#ff0044',
  };
  const KEYS = Object.keys(HEX), RGB = {}, U32 = {};

  /* 像素在内存里是小端的 RGBA，所以 32 位整数的排列是 A B G R */
  function u32(r, g, b, a) { return (((a === undefined ? 255 : a) << 24) | (b << 16) | (g << 8) | r) >>> 0; }

  for (const k of KEYS) {
    const n = parseInt(HEX[k].slice(1), 16);
    RGB[k] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    U32[k] = u32(RGB[k][0], RGB[k][1], RGB[k][2]);
  }

  TC.pal = {
    HEX, KEYS, RGB, U32, u32,

    /* 把颜色写法统一成 32 位像素值：调色板字符、'#rrggbb'、'#rrggbbaa' 或已经是数值 */
    parse(v) {
      if (typeof v === 'number') return v;
      if (v[0] === '#') {
        const n = parseInt(v.slice(1, 7), 16);
        const a = v.length >= 9 ? parseInt(v.slice(7, 9), 16) : 255;
        return u32((n >> 16) & 255, (n >> 8) & 255, n & 255, a);
      }
      return U32[v];
    },

    /* 调色板里离给定颜色最近的一个（按人眼对绿更敏感加权） */
    nearest(r, g, b) {
      let best = '0', bd = Infinity;
      for (const k of KEYS) {
        const c = RGB[k];
        const dr = r - c[0], dg = g - c[1], db = b - c[2];
        const d = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
        if (d < bd) { bd = d; best = k; }
      }
      return best;
    },
  };

  /* 4×4 Bayer 抖动矩阵：用两种颜色的疏密表现过渡 */
  const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  TC.bayer = function (x, y) { return BAYER4[((y & 3) << 2) | (x & 3)]; };

<script>
/* 精灵：把字符画解析成像素，换色、翻转、描边；最后拼成一张图集供每帧贴图。
 * 解析和换色不依赖浏览器（node 里的美术检查也用它们），只有生成画布的部分需要 DOM。 */
(function (TC) {
  'use strict';

  const P = TC.pal;

  const SP = TC.spr = {
    make(w, h) { return { w, h, px: new Uint32Array(w * h) }; },

    /* rows：等宽的字符串数组；'.' 和空格是透明；map 可以把自定义字符映射到颜色 */
    parse(rows, map) {
      const h = rows.length, w = rows[0].length;
      const px = new Uint32Array(w * h);
      for (let y = 0; y < h; y++) {
        const row = rows[y];
        if (row.length !== w) throw new Error('字符画行宽不齐：第 ' + y + ' 行宽 ' + row.length + '，应为 ' + w);
        for (let x = 0; x < w; x++) {
          const ch = row[x];
          if (ch === '.' || ch === ' ') continue;
          const v = map && map[ch] !== undefined ? P.parse(map[ch]) : P.U32[ch];
          if (v === undefined) throw new Error('字符画里有未知的颜色字符 "' + ch + '"');
          px[y * w + x] = v;
        }
      }
      return { w, h, px };
    },

    /* map：{'k': '8'} 把一种颜色换成另一种 */
    recolor(spr, map) {
      const m = new Map();
      for (const a in map) m.set(P.parse(a), P.parse(map[a]));
      const px = new Uint32Array(spr.px.length);
      for (let i = 0; i < px.length; i++) { const v = spr.px[i]; px[i] = m.has(v) ? m.get(v) : v; }
      return { w: spr.w, h: spr.h, px };
    },

    flipH(spr) {
      const px = new Uint32Array(spr.px.length);
      for (let y = 0; y < spr.h; y++) for (let x = 0; x < spr.w; x++) px[y * spr.w + x] = spr.px[y * spr.w + spr.w - 1 - x];
      return { w: spr.w, h: spr.h, px };
    },

    /* 逆时针转 90 度：站着的人变成头朝左躺着 */
    rot90(spr) {
      const w = spr.h, h = spr.w, px = new Uint32Array(w * h);
      for (let y = 0; y < spr.h; y++) for (let x = 0; x < spr.w; x++) px[(spr.w - 1 - x) * w + y] = spr.px[y * spr.w + x];
      return { w, h, px };
    },

    /* 四周加一圈 1 像素描边（精灵各边变大 1 像素） */
    outline(spr, col) {
      const w = spr.w + 2, h = spr.h + 2, px = new Uint32Array(w * h);
      for (let y = 0; y < spr.h; y++) for (let x = 0; x < spr.w; x++) {
        if (!spr.px[y * spr.w + x]) continue;
        const cx = x + 1, cy = y + 1;
        px[cy * w + cx - 1] = px[cy * w + cx + 1] = px[(cy - 1) * w + cx] = px[(cy + 1) * w + cx] = col;
      }
      for (let y = 0; y < spr.h; y++) for (let x = 0; x < spr.w; x++) {
        const v = spr.px[y * spr.w + x];
        if (v) px[(y + 1) * w + x + 1] = v;
      }
      return { w, h, px };
    },

    /* 把 src 叠到 dst 的 (x, y)，透明像素跳过 */
    blit(dst, src, x, y) {
      for (let j = 0; j < src.h; j++) {
        const yy = y + j;
        if (yy < 0 || yy >= dst.h) continue;
        for (let i = 0; i < src.w; i++) {
          const xx = x + i, v = src.px[j * src.w + i];
          if (v && xx >= 0 && xx < dst.w) dst.px[yy * dst.w + xx] = v;
        }
      }
      return dst;
    },

    fill(dst, x, y, w, h, col) {
      for (let j = Math.max(0, y); j < Math.min(dst.h, y + h); j++) {
        for (let i = Math.max(0, x); i < Math.min(dst.w, x + w); i++) dst.px[j * dst.w + i] = col;
      }
      return dst;
    },

    /* 生成画布（需要浏览器） */
    canvas(spr, scale) {
      const c = document.createElement('canvas');
      c.width = spr.w;
      c.height = spr.h;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(spr.w, spr.h);
      new Uint32Array(img.data.buffer).set(spr.px);
      ctx.putImageData(img, 0, 0);
      if (!scale || scale === 1) return c;
      const big = document.createElement('canvas');
      big.width = spr.w * scale;
      big.height = spr.h * scale;
      const bctx = big.getContext('2d');
      bctx.imageSmoothingEnabled = false;
      bctx.drawImage(c, 0, 0, big.width, big.height);
      return big;
    },
  };

  /* 字符画登记处：各 art_*.js 往这里登记，artbuild.js 统一解析 */
  TC.art = {
    defs: {},
    def(name, rows, opt) {
      if (TC.art.defs[name]) throw new Error('字符画重名：' + name);
      TC.art.defs[name] = { rows, opt: opt || {} };
    },
  };

  /* 图集：所有精灵拼在一张画布上，每帧从这里贴图 */
  const A = TC.atlas = {
    items: [],
    f: {},            // 名字 → {x, y, w, h}
    src: {},          // 名字 → 精灵像素（生成图标地址时用）
    canvas: null,
    urls: {},

    add(name, spr) {
      if (A.src[name]) throw new Error('精灵重名：' + name);
      A.src[name] = spr;
      A.items.push({ name, spr });
      return spr;
    },

    has(name) { return !!A.src[name]; },

    build() {
      const W = 512;
      const items = A.items.slice().sort((a, b) => b.spr.h - a.spr.h);
      let x = 0, y = 0, rowH = 0;
      for (const it of items) {
        if (it.spr.w > W) throw new Error('精灵太宽：' + it.name);
        if (x + it.spr.w > W) { x = 0; y += rowH + 1; rowH = 0; }
        A.f[it.name] = { x, y, w: it.spr.w, h: it.spr.h };
        x += it.spr.w + 1;
        if (it.spr.h > rowH) rowH = it.spr.h;
      }
      const H = y + rowH;
      const sheet = SP.make(W, H);
      for (const it of items) SP.blit(sheet, it.spr, A.f[it.name].x, A.f[it.name].y);
      A.canvas = SP.canvas(sheet);
      A.w = W;
      A.h = H;
    },

    draw(ctx, name, x, y) {
      const f = A.f[name];
      if (f) ctx.drawImage(A.canvas, f.x, f.y, f.w, f.h, x, y, f.w, f.h);
    },

    /* 给网页元素用的图标地址（data URL），按名字和倍率缓存 */
    url(name, scale) {
      const key = name + '@' + (scale || 1);
      if (A.urls[key] !== undefined) return A.urls[key];
      let u = '';
      try { if (A.src[name]) u = SP.canvas(A.src[name], scale || 1).toDataURL(); } catch (e) { u = ''; }
      A.urls[key] = u;
      return u;
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 程序化生成的纹理：平台顶面和侧面、泡沫、光晕。
 * 只生成像素数组，不依赖浏览器；每种纹理有几个变体，让大片平台不显得重复。 */
(function (TC) {
  'use strict';

  const P = TC.pal, SP = TC.spr;
  const H = (x, y, s) => TC.rng.hash01(x, y, s);
  const c = k => P.parse(k);

  const G = TC.artgen = {
    /* 平台顶面 16×16。kind：1 木筏板、2 浮筒平台、3 钢架平台 */
    deck(kind, v) {
      const s = SP.make(16, 16), px = s.px;
      if (kind === 1) {
        // 四条横木板：亮边、板面、板缝；随机的接缝、木节和木纹
        for (let p = 0; p < 4; p++) {
          const y0 = p * 4;
          for (let x = 0; x < 16; x++) {
            px[y0 * 16 + x] = c('f');
            px[(y0 + 1) * 16 + x] = c(H(x + v * 31, p, 4) < 0.14 ? 'f' : 'g');
            px[(y0 + 2) * 16 + x] = c(H(x + v * 17, p, 5) < 0.1 ? 'u' : 'g');
            px[(y0 + 3) * 16 + x] = c('h');
          }
          if (H(v, p, 2) < 0.7) {
            const sx = 1 + Math.floor(H(v, p, 1) * 14);
            for (let j = 0; j < 3; j++) px[(y0 + j) * 16 + sx] = c('h');
          }
          if (H(v, p, 3) < 0.35) px[(y0 + 1) * 16 + 1 + Math.floor(H(v, p, 6) * 14)] = c('h');
        }
      } else if (kind === 2) {
        // 浅色板材铺面，四角有铆钉
        for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
          let col = H(x + v * 13, y, 7) < 0.02 ? '6' : '5';
          if (x % 8 === 7 || y % 8 === 7) col = '4';
          else if ((x % 8 === 0 || x % 8 === 6) && (y % 8 === 0 || y % 8 === 6)) col = '3';
          px[y * 16 + x] = c(col);
        }
      } else {
        // 钢格栅
        for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
          let col = '3';
          if (x % 4 === 3 || y % 4 === 3) col = '2';
          else if (x % 4 === 0 && y % 4 === 0) col = '4';
          if (H(x + v * 7, y, 8) < 0.012) col = 'o';   // 零星锈斑
          px[y * 16 + x] = c(col);
        }
      }
      return s;
    },

    /* 平台南侧露出的侧面 16×5：俯视略带倾斜，所以只有朝南的一面看得见 */
    face(kind, v) {
      const s = SP.make(16, 5), px = s.px;
      const rows = kind === 1
        ? [['h', 'h', 'h', 'h'], ['g', 'h', 'h', 'i'], ['h', 'h', 'h', 'i'], ['h', 'h', 'i', 'i'], ['i', 'i', 'i', 'i']]            // 捆在下面的圆木
        : kind === 2
          ? [['3', '3', '3', '3', '3', '3', '3', '3'], ['7', '8', '9', '8', '8', '8', '8', '7'], ['7', '8', '8', '8', '8', '8', '8', '7'],
            ['7', '7', '8', '8', '8', '8', '7', '7'], ['1', '7', '7', '7', '7', '7', '7', '1']]                                  // 蓝色浮筒
          : [['2', '2', '2', '2'], ['1', '2', '2', '2'], ['1', '3', '3', '3'], ['1', '2', '2', '2'], ['1', '1', '1', '1']];        // 钢梁
      for (let y = 0; y < 5; y++) {
        const r = rows[y];
        for (let x = 0; x < 16; x++) px[y * 16 + x] = c(r[(x + v * 2) % r.length]);
      }
      return s;
    },

    /* 贴着船体的泡沫。side：n/s 是 16×2 的横条，w/e 是 2×16 的竖条；near 行（列）紧贴船体 */
    foam(side, f) {
      const horiz = side === 'n' || side === 's';
      const s = horiz ? SP.make(16, 2) : SP.make(2, 16);
      for (let i = 0; i < 16; i++) {
        const n = H(i + f * 5, f, 9);
        const near = (i + f * 2) % 6 < 4 ? c('6') : (n < 0.5 ? c('9') : 0);
        const far = n < 0.28 ? c('9') : 0;
        if (horiz) {
          s.px[(side === 's' ? 0 : 1) * 16 + i] = near;
          s.px[(side === 's' ? 1 : 0) * 16 + i] = far;
        } else {
          s.px[i * 2 + (side === 'e' ? 0 : 1)] = near;
          s.px[i * 2 + (side === 'e' ? 1 : 0)] = far;
        }
      }
      return s;
    },

    /* 还没盖好的平台：半透明的板子加一圈虚线 */
    siteTile() {
      const s = SP.make(16, 16), fill = P.parse('#b86f5070'), line = P.parse('e');
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const border = x === 0 || y === 0 || x === 15 || y === 15;
        s.px[y * 16 + x] = border ? (((x + y) >> 1) & 1 ? line : 0) : (y % 4 === 3 ? 0 : fill);
      }
      return s;
    },

    /* 灯火的光晕：几圈由亮到暗的暖色，圈与圈之间用抖动过渡。画在光照图上是“加亮” */
    glow(r) {
      const d = r * 2, s = SP.make(d, d);
      const LV = [0, P.u32(34, 22, 10), P.u32(80, 54, 24), P.u32(132, 94, 48), P.u32(168, 124, 68)];
      for (let y = 0; y < d; y++) for (let x = 0; x < d; x++) {
        const dx = x + 0.5 - r, dy = y + 0.5 - r;
        const t = 1 - Math.sqrt(dx * dx + dy * dy) / r;
        if (t <= 0) continue;
        const v = t * 4, base = Math.floor(v);
        const lvl = Math.min(4, base + ((v - base) * 16 > TC.bayer(x, y) ? 1 : 0));
        s.px[y * d + x] = LV[lvl];
      }
      return s;
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>

<script>
/* 启动时把所有字符画和程序化纹理解析好，登记进图集。
 * 这一步不依赖浏览器（最后的 TC.atlas.build() 才需要），node 里的美术检查直接调用 TC.artCompile()。 */
(function (TC) {
  'use strict';

  TC.artCompile = function () {
    const SP = TC.spr, A = TC.atlas, P = TC.pal, G = TC.artgen;

    // 手绘的字符画
    const defs = TC.art.defs;
    for (const name in defs) {
      const d = defs[name];
      let s = SP.parse(d.rows, d.opt.map);
      if (d.opt.outline) s = SP.outline(s, P.parse(d.opt.outline));
      A.add(name, s);
    }

    // 居民：每种外观一套帧，朝左的由朝右翻转
    const frames = TC.art.peopleFrames;
    TC.art.looks.forEach((look, i) => {
      for (const fn in frames) {
        const s = SP.parse(frames[fn], look);
        A.add('p' + i + '_' + fn, s);
        if (fn[0] === 'r') A.add('p' + i + '_l' + fn.slice(1), SP.flipH(s));
      }
      A.add('p' + i + '_lie', SP.rot90(SP.parse(frames.d0, look)));   // 睡觉时躺着
    });

    // 平台顶面和侧面
    for (let kind = 1; kind <= 3; kind++) {
      for (let v = 0; v < 4; v++) {
        A.add('deck' + kind + '_' + v, G.deck(kind, v));
        A.add('face' + kind + '_' + v, G.face(kind, v));
      }
    }

    A.add('site_tile', G.siteTile());

    // 泡沫：四个朝向各四帧
    for (const side of ['n', 's', 'w', 'e']) for (let f = 0; f < 4; f++) A.add('foam_' + side + f, G.foam(side, f));

    // 播放和快进图标：一个、两个、三个三角形并排
    const tri = A.src.ui_tri;
    for (let n = 1; n <= 3; n++) {
      const s = SP.make(tri.w * n, tri.h);
      for (let i = 0; i < n; i++) SP.blit(s, tri, i * tri.w, 0);
      A.add(n === 1 ? 'ui_play' : 'ui_ff' + n, s);
    }

    // 光晕
    A.add('glow_s', G.glow(22));
    A.add('glow_m', G.glow(38));
    A.add('glow_l', G.glow(60));
  };

  TC.artBuild = function () {
    TC.artCompile();
    TC.atlas.build();
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 镜头：整数倍缩放和坐标换算。
 * 三种坐标：
 *   世界像素  一格 16 像素，原点同城区网格左上角
 *   缓冲像素  低分辨率画布上的像素 = 世界像素 − 缓冲区原点
 *   CSS 像素  指针事件给的坐标；1 CSS 像素 = dpr 个物理像素；1 缓冲像素 = k 个物理像素 */
(function (TC) {
  'use strict';

  const T = TC.TILE, U = TC.util;

  const cam = TC.cam = {
    k: 4,              // 每个游戏像素占多少物理像素（只取整数，像素才不糊）
    dpr: 1,
    devW: 0, devH: 0,  // 画布的物理像素尺寸
    bw: 0, bh: 0,      // 低分辨率缓冲的尺寸
    x: 0, y: 0,        // 视野中心（世界像素）
    kMin: 1, kMax: 8,
    inited: false,
    bounds: { x0: 0, y0: 0, x1: TC.GRID * T, y1: TC.GRID * T },

    setViewport(devW, devH, dpr) {
      cam.devW = devW;
      cam.devH = devH;
      cam.dpr = dpr;
      cam.kMin = Math.max(1, Math.ceil(dpr * 0.75));              // 一格不小于 12 CSS 像素
      cam.kMax = Math.max(cam.kMin + 1, Math.round(dpr * 5));     // 一格不大于 80 CSS 像素
      if (!cam.inited) { cam.k = cam.defaultK(); cam.inited = true; }
      cam.k = U.clamp(cam.k, cam.kMin, cam.kMax);
      cam.bw = Math.ceil(devW / cam.k);
      cam.bh = Math.ceil(devH / cam.k);
    },

    /* 默认倍率：电脑上一格约 48 CSS 像素，手机上约 34 */
    defaultK() {
      const phone = Math.min(cam.devW, cam.devH) / cam.dpr < 600;
      return U.clamp(Math.round((phone ? 34 : 48) * cam.dpr / T), cam.kMin, cam.kMax);
    },

    /* 缓冲区左上角对应的世界像素（取整，保证像素对齐） */
    origin() { return { x: Math.round(cam.x - cam.bw / 2), y: Math.round(cam.y - cam.bh / 2) }; },

    toWorld(cssX, cssY) {
      const o = cam.origin();
      return [o.x + cssX * cam.dpr / cam.k, o.y + cssY * cam.dpr / cam.k];
    },

    toCss(wx, wy) {
      const o = cam.origin();
      return [(wx - o.x) * cam.k / cam.dpr, (wy - o.y) * cam.k / cam.dpr];
    },

    /* 切换倍率，保持指针下面的那个点不动。返回是否真的变了 */
    zoomTo(k, cssX, cssY) {
      k = U.clamp(Math.round(k), cam.kMin, cam.kMax);
      if (k === cam.k) return false;
      const w = cam.toWorld(cssX, cssY);
      cam.k = k;
      cam.bw = Math.ceil(cam.devW / k);
      cam.bh = Math.ceil(cam.devH / k);
      cam.x = w[0] - cssX * cam.dpr / k + cam.bw / 2;
      cam.y = w[1] - cssY * cam.dpr / k + cam.bh / 2;
      cam.clamp();
      return true;
    },

    panCss(dx, dy) {
      cam.x -= dx * cam.dpr / cam.k;
      cam.y -= dy * cam.dpr / cam.k;
      cam.clamp();
    },

    centerOn(wx, wy) { cam.x = wx; cam.y = wy; cam.clamp(); },

    /* 视野中心只能在城区周围一圈内活动 */
    setBoundsFromTown(bbox) {
      const m = 16;
      cam.bounds = { x0: (bbox.x0 - m) * T, y0: (bbox.y0 - m) * T, x1: (bbox.x1 + 1 + m) * T, y1: (bbox.y1 + 1 + m) * T };
      cam.clamp();
    },

    clamp() {
      const b = cam.bounds;
      cam.x = U.clamp(cam.x, b.x0, b.x1);
      cam.y = U.clamp(cam.y, b.y0, b.y1);
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 海面：启动时生成一组 128×128 的循环帧，每帧平铺整屏。
 * 纹理由三层组成：纯色的底、一道道深浅不同的横向水纹（静止在纹理上）、一闪一闪的波光。
 * 整张纹理跟着海流滚动（和漂浮物同速），所以水纹看起来在流。 */
(function (TC) {
  'use strict';

  const SIZE = 128, FRAMES = 12, FPS = 5;

  const W = TC.water = {
    SIZE, FRAMES,
    streaks: null,
    glints: null,
    canvases: [],
    patterns: [],

    makeShapes() {
      const rnd = TC.rng.local(20261110);
      W.streaks = [];
      for (let i = 0; i < 150; i++) {
        W.streaks.push({ x: rnd.int(0, SIZE - 1), y: rnd.int(0, SIZE - 1), len: rnd.int(5, 18), thick: rnd() < 0.35 ? 2 : 1, light: rnd() < 0.55 });
      }
      W.glints = [];
      for (let i = 0; i < 120; i++) {
        W.glints.push({ x: rnd.int(0, SIZE - 1), y: rnd.int(0, SIZE - 1), len: rnd.int(2, 6), phase: rnd.int(0, FRAMES - 1), life: rnd.int(4, 7), bright: rnd() < 0.3 });
      }
    },

    /* 第 f 帧的像素 */
    frame(f) {
      const P = TC.pal, s = TC.spr.make(SIZE, SIZE), px = s.px;
      const base = P.parse('#14589c'), deep = P.parse('#104a87'), lite = P.parse('#1b6bb1');
      const soft = P.parse('#3f9fe0'), spark = P.parse('#93dcf7');
      if (!W.streaks) W.makeShapes();
      px.fill(base);
      const put = (x, y, col) => { px[((y % SIZE + SIZE) % SIZE) * SIZE + ((x % SIZE + SIZE) % SIZE)] = col; };

      // 水纹：两头尖的横条，粗的那种下面再垫一行短的
      for (const k of W.streaks) {
        const col = k.light ? lite : deep;
        for (let i = 0; i < k.len; i++) put(k.x + i, k.y, col);
        if (k.thick === 2) for (let i = 2; i < k.len - 2; i++) put(k.x + i, k.y + 1, col);
      }

      // 波光：一道短弧，淡入、变亮、淡出，同时往前挪一点
      for (const g of W.glints) {
        const age = (f - g.phase + FRAMES) % FRAMES;
        if (age >= g.life) continue;
        const edge = age === 0 || age === g.life - 1;
        const col = g.bright && !edge ? spark : soft;
        const x0 = g.x + (age >> 1);
        for (let i = 0; i < g.len; i++) {
          const drop = g.len >= 4 && (i === 0 || i === g.len - 1) ? 1 : 0;
          put(x0 + i, g.y + drop, col);
        }
      }
      return s;
    },

    init(ctx) {
      W.canvases = [];
      W.patterns = [];
      for (let f = 0; f < FRAMES; f++) {
        const cv = TC.spr.canvas(W.frame(f));
        W.canvases.push(cv);
        W.patterns.push(ctx.createPattern(cv, 'repeat'));
      }
    },

    /* (ox, oy)：缓冲区原点的世界坐标；(scrollX, scrollY)：海面累计滚动了多少像素 */
    draw(ctx, bw, bh, ox, oy, time, scrollX, scrollY) {
      const f = Math.floor(time * FPS) % FRAMES;
      const tx = ((scrollX - ox) % SIZE + SIZE) % SIZE - SIZE;
      const ty = ((scrollY - oy) % SIZE + SIZE) % SIZE - SIZE;
      ctx.save();
      ctx.translate(tx, ty);
      ctx.fillStyle = W.patterns[f];
      ctx.fillRect(0, 0, bw + SIZE, bh + SIZE);
      ctx.restore();
    },
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/view/water.js
</script>
<script>
/* 浮城的地面层：把所有平台画到一张缓存画布上，只有地形变了才重画，每帧只贴一次。 */
(function (TC) {
  'use strict';

  const N = TC.GRID, T = TC.TILE, FACE = 5;
  const RIM = { 1: '#733e39', 2: '#8b9bb4', 3: '#262b44' };

  const L = TC.layers = {
    ground: null,
    gctx: null,
    ver: -1,

    init() {
      L.ground = document.createElement('canvas');
      L.ground.width = N * T + 4;
      L.ground.height = N * T + FACE + 4;
      L.gctx = L.ground.getContext('2d');
      L.ver = -1;
    },

    /* 地形版本号变了才重画 */
    sync(S, C) {
      if (L.ver === C.topoVer) return;
      L.ver = C.topoVer;
      L.redraw(S, C);
    },

    redraw(S, C) {
      const ctx = L.gctx, A = TC.atlas, t = S.grid.t;
      const at = (x, y) => (x < 0 || y < 0 || x >= N || y >= N ? 0 : t[y * N + x]);
      ctx.clearRect(0, 0, L.ground.width, L.ground.height);
      const b = C.bbox;

      // 投在水面上的影子：侧面下方和东边
      ctx.fillStyle = 'rgba(8, 18, 46, 0.38)';
      for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
        if (!at(x, y)) continue;
        if (!at(x, y + 1)) ctx.fillRect(x * T + 1, (y + 1) * T + FACE, T, 2);
        if (!at(x + 1, y)) ctx.fillRect((x + 1) * T, y * T + 2, 2, T + (at(x + 1, y + 1) ? -2 : FACE));
      }

      // 朝南的侧面
      for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
        const k = at(x, y);
        if (k && !at(x, y + 1)) A.draw(ctx, 'face' + k + '_' + (Math.floor(TC.rng.hash01(x, y, 21) * 4)), x * T, (y + 1) * T);
      }

      // 顶面
      for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
        const k = at(x, y);
        if (k) A.draw(ctx, 'deck' + k + '_' + (Math.floor(TC.rng.hash01(x, y, 20) * 4)), x * T, y * T);
      }

      // 临水的边加一道深色的沿
      for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
        const k = at(x, y);
        if (!k) continue;
        ctx.fillStyle = RIM[k];
        if (!at(x, y - 1)) ctx.fillRect(x * T, y * T, T, 1);
        if (!at(x - 1, y)) ctx.fillRect(x * T, y * T, 1, T);
        if (!at(x + 1, y)) ctx.fillRect(x * T + T - 1, y * T, 1, T);
      }
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 昼夜光照：一张和画面同样大小的光照图。
 * 先铺满当前的环境光颜色，再在灯火处“加亮”，最后用正片叠底盖到世界上。
 * 白天环境光是纯白，这一步整个跳过。 */
(function (TC) {
  'use strict';

  // 一天里的环境光关键帧：[小时, 红, 绿, 蓝]
  const KEYS = [
    [0, 62, 78, 138],      // 深夜：深蓝
    [4.5, 66, 84, 146],
    [5.5, 196, 150, 156],  // 清晨：偏暖
    [6.5, 255, 226, 204],
    [8.5, 255, 255, 255],  // 白天
    [16, 255, 250, 235],
    [18, 255, 196, 150],   // 黄昏：偏橙
    [19.5, 196, 120, 140],
    [21, 92, 96, 160],
    [24, 62, 78, 138],
  ];

  const Li = TC.light = {
    cv: null,
    ctx: null,

    init() {
      Li.cv = document.createElement('canvas');
      Li.ctx = Li.cv.getContext('2d', { alpha: false });
    },

    /* 某个时刻的环境光颜色 */
    ambient(hour) {
      hour = ((hour % 24) + 24) % 24;
      let i = 0;
      while (i < KEYS.length - 2 && hour >= KEYS[i + 1][0]) i++;
      const a = KEYS[i], b = KEYS[i + 1];
      const t = (hour - a[0]) / (b[0] - a[0]);
      return [Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t), Math.round(a[3] + (b[3] - a[3]) * t)];
    },

    isDay(amb) { return amb[0] >= 250 && amb[1] >= 250 && amb[2] >= 250; },

    begin(bw, bh, amb) {
      if (Li.cv.width !== bw || Li.cv.height !== bh) { Li.cv.width = bw; Li.cv.height = bh; }
      const ctx = Li.ctx;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgb(' + amb[0] + ',' + amb[1] + ',' + amb[2] + ')';
      ctx.fillRect(0, 0, bw, bh);
      ctx.globalCompositeOperation = 'lighter';
    },

    /* 在缓冲坐标 (x, y) 处加一团光；name：glow_s / glow_m / glow_l */
    glow(name, x, y) {
      const f = TC.atlas.f[name];
      if (f) Li.ctx.drawImage(TC.atlas.canvas, f.x, f.y, f.w, f.h, Math.round(x - f.w / 2), Math.round(y - f.h / 2), f.w, f.h);
    },

    apply(ctx) {
      ctx.globalCompositeOperation = 'multiply';
      ctx.drawImage(Li.cv, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
    },
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/view/lighting.js
</script>
<script>
/* 天气的画面效果：雨丝、风暴的闪电、雾，以及阴雨天整体压暗的系数。纯画面，不影响模拟。 */
(function (TC) {
  'use strict';

  const FACTOR = {
    clear: [1, 1, 1], cloudy: [0.9, 0.92, 0.96], rain: [0.74, 0.8, 0.9],
    storm: [0.5, 0.56, 0.7], fog: [0.86, 0.9, 0.95], heat: [1, 0.95, 0.86],
  };
  const FOG = 128;

  const Wx = TC.weatherfx = {
    f: [1, 1, 1],    // 当前的压暗系数（慢慢向目标靠拢，天气变化才不突兀）
    rain: 0,         // 当前的雨量：0 没有、1 下雨、2 以上是风暴
    fog: 0,          // 雾的浓度 0–1
    flash: 0,        // 闪电的亮度 0–1
    next: 3,         // 离下一道闪电还有几秒
    fogPat: null,

    /* kind：天气；hot：是不是酷热 */
    update(dt, kind, hot) {
      const target = FACTOR[kind === 'clear' && hot ? 'heat' : kind] || FACTOR.clear, k = Math.min(1, dt * 0.6);
      for (let i = 0; i < 3; i++) Wx.f[i] += (target[i] - Wx.f[i]) * k;
      Wx.rain += ((kind === 'storm' ? 2.4 : kind === 'rain' ? 1 : 0) - Wx.rain) * Math.min(1, dt * 0.8);
      Wx.fog += ((kind === 'fog' ? 1 : 0) - Wx.fog) * Math.min(1, dt * 0.5);
      Wx.flash = Math.max(0, Wx.flash - dt * 5);
      if (kind === 'storm') {
        Wx.next -= dt;
        if (Wx.next <= 0) { Wx.flash = 1; Wx.next = 1.5 + Math.random() * 6; TC.sfx.play('thunder'); }
      }
    },

    /* 把环境光乘上天气系数 */
    tint(amb) {
      return [Math.round(amb[0] * Wx.f[0]), Math.round(amb[1] * Wx.f[1]), Math.round(amb[2] * Wx.f[2])];
    },

    /* 雨丝：一道道斜着落下的短线，位置由序号和时间算出来，不用保存状态。风暴里更密、更斜、更快 */
    drawRain(ctx, bw, bh, time) {
      if (Wx.rain < 0.03) return;
      const heavy = Math.max(0, Math.min(1, Wx.rain - 1));
      const n = Math.min(1400, Math.floor(bw * bh / 520 * Wx.rain));
      const slant = 34 + heavy * 90, fall = 150 + heavy * 90;
      ctx.fillStyle = heavy > 0.3 ? 'rgba(190, 220, 245, 0.72)' : 'rgba(170, 212, 245, 0.6)';
      for (let i = 0; i < n; i++) {
        const sx = TC.rng.hash01(i, 11, 3), sy = TC.rng.hash01(i, 12, 3), sp = 0.8 + TC.rng.hash01(i, 13, 3) * 0.5;
        const y = (sy * (bh + 24) + time * fall * sp) % (bh + 24) - 12;
        const x = (((sx * (bw + 60) - time * slant * sp) % (bw + 60)) + bw + 60) % (bw + 60) - 30;
        ctx.fillRect(x | 0, y | 0, 1, 3);
        ctx.fillRect((x | 0) - 1, (y | 0) + 3, 1, 2);
      }
    },

    /* 雾：一张抖动出来的云絮图案，两层错开着慢慢飘 */
    drawFog(ctx, bw, bh, time) {
      if (Wx.fog < 0.03) return;
      if (!Wx.fogPat) {
        // 一团一团的云絮：团里是实心的，只有边上用抖动化开（两个像素一格，免得太碎）
        const s = TC.spr.make(FOG, FOG), col = TC.pal.parse('#dbe6f2');
        for (let y = 0; y < FOG; y++) for (let x = 0; x < FOG; x++) {
          const a = x * Math.PI * 2 / FOG, b = y * Math.PI * 2 / FOG;
          const v = 0.5 + 0.27 * Math.sin(a + Math.cos(b * 2) * 1.3) + 0.23 * Math.sin(b * 2 + Math.sin(a) * 1.6);   // 0–1 的平滑起伏，首尾相接
          if (v > 0.56 + (TC.bayer(x >> 1, y >> 1) - 7.5) / 16 * 0.2) s.px[y * FOG + x] = col;
        }
        Wx.fogPat = ctx.createPattern(TC.spr.canvas(s), 'repeat');
      }
      ctx.save();
      ctx.fillStyle = Wx.fogPat;
      for (let layer = 0; layer < 2; layer++) {
        const tx = Math.round((time * (layer ? 7 : 4)) % FOG) - FOG, ty = Math.round((time * (layer ? 1.5 : -2)) % FOG) - FOG + layer * 53;
        ctx.globalAlpha = Wx.fog * (layer ? 0.22 : 0.34);
        ctx.setTransform(1, 0, 0, 1, tx, ty);
        ctx.fillRect(0, 0, bw + FOG * 2, bh + FOG * 2);
      }
      ctx.restore();
    },

    /* 闪电：一瞬间整屏发白 */
    drawFlash(ctx, bw, bh) {
      if (Wx.flash <= 0.02) return;
      ctx.fillStyle = 'rgba(235, 244, 255, ' + (0.55 * Wx.flash).toFixed(3) + ')';
      ctx.fillRect(0, 0, bw, bh);
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 粒子和飘字：水花、打捞所得的“+2”。纯画面效果，不影响模拟。 */
(function (TC) {
  'use strict';

  const FX = TC.fx = {
    parts: [],
    pops: [],
    shots: [],       // 鱼叉射出去的线：{x0, y0, x1, y1, life}
    stamps: [],      // 短暂出现的一张图（缠上平台的触手）：{name, x, y 脚底的世界像素, life}
    MAX: 400,

    /* 在世界像素 (wx, wy) 溅起 n 颗水花；cols 是 CSS 颜色数组 */
    splash(wx, wy, n, cols) {
      for (let i = 0; i < n && FX.parts.length < FX.MAX; i++) {
        const a = Math.random() * Math.PI * 2, sp = 10 + Math.random() * 26;
        FX.parts.push({
          x: wx, y: wy,
          vx: Math.cos(a) * sp,
          vy: -Math.abs(Math.sin(a)) * sp - 8,
          life: 0.3 + Math.random() * 0.3,
          col: cols[(Math.random() * cols.length) | 0],
        });
      }
    },

    /* 飘字：一个图标加“+n”，delay 秒后出现 */
    pop(wx, wy, icon, n, delay) {
      if (FX.pops.length > 40) FX.pops.shift();
      FX.pops.push({ x: wx, y: wy, icon, n, t: -(delay || 0), life: 1.1 });
    },

    /* 一道从 (x0, y0) 射向 (x1, y1) 的线（世界像素），转瞬即逝 */
    shot(x0, y0, x1, y1) {
      if (FX.shots.length > 24) FX.shots.shift();
      FX.shots.push({ x0, y0, x1, y1, life: 0.16 });
    },

    /* 在 (wx, wy) 立一张图，脚底对齐，life 秒后消失 */
    stamp(name, wx, wy, life) {
      if (FX.stamps.length > 12) FX.stamps.shift();
      FX.stamps.push({ name, x: wx, y: wy, life });
    },

    update(dt) {
      for (let i = FX.stamps.length - 1; i >= 0; i--) { FX.stamps[i].life -= dt; if (FX.stamps[i].life <= 0) FX.stamps.splice(i, 1); }
      for (let i = FX.shots.length - 1; i >= 0; i--) { FX.shots[i].life -= dt; if (FX.shots[i].life <= 0) FX.shots.splice(i, 1); }
      const ps = FX.parts;
      for (let i = ps.length - 1; i >= 0; i--) {
        const p = ps[i];
        p.life -= dt;
        if (p.life <= 0) { ps[i] = ps[ps.length - 1]; ps.pop(); continue; }
        p.vy += 90 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      const pp = FX.pops;
      for (let i = pp.length - 1; i >= 0; i--) {
        pp[i].t += dt;
        if (pp[i].t >= pp[i].life) pp.splice(i, 1);
      }
    },

    draw(ctx, ox, oy) {
      const ps = FX.parts, A = TC.atlas;
      for (let i = 0; i < FX.stamps.length; i++) {
        const st = FX.stamps[i], fr = A.f[st.name];
        if (fr) A.draw(ctx, st.name, Math.round(st.x - ox) - (fr.w >> 1), Math.round(st.y - oy) - fr.h + (st.life < 0.25 ? 3 : 0));
      }
      for (let i = 0; i < FX.shots.length; i++) {
        const s = FX.shots[i];
        ctx.fillStyle = s.life > 0.08 ? '#ffffff' : '#8b9bb4';
        TC.render.line(ctx, s.x0 - ox, s.y0 - oy, s.x1 - ox, s.y1 - oy);
      }
      for (let i = 0; i < ps.length; i++) {
        const p = ps[i];
        ctx.fillStyle = p.col;
        ctx.fillRect(Math.round(p.x - ox), Math.round(p.y - oy), 1, 1);
      }
      for (let i = 0; i < FX.pops.length; i++) {
        const p = FX.pops[i];
        if (p.t < 0) continue;
        const rise = Math.round(Math.min(1, p.t / 0.5) * 12);
        let x = Math.round(p.x - ox) - 10;
        const y = Math.round(p.y - oy) - 10 - rise;
        if (p.t > p.life - 0.25 && (Math.floor(p.t * 20) & 1)) continue;   // 快消失时闪两下
        A.draw(ctx, p.icon, x, y - 3);
        x += 13;
        A.draw(ctx, p.n >= 0 ? 'n_plus' : 'n_minus', x, y);
        x += 4;
        const s = String(Math.abs(p.n));
        for (let j = 0; j < s.length; j++) { A.draw(ctx, 'n_' + s[j], x, y); x += 4; }
      }
    },
  };
})(globalThis.TC = globalThis.TC || {});
