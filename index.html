</script>
<script>
/* 军事：势力的好感度、自家的战船、盟友的船、攻打海盗的据点。
 *   S.factions = {tide: {rep}, guild: {rep}}：好感度 0–100，30 起友好，60 起同盟（送礼可以送东西，也可以送旧币）
 *   S.threat.fleet = [{id, kind 'war' 自家的战船 / 'ally' 潮民来助战的船, bid 哪座战船坞的（盟友的是 0）, x, y, hp, cd, idle 没人操船已经等了多少步}]
 *   S.threat.siege = {sid, hp, max, boats 守军的船 [{id, x, y, hp}], until 到哪一步收兵, ally 盟友来过没有}（没在攻打就是 null）
 *   据点（去处）：{kind: 'fort', hp, max, loot 打下来以后留下的东西, dead, cool, tries}
 * 战船和盟友的船自己找最近的敌人贴上去打，不用操作；打坏了自己回港，过一阵修好。 */
(function (TC) {
  'use strict';

  const SUB = TC.SUB, DIR = TC.DIR16, SPREAD = [0, 2, -2, 4, -4, 1, -1, 3, -3];      // 围上去的时候，各条船依次占的方位（相对正对着的那一个）

  const Fa = TC.faction = {
    rep(S, id) { return S.factions[id] ? S.factions[id].rep : 0; },

    /* 0 冷淡、1 友好、2 同盟 */
    tier(S, id) {
      const B = TC.data.balance.war, r = Fa.rep(S, id);
      return r >= B.allied ? 2 : r >= B.friendly ? 1 : 0;
    },

    tierName(t) { return ['冷淡', '友好', '同盟'][t]; },

    /* 好感涨 n（可以带小数，攒够 1 才算数）；跨过门槛时通知界面 */
    add(S, id, n, out) {
      const f = S.factions[id], B = TC.data.balance.war;
      if (!f || n <= 0) return;
      const before = Fa.tier(S, id);
      f.frac = (f.frac || 0) + n;
      const whole = Math.floor(f.frac);
      if (whole <= 0) return;
      f.frac = Math.round((f.frac - whole) * 1000) / 1000;
      f.rep = Math.min(B.max, f.rep + whole);
      const after = Fa.tier(S, id);
      if (after !== before) out.events.push({ t: 'faction', id, tier: after });
    },

    /* 这个去处是哪家的地方（不是谁家的返回 ''） */
    of(s) {
      if (!s) return '';
      for (const id of TC.data.factionOrder) if (TC.data.factions[id].home === s.kind) return id;
      return '';
    },

    /* 眼下停靠的地方有没有这家的去处（在他们的地方才能送礼） */
    here(S, id) {
      const ss = TC.voyage.sites(S), home = TC.data.factions[id].home;
      for (let i = 0; i < ss.length; i++) if (ss[i].kind === home) return ss[i];
      return null;
    },

    /* 送一份礼值多少好感（旧币按面值算） */
    giftValue(id, res, n) {
      const base = res === 'coin' ? 1 : TC.data.market.base[res] || 0, like = TC.data.factions[id].likes[res] || 1;
      return base * n * like / TC.data.balance.war.giftPer;
    },

    /* 能不能送礼：null 可以；gone 没有这家；where 不在他们的地方；bad 数量或东西不对；none 你没有这么多；full 已经是同盟了，不用再送 */
    canGift(S, C, id, res, n) {
      if (!S.factions[id] || !TC.data.factions[id]) return 'gone';
      if (!Number.isInteger(n) || n < 1 || n > (res === 'coin' ? 999 : 99) || !(res === 'coin' || TC.data.market.base[res])) return 'bad';
      if (!Fa.here(S, id)) return 'where';
      if ((S.stock[res] || 0) < n) return 'none';
      if (Fa.rep(S, id) >= TC.data.balance.war.max) return 'full';
      return null;
    },

    gift(S, C, id, res, n, out) {
      const before = Fa.rep(S, id);
      S.stock[res] -= n;
      S.stats.gifts += n;
      Fa.add(S, id, Fa.giftValue(id, res, n), out);
      C.jobsDirty = true;
      out.events.push({ t: 'gift', id, res, n, gain: Fa.rep(S, id) - before });
    },

    /* 在集市上成交了 coins 旧币：那家的好感跟着涨 */
    traded(S, at, coins, out) {
      const id = at.m.kind === 'post' ? 'guild' : Fa.of(at.s);
      if (id) Fa.add(S, id, coins / TC.data.balance.war.tradePer, out);
    },

    /* 两家都恨海盗：打沉海盗船、拔掉据点，两家好感一起涨 */
    both(S, n, out) { for (const id of TC.data.factionOrder) Fa.add(S, id, n, out); },

    /* 行商会给的折扣（友好一成，同盟两成）：只对商船和上门的行商有效 */
    discount(S, at) {
      const kind = at.m.kind;
      return kind === 'merchant' || kind === 'post' ? Fa.tier(S, 'guild') * TC.data.balance.war.discount : 0;
    },
  };

  const War = TC.war = {
    /* 眼下有没有仗要打（战船坞据此决定要不要人） */
    active(S) {
      const r = S.threat.raid;
      return !!S.threat.boss || !!S.threat.siege || (!!r && r.ph === 'fight');
    },

    /* 这片海域的据点（去处）：没有返回 null */
    fortIn(S, region) {
      for (const n of S.chart.nodes) if (n.region === region) for (const s of n.sites) if (s.kind === 'fort') return s;
      return null;
    },

    /* 这片海域的海盗隔多久来一趟的倍数：据点拔掉了就少一大半 */
    calm(S, region) {
      const f = War.fortIn(S, region);
      return f && f.dead ? TC.data.balance.war.calm : 1;
    },

    /* 眼下这个地点的据点（没有，或者正在航行，返回 null） */
    fortHere(S) {
      const ss = TC.voyage.sites(S);
      for (let i = 0; i < ss.length; i++) if (ss[i].kind === 'fort') return ss[i];
      return null;
    },

    /* 现在出得了港的战船坞：建好、启用、船没在修 */
    docksReady(S) {
      const list = [];
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i];
        if (b.def === 'wardock' && b.st === 'on' && b.on && S.tick >= (b.cool || 0)) list.push(b);
      }
      return list;
    },

    /* 能不能攻打：null 可以；gone 没有这个据点；dead 已经拔掉了；sailing；busy 正打着别的；cool 上回刚打过，他们还戒备着；noboat 没有出得了港的战船 */
    canAssault(S, C, sid) {
      const s = TC.voyage.site(S, sid);
      if (!s || s.kind !== 'fort') return 'gone';
      if (s.dead) return 'dead';
      if (S.voyage.to >= 0) return 'sailing';
      if (S.threat.boss || S.threat.raid || S.threat.siege) return 'busy';
      if (S.tick < (s.cool || 0)) return 'cool';
      if (!War.docksReady(S).length) return 'noboat';
      return null;
    },

    assault(S, C, sid, out) {
      const s = TC.voyage.site(S, sid), B = TC.data.balance.war;
      const sg = S.threat.siege = { sid, hp: s.hp, max: s.max, boats: [], until: S.tick + B.fortTime, ally: 0 };
      for (let i = 0; i < B.fortBoats; i++) {
        const d = DIR[(i * 5 + 2) & 15];
        sg.boats.push({ id: S.nextId++, x: Math.round(s.x + d[0] * 14), y: Math.round(s.y + d[1] * 14), hp: TC.data.balance.raid.boatHp });
      }
      s.tries = (s.tries || 0) + 1;
      S.stats.sieges++;
      C.jobsDirty = true;
      out.events.push({ t: 'siege', sid });
    },

    /* 潮民来助战：结了同盟、有电台，每场仗来一回 */
    callAllies(S, C, fight, out) {
      const B = TC.data.balance.war;
      if (fight.ally || Fa.tier(S, 'tide') < 2 || !(C.n.radio > 0)) return;
      fight.ally = 1;
      const c = TC.threat.center(C), d0 = TC.rng.int(S, 'threat', 0, 15), far = (Math.max(C.bbox.x1 - C.bbox.x0, C.bbox.y1 - C.bbox.y0) / 2 + 11) * SUB;
      for (let i = 0; i < B.allyBoats; i++) {
        const d = DIR[(d0 + i) & 15];
        S.threat.fleet.push({ id: S.nextId++, kind: 'ally', bid: 0, x: Math.round(c[0] + d[0] * far / 100), y: Math.round(c[1] + d[1] * far / 100), hp: B.boat.hp, cd: 0, idle: 0 });
      }
      out.events.push({ t: 'allies', n: B.allyBoats });
    },

    /* 眼下能打的敌人：[{o 对象（有 x, y, hp）, kind 'raid' | 'guard' | 'boss' | 'fort'}] */
    enemies(S) {
      const list = [], r = S.threat.raid, sg = S.threat.siege;
      if (r && r.ph === 'fight') for (const b of r.boats) if (b.hp > 0) list.push({ o: b, kind: 'raid' });
      if (S.threat.boss && S.threat.boss.hp > 0) list.push({ o: S.threat.boss, kind: 'boss' });
      if (sg) {
        for (const b of sg.boats) if (b.hp > 0) list.push({ o: b, kind: 'guard' });
        if (!list.some(e => e.kind === 'guard') && sg.hp > 0) {
          const s = TC.voyage.site(S, sg.sid);
          if (s) list.push({ o: { x: s.x, y: s.y, hp: sg.hp, fort: sg }, kind: 'fort' });      // 守军的船打光了才轮到寨子
        }
      }
      return list;
    },

    /* 朝 (dx, dy) 最近的那个方位（0–15） */
    facing(dx, dy) {
      let best = 0, bv = -Infinity;
      for (let k = 0; k < 16; k++) {
        const v = DIR[k][0] * dx + DIR[k][1] * dy;
        if (v > bv) { bv = v; best = k; }
      }
      return best;
    },

    /* 一条战船打坏了：回港修一阵，操船的人受点伤 */
    disable(S, C, f, out) {
      const B = TC.data.balance.war.boat;
      if (f.kind === 'war') {
        const b = C.byId.get(f.bid);
        if (b) {
          b.cool = S.tick + B.repair;
          const r = b.w ? TC.people.byId(S, b.w) : null;
          if (r) r.health = Math.max(Math.min(r.health, 300), r.health - B.hurt);
        }
      }
      out.events.push({ t: 'boatdown', kind: f.kind, x: f.x, y: f.y });
    },

    winSiege(S, C, sg, out) {
      const s = TC.voyage.site(S, sg.sid), B = TC.data.balance.war;
      S.threat.siege = null;
      if (s) {
        s.dead = 1;
        s.hp = 0;
        s.left = Object.assign({}, s.loot);
        s.order = 1;
      }
      S.stats.forts++;
      Fa.both(S, B.fort, out);
      TC.progress.gain(S, B.fortWin, out);
      TC.threat.schedule(S);                 // 这片海太平了：下一趟海盗往后推
      C.jobsDirty = true;
      out.events.push({ t: 'fortwin', sid: sg.sid, loot: s ? Object.assign({}, s.left) : {} });
    },

    /* 没打下来：收兵。寨子修好一半，他们戒备一阵 */
    endSiege(S, C, sg, why, out) {
      const s = TC.voyage.site(S, sg.sid) || TC.boss.find(S, sg.sid), B = TC.data.balance.war;
      S.threat.siege = null;
      if (s) {
        s.hp = Math.min(sg.max, Math.ceil((Math.max(0, sg.hp) + sg.max) / 2));
        s.cool = S.tick + B.fortCool;
      }
      C.jobsDirty = true;
      out.events.push({ t: 'siegeend', sid: sg.sid, why, hp: s ? s.hp : sg.max });
    },
  };

  TC.sys.war = function (S, C, out) {
    const B = TC.data.balance.war, fleet = S.threat.fleet, active = War.active(S);
    const sg = S.threat.siege, r = S.threat.raid;

    if (!active) {
      // 仗打完了：船都回港（盟友各回各家）
      if (fleet.length) { fleet.length = 0; C.jobsDirty = true; }
      return;
    }

    // 出港：有人守着、船没在修的战船坞，各放一条船
    for (let i = 0; i < S.buildings.length; i++) {
      const b = S.buildings[i];
      if (b.def !== 'wardock' || b.st !== 'on' || !b.on || !b.w || S.tick < (b.cool || 0)) continue;
      const g = TC.people.byId(S, b.w);
      if (!g || !g.task || g.task.k !== 'duty' || g.task.ph !== 1) continue;
      if (fleet.some(f => f.bid === b.id)) continue;
      const p = TC.voyage.launch(S, C, b);
      fleet.push({ id: S.nextId++, kind: 'war', bid: b.id, x: p[0], y: p[1], hp: B.boat.hp, cd: 0, idle: 0 });
      out.events.push({ t: 'sortie', bid: b.id });
    }
    // 盟友：潮民只管打海盗（来犯的海盗船、据点、海盗的旗舰），水底下的大家伙他们不碰
    const boss = S.threat.boss, fight = sg || (boss && boss.id === 'flagship' ? boss : null) || (r && r.ph === 'fight' && !(boss && boss.id !== 'flagship') ? r : null);
    if (fight) War.callAllies(S, C, fight, out);

    // 攻打据点：守军的船挡在寨子前面，打光了才轮到寨子（它们还手的机会算在 counter 里）；时间到了、或者没船了，就收兵
    if (sg) {
      if (S.voyage.to >= 0) { War.endSiege(S, C, sg, 'left', out); return; }
      for (let i = sg.boats.length - 1; i >= 0; i--) {
        if (sg.boats[i].hp > 0) continue;
        out.events.push({ t: 'sunk', x: sg.boats[i].x, y: sg.boats[i].y });
        Fa.both(S, B.sink, out);
        sg.boats.splice(i, 1);
      }
      if (sg.hp <= 0) { War.winSiege(S, C, sg, out); return; }
      // 守军的船迎上来：谁靠近寨子就朝谁划，但不离开寨子太远
      const fs = TC.voyage.site(S, sg.sid), leash2 = (B.guardLeash * SUB) * (B.guardLeash * SUB);
      for (let i = 0; fs && i < sg.boats.length; i++) {
        const g = sg.boats[i];
        let near = null, nd = Infinity;
        for (let j = 0; j < fleet.length; j++) {
          const f = fleet[j], dx = f.x - fs.x, dy = f.y - fs.y;
          if (dx * dx + dy * dy > leash2) continue;                       // 还没进到寨子跟前的不理
          const ex = f.x - g.x, ey = f.y - g.y, d = ex * ex + ey * ey;
          if (d < nd) { nd = d; near = f; }
        }
        if (near && nd > (0.8 * SUB) * (0.8 * SUB)) TC.threat.step(g, near.x, near.y, B.guardSpeed);
      }
      if (S.tick >= sg.until) { War.endSiege(S, C, sg, 'time', out); return; }
      if (!fleet.length && !War.docksReady(S).length) { War.endSiege(S, C, sg, 'beaten', out); return; }      // 战船都打坏了（船坞都在修）：只好收兵
    }

    const foes = War.enemies(S), range2 = (B.boat.range * SUB) * (B.boat.range * SUB), ctr = TC.threat.center(C), stand = B.boat.stand * SUB / 100;
    for (let i = fleet.length - 1; i >= 0; i--) {
      const f = fleet[i];
      if (f.hp <= 0) { War.disable(S, C, f, out); fleet.splice(i, 1); continue; }
      if (f.kind === 'war') {
        const b = C.byId.get(f.bid), g = b && b.w ? TC.people.byId(S, b.w) : null;
        if (!b || b.st !== 'on' || !b.on) { fleet.splice(i, 1); continue; }             // 船坞没了、停用了：回港
        if (!g || !g.task || g.task.k !== 'duty' || g.task.ph !== 1) {
          // 操船的人走开了（吃饭、喝水、换班）：船在原地等着，等太久就回港
          f.idle = (f.idle || 0) + 1;
          if (f.idle > B.boat.wait) fleet.splice(i, 1);
          continue;
        }
        f.idle = 0;
      }
      let best = null, bd = Infinity;
      for (let j = 0; j < foes.length; j++) {
        const e = foes[j], dx = e.o.x - f.x, dy = e.o.y - f.y, d = dx * dx + dy * dy;
        if (e.o.hp > 0 && d < bd) { bd = d; best = e; }
      }
      if (f.cd > 0) f.cd--;
      if (!best) continue;
      // 各占一个方位围上去，免得几条船叠在一处：打据点停在靠自家这一侧，打靠上来的海盗和 Boss 停在外侧（不往城里挤）
      const out2 = best.kind === 'raid' || best.kind === 'boss', sx = out2 ? best.o.x - ctr[0] : ctr[0] - best.o.x, sy = out2 ? best.o.y - ctr[1] : ctr[1] - best.o.y;
      const slot = DIR[(War.facing(sx, sy) + SPREAD[i % SPREAD.length]) & 15];
      const gx = Math.round(best.o.x + slot[0] * stand), gy = Math.round(best.o.y + slot[1] * stand);
      if ((gx - f.x) * (gx - f.x) + (gy - f.y) * (gy - f.y) > (0.2 * SUB) * (0.2 * SUB)) TC.threat.step(f, gx, gy, B.boat.speed);
      if (bd > range2 || f.cd > 0) continue;
      // 贴上了：打一回合
      f.cd = B.boat.every;
      const hit = TC.rng.next(S, 'threat') < (best.kind === 'boss' ? B.boat.bossHit : B.boat.hit);
      if (hit) {
        if (best.kind === 'fort') { best.o.fort.hp--; best.o.hp--; } else best.o.hp--;
      }
      if (TC.rng.next(S, 'threat') < B.counter[best.kind]) f.hp--;
      out.events.push({ t: 'clash', x: f.x, y: f.y, ex: best.o.x, ey: best.o.y, hit, kind: best.kind });
    }
  };

  /* 战船坞的值守：有仗打、船没在修的时候才要人 */
  TC.duty.war = {
    verb: '操战船',
    want(S, C, b) { return War.active(S) && S.tick >= (b.cool || 0) ? TC.data.balance.prio.urgent + 3 : 0; },
    tick(S, C, b) { return War.active(S) && S.tick >= (b.cool || 0); },
    status(S, C, b) { return S.tick < (b.cool || 0) ? 'repair' : War.active(S) ? '' : 'peace'; },
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/sys_war.js
</script>
<script>
/* 电力：风车和太阳能板发电，蓄电池存电，净水机、探照灯、研究台用电。
 * 每隔几步结算一次：发的电加上存的电，按“净水机 → 探照灯 → 研究台”的顺序供；不够的就停。
 *   S.power = {e 蓄电池里存着多少, gen 上一次结算发了多少, use 用了多少, lit 有没有亮着的探照灯}
 *   用电的建筑身上有 pw：上一次结算有没有供上电 */
(function (TC) {
  'use strict';

  const ORDER = ['purifier', 'searchlight', 'lab'];

  const Pw = TC.power = {
    /* 眼下能发多少电 */
    gen(S, C) {
      const B = TC.data.balance.power, W = S.weather, h = TC.clock.hourF(S);
      const day = h >= 6.5 && h < 18.5;
      const sun = !day ? 0 : W.kind === 'clear' ? B.sun : W.kind === 'cloudy' ? B.sun / 2 : 0;
      let g = C.n.windmill * B.wind[W.ws] + C.n.solar * sun;
      if (TC.voyage.hasSpec(S, 'electrician')) g *= B.expert;
      return Math.round(g);
    },

    cap(C) { return C.n.battery * TC.data.buildings.battery.store; },

    /* 这座建筑现在用不用电 */
    needs(S, C, b, def) {
      if (def.when === 'dark') { const h = TC.clock.hourF(S); return S.weather.kind === 'fog' || h >= 19 || h < 6; }
      if (def.when === 'lab') return !!S.progress.tech.cur && !!b.w;
      return true;
    },
  };

  TC.sys.power = function (S, C, out) {
    if (S.tick % TC.data.balance.power.every !== 0) return;
    const P = S.power, gen = Pw.gen(S, C);
    let avail = gen + P.e, use = 0, lit = 0;
    for (let k = 0; k < ORDER.length; k++) {
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i];
        if (b.def !== ORDER[k]) continue;
        const def = TC.bld.def(b);
        const on = b.st === 'on' && b.on && Pw.needs(S, C, b, def) && avail >= def.power;
        if (on) { avail -= def.power; use += def.power; if (b.def === 'searchlight') lit = 1; }
        b.pw = on ? 1 : 0;
      }
    }
    P.e = Math.min(Pw.cap(C), avail);
    P.gen = gen;
    P.use = use;
    P.lit = lit;
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/sys_power.js
</script>
<script>
/* 海面：漂浮物的生成、漂流、绕开浮城、被钩回。
 * 位置用整数（每格 1024 单位），原点同城区网格。
 * 漂浮物记录：{id, kind, x, y, u, v 自身的小速度, tag 玩家点了名, claim 认领它的居民 id, pull 正被拉向的点} */
(function (TC) {
  'use strict';

  const N = TC.GRID, SUB = TC.SUB, DIR = TC.DIR16;
  const OPEN = {};       // 航行途中的“储量”：什么都没有
  const FACE = 384;      // 平台南侧露出的侧面厚度（占 0.375 格），漂浮物不能钻进去
  const RADIUS = 300;    // 漂浮物的碰撞半径

  const Sea = TC.sea = {
    byId(S, id) {
      const fs = S.sea.floaters;
      for (let i = 0; i < fs.length; i++) if (fs[i].id === id) return fs[i];
      return null;
    },

    /* 这片海各类物资还剩多少、原来有多少。航行途中是茫茫大海，没有储量 */
    budget(S) { return S.voyage.to >= 0 ? OPEN : S.chart.nodes[S.voyage.at].budget; },
    total(S) { return S.voyage.to >= 0 ? OPEN : S.chart.nodes[S.voyage.at].total; },

    /* 当前的漂流速度（海流加风；航行时再减去浮城自己的速度，东西就迎面流过来），单位/步 */
    drift(S) {
      const B = TC.data.balance.drift, W = S.weather, flow = S.voyage.flow, hd = DIR[S.voyage.head];
      let dx = Math.round((DIR[W.cd][0] * W.cs * B.current + DIR[W.wd][0] * W.ws * B.windGain - hd[0] * flow) / 100);
      let dy = Math.round((DIR[W.cd][1] * W.cs * B.current + DIR[W.wd][1] * W.ws * B.windGain - hd[1] * flow) / 100);
      if (dx * dx + dy * dy < B.min * B.min) {
        dx = Math.round(DIR[W.cd][0] * B.min / 100);
        dy = Math.round(DIR[W.cd][1] * B.min / 100);
      }
      return [dx, dy];
    },

    /* 海面活动区：城区包围盒向外扩一圈 */
    area(S, C) {
      const m = TC.data.balance.sea.margin, b = C.bbox;
      return {
        x0: (b.x0 - m) * SUB, y0: (b.y0 - m) * SUB,
        x1: (b.x1 + 1 + m) * SUB, y1: (b.y1 + 1 + m) * SUB,
        cx: (b.x0 + b.x1 + 1) * SUB / 2, cy: (b.y0 + b.y1 + 1) * SUB / 2,
        hw: (b.x1 - b.x0 + 1) * SUB / 2, hh: (b.y1 - b.y0 + 1) * SUB / 2,
      };
    },

    solid(S, x, y) {
      const tx = Math.floor(x / SUB), ty = Math.floor(y / SUB);
      if (tx < 0 || tx >= N || ty < 0 || ty > N) return false;
      if (ty < N && S.grid.t[ty * N + tx] > 0) return true;
      return ty > 0 && S.grid.t[(ty - 1) * N + tx] > 0 && y - ty * SUB < FACE;
    },

    /* 漂浮物（带一点体积）能不能待在这里 */
    blocked(S, x, y) {
      return Sea.solid(S, x - RADIUS, y - 200) || Sea.solid(S, x + RADIUS, y - 200) ||
        Sea.solid(S, x - RADIUS, y + 200) || Sea.solid(S, x + RADIUS, y + 200);
    },

    /* 找最近平台时往四周看多少格 */
    scanR() { const B = TC.data.balance; return Math.ceil(B.sea.reach + B.skill.reach * B.skill.max) + 1; },

    /* 眼下的打捞范围（格）：起雾又没有亮着的探照灯时会缩水 */
    reach(S) {
      return (S.weather.kind === 'fog' && !S.power.lit ? TC.data.balance.weather2.fogReach : TC.data.balance.sea.reach) + TC.skill.val(S, 'reach');
    },

    /* 这个漂浮物在不在打捞范围内。给了 C 就先用城区包围盒快速排除远处的 */
    inReach(S, f, C) {
      const reach = Sea.reach(S) * SUB;
      if (C) {
        const b = C.bbox;
        if (f.x < b.x0 * SUB - reach || f.x > (b.x1 + 1) * SUB + reach || f.y < b.y0 * SUB - reach || f.y > (b.y1 + 1) * SUB + reach) return false;
      }
      return TC.grid.deckDist2(S, f.x, f.y, Sea.scanR()) <= reach * reach;
    },

    /* 城越宽，迎着海流扫过的水面越宽，漂到身边的东西也越多（和开局 3 格宽的木筏相比的倍数） */
    sweep(S, C) {
      const B = TC.data.balance.sea, d = Sea.drift(S), b = C.bbox;
      const w = Math.abs(d[0]) >= Math.abs(d[1]) ? b.y1 - b.y0 + 1 : b.x1 - b.x0 + 1;
      return (w + 2 * B.lateral) / (3 + 2 * B.lateral);
    },

    /* 这片海还剩几成物资（0–1） */
    richness(S) {
      const bud = Sea.budget(S), tot = Sea.total(S);
      let left = 0, total = 0;
      for (const k in tot) { left += bud[k] || 0; total += tot[k]; }
      return total > 0 ? left / total : 0;
    },

    pickKind(S) {
      const defs = TC.data.floaters, list = [], bud = Sea.budget(S), tot = Sea.total(S);
      const fw = (S.voyage.to < 0 && TC.data.world.kinds[S.chart.nodes[S.voyage.at].kind].fw) || OPEN;   // 这种地点特有的偏重
      let any = false;
      for (const k in defs) {
        const d = defs[k];
        if (!d.w) continue;                      // 不走权重的（漂流的人）
        const total = tot[d.main] || 0;
        const frac = total > 0 ? (bud[d.main] || 0) / total : 0;
        if (frac > 0) any = true;
        list.push([k, d.w * frac * (fw[k] === undefined ? 1 : fw[k])]);
      }
      if (!any) for (let i = 0; i < list.length; i++) list[i][1] = defs[list[i][0]].w;   // 捞空后：零星漂来什么都有可能
      return TC.rng.wpick(S, 'sea', list);
    },

    /* 在上游边上生成一个漂浮物。kind 不给就按储量和权重抽；spread 是横向散布的比例（小于 1 会更靠近城） */
    spawn(S, C, kind, spread) {
      const B = TC.data.balance.sea, R = TC.rng;
      const d = Sea.drift(S), dx = d[0], dy = d[1];
      if (!dx && !dy) return null;
      kind = kind || Sea.pickKind(S);
      if (!kind) return null;
      const A = Sea.area(S, C);
      const alongX = Math.abs(dx) >= Math.abs(dy);
      const half = (alongX ? A.hh : A.hw) + B.lateral * SUB;
      const tri = (R.next(S, 'sea') + R.next(S, 'sea') - 1) * half * (spread || 1);   // 中间密、两边疏
      let x, y;
      if (alongX) {
        x = dx > 0 ? A.x0 : A.x1;
        y = A.cy + tri - dy * (A.cx - x) / dx;      // 预先补偿侧向漂移，让它经过城边
      } else {
        y = dy > 0 ? A.y0 : A.y1;
        x = A.cx + tri - dx * (A.cy - y) / dy;
      }
      const speed = Math.max(Math.abs(dx), Math.abs(dy));
      const f = {
        id: S.nextId++,
        kind,
        x: Math.round(x),
        y: Math.round(y),
        u: Math.round((R.next(S, 'sea') * 2 - 1) * B.wobble * speed),
        v: Math.round((R.next(S, 'sea') * 2 - 1) * B.wobble * speed),
        tag: 0,
        claim: 0,
      };
      S.sea.floaters.push(f);
      return f;
    },

    /* 开局时海面上已经漂着一些东西，其中几件就在手边，免得一上来干等 */
    seed(S, C) {
      const B = TC.data.balance.sea, R = TC.rng, A = Sea.area(S, C);
      for (let i = 0; i < B.startFloaters; i++) {
        for (let tries = 0; tries < 20; tries++) {
          let x, y;
          if (i < B.startNear) {
            const dir = DIR[R.int(S, 'sea', 0, 15)], far = (1.5 + R.next(S, 'sea') * 2) * SUB;
            x = A.cx + dir[0] * (A.hw + far) / 100;
            y = A.cy + dir[1] * (A.hh + far) / 100;
          } else {
            x = A.x0 + R.next(S, 'sea') * (A.x1 - A.x0);
            y = A.y0 + R.next(S, 'sea') * (A.y1 - A.y0);
          }
          x = Math.round(x);
          y = Math.round(y);
          if (Sea.blocked(S, x, y)) continue;
          const kind = Sea.pickKind(S);
          S.sea.floaters.push({ id: S.nextId++, kind, x, y, u: 0, v: 0, tag: 0, claim: 0 });
          break;
        }
      }
    },

    /* 有空床位、人口没到上限、有余粮余水、海上没有别的漂流者：这样的日子攒够了，就漂来一个人。
     * 间隔有长有短，但不会一直等不到 */
    maybeSurvivor(S, C) {
      const L = TC.data.balance.levels, B = TC.data.balance, pop = S.residents.length;
      if (S.voyage.to >= 0) return;                                                  // 航行途中遇到的人算在途中的事件里
      if (pop >= L.pop[S.progress.level] || C.beds <= pop) return;
      if (TC.stock.foodDays(S) < pop || (S.stock.water || 0) < pop * 2) return;      // 自己都吃不饱的时候没人来投奔
      const fs = S.sea.floaters;
      for (let i = 0; i < fs.length; i++) if (fs[i].kind === 'survivor') return;
      S.sea.surv -= Math.round(B.sea.spawnEvery * (C.n.radio > 0 ? 1.6 : 1) * (TC.faction.tier(S, 'tide') >= 2 ? 1.3 : 1));      // 有电台、和潮民结了盟：来得更勤
      if (S.sea.surv > 0) return;
      S.sea.surv = TC.rng.int(S, 'event', B.survivor.every[0], B.survivor.every[1]);
      Sea.spawn(S, C, 'survivor', 0.4);
    },

    /* 漂浮物要消失了：放掉认领它的居民 */
    release(S, f) {
      if (f.claim) {
        const r = TC.people.byId(S, f.claim);
        if (r && r.task && r.task.k === 'hook' && r.task.fid === f.id) r.task = null;
      }
      f.claim = 0;
      f.tag = 0;
    },

    /* 一个人上了浮城：站到离 (x, y) 最近的那格平台上，又饿又渴。spec 不为空就是一位专家 */
    join(S, C, x, y, spec, out) {
      const e = TC.grid.nearestDeck(S, x, y, N), b = C.bbox;
      const r = TC.people.add(S, e ? e.tx : b.x0, e ? e.ty : b.y0);
      r.hunger = 4500;
      r.thirst = 4200;
      S.stats.rescued++;
      if (S.factions) TC.faction.add(S, 'tide', TC.data.balance.war.rescue, out);
      if (spec) {
        const sp = TC.data.specs[spec];
        r.spec = spec;
        r.name = sp.name;
        S.stats.specs++;
        S.quests[spec] = { step: 0, base: sp.quest[0].rel ? sp.quest[0].val(S, C) : 0, done: 0 };
        if (sp.join) TC.tech.grant(S, C, sp.join, out, spec);
        TC.voyage.reveal(S, C);
      }
      C.jobsDirty = true;
      out.events.push({ t: 'joined', id: r.id, name: r.name, tr: r.tr, spec: spec || '', x, y });
      return r;
    },

    /* 把漂浮物收上来：按种类掷出所得，计入库存（放不下的丢掉），扣减这片海的储量 */
    collect(S, C, f, out) {
      const def = TC.data.floaters[f.kind], loot = {}, bud = Sea.budget(S);
      if (def.survivor) { Sea.join(S, C, f.x, f.y, '', out); return; }
      let lost = 0;
      for (const res in def.loot) {
        const n = TC.rng.int(S, 'loot', def.loot[res][0], def.loot[res][1]);
        if (n <= 0) continue;
        const got = TC.stock.add(S, C, res, n);
        if (got > 0) loot[res] = got;
        lost += n - got;
        if (bud[res] !== undefined) bud[res] = Math.max(0, bud[res] - n);
      }
      S.stats.picked++;
      if (f.tag) S.stats.manual++;
      out.events.push({ t: 'pickup', id: f.id, kind: f.kind, x: f.x, y: f.y, loot, lost });
    },
  };

  TC.sys.sea = function (S, C, out) {
    const B = TC.data.balance.sea, fs = S.sea.floaters;
    const d = Sea.drift(S), dx = d[0], dy = d[1];
    const A = Sea.area(S, C);
    const alongX = Math.abs(dx) >= Math.abs(dy);
    const slide = Math.max(Math.abs(dx), Math.abs(dy));
    const pad = 2 * SUB;

    for (let i = fs.length - 1; i >= 0; i--) {
      const f = fs[i];
      if (f.pull) {
        const px = f.pull[0] - f.x, py = f.pull[1] - f.y;
        const dist = Math.sqrt(px * px + py * py);
        if (dist <= B.pullSpeed) {
          Sea.collect(S, C, f, out);
          Sea.release(S, f);
          fs.splice(i, 1);
        } else {
          f.x += Math.round(px / dist * B.pullSpeed);
          f.y += Math.round(py / dist * B.pullSpeed);
        }
        continue;
      }
      let nx = f.x + dx + f.u, ny = f.y + dy + f.v;
      if (Sea.blocked(S, nx, ny)) {
        // 被浮城挡住：顺着边缘往外侧滑开，像水绕过礁石
        if (alongX) { nx = f.x; ny = f.y + (f.y >= A.cy ? slide : -slide); }
        else { ny = f.y; nx = f.x + (f.x >= A.cx ? slide : -slide); }
        if (Sea.blocked(S, nx, ny)) { nx = f.x; ny = f.y; }
      }
      f.x = nx;
      f.y = ny;
      if (nx < A.x0 - pad || nx > A.x1 + pad || ny < A.y0 - pad || ny > A.y1 + pad) {
        if (TC.data.floaters[f.kind].survivor) {
          S.sea.surv = Math.min(S.sea.surv, TC.data.balance.survivor.retry);     // 没救到：下一个来得快一些
          out.events.push({ t: 'missed' });
        }
        Sea.release(S, f);
        fs.splice(i, 1);
      }
    }

    if (S.tick % B.spawnEvery === 0) {
      if (fs.length < B.maxFloaters) {
        const p = S.voyage.to >= 0 ? TC.data.balance.voyage.spawn : B.trickle + B.spawnBase * Sea.richness(S);
        if (TC.rng.next(S, 'sea') < p * Sea.sweep(S, C)) Sea.spawn(S, C);
      }
      Sea.maybeSurvivor(S, C);
    }
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 任务分配：把要干的活（盖房、生产、打捞）分给空闲的居民。
 * 默认没有固定岗位：把“居民 × 活计”按“优先级 − 路程 + 手艺加成”打分，从高到低配对，
 * 所以只要有活就不会有人闲着，擅长的人会优先拿到对口的活。
 * 玩家可以给一座建筑指定专人（只有这个人能在那儿干活），也可以调高调低它的优先级。
 * 玩家点名的漂浮物最优先，会打断手头的活立刻去钩。 */
(function (TC) {
  'use strict';

  const SUB = TC.SUB;

  function firstKey(o) { for (const k in o) return k; return null; }

  const J = TC.jobs = {
    picked: '',      // 上一次调用 want 时选中的配方

    /* 这个配方的成品库存到多少就停手 */
    target(S, rec, pop) {
      if (rec.keepN !== undefined) {
        const t = S.targets[firstKey(rec.out)];
        return t !== undefined ? t : rec.keepN;
      }
      return pop * rec.keep;
    },

    /* 留给蒸馏和做饭的原料有多少份不能动：吃的喝的都宽裕时只留最少的那点，紧张时按人头留 */
    reserve(S, k) {
      const B = TC.data.balance, pop = S.residents.length;
      if (!B.reserve[k]) return 0;
      if (TC.stock.foodDays(S) >= pop * B.reserveEase[0] && (S.stock.water || 0) >= pop * B.reserveEase[1]) return B.reserveMin;
      return Math.min(B.reserveMax, Math.max(B.reserveMin, pop * B.reserve[k]));
    },

    /* 加工类的配方（做到固定数量就停的那些）不动用留给蒸馏和做饭的原料 */
    reserved(S, rec) {
      if (rec.keepN === undefined) return false;
      for (const k in rec.in) {
        if ((S.stock[k] || 0) - rec.in[k] < J.reserve(S, k)) return true;
      }
      return false;
    },

    /* 这座建筑现在做不做这个配方：返回优先级，0 表示不做 */
    wantRecipe(S, C, b, id) {
      const rec = TC.data.recipes[id], P = TC.data.balance.prio;
      if (rec.needsWater && TC.bld.waterSide(S, C, b.x, b.y) < 0) return 0;
      if (!TC.stock.has(S, rec.in) || J.reserved(S, rec)) return 0;
      for (const k in rec.out) if (TC.stock.room(S, C, k) < rec.out[k]) return 0;      // 产出放不下就先不做
      const pop = Math.max(1, S.residents.length), have = S.stock[firstKey(rec.out)] || 0;
      if (have >= J.target(S, rec, pop)) return 0;                                      // 够用了，留着人手干别的
      let base = rec.urgent && have < pop * rec.urgent ? P.urgent : (rec.prio || 56);
      if (rec.surplus) {
        let plenty = true;
        for (const k in rec.surplus) if ((S.stock[k] || 0) < rec.surplus[k]) plenty = false;
        if (plenty) base += 3;                                                          // 这样原料多得用不完：先拿它来做
      }
      return base + (b.prio || 0) * 15;
    },

    /* 这座建筑现在要不要人来干活：返回优先级（0 表示不需要），选中的配方记在 J.picked。
     * b.batch：0 没有在做的、1 做到一半（要人）、2 人干完了正放着等（晾晒、生长，不要人） */
    want(S, C, b) {
      const def = TC.bld.def(b);
      J.picked = '';
      if (b.st !== 'on' || !b.on || !def.recipes || b.batch === 2) return 0;
      if (b.batch === 1) {
        J.picked = b.rec;
        return (TC.data.recipes[b.rec].prio || 56) + (b.prio || 0) * 15;      // 已经投了料的一批总要做完
      }
      let best = 0;
      for (let i = 0; i < def.recipes.length; i++) {
        const p = J.wantRecipe(S, C, b, def.recipes[i]);
        if (p > best) { best = p; J.picked = def.recipes[i]; }
      }
      return best;
    },

    /* 这座建筑眼下的状况，给界面显示用。返回 {code, frac 进度, rid 干活的人, rec 相关的配方}
     * code：waiting 等人来盖、building 正在盖、passive 不用人管、off 已停用、working 有人在干、paused 做到一半没人接手、
     *       curing 放着等（晾晒、生长）、nowater 没挨着水、noinput 缺原料、reserve 原料要留给蒸馏和做饭、full 放不下、enough 够用了、
     *       nohands 等人手、night 收工了；值守的建筑还有 moored 停泊中、noproject 没有在研究的项目；船坞有 boatin 船在港、boatout 船出去了 */
    status(S, C, b) {
      const def = TC.bld.def(b), RC = TC.data.recipes;
      if (b.st === 'site') return { code: b.w ? 'building' : 'waiting', frac: b.work / def.work, rid: b.w };
      if (def.passive) return { code: !b.on ? 'off' : def.place === 'edge' && TC.bld.waterSide(S, C, b.x, b.y) < 0 ? 'nowater' : def.power && !b.pw ? 'nopower' : 'passive' };
      if (def.duty) {
        // 要人值守的差事：船舵、研究台
        const D = TC.duty[def.duty];
        if (!b.on) return { code: 'off' };
        const idle = D.status(S, C, b);
        if (idle) return { code: idle };
        const frac = D.frac ? D.frac(S) : undefined;
        if (b.w) return { code: 'working', rid: b.w, frac, verb: D.verb, rec: '' };
        return { code: TC.clock.workTime(S) ? 'nohands' : 'night', frac };
      }
      if (def.boat) {
        if (!b.on) return { code: 'off' };
        return b.w ? { code: 'boatout', rid: b.w } : { code: 'boatin' };
      }
      if (def.power && !def.optional && b.on && !b.pw && TC.power.needs(S, C, b, def)) return { code: 'nopower' };
      if (!def.recipes) return { code: 'passive' };
      if (!b.on) return { code: 'off' };
      if (b.batch === 2) return { code: 'curing', frac: 1 - Math.max(0, b.wait - S.tick) / RC[b.rec].wait, rec: b.rec };
      if (b.w) return { code: 'working', rid: b.w, frac: b.batch ? b.prog / RC[b.rec].work : 0, rec: b.batch ? b.rec : '' };
      if (b.batch === 1) return { code: 'paused', frac: b.prog / RC[b.rec].work, rec: b.rec };
      if (J.want(S, C, b) > 0) return { code: TC.clock.workTime(S) ? 'nohands' : 'night', rec: J.picked };
      // 哪个配方都不做：挑一个最能说明问题的原因（够用了 > 放不下 > 原料要留着 > 缺原料）
      let code = 'noinput', rec = def.recipes[0];
      for (let i = 0; i < def.recipes.length; i++) {
        const r = RC[def.recipes[i]];
        if (r.needsWater && TC.bld.waterSide(S, C, b.x, b.y) < 0) return { code: 'nowater' };
        if (!TC.stock.has(S, r.in)) continue;
        if (J.reserved(S, r)) { if (code === 'noinput') { code = 'reserve'; rec = def.recipes[i]; } continue; }
        let full = false;
        for (const k in r.out) if (TC.stock.room(S, C, k) < r.out[k]) full = true;
        if (!full) return { code: 'enough', rec: def.recipes[i] };
        code = 'full';
        rec = def.recipes[i];
      }
      return { code, rec };
    },

    /* 现在所有等人来做的活 */
    offers(S, C) {
      const list = [], P = TC.data.balance.prio, work = TC.clock.workTime(S);
      if (S.alert) {
        // 敲了钟，大家都躲着：只有鱼叉架和战船坞还要人
        for (let i = 0; i < S.buildings.length; i++) {
          const b = S.buildings[i], def = TC.bld.def(b);
          if (b.w || b.st !== 'on' || !b.on || (def.duty !== 'guard' && def.duty !== 'war')) continue;
          const p = TC.duty[def.duty].want(S, C, b);
          if (p > 0) list.push({ k: 'duty', bid: b.id, p, b, pin: b.pin || 0 });
        }
        return list;
      }
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i];
        if (b.w) continue;                                      // 已经有人在干
        if (b.st === 'site') {
          if (work) list.push({ k: 'build', bid: b.id, p: P.build + (b.prio || 0) * 15, b, skill: 'build', pin: 0 });
        } else {
          const def = TC.bld.def(b);
          if (def.duty) {
            // 要人值守的差事（掌舵、研究）
            const p = b.on ? TC.duty[def.duty].want(S, C, b) + (b.prio || 0) * 15 : 0;
            if (p > 0 && (work || p >= P.urgent)) list.push({ k: 'duty', bid: b.id, p, b, pin: b.pin || 0 });
            continue;
          }
          const p = J.want(S, C, b);
          if (p > 0 && (work || p >= P.urgent)) list.push({ k: 'work', bid: b.id, p, b, skill: TC.data.recipes[J.picked].skill, pin: b.pin || 0 });
        }
      }
      if (work) TC.voyage.offers(S, C, list);                   // 小船的差事
      if (work) TC.hazard.offers(S, C, list);                   // 修补打坏的平台

      const fs = S.sea.floaters;
      // 居民自己顺手打捞：同一时间最多“每四个人里一个”在做（至少一个）
      let n = 0;
      for (let i = 0; i < S.residents.length; i++) {
        const t = S.residents[i].task;
        if (t && t.k === 'hook' && !t.manual && !t.rescue) n++;
      }
      const autoMax = Math.max(1, Math.floor(S.residents.length / 4));
      for (let i = 0; i < fs.length; i++) {
        const f = fs[i];
        if (f.claim || f.tag || f.pull) continue;
        const def = TC.data.floaters[f.kind];
        if (def.survivor) {
          // 漂来的人：不分白天黑夜，谁醒着谁去拉
          if (TC.sea.inReach(S, f, C)) list.push({ k: 'hook', fid: f.id, p: P.rescue, f, x: TC.grid.hit.tx, y: TC.grid.hit.ty, rescue: 1 });
          continue;
        }
        // 只考虑够得着、没人管、放得下的
        if (!work || n >= autoMax) continue;
        if (TC.stock.room(S, C, def.main) <= 0) continue;
        if (!TC.sea.inReach(S, f, C)) continue;
        list.push({ k: 'hook', fid: f.id, p: P.salvage, f, x: TC.grid.hit.tx, y: TC.grid.hit.ty });
        n++;
      }
      return list;
    },

    /* 放下手头的活（被打断、去吃饭、死亡时调用） */
    release(S, C, r) {
      const t = r.task;
      if (!t) return;
      if (t.k === 'build' || t.k === 'work' || t.k === 'duty' || t.k === 'boat') {
        const b = C.byId.get(t.bid);
        if (b && b.w === r.id) b.w = 0;
      } else if (t.k === 'hook') {
        const f = TC.sea.byId(S, t.fid);
        if (f && f.claim === r.id) { f.claim = 0; delete f.pull; }
      }
      r.task = null;
      C.jobsDirty = true;
    },

    /* 把一件活交给居民 */
    take(S, C, r, o) {
      const B = TC.data.balance.sea;
      if (o.k === 'hook') {
        o.f.claim = r.id;
        r.task = { k: 'hook', fid: o.fid, ph: 0, t: o.rescue ? B.hookAim : B.autoAim };
        if (o.rescue) r.task.rescue = 1;
      } else if (o.k === 'repair') {
        r.task = { k: 'repair', tx: o.x, ty: o.y, ph: 0, sx: o.x, sy: o.y, t: TC.data.balance.repair.work };
      } else {
        o.b.w = r.id;
        r.task = { k: o.k, bid: o.bid, ph: 0, sx: o.sx, sy: o.sy };
        if (o.k === 'boat') { r.task.sid = o.sid; r.task.act = o.act; r.task.t = 0; r.task.bx = 0; r.task.by = 0; r.task.cargo = null; }
      }
    },

    /* 把活计分给空闲的居民：所有“居民 × 活计”打分，从高到低配对 */
    assign(S, C) {
      const offers = J.offers(S, C);
      if (!offers.length) return;
      const pairs = [];
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i], t = r.task;
        if (t && t.k !== 'idle' && t.k !== 'relax' && t.k !== 'shelter') continue;
        if (r.health < 1200) continue;                           // 伤得太重，干不了活
        for (let j = 0; j < offers.length; j++) {
          const o = offers[j];
          if (o.pin && o.pin !== r.id) continue;                 // 这座建筑指定了别人
          let d, sx = 0, sy = 0;
          if (o.k === 'hook') d = TC.path.dist(S, C, r.x, r.y, o.x, o.y) < 0 ? -1 : 0;   // 抛钩不用走过去
          else if (o.k === 'repair') { d = TC.path.dist(S, C, r.x, r.y, o.x, o.y); sx = o.x; sy = o.y; }
          else {
            const s = TC.bld.stand(S, C, o.b, r.x, r.y);
            if (!s) continue;                                    // 这格平台还没挨着真正的地面，先盖别的
            d = TC.path.dist(S, C, r.x, r.y, s[0], s[1]);
            sx = s[0];
            sy = s[1];
          }
          if (d < 0) continue;
          let score = o.p - d;
          if (o.skill) score += (TC.people.skill(r, o.skill) - 1) * 40;   // 擅长的人优先
          if (o.pin === r.id) score += 30;
          pairs.push({ r, o, score, sx, sy, ri: i, oi: j });
        }
      }
      pairs.sort((a, b) => b.score - a.score || a.ri - b.ri || a.oi - b.oi);
      for (let k = 0; k < pairs.length; k++) {
        const p = pairs[k];
        if (p.o.taken || p.r.busy) continue;
        if (p.o.k === 'boat' && p.o.b.w) continue;               // 这座船坞的船这一轮已经派出去了
        p.o.taken = true;
        p.r.busy = true;
        p.o.sx = p.sx;
        p.o.sy = p.sy;
        J.take(S, C, p.r, p.o);
      }
      for (let i = 0; i < S.residents.length; i++) delete S.residents[i].busy;
    },

    /* 这个居民现在能不能被叫去钩玩家点名的漂浮物 */
    canCall(r) {
      const t = r.task;
      if (!t) return true;
      if (t.k === 'idle' || t.k === 'relax' || t.k === 'build' || t.k === 'work' || t.k === 'repair') return true;
      if (t.k === 'duty') return true;
      if (t.k === 'hook') return t.ph === 0 && !t.manual;
      if (t.k === 'sleep') return t.ph === 1 && r.rest > 3000;   // 睡得差不多了可以叫醒
      return false;                                               // 正在吃喝，或者正在收绳
    },

    /* 玩家点名的漂浮物：立刻派离得最近的人去钩 */
    dispatchTags(S, C, out) {
      const fs = S.sea.floaters, B = TC.data.balance.sea;
      for (let i = 0; i < fs.length; i++) {
        const f = fs[i];
        if (!f.tag || f.claim) continue;
        if (!TC.sea.inReach(S, f, C)) { f.tag = 0; out.events.push({ t: 'lost', id: f.id }); continue; }
        let best = null, bd = Infinity;
        for (let j = 0; j < S.residents.length; j++) {
          const r = S.residents[j];
          if (!J.canCall(r) || S.alert) continue;
          const dx = (r.x + 0.5) * SUB - f.x, dy = (r.y + 0.5) * SUB - f.y;
          const d = dx * dx + dy * dy + (r.task && r.task.k === 'sleep' ? 1e12 : 0);   // 醒着的人优先
          if (d < bd) { bd = d; best = r; }
        }
        if (!best) continue;                                      // 都腾不出手，先等着
        J.release(S, C, best);
        f.claim = best.id;
        best.task = { k: 'hook', fid: f.id, ph: 0, t: B.hookAim, manual: 1 };
      }
    },
  };

  TC.sys.jobs = function (S, C, out) {
    J.dispatchTags(S, C, out);
    if (C.jobsDirty || S.tick % 5 === 0) {
      C.jobsDirty = false;
      J.assign(S, C);
    }
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 居民：各项状态的消耗和恢复、心情、死亡和出走，以及“现在做什么”的行为。
 * 居民记录：{id, name, look, tr 特质, x, y 所在格, px, py 上一格, mt, mn 走这一步的起始步数和耗时, dir 朝向,
 *            hunger 饱食, thirst 口渴, rest 精力, mood 心情, health 健康（都是 0–10000）,
 *            task 手头的事, home 住处建筑的编号, meal 最近一餐对心情的影响, diet 最近三顿吃的什么,
 *            floor 昨晚是否睡地板, relaxed 上次歇息的步数, relaxLv 在哪种地方歇的, sad 连续很不开心的次数,
 *            spec 专长（专家才有，见 data/specialists.js）, sick 病了多少步（0 表示没病）}
 * task.k：hook 抛钩、build 盖房、work 生产、duty 值守（掌舵、研究、守鱼叉）、boat 划小船出去、repair 修平台、shelter 进屋躲避、treat 用药、
 *         eat 吃、drink 喝、sleep 睡、relax 歇息、idle 闲逛；ph 是阶段。 */
(function (TC) {
  'use strict';

  const SUB = TC.SUB;
  const BREAKABLE = { idle: 1, relax: 1, build: 1, work: 1, duty: 1, repair: 1, shelter: 1 };   // 这些事可以被吃喝睡打断
  const FIGHT = { guard: 1, war: 1 };          // 敲了钟也不躲的差事：守鱼叉、操战船

  const Ppl = TC.people = {
    byId(S, id) {
      for (let i = 0; i < S.residents.length; i++) if (S.residents[i].id === id) return S.residents[i];
      return null;
    },

    /* 新来一个居民：名字和外观尽量不和已有的重复，带一到两个特质 */
    add(S, x, y) {
      const R = TC.rng, T = TC.data.traits, order = TC.data.traitOrder;
      const usedN = new Set(), usedL = new Set();
      for (const r of S.residents) { usedN.add(r.name); usedL.add(r.look); }
      const names = TC.data.names.filter(n => !usedN.has(n));
      const looks = [];
      for (let i = 0; i < TC.data.LOOKS; i++) if (!usedL.has(i)) looks.push(i);
      const tr = [R.pick(S, 'ai', order)];
      if (R.next(S, 'ai') < 0.5) {
        const second = R.pick(S, 'ai', order);
        if (second !== tr[0] && T[tr[0]].not !== second) tr.push(second);
      }
      const r = {
        id: S.nextId++,
        name: R.pick(S, 'ai', names.length ? names : TC.data.names),
        look: looks.length ? R.pick(S, 'ai', looks) : R.int(S, 'ai', 0, TC.data.LOOKS - 1),
        tr,
        x, y, px: x, py: y, mt: 0, mn: 0, dir: 0,
        hunger: R.int(S, 'ai', 6800, 9200), thirst: R.int(S, 'ai', 6800, 9200), rest: R.int(S, 'ai', 8200, 9800),
        mood: 6000, health: 10000,
        task: null, home: 0, meal: 0, diet: [], floor: 0, relaxed: -1000000, relaxLv: 0, sad: 0, spec: '', sick: 0,
      };
      S.residents.push(r);
      return r;
    },

    /* 特质带来的倍数。key：speed 干活、hunger 饿得快慢、rest 累得快慢 */
    mult(r, key) {
      let m = 1;
      const tr = r.tr || [];
      for (let i = 0; i < tr.length; i++) { const v = TC.data.traits[tr[i]][key]; if (v) m *= v; }
      return m;
    },

    /* 某类手艺的速度倍数（build、fish、cook、craft、farm） */
    skill(r, skill) {
      let m = 1;
      const tr = r.tr || [];
      for (let i = 0; i < tr.length; i++) { const s = TC.data.traits[tr[i]].skill; if (s && s[skill]) m *= s[skill]; }
      const sp = r.spec ? TC.data.specs[r.spec].skill : null;        // 专家的专长
      if (sp && sp[skill]) m *= sp[skill];
      return m;
    },

    /* 干活的速度：心情好干得快，累坏了干得慢，再乘上特质 */
    speed(r, skill) {
      return (0.8 + 0.4 * r.mood / 10000) * (r.rest < 1500 ? 0.7 : 1) * (r.sick ? TC.data.balance.sick.slow : 1) * Ppl.mult(r, 'speed') * (skill ? Ppl.skill(r, skill) : 1);
    },

    asleep(r) { return !!r.task && r.task.k === 'sleep' && r.task.ph === 1; },

    face(r, tx, ty) {
      const dx = tx - r.x, dy = ty - r.y;
      if (Math.abs(dx) > Math.abs(dy)) r.dir = dx > 0 ? 2 : 3;
      else if (dy !== 0 || dx !== 0) r.dir = dy >= 0 ? 0 : 1;
    },

    /* 朝 (gx, gy) 走一步。返回 1 已到、0 在路上、-1 走不到 */
    go(S, C, r, gx, gy) {
      if (r.x === gx && r.y === gy) return 1;
      const n = TC.path.next(S, C, r.x, r.y, gx, gy);
      if (!n) return -1;
      r.px = r.x;
      r.py = r.y;
      r.dir = n[0] > r.x ? 2 : n[0] < r.x ? 3 : n[1] > r.y ? 0 : 1;
      r.x = n[0];
      r.y = n[1];
      r.mt = S.tick;
      r.mn = TC.data.balance.move;
      return 0;
    },

    /* 找个地方吃或喝：合适的建筑里挑档次最高、其次最近的那座的旁边；没有就在原地 */
    spotTask(S, C, r, kind, key, ticks) {
      let b = null, bs = 1e9;
      for (let i = 0; i < S.buildings.length; i++) {
        const c = S.buildings[i], v = TC.bld.def(c)[key];
        if (c.st !== 'on' || !v) continue;
        const s = v * 100 + Math.abs(c.x - r.x) + Math.abs(c.y - r.y);
        if (s < bs) { bs = s; b = c; }
      }
      const s = b ? TC.bld.stand(S, C, b, r.x, r.y) : null;
      return { k: kind, ph: 0, sx: s ? s[0] : r.x, sy: s ? s[1] : r.y, t: ticks };
    },

    /* 找床：在自己现在的住处和所有还有空位的住处里，挑最舒服、其次最近的 */
    sleepTask(S, C, r) {
      const used = new Map();
      for (const o of S.residents) if (o.home && o !== r) used.set(o.home, (used.get(o.home) || 0) + 1);
      let bed = null, bs = -1e9;
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i], def = TC.bld.def(b);
        if (b.st !== 'on' || !def.beds || (used.get(b.id) || 0) >= def.beds) continue;
        const s = (def.comfort || 0) * 100 - Math.abs(b.x - r.x) - Math.abs(b.y - r.y) + (b.id === r.home ? 5 : 0);
        if (s > bs) { bs = s; bed = b; }
      }
      r.home = bed ? bed.id : 0;
      return bed ? { k: 'sleep', ph: 0, sx: bed.x, sy: bed.y, bed: 1 } : { k: 'sleep', ph: 0, sx: r.x, sy: r.y, bed: 0 };
    },

    /* 有没有比手头的事更要紧的需要：渴、饿、困。有就返回新的任务 */
    urgent(S, C, r) {
      const Nd = TC.data.balance.needs;
      if (r.thirst < Nd.drinkAt && (S.stock.water || 0) > 0) return Ppl.spotTask(S, C, r, 'drink', 'drink', Nd.drinkTicks);
      if (r.hunger < Nd.eatAt && TC.stock.bestFood(S)) return Ppl.spotTask(S, C, r, 'eat', 'eat', Nd.eatTicks);
      // 生病或者伤得不轻：有药、有医务棚就去用药
      if ((r.sick || r.health < 5000) && (S.stock.medicine || 0) > 0 && C.n.infirmary > 0) {
        const b = TC.bld.nearest(S, r.x, r.y, (d, bb) => bb.def === 'infirmary' && bb.on);
        if (b) { const s = TC.bld.stand(S, C, b, r.x, r.y); return { k: 'treat', ph: 0, sx: s[0], sy: s[1], t: TC.data.balance.sick.treat }; }
      }
      if ((TC.clock.sleepTime(S) && r.rest < 9000) || r.rest < Nd.napAt) return Ppl.sleepTask(S, C, r);
      return null;
    },

    /* 敲钟了：找个能躲的屋子（挑还有空位的、最近的）；实在没有就原地蹲着 */
    shelterTask(S, C, r) {
      const used = new Map();
      for (const o of S.residents) if (o !== r && o.task && o.task.k === 'shelter' && o.task.bid) used.set(o.task.bid, (used.get(o.task.bid) || 0) + 1);
      let best = null, bd = 1e9;
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i], cap = TC.bld.def(b).shelter;
        if (b.st !== 'on' || !cap || (used.get(b.id) || 0) >= cap) continue;
        const d = TC.path.dist(S, C, r.x, r.y, b.x, b.y);
        if (d >= 0 && d < bd) { bd = d; best = b; }
      }
      return best ? { k: 'shelter', ph: 0, sx: best.x, sy: best.y, bid: best.id, in: 1 } : { k: 'shelter', ph: 0, sx: r.x, sy: r.y, bid: 0, in: 0 };
    },

    /* 没活干：收工后去茶棚或篝火旁歇着，否则在附近走走 */
    idle(S, C, r) {
      const R = TC.rng;
      if (!TC.clock.workTime(S)) {
        let spot = null, bs = -1e9;
        for (let i = 0; i < S.buildings.length; i++) {
          const b = S.buildings[i], lv = TC.bld.def(b).relax;
          if (b.st !== 'on' || !lv) continue;
          const s = lv * 100 - Math.abs(b.x - r.x) - Math.abs(b.y - r.y);
          if (s > bs) { bs = s; spot = b; }
        }
        if (spot) {
          const s = TC.bld.stand(S, C, spot, r.x, r.y);
          r.task = { k: 'relax', ph: 0, sx: s[0], sy: s[1], t: 150, bx: spot.x, by: spot.y, lv: TC.bld.def(spot).relax };
          return;
        }
      }
      let tx = r.x, ty = r.y;
      for (let i = 0; i < 3; i++) {
        const d = TC.bld.NB[R.int(S, 'ai', 0, 3)];
        if (TC.grid.isDeck(S, tx + d[0], ty + d[1])) { tx += d[0]; ty += d[1]; }
      }
      r.task = { k: 'idle', ph: 0, sx: tx, sy: ty, t: R.int(S, 'ai', 30, 90) };
    },

    /* 一个人不在了（死去或出走）：放下手头的活，腾出指定给他的岗位 */
    remove(S, C, r) {
      TC.jobs.release(S, C, r);
      S.residents.splice(S.residents.indexOf(r), 1);
      for (let i = 0; i < S.buildings.length; i++) if (S.buildings[i].pin === r.id) S.buildings[i].pin = 0;
      S.grief = S.tick;
    },

    die(S, C, r, why, out) {
      Ppl.remove(S, C, r);
      S.stats.deaths++;
      out.events.push({ t: 'death', name: r.name, why, x: r.x, y: r.y });
      Ppl.checkOver(S, why, out);
    },

    leave(S, C, r, out) {
      Ppl.remove(S, C, r);
      S.stats.left++;
      out.events.push({ t: 'left', name: r.name, x: r.x, y: r.y });
      Ppl.checkOver(S, 'left', out);
    },

    checkOver(S, why, out) {
      if (S.residents.length || S.over) return;
      S.over = { tick: S.tick, why };
      out.events.push({ t: 'over', why });
    },

    /* 这一刻大家共有的心情因素：刚有人不在了、下雨、周围好不好看 */
    moodEnv(S, C) {
      const Md = TC.data.balance.mood;
      return {
        grief: S.tick - S.grief < 2 * TC.DAY,
        rain: S.weather.kind === 'rain',
        beauty: Math.min(Md.beautyMax, Math.round(Md.beautyMax * C.beauty / (S.residents.length + 4))),
        cheer: TC.skill.val(S, 'cheer'),
      };
    },

    /* 心情“应有的水平”由哪些因素构成：[[原因码, 加减]…]。needs 按它结算，界面按它向玩家解释 */
    moodParts(S, C, r, env) {
      const Md = TC.data.balance.mood, parts = [['base', Md.base]];
      const add = (k, v) => { if (v) parts.push([k, v]); };
      const home = r.home ? C.byId.get(r.home) : null;
      add('food', r.hunger > 5000 ? Md.fed : r.hunger < 2000 ? Md.hungry : 0);
      add('water', r.thirst > 5000 ? Md.watered : r.thirst < 2000 ? Md.thirsty : 0);
      add('rest', r.rest > 5000 ? Md.rested : r.rest < 2000 ? Md.tired : 0);
      add('home', home ? Md.bed + (TC.bld.def(home).comfort || 0) * Md.comfort : Md.nobed);
      if (r.floor) add('floor', Md.floor);
      add('meal', r.meal * Md.meal);                                          // 上一顿吃得好不好
      const d = r.diet;
      if (d.length >= 3 && d[0] !== d[1] && d[1] !== d[2] && d[0] !== d[2]) add('variety', Md.variety);   // 吃得不重样
      if (S.tick - r.relaxed < TC.DAY) add('relax', Md.relax[r.relaxLv] || 0);   // 收工后歇过
      add('beauty', env.beauty);                                              // 装饰
      add('cheer', env.cheer);                                                // 城务技能“人望”
      const tr = r.tr || [];
      let nature = 0;
      for (let k = 0; k < tr.length; k++) nature += TC.data.traits[tr[k]].mood || 0;
      add('trait', nature);
      if (r.sick) add('sick', TC.data.balance.sick.mood);
      if (env.grief) add('grief', Md.grief);
      if (env.rain && !Ppl.asleep(r) && !(home && TC.bld.def(home).comfort)) add('rain', Md.rain);
      return parts;
    },

    /* 每 10 步结算一次：消耗、恢复、心情、健康 */
    needs(S, C, out) {
      const Nd = TC.data.balance.needs, Md = TC.data.balance.mood, Sk = TC.data.balance.sick, U = TC.util;
      const env = Ppl.moodEnv(S, C);
      const hard = TC.hazard.diff(S).needs * (1 - TC.skill.val(S, 'thrift'));             // 难度和“节俭”：吃喝消耗的快慢
      const hot = S.weather.heat > S.tick ? TC.data.balance.weather2.heatThirst : 1;      // 酷热：渴得快
      for (let i = S.residents.length - 1; i >= 0; i--) {
        const r = S.residents[i], asleep = Ppl.asleep(r);
        r.hunger = Math.max(0, r.hunger - Math.round((asleep ? Nd.hungerAsleep : Nd.hunger) * Ppl.mult(r, 'hunger') * hard));
        r.thirst = Math.max(0, r.thirst - Math.round((asleep ? Nd.thirstAsleep : Nd.thirst) * hard * hot));
        if (r.sick) {
          // 病着：慢慢掉健康；扛得够久、身子还行就自己好了
          r.sick += Nd.every;
          r.health -= Sk.drain;
          if (r.sick >= Sk.natural && r.health > 3000) { r.sick = 0; out.events.push({ t: 'cured', name: r.name, id: r.id, how: 'self' }); }
        }
        r.rest = asleep
          ? Math.min(10000, r.rest + (r.task.bed ? Nd.restBed : Nd.restFloor))
          : Math.max(0, r.rest - Math.round(Nd.restAwake * Ppl.mult(r, 'rest')));

        if (r.hunger === 0) r.health -= Nd.starve;
        if (r.thirst === 0) r.health -= Nd.parch;
        if (r.hunger > 3000 && r.thirst > 3000 && r.health < 10000) r.health = Math.min(10000, r.health + Nd.heal);

        // 心情往“应有的水平”慢慢靠拢
        const parts = Ppl.moodParts(S, C, r, env);
        let m = 0;
        for (let k = 0; k < parts.length; k++) m += parts[k][1];
        r.mood += U.clamp(U.clamp(m, 0, 10000) - r.mood, -Nd.moodStep, Nd.moodStep);

        if (r.health <= 0) { r.health = 0; Ppl.die(S, C, r, r.thirst === 0 ? 'thirst' : r.hunger === 0 ? 'hunger' : 'sick', out); continue; }

        // 很不开心的日子攒够一整天，就划着木板走了
        if (r.mood < Md.sadAt) {
          r.sad++;
          if (r.sad === Md.sadWarn) out.events.push({ t: 'unhappy', name: r.name, id: r.id });
          if (r.sad >= Md.sadLeave) Ppl.leave(S, C, r, out);
        } else if (r.sad > 0) r.sad = Math.max(0, r.sad - 2);
      }
    },

    /* 每一步：走路、处理急事、推进手头的事 */
    act(S, C, r, out) {
      if (r.mn && S.tick < r.mt + r.mn) return;      // 还在两格之间走着
      let t = r.task;
      if (!t || BREAKABLE[t.k]) {
        const need = Ppl.urgent(S, C, r);
        if (need) { TC.jobs.release(S, C, r); r.task = t = need; }
        else if (S.alert && (!t || (t.k !== 'shelter' && !(t.k === 'duty' && FIGHT[TC.bld.def(C.byId.get(t.bid) || { def: 'raft' }).duty])))) {
          // 敲了钟：放下手里的活进屋（守鱼叉的、操战船的不动）
          TC.jobs.release(S, C, r);
          r.task = t = Ppl.shelterTask(S, C, r);
        }
      }
      if (!t) { Ppl.idle(S, C, r); return; }
      DO[t.k](S, C, r, t, out);
    },
  };

  /* 生产出货：做完一批（或者晾好、长好）时调用 */
  TC.prod = {
    finish(S, C, b, out) {
      const rec = TC.data.recipes[b.rec], made = {};
      for (const k in rec.out) {
        const n = TC.stock.add(S, C, k, rec.out[k]);
        if (n > 0) { made[k] = n; S.stats.made[k] = (S.stats.made[k] || 0) + n; }
      }
      S.stats.batches[b.rec] = (S.stats.batches[b.rec] || 0) + 1;
      b.batch = 0;
      b.prog = 0;
      b.rec = '';
      b.wait = 0;
      C.jobsDirty = true;
      out.events.push({ t: 'made', bid: b.id, x: b.x, y: b.y, made });
    },
  };

  /* 各种事情怎么推进 */
  const DO = {
    idle(S, C, r, t) {
      if (t.ph === 0) { if (Ppl.go(S, C, r, t.sx, t.sy) !== 0) t.ph = 1; return; }
      if (--t.t <= 0) r.task = null;
    },

    relax(S, C, r, t) {
      if (t.ph === 0) {
        if (Ppl.go(S, C, r, t.sx, t.sy) === 0) return;
        t.ph = 1;
        Ppl.face(r, t.bx, t.by);
        return;
      }
      r.relaxed = S.tick;
      r.relaxLv = t.lv || 1;
      if (--t.t <= 0) r.task = null;
    },

    /* 抛钩：瞄准几步 → 出钩 → 等海面系统把东西拉回来 */
    hook(S, C, r, t, out) {
      const f = TC.sea.byId(S, t.fid);
      if (!f || f.claim !== r.id) { r.task = null; return; }
      if (t.ph !== 0) return;
      if (!TC.sea.inReach(S, f, C)) {
        if (f.tag) out.events.push({ t: 'lost', id: f.id });
        f.claim = 0;
        f.tag = 0;
        r.task = null;
        return;
      }
      Ppl.face(r, f.x / SUB - 0.5, f.y / SUB - 0.5);
      if (--t.t > 0) return;
      const e = TC.grid.nearestDeck(S, f.x, f.y, TC.sea.scanR());
      f.pull = [e.x, e.y];
      t.ph = 1;
      out.events.push({ t: 'hook', id: f.id, rid: r.id, x: f.x, y: f.y });
    },

    build(S, C, r, t, out) {
      const b = C.byId.get(t.bid);
      if (!b || b.st !== 'site' || b.w !== r.id) { r.task = null; return; }
      if (t.ph === 0) {
        const a = Ppl.go(S, C, r, t.sx, t.sy);
        if (a === 0) return;
        if (a < 0) { b.w = 0; r.task = null; return; }
        t.ph = 1;
        Ppl.face(r, b.x, b.y);
        return;
      }
      b.work += Ppl.speed(r, 'build') * (1 + TC.skill.val(S, 'build'));
      if (b.work >= TC.bld.def(b).work) {
        b.w = 0;
        r.task = null;
        TC.bld.complete(S, C, b, out);
      }
    },

    /* 生产：到位 → 挑配方、投料开一批 → 干够工作量 → 出货（或者放着等）。做完一批就重新挑活 */
    work(S, C, r, t, out) {
      const b = C.byId.get(t.bid);
      if (!b || b.st !== 'on' || !b.on || b.w !== r.id) { if (b && b.w === r.id) b.w = 0; r.task = null; return; }
      if (t.ph === 0) {
        const a = Ppl.go(S, C, r, t.sx, t.sy);
        if (a === 0) return;
        if (a < 0) { b.w = 0; r.task = null; return; }
        t.ph = 1;
        const def = TC.bld.def(b);
        if (def.stand === 'self') { const side = TC.bld.waterSide(S, C, b.x, b.y); if (side >= 0) Ppl.face(r, b.x + TC.bld.NB[side][0], b.y + TC.bld.NB[side][1]); }
        else Ppl.face(r, b.x, b.y);
        return;
      }
      if (!b.batch) {
        if (TC.jobs.want(S, C, b) <= 0) { b.w = 0; r.task = null; return; }
        b.rec = TC.jobs.picked;
        TC.stock.pay(S, TC.data.recipes[b.rec].in);
        b.batch = 1;
        b.prog = 0;
      }
      const rec = TC.data.recipes[b.rec];
      b.prog += Ppl.speed(r, rec.skill) * TC.tech.mult(S, rec.skill);
      if (b.prog < rec.work) return;
      b.w = 0;
      r.task = null;
      if (rec.wait) {
        b.batch = 2;                       // 人干完了，剩下的交给时间
        b.wait = S.tick + Math.round(rec.wait * (rec.skill === 'farm' && TC.tech.has(S, 'compost') ? 0.7 : 1));
        C.jobsDirty = true;
      } else TC.prod.finish(S, C, b, out);
    },

    /* 值守：到位之后一直守着，直到这件差事不需要人了（到港了、研究完了） */
    duty(S, C, r, t, out) {
      const b = C.byId.get(t.bid);
      if (!b || b.st !== 'on' || !b.on || b.w !== r.id) { if (b && b.w === r.id) b.w = 0; r.task = null; return; }
      if (t.ph === 0) {
        const a = Ppl.go(S, C, r, t.sx, t.sy);
        if (a === 0) return;
        if (a < 0) { b.w = 0; r.task = null; return; }
        t.ph = 1;
        Ppl.face(r, b.x, b.y);
        return;
      }
      if (!TC.duty[TC.bld.def(b).duty].tick(S, C, b, r, out)) { b.w = 0; r.task = null; C.jobsDirty = true; }
    },

    /* 划小船：走到船坞 → 划过去 → 在那儿忙一阵 → 划回来 → 卸货。船的位置记在 t.bx、t.by */
    boat(S, C, r, t, out) {
      const V = TC.voyage, b = C.byId.get(t.bid), site = V.site(S, t.sid);
      if (!b || b.st !== 'on' || b.w !== r.id || (!site && t.ph < 3)) { if (b && b.w === r.id) b.w = 0; r.task = null; return; }
      if (t.ph === 0) {
        const a = Ppl.go(S, C, r, t.sx, t.sy);
        if (a === 0) return;
        if (a < 0 || !b.on) { b.w = 0; r.task = null; return; }
        const p = V.launch(S, C, b);
        t.bx = p[0];
        t.by = p[1];
        t.ph = 1;
        return;
      }
      if (t.ph === 2) {
        if (--t.t > 0) return;
        t.cargo = V.load(S, C, site, t.act);
        t.ph = 3;
        return;
      }
      // 在路上：朝目标划一步
      const home = t.ph === 3 ? V.launch(S, C, b) : null;
      const gx = home ? home[0] : site.x, gy = home ? home[1] : site.y;
      const dx = gx - t.bx, dy = gy - t.by, d = Math.sqrt(dx * dx + dy * dy), sp = V.boatSpeed(S);
      if (d > sp) {
        t.bx += Math.round(dx / d * sp);
        t.by += Math.round(dy / d * sp);
        return;
      }
      t.bx = gx;
      t.by = gy;
      if (t.ph === 1) {
        t.ph = 2;
        t.t = Math.round(TC.data.balance.boat.work[t.act] * (t.act === 'dive' && V.hasSpec(S, 'diver') ? 0.5 : 1));
        return;
      }
      V.unload(S, C, r, t, b, out);
      b.w = 0;
      r.task = null;
      C.jobsDirty = true;
    },

    /* 修平台：走到那一格，敲敲打打一阵，用掉一份材料，恢复如初 */
    repair(S, C, r, t, out) {
      const B = TC.data.balance.repair, i = t.ty * TC.GRID + t.tx, kind = S.grid.t[i];
      if (!kind || S.grid.hp[i] >= TC.grid.TILE_HP[kind]) { r.task = null; return; }
      if (t.ph === 0) {
        const a = Ppl.go(S, C, r, t.sx, t.sy);
        if (a === 0) return;
        if (a < 0) { r.task = null; return; }
        t.ph = 1;
        return;
      }
      t.t -= Ppl.speed(r, 'build') * (1 + TC.skill.val(S, 'build'));
      if (t.t > 0) return;
      const m = B.cost[kind];
      r.task = null;
      if ((S.stock[m] || 0) < 1) return;
      S.stock[m]--;
      S.grid.hp[i] = TC.grid.TILE_HP[kind];
      S.stats.repaired++;
      C.dmgDirty = true;
      C.jobsDirty = true;
      out.events.push({ t: 'repaired', x: t.tx, y: t.ty });
    },

    /* 躲避：走到屋里待着，直到警报解除 */
    shelter(S, C, r, t) {
      if (!S.alert) { r.task = null; return; }
      if (t.ph === 0) {
        if (t.bid && !C.byId.get(t.bid)) { r.task = null; return; }       // 屋子没了，重新找
        const a = Ppl.go(S, C, r, t.sx, t.sy);
        if (a === 0) return;
        if (a < 0) t.in = 0;
        t.ph = 1;
      }
    },

    /* 用药：走到医务棚，用掉一份药，病就好了 */
    treat(S, C, r, t, out) {
      const B = TC.data.balance.sick;
      if (t.ph === 0) { if (Ppl.go(S, C, r, t.sx, t.sy) === 0) return; t.ph = 1; }
      if (--t.t > 0) return;
      r.task = null;
      if ((S.stock.medicine || 0) < 1) return;
      S.stock.medicine--;
      const was = r.sick;
      r.sick = 0;
      r.health = Math.min(10000, r.health + B.heal * (TC.voyage.hasSpec(S, 'doctor') ? 2 : 1));
      S.stats.cured++;
      out.events.push({ t: 'cured', name: r.name, id: r.id, how: was ? 'medicine' : 'wound' });
    },

    eat(S, C, r, t, out) {
      if (t.ph === 0) { if (Ppl.go(S, C, r, t.sx, t.sy) === 0) return; t.ph = 1; }   // 走不到就在原地吃
      if (--t.t > 0) return;
      const Nd = TC.data.balance.needs, food = TC.stock.bestFood(S);
      if (!food) { r.task = null; return; }
      const fd = TC.data.res[food].food;
      S.stock[food]--;
      r.hunger = Math.min(10000, r.hunger + fd.fill);
      r.meal = fd.mood;
      r.diet.push(food);
      if (r.diet.length > 3) r.diet.shift();
      S.stats.eaten++;
      out.events.push({ t: 'eat', rid: r.id, res: food });
      if (r.hunger < Nd.eatTo && TC.stock.bestFood(S)) t.t = Nd.eatTicks;
      else r.task = null;
    },

    drink(S, C, r, t, out) {
      if (t.ph === 0) { if (Ppl.go(S, C, r, t.sx, t.sy) === 0) return; t.ph = 1; }
      if (--t.t > 0) return;
      const Nd = TC.data.balance.needs;
      if ((S.stock.water || 0) <= 0) { r.task = null; return; }
      S.stock.water--;
      r.thirst = Math.min(10000, r.thirst + Nd.waterFill);
      out.events.push({ t: 'drink', rid: r.id });
      if (r.thirst < 7000 && S.stock.water > 0) t.t = Nd.drinkTicks;
      else r.task = null;
    },

    sleep(S, C, r, t) {
      const Nd = TC.data.balance.needs;
      if (t.ph === 0) {
        const a = Ppl.go(S, C, r, t.sx, t.sy);
        if (a === 0) return;
        if (a < 0) { t.bed = 0; r.home = 0; }
        t.ph = 1;
        r.floor = t.bed ? 0 : 1;
        return;
      }
      if (r.rest >= 10000 || (!TC.clock.sleepTime(S) && r.rest >= Nd.wakeAt)) { r.task = null; return; }
      // 渴醒或饿醒（得有东西可吃喝才值得起来）
      if ((r.thirst < 1000 && (S.stock.water || 0) > 0) || (r.hunger < 1000 && TC.stock.bestFood(S))) r.task = null;
    },
  };

  TC.sys.residents = function (S, C, out) {
    if (S.tick % TC.data.balance.needs.every === 0) Ppl.needs(S, C, out);
    for (let i = 0; i < S.residents.length; i++) Ppl.act(S, C, S.residents[i], out);
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 不需要人值守的产出：雨水桶接雨、渔网架自己捞鱼、晾着的鱼和长着的菜到了时候出成品。
 * 有人值守的那部分（钓鱼、烤鱼、蒸馏、加工）在居民的 work 任务里推进。 */
(function (TC) {
  'use strict';

  TC.sys.production = function (S, C, out) {
    // 下雨：每只启用的雨水桶定时接到 1 份水
    if (S.weather.kind === 'rain' && C.rain > 0 && S.tick % TC.data.balance.weather.rainEvery === 0) {
      const got = TC.stock.add(S, C, 'water', C.rain);
      if (got > 0) S.stats.made.water = (S.stats.made.water || 0) + got;
    }

    // 渔网架、日晒蒸馏棚之类：隔一阵自己出一份（各座建筑错开时间）
    const pas = C.passive, h = TC.clock.hourF(S);
    const sunny = S.weather.kind === 'clear' && h >= 7 && h < 18;
    const bignet = TC.tech.has(S, 'bignet');
    for (let i = 0; i < pas.length; i++) {
      const b = pas[i], def = TC.bld.def(b), p = def.passive;
      const every = bignet && p.out === 'fish' ? Math.round(p.every * 2 / 3) : p.every;
      if ((S.tick + b.id * 37) % every !== 0) continue;
      if (p.sun && !sunny) continue;                                              // 靠太阳的：晴天的白天才出
      if (def.power && !b.pw) continue;                                           // 用电的：没电不出
      if (def.place === 'edge' && TC.bld.waterSide(S, C, b.x, b.y) < 0) continue;   // 靠水的：被围死了就不出
      if (TC.stock.add(S, C, p.out, 1) > 0) {
        S.stats.made[p.out] = (S.stats.made[p.out] || 0) + 1;
        const made = {};
        made[p.out] = 1;
        out.events.push({ t: 'made', bid: b.id, x: b.x, y: b.y, made });
      }
    }

    // 晾晒、生长到期：放得下就出货，放不下就继续等
    if (S.tick % 5 === 0) {
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i];
        if (b.batch !== 2 || S.tick < b.wait) continue;
        const rec = TC.data.recipes[b.rec];
        let room = true;
        for (const k in rec.out) if (TC.stock.room(S, C, k) < rec.out[k]) room = false;
        if (room) TC.prod.finish(S, C, b, out);
      }
    }
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 成长：心愿、繁荣度、城镇等级。
 * 心愿按 data/wishes.js 的顺序出现（要等级够），同时进行最前面的三条：有一两条一时做不到，后面的照样往下走；
 * 写好的心愿不够三条时，用模板生成一条可以反复做的补上。 */
(function (TC) {
  'use strict';

  const SHOWN = 3;

  const Pr = TC.progress = {
    need(w, S, C) { return typeof w.need === 'function' ? w.need(S, C) : w.need; },

    /* 现在轮到的、写好的心愿（等级够、还没完成），最多 SHOWN 条 */
    scripted(S) {
      const list = [], W = TC.data.wishes, P = S.progress;
      for (let i = 0; i < W.length && list.length < SHOWN; i++) {
        if (W[i].level <= P.level && P.done[W[i].id] === undefined) list.push(W[i]);
      }
      return list;
    },

    /* 当前进行中的心愿：[{id, text, hint, cur, need, pros}] */
    active(S, C) {
      const list = [];
      for (const w of Pr.scripted(S)) {
        const need = Pr.need(w, S, C);
        list.push({ id: w.id, text: w.text, hint: w.hint, cur: Math.min(need, w.val(S, C)), need, pros: w.pros });
      }
      const g = S.progress.gen;
      if (g && list.length < SHOWN) {
        const tpl = TC.data.wishGen[g.tpl], n = g.need - g.base;
        list.push({ id: 'gen-' + g.tpl + '-' + g.need, text: tpl.text(n), hint: '', cur: Math.min(n, tpl.val(S, C) - g.base), need: n, pros: tpl.pros });
      }
      return list;
    },

    levelName(S) { return TC.data.balance.levels.names[S.progress.level]; },

    /* 升到下一级需要的繁荣度；已经满级返回 null */
    nextNeed(S) {
      const L = TC.data.balance.levels;
      return S.progress.level + 1 < L.need.length ? L.need[S.progress.level + 1] : null;
    },

    /* 某一级解锁的建筑 */
    unlockedAt(level) {
      const list = [];
      for (const id of TC.data.buildOrder) if (TC.data.buildings[id].level === level) list.push(id);
      return list;
    },

    gain(S, pros, out) {
      const P = S.progress, L = TC.data.balance.levels;
      P.prosperity += pros;
      while (P.level + 1 < L.need.length && P.prosperity >= L.need[P.level + 1]) {
        P.level++;
        out.events.push({ t: 'level', level: P.level, name: L.names[P.level], unlocks: Pr.unlockedAt(P.level) });
        TC.skill.grant(S, 1, 'level', out);
      }
    },
  };

  TC.sys.progress = function (S, C, out) {
    if (S.tick % 10 !== 0) return;
    const P = S.progress;
    Pr.quests(S, C, out);
    const list = Pr.scripted(S);
    for (let i = 0; i < list.length; i++) {
      const w = list[i];
      if (w.val(S, C) < Pr.need(w, S, C)) continue;
      P.done[w.id] = S.tick;
      out.events.push({ t: 'wish', id: w.id, text: w.text, pros: w.pros });
      Pr.gain(S, w.pros, out);
      C.jobsDirty = true;
    }

    // 可以反复做的心愿：写好的不够三条时才有
    if (list.length >= SHOWN) return;
    const G = TC.data.wishGen;
    if (P.gen && G[P.gen.tpl].val(S, C) >= P.gen.need) {
      const tpl = G[P.gen.tpl];
      out.events.push({ t: 'wish', id: 'gen', text: tpl.text(P.gen.need - P.gen.base), pros: tpl.pros });
      P.gen = null;
      Pr.gain(S, tpl.pros, out);
    }
    if (!P.gen) {
      const order = TC.data.wishGenOrder.filter(id => !G[id].need || G[id].need(S, C));      // 有的心愿要先有相应的建筑
      const tpl = TC.rng.pick(S, 'event', order), base = G[tpl].val(S, C);
      P.gen = { tpl, base, need: base + G[tpl].add };
    }
  };

  /* 专家的个人心愿：一步一步来，全部做完有回报 */
  Pr.quests = function (S, C, out) {
    for (let i = 0; i < S.residents.length; i++) {
      const id = S.residents[i].spec, q = id ? S.quests[id] : null;
      if (!q || q.done) continue;
      const sp = TC.data.specs[id], step = sp.quest[q.step];
      if (step.val(S, C) - (step.rel ? q.base : 0) < step.need) continue;
      q.step++;
      if (q.step < sp.quest.length) {
        const next = sp.quest[q.step];
        q.base = next.rel ? next.val(S, C) : 0;
        out.events.push({ t: 'quest', spec: id, step: q.step, done: false });
        continue;
      }
      q.done = S.tick;
      const rw = sp.reward;
      if (rw.tech) TC.tech.grant(S, C, rw.tech, out, id);
      if (rw.data) TC.stock.add(S, C, 'data', rw.data);
      out.events.push({ t: 'quest', spec: id, step: q.step, done: true, reward: rw });
      Pr.gain(S, (rw.pros || 0) + 6, out);
    }
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/sys_progress.js
</script>
<script>
/* 主线：按 data/story.js 里的步骤一步一步往前走。
 *   S.story = {step 正在做第几步（做完了就等于步骤总数）, flags 别的系统立的旗, ending 选了哪种结局, endAt 哪一步选的, log [[步数, 步骤]…]} */
(function (TC) {
  'use strict';

  const St = TC.story = {
    /* 正在做的那一步；全做完了返回 null */
    cur(S) { return TC.data.story.steps[S.story.step] || null; },

    chapter(S) { const s = St.cur(S); return s ? s.ch : 5; },

    /* 这一步做到了没有 */
    met(S, C, s) {
      if (s.act) return false;                       // 要玩家动手的
      if (s.flag) return !!S.story.flags[s.flag];
      if (s.at) return s.at(S, C);
      return s.val(S, C) >= s.need;
    },

    /* 要玩家动手的那一步现在能不能做；返回 null 表示可以，否则是原因码 */
    canAct(S, C) {
      const s = St.cur(S);
      if (!s || !s.act) return 'gone';
      if (s.act.where && (S.voyage.to >= 0 || S.chart.nodes[S.voyage.at].kind !== s.act.where)) return 'where';
      if (s.act.cost && !TC.stock.has(S, s.act.cost)) return 'cost';
      return null;
    },

    advance(S, C, s, out) {
      S.story.step++;
      S.story.log.push([S.tick, s.id]);
      const next = St.cur(S);
      const chapterDone = !next || next.ch !== s.ch;
      out.events.push({ t: 'story', id: s.id, ch: s.ch, chapterDone });
      TC.progress.gain(S, 5, out);
      if (chapterDone) TC.skill.grant(S, 1, 'chapter', out);
      // 有几步做完了会带来实在的变化
      if (s.id === 'supply') {
        for (const n of S.chart.nodes) if (n.region >= 3 && n.seen < 2) n.seen = 2;      // 守灯人给的海图：风暴带和拂晓都看清了
        TC.tech.grant(S, C, 'reinforce', out, 'keeper');
      } else if (s.id === 'belt') {
        // 风暴带的见面礼：一场躲不掉的大风暴（已经有风暴在路上就不重复安排）
        const W = S.weather, B = TC.data.balance.storm;
        if (!W.storm) {
          const at = S.tick + Math.round(0.45 * TC.DAY);
          W.storm = { at, end: at + B.dur[1], sev: 3, warned: 0 };
        }
      }
      C.jobsDirty = true;
    },

    /* 结局选好了 */
    end(S, C, id, out) {
      S.story.ending = id;
      S.story.endAt = S.tick;
      S.story.step = TC.data.story.steps.length;
      S.story.log.push([S.tick, 'ending:' + id]);
      TC.progress.gain(S, 30, out);
      TC.skill.grant(S, 1, 'chapter', out);            // 第五章也算走完了
      out.events.push({ t: 'ending', id });
    },
  };

  TC.sys.story = function (S, C, out) {
    if (S.tick % 10 !== 0) return;
    for (let guard = 0; guard < 4; guard++) {            // 一次最多连过几步（比如读旧档时前几步早就做到了）
      const s = St.cur(S);
      if (!s || !St.met(S, C, s)) return;
      St.advance(S, C, s, out);
    }
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/sys_story.js
</script>
<script>
/* 存档的打包、解包、版本迁移、导出文本。这里不碰任何存储接口，读写由界面层负责。
 * 导出文本的格式：<标记>.<校验>.<内容>
 *   TC1j  内容是 JSON 的 base64
 *   TC1z  内容是 JSON 经 deflate-raw 压缩后的 base64（压缩和解压由界面层做）
 * 校验永远是对未压缩的 JSON 字节算的 CRC32。 */
(function (TC) {
  'use strict';

  const APP = 'tidalcity';
  const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  const MIGRATIONS = {     // MIGRATIONS[v]：把版本 v 的状态升级到 v+1
    /* 2 → 3：加入城镇等级的后续内容、特质、多配方、指定专人 */
    2(S) {
      S.seen = {};
      for (const k in S.stock) if (S.stock[k] > 0) S.seen[k] = 1;
      S.targets = {};
      S.progress.gen = null;
      S.stats.batches = {};
      S.stats.left = 0;
      S.stats.rescued = 0;
      S.stats.pontoons = 0;
      if (S.stats.manual === undefined) S.stats.manual = S.stats.picked;
      if (S.sea.budget.seed === undefined) { S.sea.budget.seed = 10; S.sea.total.seed = 10; }
      S.sea.surv = TC.data.balance.survivor.first;
      for (const r of S.residents) {
        r.tr = [];
        r.diet = [];
        r.relaxLv = 1;
        r.sad = 0;
      }
      for (const b of S.buildings) {
        const def = TC.data.buildings[b.def];
        b.rec = b.batch && def && def.recipes ? def.recipes[0] : '';
        b.wait = 0;
        b.pin = 0;
        b.prio = 0;
      }
      return S;
    },

    /* 3 → 4：加入海图、航行、小船、研究、专家 */
    3(S) {
      S.chart = TC.worldgen.make(S.seed);
      const here = S.chart.nodes[0];
      here.budget = S.sea.budget;                       // 旧档里“这片海”的储量就是起点的储量
      here.total = S.sea.total;
      for (const k of ['ewaste']) if (here.budget[k] === undefined) { here.budget[k] = 14; here.total[k] = 14; }
      delete S.sea.budget;
      delete S.sea.total;
      S.voyage = { at: 0, to: -1, dist: 0, done: 0, head: 0, flow: 0, legs: 0, since: 0, steer: -10, hold: 0, evs: [], ev: null };
      S.progress.tech = { done: {}, cur: '', prog: 0 };
      S.quests = {};
      S.stats.boat = 0;
      S.stats.dives = 0;
      S.stats.specs = 0;
      S.stats.trades = 0;
      for (const r of S.residents) r.spec = '';
      const C = TC.sim.rebuild(S);
      TC.voyage.placeSites(S, C);
      TC.voyage.reveal(S, C);
      return S;
    },

    /* 4 → 5：加入风暴、鲨鱼和海盗、疾病、电力、难度 */
    4(S) {
      const B = TC.data.balance;
      if (!B.diff[S.opts.diff]) S.opts.diff = 'normal';
      S.weather.storm = null;
      S.weather.heat = 0;
      S.sea.creatures = [];
      S.threat = { next: Math.max(S.tick + 2 * TC.DAY, B.raid.from * TC.DAY), raid: null };
      S.power = { e: 0, gen: 0, use: 0, lit: 0 };
      S.alert = 0;
      for (const k of ['storms', 'tilesLost', 'wrecked', 'washed', 'repaired', 'sharks', 'raids', 'repelled', 'paid', 'stolen', 'cured']) S.stats[k] = 0;
      for (const r of S.residents) r.sick = 0;
      for (let i = 0; i < S.grid.t.length; i++) S.grid.hp[i] = TC.grid.TILE_HP[S.grid.t[i]] || 0;      // 以前不掉结实度，统一补满
      // 两位新专家：安置到各自海域里还没去过的地点
      for (const id of ['doctor', 'electrician']) {
        if (S.chart.nodes.some(n => n.sites.some(s => s.spec === id)) || S.residents.some(r => r.spec === id)) continue;
        const node = S.chart.nodes.find(n => n.region === TC.data.specs[id].region && !n.visited && n.id !== S.voyage.to) || S.chart.nodes.find(n => !n.visited && n.kind !== 'dawn' && n.id !== S.voyage.to);
        if (!node) continue;
        const used = node.sites.map(s => s.dir);
        let dir = 0;
        while (dir < 15 && used.some(u => Math.min((u - dir) & 15, (dir - u) & 15) < 3)) dir++;
        node.sites.push({ id: node.id * 10 + node.sites.length + 1, kind: 'camp', dir, far: 10, x: 0, y: 0, left: {}, surv: 1, spec: id, order: 1 });
      }
      return S;
    },

    /* 5 → 6：加入主线。已经做到的步骤会自己很快补上（送补给那一步要玩家动手）；
     * 已经造了船舵的老存档，修电台那一步就当做过了 */
    5(S) {
      S.story = { step: 0, flags: {}, ending: '', endAt: 0, log: [] };
      if (S.stats.built.helm) { S.story.step = 1; S.story.log.push([S.tick, 'radio']); }
      if (S.stats.dives > 0 && S.chart.nodes.some(n => n.kind === 'tower' && n.visited && n.sites.some(s => s.kind === 'tower' && s.deep && TC.voyage.remains({ surv: 0, left: s.deep }) === 0))) S.story.flags.core = 1;
      return S;
    },

    /* 6 → 7：加入技能点和 Boss。技能点按已经升到的等级、已经走完的章节补发；Boss 放到还没去过的地点 */
    6(S) {
      const steps = TC.data.story.steps;
      let pts = S.progress.level - 1;
      for (let i = 0; i < Math.min(S.story.step, steps.length); i++) if (!steps[i + 1] || steps[i + 1].ch !== steps[i].ch) pts++;
      S.skills = { pts, got: pts, lv: {} };
      S.threat.boss = null;
      S.stats.bosses = {};
      S.stats.bossTries = 0;
      TC.worldgen.bosses(S.seed, S.chart.nodes, n => !n.visited && n.id !== S.voyage.to);
      return S;
    },

    /* 7 → 8：加入买卖。商船和灯塔各开一个集市；浮村和几处的旧币放在还没去过的地点 */
    7(S) {
      const fresh = n => !n.visited && n.id !== S.voyage.to;
      S.post = null;
      S.stats.bought = S.stats.sold = S.stats.coinIn = S.stats.coinOut = 0;
      TC.worldgen.villages(S.seed, S.chart.nodes, fresh);
      TC.worldgen.markets(S.seed, S.chart.nodes, fresh);
      for (const n of S.chart.nodes) for (const s of n.sites) if (s.market) s.market.day = Math.floor(S.tick / TC.DAY) + 1;
      return S;
    },

    /* 8 → 9：加入势力和军事。好感从头算；海盗的据点放在还没去过的地点 */
    8(S) {
      const B = TC.data.balance.war;
      S.factions = { tide: { rep: B.rep0 }, guild: { rep: B.rep0 } };
      S.threat.fleet = [];
      S.threat.siege = null;
      S.stats.forts = S.stats.sieges = S.stats.gifts = 0;
      TC.worldgen.forts(S.seed, S.chart.nodes, n => !n.visited && n.id !== S.voyage.to);
      return S;
    },
  };

  function b64enc(bytes) {
    let out = '';
    for (let i = 0; i < bytes.length; i += 3) {
      const a = bytes[i], b = i + 1 < bytes.length ? bytes[i + 1] : 0, c = i + 2 < bytes.length ? bytes[i + 2] : 0;
      out += ALPHA[a >> 2] + ALPHA[((a & 3) << 4) | (b >> 4)];
      out += i + 1 < bytes.length ? ALPHA[((b & 15) << 2) | (c >> 6)] : '';
      out += i + 2 < bytes.length ? ALPHA[c & 63] : '';
    }
    return out;
  }

  let REV = null;
  function b64dec(str) {
    if (!REV) { REV = {}; for (let i = 0; i < ALPHA.length; i++) REV[ALPHA[i]] = i; REV['+'] = 62; REV['/'] = 63; }
    str = str.replace(/=+$/, '');
    const n = Math.floor(str.length * 3 / 4), out = new Uint8Array(n);
    let acc = 0, bits = 0, o = 0;
    for (let i = 0; i < str.length; i++) {
      const v = REV[str[i]];
      if (v === undefined) return null;
      acc = (acc << 6) | v;
      bits += 6;
      if (bits >= 8) { bits -= 8; out[o++] = (acc >> bits) & 255; }
    }
    return out.subarray(0, o);
  }

  let CRC = null;
  function crc32(bytes) {
    if (!CRC) {
      CRC = new Int32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
        CRC[n] = c;
      }
    }
    let crc = -1;
    for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ CRC[(crc ^ bytes[i]) & 255];
    return (crc ^ -1) >>> 0;
  }

  const Save = TC.save = {
    APP, MIGRATIONS, b64enc, b64dec, crc32,

    /* now：界面层传进来的时间戳（模拟层自己不读时钟） */
    pack(S, now) {
      return {
        app: APP,
        v: TC.SAVE_VERSION,
        savedAt: now || 0,
        meta: { day: TC.clock.day(S), pop: S.residents.length, level: (S.progress && S.progress.level) || 1 },
        S,
      };
    },

    /* 返回 {S} 或 {error}；error：format 不是存档 / newer 来自更新的版本 / migrate 缺迁移 / invalid 内容损坏 */
    unpack(obj) {
      if (!obj || obj.app !== APP || !obj.S || typeof obj.v !== 'number') return { error: 'format' };
      if (obj.v > TC.SAVE_VERSION) return { error: 'newer' };
      let S = obj.S;
      for (let v = obj.v; v < TC.SAVE_VERSION; v++) {
        if (!MIGRATIONS[v]) return { error: 'migrate' };
        S = MIGRATIONS[v](S);
      }
      S.v = TC.SAVE_VERSION;
      const bad = TC.sim.validate(S);
      if (bad.length) return { error: 'invalid', detail: bad };
      return { S };
    },

    bytesOf(obj) { return new TextEncoder().encode(JSON.stringify(obj)); },

    wrap(tag, rawBytes, payloadBytes) { return tag + '.' + crc32(rawBytes).toString(36) + '.' + b64enc(payloadBytes); },

    /* 拆开导出文本：返回 {tag, crc, payload} 或 {error} */
    parseText(text) {
      const parts = String(text || '').trim().split('.');
      if (parts.length !== 3 || (parts[0] !== 'TC1j' && parts[0] !== 'TC1z')) return { error: 'format' };
      const payload = b64dec(parts[2]);
      if (!payload) return { error: 'format' };
      return { tag: parts[0], crc: parts[1], payload };
    },

    /* 未压缩的 JSON 字节 → 存档对象；校验不符说明文本被截断或改动过 */
    fromBytes(rawBytes, crc) {
      if (crc32(rawBytes).toString(36) !== crc) return { error: 'checksum' };
      try { return { obj: JSON.parse(new TextDecoder().decode(rawBytes)) }; } catch (e) { return { error: 'format' }; }
    },

    /* 不压缩的同步版本 */
    toText(obj) { const raw = Save.bytesOf(obj); return Save.wrap('TC1j', raw, raw); },
    fromText(text) {
      const p = Save.parseText(text);
      if (p.error) return p;
      if (p.tag !== 'TC1j') return { error: 'compressed' };
      return Save.fromBytes(p.payload, p.crc);
    },
  };
})(globalThis.TC = globalThis.TC || {});
