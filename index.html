<script>
/* 菜单：帮助、这一局的统计、存档的导出和导入、新开一局、声音和音乐、运行信息 */
(function (TC) {
  'use strict';

  const ERR = {
    format: '这不是一份存档文本。',
    checksum: '存档文本不完整，或者被改动过。',
    newer: '这份存档来自更新的版本，当前版本读不了。',
    migrate: '这份存档的版本太旧，读不了。',
    invalid: '这份存档已经损坏。',
    compressed: '当前浏览器解不开这份压缩过的存档。',
  };

  async function pipe(bytes, stream) {
    const out = new Blob([bytes]).stream().pipeThrough(stream);
    return new Uint8Array(await new Response(out).arrayBuffer());
  }

  const Sy = TC.sysui = {
    /* 导出文本：能压缩就压缩（短得多），不能就用不压缩的格式 */
    async exportText(S) {
      const raw = TC.save.bytesOf(TC.save.pack(S, Date.now()));
      try {
        if (typeof CompressionStream === 'function') return TC.save.wrap('TC1z', raw, await pipe(raw, new CompressionStream('deflate-raw')));
      } catch (e) { /* 落到不压缩的格式 */ }
      return TC.save.wrap('TC1j', raw, raw);
    },

    /* 返回 {S} 或 {error: 原因码} */
    async importText(text) {
      const p = TC.save.parseText(text);
      if (p.error) return p;
      let raw = p.payload;
      if (p.tag === 'TC1z') {
        try {
          if (typeof DecompressionStream !== 'function') return { error: 'compressed' };
          raw = await pipe(p.payload, new DecompressionStream('deflate-raw'));
        } catch (e) { return { error: 'checksum' }; }
      }
      const got = TC.save.fromBytes(raw, p.crc);
      if (got.error) return got;
      return TC.save.unpack(got.obj);
    },

    infoLines() {
      const app = TC.app, cam = TC.cam, st = TC.main.stats(), S = app.S;
      const yes = v => (v ? '可用' : '不可用');
      let clip = false, comp = false;
      try { clip = !!(navigator.clipboard && navigator.clipboard.writeText); } catch (e) { /* 忽略 */ }
      try { comp = typeof CompressionStream === 'function'; } catch (e) { /* 忽略 */ }
      return [
        '版本 ' + (TC.BUILD || '开发') + ' · 种子 ' + S.seed + ' · 难度 ' + TC.data.balance.diff[S.opts.diff].name,
        '屏幕 ' + Math.round(app.cssW()) + '×' + Math.round(app.cssH()) + ' · 像素比 ' + (+cam.dpr.toFixed(3)),
        '放大 ' + cam.k + ' 倍 · 画面 ' + cam.bw + '×' + cam.bh + ' · ' + (app.layout === 'phone' ? '手机' : '电脑') + '布局',
        '帧率 ' + st.fps + ' · 每帧 ' + st.mean + ' / ' + st.p95 + ' 毫秒（平均 / 95 分位）',
        '漂浮物 ' + S.sea.floaters.length + ' · 每帧贴图 ' + TC.render.draws + ' 次',
        '本地存档 ' + yes(TC.store.available()) + ' · 剪贴板 ' + yes(clip) + ' · 压缩 ' + yes(comp),
        '声音 ' + ({ running: '已启动', suspended: '待点击', none: '未启动' }[TC.sfx.state()] || TC.sfx.state()),
        '这片海剩余物资 ' + Math.round(TC.sea.richness(S) * 100) + '%',
      ].join('\n');
    },

    open(body) {
      const el = TC.dom.el, app = TC.app;
      const saveNote = el('p', { class: 'note' });
      const out = el('textarea', { class: 'savebox', id: 'save-out', readonly: '', rows: '3', 'aria-label': '导出的存档文本', hidden: '' });
      const copy = el('button', { class: 'btn', type: 'button', id: 'save-copy', hidden: '' }, ['复制']);
      const inp = el('textarea', { class: 'savebox', id: 'save-in', rows: '3', placeholder: '把导出的存档文本粘贴到这里', 'aria-label': '要导入的存档文本' });
      const msg = el('p', { class: 'warn', id: 'save-msg' });
      const sound = el('button', { class: 'btn wide', type: 'button', id: 'menu-sound', onclick: () => { app.toggleSound(); Sy.key = ''; Sy.update(); } });
      const music = el('button', { class: 'btn wide', type: 'button', id: 'menu-music', onclick: () => { app.toggleMusic(); Sy.key = ''; Sy.update(); } });
      const fresh = el('button', { class: 'btn wide', type: 'button', id: 'menu-new' }, ['新开一局']);
      const info = el('div', { class: 'info', id: 'info' });
      let armed = 0;

      fresh.addEventListener('click', () => {
        if (!armed) {
          armed = setTimeout(() => { armed = 0; fresh.classList.remove('danger'); fresh.textContent = '新开一局'; }, 3000);
          fresh.classList.add('danger');
          fresh.textContent = '现在这局会丢掉，再点一次确认';
          return;
        }
        clearTimeout(armed);
        TC.panel.close();
        app.newGame();
      });

      copy.addEventListener('click', () => {
        const done = () => app.toast('已复制到剪贴板', 'good', true);
        const manual = () => { out.focus(); out.select(); app.toast('请长按或用快捷键手动复制选中的文字', '', true); };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.value).then(done, manual);
          else manual();
        } catch (e) { manual(); }
      });

      body.append(
        el('div', { class: 'rowbtns' }, [
          el('button', { class: 'btn', type: 'button', id: 'menu-help', onclick: () => { TC.sfx.play('click'); TC.panel.open('help'); } }, ['帮助']),
          el('button', { class: 'btn', type: 'button', id: 'menu-log', onclick: () => { TC.sfx.play('click'); TC.panel.open('log'); } }, ['消息记录']),
          el('button', { class: 'btn', type: 'button', id: 'menu-factions', onclick: () => { TC.sfx.play('click'); TC.panel.open('factions'); } }, ['势力']),
          el('button', { class: 'btn', type: 'button', id: 'menu-stats', onclick: () => { TC.sfx.play('click'); TC.storyui.showStats(); } }, ['这一局的统计']),
        ]),
        el('h4', { text: '存档' }), saveNote,
        el('div', { class: 'rowbtns' }, [
          el('button', { class: 'btn', type: 'button', id: 'save-now', onclick: () => { const ok = TC.main.save('manual'); app.toast(ok ? '已保存' : '这个环境不能保存到浏览器，请用“导出存档”', ok ? 'good' : 'bad'); } }, ['立即保存']),
          el('button', { class: 'btn', type: 'button', id: 'save-export', onclick: async () => {
            out.value = await Sy.exportText(app.S);
            out.hidden = false;
            copy.hidden = false;
          } }, ['导出存档']),
        ]),
        out, copy,
        el('h4', { text: '导入存档' }), inp,
        el('button', { class: 'btn wide', type: 'button', id: 'save-import', onclick: async () => {
          msg.textContent = '';
          const got = await Sy.importText(inp.value);
          if (got.error) { msg.textContent = ERR[got.error] || '读不了这份存档。'; TC.sfx.play('deny'); return; }
          TC.panel.close();
          app.begin(got.S, false);
          app.toast('存档已读取', 'good');
        } }, ['读取这份存档']),
        msg,
        el('h4', { text: '其它' }), sound, music, fresh,
        el('h4', { text: '运行信息' }), info,
      );
      Sy.nodes = { saveNote, sound, music, info };
      Sy.key = '';
    },

    update() {
      const N = Sy.nodes, D = TC.dom, M = TC.main;
      D.setText(N.info, Sy.infoLines());
      const ok = TC.store.available();
      const ago = Math.round((M.playedMs - M.savedAt) / 1000);
      D.setText(N.saveNote, ok
        ? '每分钟、每天清晨和切到后台时自动保存在这个浏览器里。' + (M.everSaved ? '上次保存在 ' + ago + ' 秒前。' : '')
        : '这个环境不能把存档留在浏览器里，关掉页面进度就没了。换设备或想保险一点，请用“导出存档”。');
      const key = TC.sfx.on + '|' + TC.music.on;
      if (key !== Sy.key) {
        Sy.key = key;
        N.sound.textContent = TC.sfx.on ? '声音：开' : '声音：关';
        N.music.textContent = TC.music.on ? '背景音乐：开' : '背景音乐：关';
      }
    },
  };

  TC.panel.register('menu', { title: '菜单', open: Sy.open, update: Sy.update });
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 界面总管：布局、把点击和手势变成命令、放置建筑、选中、提示、弹窗。
 * 界面从不直接改模拟状态，只往 App.queue 里放命令。 */
(function (TC) {
  'use strict';

  const T = TC.TILE, SUB = TC.SUB, N = TC.GRID;
  const WHY = {
    far: '太远了，够不着', claimed: '已经有人在钩了', gone: '漂走了',
    occupied: '这里已经有东西了', detached: '要挨着已有的平台', nodeck: '要建在平台上',
    noedge: '要建在挨着水的格子上', cost: '材料不够', none: '还没选位置', oob: '太远了，超出了范围', locked: '还没解锁', over: '这一局已经结束了',
    blocks: '会把旁边的钓鱼台或渔网架围死', last: '这是最后一格平台了', busy: '上面有人，或者旁边正在施工，等一下',
    split: '拆了这一格，浮城就断成两截了', bad: '这个数不行',
    site: '离那边的礁石和沉船太近了，铺不过去', sailing: '正在航行，到了再说', nohelm: '要先造一座船舵', notnear: '只能去相邻的地点', boats: '小船还在外面',
    nolab: '要先搭一座研究台', req: '要先掌握前面的技术', done: '已经掌握了', sold: '换完了', full: '放不下',
    nobell: '要先搭一座警钟（建造 → 防御）', where: '要停在指定的地点才能做', need: '条件还不够',
  };
  // 拆平台时，同样的原因码要换个说法
  const WHY_UNRAFT = { nodeck: '这里没有平台', occupied: '上面有建筑，要先拆掉建筑' };
  const DAWN_KEY = 'tidalcity.dawn';

  /* Boss 沉下去的那一大片水花 */
  function fx_splash(e) {
    const K = T / SUB;
    TC.fx.splash(e.x * K, e.y * K - 6, 30, ['#ffffff', '#93dcf7', '#2ce8f5', '#68386c']);
  }

  const App = TC.app = {
    S: null, C: null,
    queue: [],            // 等待在下一步执行的命令
    speed: 1, lastSpeed: 1,
    layout: 'desktop',
    short: false,         // 屏幕很矮（横着拿的手机）
    blocked: false,       // 有弹窗开着：时间不走
    noSave: false,        // 样张和压力测试不写存档
    centered: false,
    pinchK: 0,
    tool: null,           // 正在放置的建筑种类
    ghost: null,          // 虚影所在的格 {x, y}
    pending: [],          // 手机上一次选好的多格平台
    lastDeny: -1e9,
    log: [],              // 这次打开以来飘过的消息（给“消息记录”面板看）：{day, at, text, kind}
    logVer: 0,

    init() {
      const D = TC.dom, el = D.el;
      App.stage = D.$('#stage');
      App.canvas = D.$('#world');
      App.ui = D.$('#ui');
      TC.hud.init(App.ui, App);
      App.mid = el('div', { class: 'mid' });
      TC.tracker.init(App.mid);
      TC.panel.init(App.mid);
      App.placeMsg = el('div', { class: 'msg' });
      App.placeOk = el('button', { class: 'btn primary', type: 'button', id: 'place-ok', onclick: () => App.confirmPlace() }, ['确认']);
      App.placeNo = el('button', { class: 'btn', type: 'button', id: 'place-cancel', onclick: () => { TC.sfx.play('click'); App.clearTool(); } }, ['取消']);
      App.placebar = el('div', { class: 'placebar', id: 'placebar', hidden: '' }, [App.placeMsg, App.placeOk, App.placeNo]);
      App.toasts = el('div', { class: 'toasts', id: 'toasts', 'aria-live': 'polite' });
      App.mid.append(App.placebar, App.toasts);
      App.ui.append(App.mid, TC.hud.bottom);
      TC.render.init(App.canvas);

      TC.input.init(App.canvas, {
        anyDown: App.wake,
        tap: App.tap,
        pan: App.pan,
        pinchStart: () => { App.pinchK = TC.cam.k; },
        pinch: (scale, x, y) => { TC.cam.zoomTo(App.pinchK * scale, x, y); },
        zoomStep: (dir, x, y) => { TC.cam.zoomTo(TC.cam.k + dir, x, y); },
        hover: App.hover,
        key: App.key,
        rightTap: () => { if (App.tool) App.clearTool(); },
      });
      App.ui.addEventListener('pointerdown', App.wake);

      // 画布大小跟着容器走；尽量拿到精确的物理像素数，这样画布和屏幕一比一，不会被浏览器再缩放一次
      const onSize = entries => {
        const e = entries[0], dpr = window.devicePixelRatio || 1;
        const cw = e.contentRect.width, ch = e.contentRect.height;
        let w = Math.round(cw * dpr), h = Math.round(ch * dpr);
        // 浏览器报告的物理像素数只有和“CSS 尺寸 × 像素比”对得上才采信（设备模拟下它会报错数）
        const box = e.devicePixelContentBoxSize && e.devicePixelContentBoxSize[0];
        if (box && Math.abs(box.inlineSize - cw * dpr) < 2 && Math.abs(box.blockSize - ch * dpr) < 2) {
          w = box.inlineSize;
          h = box.blockSize;
        }
        if (w > 0 && h > 0) App.resize(w, h, dpr, cw, ch);
      };
      const ro = new ResizeObserver(onSize);
      try { ro.observe(App.canvas, { box: 'device-pixel-content-box' }); } catch (err) { ro.observe(App.canvas); }
      const r = App.canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      App.resize(Math.max(1, Math.round(r.width * dpr)), Math.max(1, Math.round(r.height * dpr)), dpr, r.width, r.height);
    },

    resize(devW, devH, dpr, cssW, cssH) {
      TC.render.resize(devW, devH, dpr);
      const layout = App.forceLayout || (cssW < 700 || (cssH > cssW && cssW < 840) ? 'phone' : 'desktop');
      if (layout !== App.layout || !App.ui.dataset.layout) {
        App.layout = layout;
        App.ui.dataset.layout = layout;
        if (App.tool) App.refreshPlace();
      }
      // 矮屏（横着拿的手机）：顶栏和心愿栏都收紧一些，把地方让给画面
      const short = cssH < 520;
      if (short !== App.short || !App.ui.dataset.short) {
        App.short = short;
        App.ui.dataset.short = short ? '1' : '0';
      }
      if (App.S && !App.centered) App.centerOnTown();
    },

    /* 开始（或接着）一局。fresh 为真表示新开的局，要放开场白 */
    begin(S, fresh) {
      App.S = S;
      App.C = TC.sim.rebuild(S);
      App.queue.length = 0;
      App.log.length = 0;
      App.logVer++;
      App.tool = null;
      App.ghost = null;
      App.pending = [];
      App.placebar.hidden = true;
      TC.dialog.clear();
      TC.chartui.close();
      TC.panel.close();
      TC.render.reset();
      TC.tracker.reset();
      TC.render.afterStep(S, App.C);
      App.refreshAll();
      App.centered = false;
      if (TC.cam.devW) App.centerOnTown();
      TC.sfx.setWeather(S.weather.kind);
      if (S.over) App.showOver();
      else if (fresh) App.showIntro();
    },

    newGame() {
      App.begin(TC.sim.newGame(TC.main.newSeed()), true);
      TC.main.save('new');
    },

    refreshAll() {
      const S = App.S;
      if (!App.nightHint && !S.over && TC.clock.day(S) === 1 && TC.clock.hourF(S) >= 22 && S.residents.length && S.residents.every(r => TC.people.asleep(r))) {
        App.nightHint = true;
        App.toast('夜深了，大家都睡了。可以点右上角的快进，天亮得快一些');
      }
      TC.hud.update(App.S, App.C, App);
      TC.tracker.update(App.S, App.C);
      TC.panel.update();
      // 告诉渲染器界面占掉了哪几边（屏幕边上的去处指示要让开）
      const pad = TC.render.view.pad, pr = TC.panel.cur ? TC.panel.el.getBoundingClientRect() : null;
      pad[0] = TC.hud.bar.getBoundingClientRect().bottom + 4;
      pad[1] = pr && App.layout !== 'phone' ? App.cssW() - pr.left + 4 : 4;
      pad[2] = (pr && App.layout === 'phone' ? App.cssH() - pr.top : TC.hud.bottom.getBoundingClientRect().height) + 4;
      pad[3] = 4;
      // 航行途中遇到的事还没拿主意（比如读档回来）：把选项摆出来
      if (S.voyage.ev && !TC.dialog.el && !App.quiet && !TC.main.bot && !S.over) App.showVoyEvent(S.voyage.ev.id);
      const raid = S.threat.raid;
      if (raid && raid.ph === 'ask' && !TC.dialog.el && !App.quiet && !TC.main.bot && !S.over) App.showRaid({ demand: raid.demand, n: raid.n });
    },

    centerOnTown() {
      const b = App.C.bbox;
      TC.cam.setBoundsFromTown(b);
      TC.cam.centerOn((b.x0 + b.x1 + 1) * T / 2, (b.y0 + b.y1 + 1) * T / 2);
      if (App.layout === 'phone') {
        // 手机上顶栏和心愿栏占了上面一截：把城挪到剩下那块区域的中间
        const top = Math.max(TC.hud.bar.getBoundingClientRect().bottom, TC.tracker.el.getBoundingClientRect().bottom);
        const bottom = App.cssH() - TC.hud.bottom.getBoundingClientRect().height;
        const dy = Math.round((top + bottom) / 2 - App.cssH() / 2);
        if (dy > 0) TC.cam.panCss(0, dy);
      }
      App.centered = true;
    },

    focusResident(rid) {
      const p = TC.render.rpos.get(rid);
      if (p) App.reveal(p[0], p[1] - 6, true);
    },

    /* 把世界里的一点挪到没被界面挡住的地方：手机上面板盖住下半屏，电脑上盖住右边一条。
     * center 为真时不管它原来在哪，都挪到看得见的那块区域的正中 */
    reveal(wx, wy, center) {
      const cam = TC.cam, c = cam.toCss(wx, wy), m = 30;
      let x0 = 0, x1 = App.cssW(), y0 = TC.hud.bar.getBoundingClientRect().bottom, y1 = App.cssH() - TC.hud.bottom.getBoundingClientRect().height;
      if (TC.panel.cur) {
        const pr = TC.panel.el.getBoundingClientRect();
        if (App.layout === 'phone') y1 = pr.top;
        else x1 = pr.left;
      }
      let dx = 0, dy = 0;
      if (center) {
        dx = (x0 + x1) / 2 - c[0];
        dy = (y0 + y1) / 2 - c[1];
      } else {
        if (c[0] > x1 - m) dx = x1 - m - c[0];
        else if (c[0] < x0 + m) dx = x0 + m - c[0];
        if (c[1] > y1 - m) dy = y1 - m - c[1];
        else if (c[1] < y0 + m) dy = y0 + m - c[1];
      }
      if (dx || dy) cam.panCss(dx, dy);
    },

    /* 第一次碰到屏幕时启动声音（浏览器要求先有用户操作） */
    wake() {
      TC.sfx.init();
      TC.sfx.resume();
      TC.sfx.startAmbient();
      if (App.S) TC.sfx.setWeather(App.S.weather.kind);
    },

    /* 立刻执行排队的命令（命令本来就只在两步之间生效，早一点执行不影响结果） */
    flush() {
      if (!App.queue.length) return;
      const out = TC.main.out;
      TC.sim.applyCommands(App.S, App.C, App.queue, out);
      App.queue.length = 0;
      TC.render.afterStep(App.S, App.C);
      if (out.events.length) { App.onEvents(out.events); out.events.length = 0; }
    },

    tileAt(x, y) {
      const w = TC.cam.toWorld(x, y);
      return [Math.floor(w[0] / T), Math.floor(w[1] / T), w[0], w[1]];
    },

    /* 原因码 → 给玩家看的话 */
    whyText(why) {
      if (App.tool === 'unraft' && WHY_UNRAFT[why]) return WHY_UNRAFT[why];
      if (why === 'limit') {
        const L = TC.data.balance.levels, lv = App.S.progress.level;
        return '平台已经铺到这一级的上限 ' + L.tiles[lv] + ' 格' + (lv + 1 < L.tiles.length ? '，升级后才能再扩' : '');
      }
      return WHY[why] || '现在不行';
    },

    deny(why) {
      const now = performance.now();
      if (now - App.lastDeny < 500) return;       // 连续点错不刷屏
      App.lastDeny = now;
      TC.sfx.play('deny');
      App.toast(App.whyText(why), 'bad', true);
    },

    /* ── 点击 ── */
    tap(x, y, p) {
      if (App.blocked || !App.S) return;
      App.flush();
      const S = App.S, C = App.C, cam = TC.cam, at = App.tileAt(x, y);
      if (App.tool) { App.toolTap(at[0], at[1], p.type !== 'mouse'); return; }

      // 屏幕边上的去处指示：点它就把镜头移过去
      const mark = TC.render.pickMark(x * cam.dpr / cam.k, y * cam.dpr / cam.k);
      if (mark) { TC.sfx.play('click'); App.gotoSite(mark.sid); return; }

      const radius = Math.max(8, (p.type === 'mouse' ? 16 : 30) * cam.dpr / cam.k);   // 手指比鼠标粗，判定放宽
      const f = TC.render.pickFloater(S, at[2], at[3], radius);
      if (f) {
        const why = TC.sim.check(S, C, { type: 'hook', id: f.id });
        if (why) { App.deny(why); return; }
        App.queue.push({ type: 'hook', id: f.id });
        TC.sfx.play('click');
        return;
      }
      const r = TC.render.pickResident(S, at[2], at[3], p.type === 'mouse' ? 1 : 5);
      const away = r && r.task && r.task.k === 'boat' && r.task.ph > 0;        // 划船出去的人：点在沉船、小岛上时，算点的是那个去处
      if (r && !(away && TC.render.pickSite(S, at[2], at[3], 0))) { TC.sfx.play('click'); App.select({ r: r.id }); return; }
      const idx = at[1] * N + at[0];
      const b = TC.util.inb(at[0], at[1]) ? (TC.bld.at(C, at[0], at[1]) || (C.siteAt.has(idx) ? C.byId.get(C.siteAt.get(idx)) : null)) : null;
      if (b) { TC.sfx.play('click'); App.select({ b: b.id }); return; }
      const site = TC.render.pickSite(S, at[2], at[3], p.type === 'mouse' ? 0 : 6);
      if (site) { TC.sfx.play('click'); App.select({ s: site.id }); return; }
      App.select(null);
    },

    /* 把镜头移到某个去处（沉船、小岛……）并选中它 */
    gotoSite(sid) {
      const s = TC.voyage.site(App.S, sid);
      if (!s) return;
      const K = T / SUB;
      TC.cam.setBoundsFromTown(App.C.bbox);
      TC.cam.centerOn(s.x * K, s.y * K - 10);
      App.select({ s: sid });
    },

    /* ── 选中居民、建筑或去处 ── */
    select(sel, focus) {
      if (sel && sel.r) TC.panel.open('person', sel.r);
      else if (sel && sel.b) TC.panel.open('inspect', sel.b);
      else if (sel && sel.s) TC.panel.open('site', sel.s);
      else if (TC.panel.cur === 'person' || TC.panel.cur === 'inspect' || TC.panel.cur === 'site') TC.panel.close();
      TC.render.view.sel = sel;     // 放在开关面板之后：开关面板时会先清掉旧的选中
      // 别让刚选中的东西被面板挡住
      if (sel && sel.r) {
        const p = TC.render.rpos.get(sel.r);
        if (p) App.reveal(p[0], p[1] - 6, focus);
      } else if (sel && sel.b) {
        const b = App.C.byId.get(sel.b);
        if (b) App.reveal(b.x * T + 8, b.y * T + 8);
      } else if (sel && sel.s) {
        const s = TC.voyage.site(App.S, sel.s);
        if (s) App.reveal(s.x * T / SUB, s.y * T / SUB - 10);
      }
    },

    /* ── 放置建筑 ── */
    setTool(def) {
      App.tool = def;
      App.ghost = null;
      App.pending = [];
      TC.render.view.sel = null;
      App.refreshPlace();
    },

    clearTool() {
      App.tool = null;
      App.ghost = null;
      App.pending = [];
      App.placebar.hidden = true;
      App.canvas.style.cursor = '';
    },

    /* 这一格能不能加进“待铺”的平台里（挨着平台、工地，或者挨着已经选好的格子） */
    pendingOk(x, y) {
      const S = App.S, C = App.C;
      if (!TC.util.inb(x, y)) return 'oob';
      if (S.grid.t[y * N + x] || C.siteAt.has(y * N + x)) return 'occupied';
      for (const d of TC.bld.NB) {
        const ax = x + d[0], ay = y + d[1];
        if (!TC.util.inb(ax, ay)) continue;
        if (S.grid.t[ay * N + ax] || C.siteAt.has(ay * N + ax) || App.pending.some(t => t[0] === ax && t[1] === ay)) return null;
      }
      return 'detached';
    },

    toolTap(tx, ty, touch) {
      const S = App.S, C = App.C, def = App.tool;
      if (def === 'unraft') {
        // 拆平台。电脑：点哪拆哪，可以连着拆；手机：先选一格，再点“确认”
        if (touch) { App.ghost = { x: tx, y: ty }; TC.sfx.play('click'); App.refreshPlace(); return; }
        const cmd = { type: 'removeTile', x: tx, y: ty }, why = TC.sim.check(S, C, cmd);
        if (why) { App.deny(why); return; }
        App.queue.push(cmd);
        TC.sfx.play('click');
        return;
      }
      if (!touch) {
        // 电脑：点哪放哪。平台可以连着铺，别的建筑放下一座就收起工具
        const why = TC.sim.check(S, C, { type: 'build', def, x: tx, y: ty });
        if (why) { App.deny(why); return; }
        App.queue.push({ type: 'build', def, x: tx, y: ty });
        TC.sfx.play('click');
        if (!TC.data.buildings[def].tile) App.clearTool();
        return;
      }
      // 手机：先选位置，再点“确认”
      if (def === 'raft') {
        const i = App.pending.findIndex(t => t[0] === tx && t[1] === ty);
        if (i >= 0) App.pending.splice(i, 1);
        else {
          const why = App.pendingOk(tx, ty);
          if (why) { App.deny(why); return; }
          App.pending.push([tx, ty]);
        }
      } else App.ghost = { x: tx, y: ty };
      TC.sfx.play('click');
      App.refreshPlace();
    },

    /* 手机上的“确认” */
    confirmPlace() {
      const S = App.S, C = App.C, def = App.tool;
      if (!def) return;
      const g = App.ghost;
      const cmd = def === 'raft' ? { type: 'buildTiles', tiles: App.pending.slice() }
        : !g ? null
        : def === 'unraft' ? { type: 'removeTile', x: g.x, y: g.y }
        : { type: 'build', def, x: g.x, y: g.y };
      if (!cmd || (def === 'raft' && !App.pending.length)) { App.deny('none'); return; }
      const why = TC.sim.check(S, C, cmd);
      if (why) { App.deny(why); return; }
      App.queue.push(cmd);
      TC.sfx.play('click');
      if (def === 'raft') { App.pending = []; App.refreshPlace(); }
      else if (def === 'unraft' || TC.data.buildings[def].tile) { App.ghost = null; App.refreshPlace(); }   // 平台常常连着铺、连着拆，工具先不收
      else App.clearTool();
    },

    /* 每帧算一遍虚影（给渲染器），顺带知道当前位置合不合法 */
    viewGhosts() {
      const g = [], S = App.S, C = App.C;
      if (!App.tool) return g;
      if (App.pending.length) {
        const ok = TC.sim.check(S, C, { type: 'buildTiles', tiles: App.pending }) === null;
        for (const t of App.pending) g.push({ def: 'raft', x: t[0], y: t[1], ok });
      } else if (App.ghost) {
        const x = App.ghost.x, y = App.ghost.y;
        const why = App.tool === 'unraft' ? TC.sim.check(S, C, { type: 'removeTile', x, y }) : TC.bld.canPlace(S, C, App.tool, x, y);
        g.push({ def: App.tool, x, y, ok: why === null });
      }
      return g;
    },

    /* 刷新放置提示条的文字和按钮 */
    refreshPlace() {
      const def = App.tool;
      if (!def) { App.placebar.hidden = true; return; }
      const S = App.S, C = App.C, un = def === 'unraft', name = un ? '拆平台' : TC.data.buildings[def].name, phone = App.layout === 'phone';
      let text = '', bad = '', okEnabled = false;
      if (def === 'raft' && phone) {
        const n = App.pending.length, need = n * TC.data.buildings.raft.cost.wood;
        text = n ? '已选 ' + n + ' 格，需要浮木 ' + need : '点木筏旁边的水面，选好要铺的格子';
        if (n) { const why = TC.sim.check(S, C, { type: 'buildTiles', tiles: App.pending }); if (why) bad = App.whyText(why); else okEnabled = true; }
      } else if (App.ghost) {
        const x = App.ghost.x, y = App.ghost.y;
        const why = un ? TC.sim.check(S, C, { type: 'removeTile', x, y }) : TC.bld.canPlace(S, C, def, x, y);
        text = un ? (phone ? '拆掉这一格？' : '点一下拆掉，退一半材料') : phone ? '放在这里？' : '点一下放下';
        if (why) bad = App.whyText(why); else okEnabled = true;
      } else text = un ? (phone ? '点一下要拆的那格平台' : '把鼠标移到要拆的平台上') : phone ? '点一下要放的位置' : '把鼠标移到要放的位置';
      const key = name + '|' + text + '|' + bad + '|' + okEnabled + '|' + phone;
      if (key === App.placeKey && !App.placebar.hidden) return;
      App.placeKey = key;
      const el = TC.dom.el;
      App.placeMsg.replaceChildren(el('b', { text: name }), '：' + text, bad ? el('span', { class: 'bad', text: '（' + bad + '）' }) : '');
      App.placeOk.hidden = !phone;
      App.placeOk.disabled = !okEnabled;
      App.placebar.hidden = false;
    },

    /* ── 拖动、悬停、按键 ── */
    pan(dx, dy, p) {
      const tdef = App.tool ? TC.data.buildings[App.tool] : null;
      if (tdef && tdef.tile && p && p.type === 'mouse' && p.button === 0) {
        // 拿着平台按住左键拖：一路铺过去
        const at = App.tileAt(p.x, p.y), cmd = { type: 'build', def: App.tool, x: at[0], y: at[1] };
        App.ghost = { x: at[0], y: at[1] };
        App.flush();
        if (TC.sim.check(App.S, App.C, cmd) === null) {
          App.queue.push(cmd);
          TC.sfx.play('click');
        }
        return;
      }
      TC.cam.panCss(dx, dy);
    },

    hover(x, y) {
      if (!App.S) return;
      if (App.tool) {
        if (x < 0) { App.ghost = null; return; }
        const at = App.tileAt(x, y);
        App.ghost = { x: at[0], y: at[1] };
        App.canvas.style.cursor = 'crosshair';
        return;
      }
      if (x < 0) { TC.render.hoverId = 0; return; }
      const cam = TC.cam, w = cam.toWorld(x, y);
      const f = TC.render.pickFloater(App.S, w[0], w[1], Math.max(8, 16 * cam.dpr / cam.k));
      TC.render.hoverId = f ? f.id : 0;
      App.canvas.style.cursor = f && TC.render.reachable.has(f.id) ? 'pointer' : '';
    },

    key(k) {
      if (TC.chartui.el) {
        if (k === 'Escape' || k === 'm') TC.chartui.close();
        return true;
      }
      if (App.blocked) return false;
      if (k === 'Escape') {
        if (App.tool) App.clearTool();
        else if (TC.panel.cur) TC.panel.close();
        return true;
      }
      if (k === ' ') { App.setSpeed(App.speed === 0 ? App.lastSpeed : 0); return true; }
      if (k === '1' || k === '2' || k === '3') { App.setSpeed(Number(k)); return true; }
      if (k === '=' || k === '+') { TC.cam.zoomTo(TC.cam.k + 1, App.cssW() / 2, App.cssH() / 2); return true; }
      if (k === '-' || k === '_') { TC.cam.zoomTo(TC.cam.k - 1, App.cssW() / 2, App.cssH() / 2); return true; }
      if (k === 'h' || k === 'Home') { App.centerOnTown(); return true; }
      if (k === 'b') { TC.panel.toggle('build'); return true; }
      if (k === 'p') { TC.panel.toggle('people'); return true; }
      if (k === 'c') { TC.panel.toggle('stock'); return true; }
      if (k === 'm') { TC.chartui.open(); return true; }
      if (k === 'r') { TC.panel.toggle('research'); return true; }
      if (k === 'j') { TC.panel.toggle('story'); return true; }
      if (k === 'l') { TC.panel.toggle('log'); return true; }
      if (k === 'k') { if (App.S.skills.got > 0) TC.panel.toggle('skills'); return true; }
      if (k === 'f') { TC.panel.toggle('factions'); return true; }
      if (k === 't') { const s = TC.voyage.sites(App.S).find(x => x.market); if (s) TC.panel.toggle('market', s.id); else if (App.S.post && App.C.n.tradepost) TC.panel.toggle('market', TC.market.POST); return true; }
      if (k === '?' || k === '/') { TC.panel.toggle('help'); return true; }
      return false;
    },

    cssW() { return TC.cam.devW / TC.cam.dpr; },
    cssH() { return TC.cam.devH / TC.cam.dpr; },

    /* 按住方向键或 WASD 平移视野 */
    keyPan(dt) {
      const ks = TC.input.keys;
      if (!ks.size || App.blocked) return;
      let dx = 0, dy = 0;
      if (ks.has('a') || ks.has('ArrowLeft')) dx += 1;
      if (ks.has('d') || ks.has('ArrowRight')) dx -= 1;
      if (ks.has('w') || ks.has('ArrowUp')) dy += 1;
      if (ks.has('s') || ks.has('ArrowDown')) dy -= 1;
      if (dx || dy) TC.cam.panCss(dx * dt * 0.6, dy * dt * 0.6);
    },

    setSpeed(v) {
      v = Math.max(0, Math.min(3, v | 0));
      if (v > 0) App.lastSpeed = v;
      App.speed = v;
      TC.sfx.play('click');
      TC.hud.update(App.S, App.C, App);
    },

    toggleSound() {
      App.wake();
      TC.sfx.setOn(!TC.sfx.on);
      TC.store.set('tidalcity.sound', TC.sfx.on ? 1 : 0);
      TC.hud.update(App.S, App.C, App);
    },

    toggleMusic() {
      App.wake();
      TC.music.setOn(!TC.music.on);
      TC.store.set('tidalcity.music', TC.music.on ? 1 : 0);
    },

    /* 记进“消息记录”（弹窗说过的事也记一笔，方便回头看） */
    remember(text, kind) {
      if (!App.S) return;
      App.log.push({ day: TC.clock.day(App.S), at: TC.clock.hhmm(App.S), text, kind: kind || '' });
      if (App.log.length > 120) App.log.shift();
      App.logVer++;
    },

    /* 飘一行字。nolog：操作上的小提醒（够不着、材料不够……）不记进“消息记录” */
    toast(text, kind, nolog) {
      if (!nolog) App.remember(text, kind);
      while (App.toasts.childElementCount >= 3) App.toasts.lastElementChild.remove();
      const t = TC.dom.el('div', { class: 'toast' + (kind ? ' ' + kind : ''), text });
      App.toasts.prepend(t);
      setTimeout(() => t.remove(), kind === 'good' || kind === 'bad' ? 3200 : 2200);
    },

    /* ── 模拟事件 → 画面、声音、提示 ── */
    onEvents(events) {
      const K = T / SUB, fx = TC.fx, S = App.S;
      for (let i = 0; i < events.length; i++) {
        const e = events[i];
        switch (e.t) {
          case 'pickup': {
            const wx = e.x * K, wy = e.y * K;
            fx.splash(wx, wy, 7, ['#ffffff', '#2ce8f5', '#0099db']);
            let n = 0;
            for (const res in e.loot) fx.pop(wx, wy, 'i_' + res, e.loot[res], 0.22 * n++);
            TC.sfx.play('pickup');
            if (e.lost > 0 && performance.now() - (App.lastFull || 0) > 8000) {
              App.lastFull = performance.now();
              App.toast('放不下了，多搭一座物资堆吧', 'bad');
            }
            break;
          }
          case 'hook':
            fx.splash(e.x * K, e.y * K, 4, ['#ffffff', '#2ce8f5']);
            TC.sfx.play('hook');
            break;
          case 'lost': App.toast('点了名的东西漂走了'); break;
          case 'placed': TC.cam.setBoundsFromTown(App.C.bbox); break;
          case 'untile':
            TC.sfx.play('build');
            fx.splash(e.x * T + 8, e.y * T + 8, 6, ['#ffffff', '#2ce8f5', '#0099db']);
            TC.cam.setBoundsFromTown(App.C.bbox);
            break;
          case 'joined':
            TC.sfx.play('good');
            fx.splash(e.x * K, e.y * K, 8, ['#ffffff', '#2ce8f5', '#fee761']);
            if (e.spec) App.toast(TC.data.specs[e.spec].title + ' ' + e.name + ' 上了浮城：' + TC.data.specs[e.spec].desc, 'good');
            else App.toast(e.name + ' 上来了，从此是浮城的一员' + (e.tr && e.tr.length ? '（' + e.tr.map(k => TC.data.traits[k].name).join('、') + '）' : ''), 'good');
            break;
          case 'missed': App.toast('有个漂在海上的人没等到救援，漂远了', 'bad'); break;
          case 'unhappy':
            TC.sfx.play('bad');
            App.toast(e.name + ' 很不开心，再这样下去会离开。点开看看心情从哪来', 'bad');
            break;
          case 'left':
            TC.sfx.play('bad');
            App.toast(e.name + ' 受不了这里的日子，划着木板走了', 'bad');
            break;
          case 'level': App.showLevel(e); break;
          case 'skillpt':
            App.toast('得到 ' + e.n + ' 点技能点（' + ({ level: '升级', chapter: '主线走完一章', boss: '打赢了 Boss' }[e.why] || '') + '）。点底栏的“技能”把它花掉', 'good');
            break;
          case 'skill':
            TC.sfx.play('good');
            App.toast('城务技能：' + TC.data.skills[e.id].name + ' ' + e.lv + ' 级', 'good');
            TC.cam.setBoundsFromTown(App.C.bbox);
            break;
          case 'bossfight': {
            const bd = TC.data.bosses[e.id];
            TC.sfx.play('alarm');
            TC.sfx.play('thunder');
            App.toast(bd.name + '被引出来了！' + (App.C.n.harpoon ? '鱼叉架有人守着就会射它' : '一座鱼叉架都没有，只能等它自己退走'), 'bad');
            if (TC.panel.cur === 'site') TC.panel.update();
            break;
          }
          case 'bosshit':
            if (e.id === 'kraken') fx.stamp('boss_arm', e.x * T + 8, e.y * T + 15, 0.9);
            fx.splash(e.x * T + 8, e.y * T + 8, 12, ['#ffffff', '#93dcf7', '#b86f50']);
            TC.sfx.play('bad');
            if (e.dmg <= 0 && performance.now() - (App.lastTough || 0) > 6000) { App.lastTough = performance.now(); App.toast('钢架平台纹丝不动'); }
            break;
          case 'bossvolley':
            for (const p of e.hit) { fx.shot(e.bx * K, e.by * K - 14, p[0] * T + 8, p[1] * T + 6); fx.splash(p[0] * T + 8, p[1] * T + 8, 3, ['#ffffff', '#e43b44']); }
            TC.sfx.play('hook');
            if (performance.now() - (App.lastVolley || 0) > 9000) {
              App.lastVolley = performance.now();
              App.toast(e.hit.length ? '黑潮号放了一轮箭！' + (S.alert ? '' : App.C.n.bell ? '敲钟让大家进屋' : '没有警钟，躲不了') : '黑潮号放了一轮箭，大家都在屋里，没伤着', e.hit.length ? 'bad' : '');
            }
            break;
          case 'bosswave': App.toast(TC.data.bosses[e.id].short + '又放下 ' + e.n + ' 条小船', 'bad'); break;
          case 'bosswin': App.showBossWin(e); break;
          case 'bossaway':
            TC.sfx.play('bad');
            App.toast(TC.data.bosses[e.id].short + (e.why === 'left' ? '被甩在了后面' : '退走了') + '，还要射中 ' + e.hp + ' 下。' + (e.why === 'left' ? '' : '它缓过来以后可以再引出来'), 'bad');
            if (TC.panel.cur === 'site') TC.panel.update();
            break;
          case 'story':
            TC.storyui.onStep(e);
            if (TC.panel.cur === 'story') TC.panel.update();
            break;
          case 'ending':
            TC.main.save('ending');
            TC.storyui.showEnding(e.id);
            break;
          case 'depart':
            TC.sfx.play('good');
            App.toast('起航！驶向 ' + TC.chartui.title(S.chart.nodes[e.to]), 'good');
            if (TC.panel.cur === 'site') App.select(null);
            break;
          case 'arrive':
            TC.main.save('arrive');
            TC.cam.setBoundsFromTown(App.C.bbox);
            App.showArrive(e);
            break;
          case 'voyev': App.showVoyEvent(e.id); break;
          case 'voyres': App.voyResult(e); break;
          case 'boat': {
            let n = 0;
            for (const res in e.loot) fx.pop(e.x * T + 8, e.y * T + 2, 'i_' + res, e.loot[res], 0.22 * n++);
            if (n) TC.sfx.play('pickup');
            if (e.lost > 0 && performance.now() - (App.lastFull || 0) > 8000) {
              App.lastFull = performance.now();
              App.toast('小船带回来的东西放不下，丢了 ' + e.lost + ' 份', 'bad');
            }
            break;
          }
          case 'tech':
            TC.sfx.play('good');
            App.toast((e.how === 'lab' ? '研究完成：' : TC.data.specs[e.how].title + '带来了技术：') + TC.data.tech[e.id].name, 'good');
            break;
          case 'quest': {
            const sp = TC.data.specs[e.spec];
            if (e.done) { TC.sfx.play('good'); App.toast(sp.name + ' 的心愿了了：' + TC.roster.rewardText(e.reward), 'good'); }
            else App.toast(sp.name + ' 的心愿往前走了一步');
            break;
          }
          case 'trade': TC.sfx.play('pickup'); break;
          case 'bought':
          case 'sold':
            TC.sfx.play('pickup');
            if (TC.panel.cur === 'market') TC.panel.update();
            break;
          case 'faction': {
            const fd = TC.data.factions[e.id];
            TC.sfx.play('good');
            App.toast('和' + fd.name + (e.tier >= 2 ? '结成了同盟：' : '交上了朋友：') + fd.perks[e.tier - 1], 'good');
            if (TC.panel.cur === 'factions') TC.panel.update();
            break;
          }
          case 'gift':
            TC.sfx.play('pickup');
            App.toast('送给' + TC.data.factions[e.id].name + ' ' + e.n + (e.res === 'coin' ? ' ' : ' 份') + TC.data.res[e.res].name + (e.gain ? '，好感 +' + e.gain : '，心意收下了'), '', true);
            if (TC.panel.cur === 'factions') TC.panel.update();
            break;
          case 'siege':
            TC.sfx.play('alarm');
            App.toast('战船出港，攻打海盗的据点！先打守军的船，再打寨子', 'good');
            if (TC.panel.cur === 'site') TC.panel.update();
            break;
          case 'sortie':
            if (performance.now() - (App.lastSortie || 0) > 5000) { App.lastSortie = performance.now(); App.toast('战船出港了'); }
            break;
          case 'allies':
            TC.sfx.play('good');
            App.toast('潮民来了 ' + e.n + ' 条船助战！', 'good');
            break;
          case 'clash':
            fx.shot(e.x * K, e.y * K - 6, e.ex * K, e.ey * K - 4);
            fx.splash(e.ex * K, e.ey * K, e.hit ? 6 : 3, e.hit ? ['#ffffff', '#feae34', '#e43b44'] : ['#ffffff', '#93dcf7']);
            if (performance.now() - (App.lastClash || 0) > 400) { App.lastClash = performance.now(); TC.sfx.play('hook'); }
            break;
          case 'boatdown':
            TC.sfx.play('bad');
            fx.splash(e.x * K, e.y * K, 14, ['#ffffff', '#93dcf7', '#b86f50']);
            App.toast(e.kind === 'ally' ? '潮民的一条船打坏了，退了下去' : '一条战船打坏了，回港修理，操船的人受了伤', 'bad');
            break;
          case 'fortwin': App.showFortWin(e); break;
          case 'siegeend':
            TC.sfx.play('bad');
            App.toast((e.why === 'left' ? '浮城起航，战船收兵' : e.why === 'beaten' ? '战船都打坏了，只好收兵' : '打了大半天没打下来，收兵') + '。寨子还要打 ' + e.hp + ' 下，他们会戒备一阵', 'bad');
            if (TC.panel.cur === 'site') TC.panel.update();
            break;
          case 'peddler':
            App.toast('行商的小船来过了，贸易站换了一批货。点贸易站看看', 'good');
            break;
          case 'built':
            TC.sfx.play('build');
            fx.splash(e.x * T + 8, e.y * T + 8, 6, ['#ead4aa', '#e4a672', '#ffffff']);
            TC.cam.setBoundsFromTown(App.C.bbox);
            break;
          case 'made': {
            let n = 0;
            for (const res in e.made) fx.pop(e.x * T + 8, e.y * T + 2, 'i_' + res, e.made[res], 0.2 * n++);
            break;
          }
          case 'wish':
            TC.sfx.play('good');
            App.toast('心愿达成：' + e.text + '（繁荣 +' + e.pros + '）', 'good');
            break;
          case 'weather':
            TC.sfx.setWeather(e.kind);
            if (e.kind === 'storm') {
              App.stormBase = { lost: S.stats.tilesLost, wrecked: S.stats.wrecked, washed: S.stats.washed };
              TC.sfx.play('thunder');
              App.toast('风暴来了！' + (S.alert ? '' : App.C.n.bell ? '点右上角的钟，让大家进屋' : '没有警钟，大家只能硬扛'), 'bad');
            } else if (e.kind === 'rain' && e.was !== 'storm') App.toast('下雨了' + (App.C.rain ? '，雨水桶开始接水' : '。有雨水桶就能接水'));
            else if (e.kind === 'fog') App.toast('起雾了，够得着的范围小了一圈' + (S.power.lit ? '（探照灯亮着，不受影响）' : ''));
            break;
          case 'heat': App.toast('今天热得厉害，大家渴得快，多备些淡水', 'bad'); break;
          case 'stormwarn':
            TC.sfx.play('alarm');
            App.toast('要起风暴了，约 ' + TC.chartui.span(e.eta / TC.DAY) + '后到' + (e.sev >= 3 ? '，来势很猛' : '') + '。把边上的东西护好，留些修补用的材料', 'bad');
            break;
          case 'stormend': {
            const b = App.stormBase || { lost: S.stats.tilesLost, wrecked: S.stats.wrecked, washed: S.stats.washed };
            const lost = S.stats.tilesLost - b.lost, wr = S.stats.wrecked - b.wrecked, wa = S.stats.washed - b.washed, parts = [];
            if (lost) parts.push('碎了 ' + lost + ' 格平台');
            if (wr) parts.push('冲毁 ' + wr + ' 座建筑');
            if (wa) parts.push('冲走 ' + wa + ' 份物资');
            App.toast('风暴过去了' + (parts.length ? '：' + parts.join('，') : '，没什么损失'), parts.length ? 'bad' : 'good');
            TC.cam.setBoundsFromTown(App.C.bbox);
            break;
          }
          case 'tilelost':
            fx.splash(e.x * T + 8, e.y * T + 8, 14, ['#ffffff', '#93dcf7', '#b86f50', '#733e39']);
            TC.sfx.play('bad');
            break;
          case 'wrecked':
            fx.splash(e.x * T + 8, e.y * T + 6, 10, ['#ffffff', '#93dcf7', '#ead4aa']);
            if (performance.now() - (App.lastWreck || 0) > 4000) { App.lastWreck = performance.now(); App.toast(TC.data.buildings[e.def].name + ' 被浪冲毁了', 'bad'); }
            if (TC.panel.cur === 'inspect') TC.panel.update();
            break;
          case 'washed': {
            let n = 0;
            for (const k in e.lost) n += e.lost[k];
            if (performance.now() - (App.lastWash || 0) > 6000) { App.lastWash = performance.now(); App.toast('露天的物资被浪卷走了 ' + n + ' 份。仓库里的不怕', 'bad'); }
            break;
          }
          case 'hurt':
            if (performance.now() - (App.lastHurt || 0) > 5000) {
              App.lastHurt = performance.now();
              App.toast(e.name + (e.why === 'raid' ? ' 被海盗打伤了' : e.why === 'boss' ? ' 中了一箭' : e.why === 'fall' ? ' 掉进海里，受了伤' : ' 被浪打伤了'), 'bad');
            }
            break;
          case 'repaired': fx.splash(e.x * T + 8, e.y * T + 8, 3, ['#ead4aa', '#e4a672']); break;
          case 'sick': App.toast(e.name + ' 病倒了' + (App.C.n.infirmary ? '' : '。搭一座医务棚、备些药才治得了'), 'bad'); break;
          case 'cured': App.toast(e.name + (e.how === 'self' ? ' 自己扛过来了' : e.how === 'wound' ? ' 的伤上过药了' : ' 用了药，病好了'), 'good'); break;
          case 'shark': App.toast('有鲨鱼在附近转悠' + (App.C.n.harpoon ? '，鱼叉架有人守着就会射它' : '，小船出去要当心'), 'bad'); break;
          case 'sharkbite': TC.sfx.play('bad'); App.toast(e.name + ' 的小船被鲨鱼撞了，人受了伤，这一趟白跑', 'bad'); fx.splash(e.x * K, e.y * K, 12, ['#ffffff', '#93dcf7', '#e43b44']); break;
          case 'sharkdead': TC.sfx.play('good'); App.toast('鲨鱼被射死了，浮上来了：捞上来就是一大堆鱼肉', 'good'); fx.splash(e.x * K, e.y * K, 12, ['#ffffff', '#93dcf7']); break;
          case 'shot':
            fx.shot(e.bx * T + 8, e.by * T + 4, e.x * K, e.y * K);
            fx.splash(e.x * K, e.y * K, e.hit ? 6 : 3, e.hit ? ['#ffffff', '#feae34', '#e43b44'] : ['#ffffff', '#93dcf7']);
            TC.sfx.play('hook');
            break;
          case 'sunk': TC.sfx.play('good'); fx.splash(e.x * K, e.y * K, 16, ['#ffffff', '#93dcf7', '#733e39']); break;
          case 'raidwarn':
            TC.sfx.play('alarm');
            App.toast(e.far ? '瞭望的人看见了海盗船，约 ' + TC.chartui.span(e.eta / TC.DAY) + '后到' : '海盗船！已经到跟前了', 'bad');
            break;
          case 'raidask': App.showRaid(e); break;
          case 'raidpaid': App.toast('东西给了，海盗走了', 'bad'); break;
          case 'raidfight':
            TC.sfx.play('alarm');
            if (TC.dialog.el && TC.dialog.el.id === 'raid') TC.dialog.close();
            App.toast(e.n + ' 条海盗船划过来了！' + (App.C.n.harpoon ? '' : '没有鱼叉架，只能看着他们搬'), 'bad');
            break;
          case 'raidend':
            if (e.boss) { if (e.stolen) App.toast('放过来的小船抢走了 ' + e.stolen + ' 份东西', 'bad'); }
            else if (e.clean) { TC.sfx.play('good'); App.toast('一条船也没让他们靠上来！海盗被打跑了（繁荣 +' + TC.data.balance.raid.repel + '）', 'good'); }
            else App.toast('海盗走了，抢走 ' + e.stolen + ' 份东西' + (e.sunk ? '，打沉了 ' + e.sunk + ' 条船' : ''), 'bad');
            break;
          case 'alert':
            TC.sfx.play(e.on ? 'alarm' : 'click');
            App.toast(e.on ? '钟敲响了：大家放下手里的活，进屋躲着' : '警报解除，大家回去干活');
            break;
          case 'reject':
            // 界面下单前都先查过，走到这里多半是同一瞬间别的事先发生了；说一声，免得玩家以为点了没反应
            if (e.cmd !== 'hook' && e.why !== 'gone' && !App.quiet && !TC.main.bot) App.deny(e.why);
            break;
          case 'dawn':
            if (!App.noSave) TC.store.set(DAWN_KEY, TC.save.pack(S, Date.now()));
            TC.main.save('dawn');
            App.toast('第 ' + e.day + ' 天');
            break;
          case 'death':
            TC.sfx.play('bad');
            App.toast(e.name + (e.why === 'thirst' ? ' 渴死了' : e.why === 'hunger' ? ' 饿死了' : ' 病重不治'), 'bad');
            break;
          case 'over':
            TC.main.save('over');
            App.showOver();
            break;
        }
      }
    },

    /* ── 弹窗 ── */
    showIntro() {
      TC.dialog.show({
        id: 'intro',
        title: '潮汐浮城',
        lines: [
          '大潮淹没了陆地。你和两位同伴守着一块三格见方的木筏，漂在一片垃圾海上。',
          '漂过来的浮木、塑料瓶、破布，都是旧世界留下的家当。把它们捞上来，把木筏一格一格扩成能住人的地方。',
          '先解决喝的和吃的。左上角的心愿会告诉你下一步做什么。木筏上还有一台泡过水的手摇电台：修好它，也许能听到别处的消息。',
        ],
        stack: true,
        buttons: [
          { label: '标准', note: '该有的风浪都有', primary: true, id: 'intro-start', onclick: () => App.pickDiff('normal') },
          { label: '休闲', note: '吃喝消耗慢一些，风暴和海盗少一些', id: 'intro-casual', onclick: () => App.pickDiff('casual') },
          { label: '硬核', note: '消耗更快，风暴和海盗更勤', id: 'intro-hard', onclick: () => App.pickDiff('hard') },
        ],
      });
    },

    /* 开场时选难度：同一个种子按选的难度重开（这时候一步都还没走） */
    pickDiff(diff) {
      const S = App.S;
      if (S.tick !== 0 || S.opts.diff === diff) return;
      App.begin(TC.sim.newGame(S.seed, { diff }), false);
      TC.main.save('new');
    },

    /* 海盗开口要东西 */
    showRaid(e) {
      const RES = TC.data.res, C = App.C;
      if (App.quiet || TC.main.bot) return;
      TC.chartui.close();
      TC.sfx.play('alarm');
      const list = Object.keys(e.demand).map(k => RES[k].name + ' ' + e.demand[k]).join('、');
      TC.dialog.show({
        id: 'raid',
        title: '海盗来了',
        lines: [e.n + ' 条挂着黑帆的船围了上来。领头的敲着船帮喊：把东西交出来，我们拿了就走！', '他们要：' + (list || '你们什么都没有，他们骂骂咧咧地看着')],
        stack: true,
        buttons: [
          { label: '交出去', note: '破财免灾', id: 'raid-pay', primary: C.n.harpoon < 2, onclick: () => { App.queue.push({ type: 'raidAnswer', pay: 1 }); App.flush(); } },
          { label: '不给', note: C.n.harpoon ? '有 ' + C.n.harpoon + ' 座鱼叉架。他们会划过来硬抢，每条船要射中三下才沉' : '没有鱼叉架：他们会划过来硬抢，还会伤人', id: 'raid-refuse', primary: C.n.harpoon >= 2, onclick: () => { App.queue.push({ type: 'raidAnswer', pay: 0 }); App.flush(); } },
        ],
      });
    },

    /* 升级了：告诉玩家解锁了什么。自动快进和脚本玩家操作时不弹窗，只飘一行字 */
    showLevel(e) {
      const L = TC.data.balance.levels, names = (e.unlocks || []).filter(id => !TC.data.buildings[id].tech).map(id => TC.data.buildings[id].name);
      TC.sfx.play('good');
      if (App.quiet || TC.main.bot) { App.toast('升到 ' + e.level + ' 级 · ' + e.name + (names.length ? '，解锁 ' + names.length + ' 种新建筑' : ''), 'good'); return; }
      App.remember('升到 ' + e.level + ' 级 · ' + e.name, 'good');
      const rows = [['人口上限', L.pop[e.level] + ' 人'], ['平台上限', L.tiles[e.level] + ' 格']];
      if (names.length) rows.push(['新建筑', names.join('、')]);
      TC.dialog.show({
        id: 'levelup',
        queue: true,
        title: e.level + ' 级 · ' + e.name,
        lines: ['繁荣度够了，这座浮城现在算得上一座“' + e.name + '”。能住的人更多，能铺的平台更大，建造菜单里也多了新东西。'],
        rows,
        buttons: [{ label: '好', primary: true, id: 'levelup-ok' }],
      });
    },

    /* 打赢了一个 Boss */
    showFortWin(e) {
      const B = TC.data.balance.war;
      TC.sfx.play('good');
      App.remember('拔掉了海盗的一处据点', 'good');
      if (App.quiet || TC.main.bot) { App.toast('海盗的据点拔掉了！', 'good'); return; }
      if (TC.panel.cur === 'site') TC.panel.update();
      TC.dialog.show({
        id: 'fortwin',
        queue: true,
        title: '据点拔掉了',
        lines: ['寨子烧了起来，黑帆帮剩下的船四散逃走。这片海往后太平多了：海盗隔好久才来一趟。'],
        rows: [['战利品', TC.siteui.listText(e.loot) + '（散在原地，派小船去捞）'], ['潮民、行商会的好感', '各 +' + B.fort], ['繁荣度', '+' + B.fortWin]],
        buttons: [{ label: '好', primary: true, id: 'fortwin-ok' }],
      });
    },

    showBossWin(e) {
      const bd = TC.data.bosses[e.id], B = TC.data.balance.boss;
      TC.sfx.play('good');
      fx_splash(e);
      App.remember('打赢了' + bd.name, 'good');
      if (App.quiet || TC.main.bot) { App.toast('打赢了' + bd.name + '！', 'good'); return; }
      if (TC.panel.cur === 'site') TC.panel.update();
      TC.dialog.show({
        id: 'bosswin',
        queue: true,
        title: bd.short + '沉下去了',
        lines: [bd.name + '翻了个身，慢慢沉进水里。这片海往后清静了。'],
        rows: [['战利品', TC.siteui.listText(e.loot) + '（漂在原地，派小船去捞）'], ['技能点', '+1'], ['繁荣度', '+' + B.win]],
        buttons: [{ label: '好', primary: true, id: 'bosswin-ok' }],
      });
    },

    /* 到了一个新地点 */
    showArrive(e) {
      const S = App.S, node = S.chart.nodes[e.node], kind = TC.data.world.kinds[node.kind];
      TC.sfx.play('good');
      const has = TC.chartui.siteSummary(node);
      if (App.quiet || TC.main.bot) { App.toast('到了：' + node.name, 'good'); return; }
      App.remember('到了：' + node.name, 'good');
      const rows = [];
      if (has) rows.push(['这里有', has]);
      if (node.sites.some(s => s.spec)) rows.push(['求救的火光', '有人等着接']);
      rows.push(['已经航行', S.voyage.legs + ' 段']);
      TC.dialog.show({
        id: 'arrive',
        queue: true,
        title: '到了：' + node.name,
        lines: [kind.desc, App.C.n.dock ? '远处的东西点一下就能看，小船会自己过去打捞。' : '远处的沉船、小岛要有小船坞才去得了（建造 → 航行）。'],
        rows,
        buttons: [{ label: '好', primary: true, id: 'arrive-ok' }],
      });
    },

    /* 航行途中遇到事：把选项摆出来 */
    showVoyEvent(id) {
      const ev = TC.data.events[id];
      if (App.quiet || TC.main.bot) return;
      TC.chartui.close();
      TC.sfx.play('click');
      TC.dialog.show({
        id: 'voyev',
        title: ev.title,
        lines: [ev.text],
        stack: true,
        buttons: ev.opts.map((o, i) => ({ label: o.label, note: o.note, id: 'voyev-' + i, primary: i === 0, onclick: () => { App.queue.push({ type: 'choose', opt: i }); App.flush(); } })),
      });
    },

    /* 途中的事有了结果：说一声 */
    voyResult(e) {
      const RES = TC.data.res, parts = [];
      if (TC.dialog.el && TC.dialog.el.id === 'voyev') TC.dialog.close();        // 拖得太久，已经按稳妥的办了
      for (const k in e.loot) parts.push(RES[k].name + ' +' + e.loot[k]);
      if (e.joined.length) parts.push(e.joined.join('、') + ' 上了浮城');
      const lost = Object.keys(e.lost).map(k => RES[k].name + ' −' + e.lost[k]);
      if (e.id === 'patrol') {
        if (e.opt === 0) App.toast('买路钱交了：' + (lost.join('、') || '他们嫌少，骂了几句就让开了'), 'bad');
        else if (e.opt === 2 && e.fail) { TC.sfx.play('bad'); App.toast('没闯过去：有人受了伤' + (lost.length ? '，还丢了货：' + lost.join('、') : ''), 'bad'); }
        else if (e.opt === 2) { TC.sfx.play('good'); App.toast('鱼叉一排射过去，哨船掉头就跑', 'good'); }
      } else if (e.fail) {
        TC.sfx.play('bad');
        App.toast('船底狠狠蹭了一下' + (lost.length ? '，掉了些货：' + lost.join('、') : ''), 'bad');
      } else if (parts.length) { TC.sfx.play('pickup'); App.toast(parts.join('，'), 'good'); }
      else if (e.id === 'shoal' && e.opt === 1) App.toast('有惊无险地蹭了过去', 'good');
    },

    showOver() {
      const S = App.S;
      const buttons = [];
      TC.dialog.clear();
      const dawn = App.noSave ? null : TC.store.get(DAWN_KEY);
      const un = dawn ? TC.save.unpack(dawn) : null;
      if (un && !un.error && !un.S.over && un.S.residents.length) {
        buttons.push({ label: '回到第 ' + TC.clock.day(un.S) + ' 天清晨', id: 'over-dawn', onclick: () => App.begin(un.S, false) });
      }
      buttons.push({ label: '新开一局', primary: true, id: 'over-new', onclick: () => App.newGame() });
      TC.dialog.show({
        id: 'over',
        title: '浮城沉寂了',
        lines: [S.over.why === 'left'
          ? '最后一个人在第 ' + TC.clock.day(S) + ' 天划着木板离开了。日子过得太苦，谁也留不住。'
          : '最后一个人在第 ' + TC.clock.day(S) + ' 天' + (S.over.why === 'thirst' ? '渴' : S.over.why === 'hunger' ? '饿' : '病') + '倒了。木筏还漂在海上，只是再没有人去捞那些漂过来的东西。'],
        rows: TC.storyui.statRows(S, App.C),
        wide: true,
        buttons,
      });
    },
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 启动、主循环、自动存档，以及给自动测试用的几个入口。
 * 本地调试参数（只在本地预览里有效，发布成 Artifact 后网址不带参数）：
 *   ?seed=42        指定种子开新局          ?new=1       不读存档，开新局
 *   ?speed=3        开局倍速                ?layout=phone  强制手机布局
 *   ?nostore=1      假装本地存储不可用      ?nointro=1   不放开场白
 *   ?sample=1&hour=20  美术样张（一座现成的小浮城），可指定时刻
 *   ?stress=2000    压力测试：大平台、几十座建筑、25 个居民、两千个漂浮物
 *   ?ff=600         开局先快进这么多步      ?bot=default 让脚本玩家来操作 */
(function (TC) {
  'use strict';

  const TICK_MS = 1000 / TC.TPS, T = TC.TILE, SUB = TC.SUB, N = TC.GRID;
  const SAVE_KEY = 'tidalcity.save', BAK_KEY = 'tidalcity.save.bak';

  let params;
  try { params = new URLSearchParams(location.search); } catch (e) { params = new URLSearchParams(''); }

  const M = TC.main = {
    params,
    acc: 0,              // 攒着还没走的模拟时间（毫秒）
    last: 0,
    viewTime: 0,         // 画面动画用的时钟，暂停时不走
    work: new Float32Array(120),   // 最近 120 帧每帧的工作耗时
    wi: 0, wn: 0,
    fps: 0, fpsN: 0, fpsT: 0,
    hudT: 0,
    playedMs: 0, savedAt: 0, everSaved: false,
    out: { events: [] },
    ready: false,
    bot: null,

    newSeed() { return ((Date.now() & 0x7fffffff) ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0; },

    stats() {
      const n = Math.min(M.wn, 120);
      if (!n) return { fps: 0, mean: 0, p95: 0 };
      const a = Array.from(M.work.subarray(0, n)).sort((x, y) => x - y);
      let sum = 0;
      for (const v of a) sum += v;
      return { fps: M.fps, mean: +(sum / n).toFixed(2), p95: +a[Math.min(n - 1, Math.floor(n * 0.95))].toFixed(2) };
    },

    save(why) {
      const App = TC.app;
      if (!App.S || App.noSave) return false;
      try {
        const prev = TC.store.read(SAVE_KEY);
        if (prev) TC.store.write(BAK_KEY, prev);      // 留一份上一次的存档作备份
        const ok = TC.store.set(SAVE_KEY, TC.save.pack(App.S, Date.now()));
        M.savedAt = M.playedMs;
        M.everSaved = ok;
        M.lastSaveWhy = why;
        return ok;
      } catch (e) { return false; }
    },

    load() {
      for (const key of [SAVE_KEY, BAK_KEY]) {
        const obj = TC.store.get(key);
        if (!obj) continue;
        const un = TC.save.unpack(obj);
        if (!un.error) return un.S;
      }
      return null;
    },

    /* 走一步，并把这一步的事件交给界面 */
    stepOnce() {
      const App = TC.app, S = App.S, C = App.C, out = M.out;
      if (M.bot && S.tick % 10 === 0) TC.sim.applyCommands(S, C, TC.bot.policies[M.bot](S, C), out);
      if (App.queue.length) { TC.sim.applyCommands(S, C, App.queue, out); App.queue.length = 0; }
      TC.render.beforeStep(S);
      TC.sim.step(S, C, out);
      TC.render.afterStep(S, C);
      if (out.events.length) { App.onEvents(out.events); out.events.length = 0; }
    },

    /* 调试和自动测试用：立刻走 n 步并重画一帧，不依赖浏览器的帧回调（后台标签页里帧回调会被节流） */
    advance(n) {
      const App = TC.app;
      App.quiet = true;                 // 快进时不弹升级窗，只飘字
      for (let i = 0; i < n && !App.S.over; i++) M.stepOnce();
      App.quiet = false;
      if (App.queue.length) { TC.sim.applyCommands(App.S, App.C, App.queue, M.out); App.queue.length = 0; TC.render.afterStep(App.S, App.C); }
      if (M.out.events.length) { App.onEvents(M.out.events); M.out.events.length = 0; }
      M.viewTime += n / TC.TPS;
      TC.fx.update(Math.min(0.2, n / TC.TPS));
      M.draw(1, 0.1);
      App.refreshAll();
      return App.S.tick;
    },

    draw(alpha, dt) {
      const App = TC.app;
      TC.render.view.ghosts = App.viewGhosts();
      if (App.tool) App.refreshPlace();
      TC.render.frame(App.S, App.C, alpha, M.viewTime, dt);
    },

    /* 自动测试用：找一个画面内的漂浮物，返回它的 CSS 坐标。kind：'reach' 够得着的，'far' 够不着的 */
    testPoint(kind) {
      const App = TC.app, cam = TC.cam, K = T / SUB;
      const w = cam.devW / cam.dpr, h = cam.devH / cam.dpr;
      for (const f of App.S.sea.floaters) {
        if (f.claim || f.tag || TC.render.reachable.has(f.id) !== (kind === 'reach')) continue;
        const c = cam.toCss(f.x * K, f.y * K);
        if (c[0] > 30 && c[1] > 120 && c[0] < w - 30 && c[1] < h - 110) return [Math.round(c[0]), Math.round(c[1])];
      }
      return null;
    },

    /* 自动测试用：在格坐标 (tx, ty) 放一个漂浮物，返回它的 CSS 坐标 */
    putFloater(kind, tx, ty) {
      const App = TC.app, S = App.S;
      const f = { id: S.nextId++, kind, x: Math.round(tx * SUB), y: Math.round(ty * SUB), u: 0, v: 0, tag: 0, claim: 0 };
      S.sea.floaters.push(f);
      TC.render.afterStep(S, App.C);
      M.draw(1, 0);
      return TC.cam.toCss(f.x * T / SUB, f.y * T / SUB).map(Math.round);
    },

    /* 自动测试用：某个界面元素中心的 CSS 坐标 */
    elPoint(id) {
      const e = document.getElementById(id);
      if (!e) return null;
      const body = e.closest('.panel-body');
      if (body) {
        const br = body.getBoundingClientRect(), er = e.getBoundingClientRect();
        if (er.top < br.top) body.scrollTop -= br.top - er.top + 4;
        else if (er.bottom > br.bottom) body.scrollTop += er.bottom - br.bottom + 4;
      }
      const r = e.getBoundingClientRect();
      return [Math.round(r.left + r.width / 2), Math.round(r.top + r.height / 2)];
    },

    /* 自动测试用：某一格中心的 CSS 坐标 */
    tilePoint(tx, ty) {
      const c = TC.cam.toCss(tx * T + 8, ty * T + 8);
      return [Math.round(c[0]), Math.round(c[1])];
    },

    /* 直接摆出来的平台：把结实程度补满 */
    fillHp(S) {
      for (let i = 0; i < S.grid.t.length; i++) S.grid.hp[i] = TC.grid.TILE_HP[S.grid.t[i]] || 0;
    },

    put(S, def, x, y) {
      S.buildings.push({ id: S.nextId++, def, x, y, st: 'on', work: 0, on: 1, w: 0, batch: 0, rec: '', prog: 0, wait: 0, pin: 0, prio: 0 });
      S.stats.built[def] = (S.stats.built[def] || 0) + 1;
    },

    /* 美术样张：一座现成的四级浮镇，三种平台、三十来座建筑、九个居民，照常运转 */
    sampleState() {
      const S = TC.sim.newGame(20261110), c = N >> 1;
      // 11×7 的平台：左边木筏板，中间偏右浮筒，最右钢架；四个角各缺一格
      for (let y = c - 3; y <= c + 3; y++) for (let x = c - 5; x <= c + 5; x++) {
        if ((x === c - 5 || x === c + 5) && (y === c - 3 || y === c + 3)) continue;
        S.grid.t[y * N + x] = x >= c + 4 ? TC.T_STEEL : x >= c + 1 ? TC.T_PONTOON : TC.T_RAFT;
      }
      const LAYOUT = [
        ['net', -4, -3], ['fishing', -2, -3], ['drying', 0, -3], ['flag', 2, -3], ['lights', 4, -3],
        ['stockpile', -4, -2], ['warehouse', -2, -2], ['shack', 2, -2], ['cabin', 4, -2],
        ['rainbarrel', -5, -1], ['still', -3, -1], ['hammock', 1, -1], ['hammock', 2, -1], ['hammock', 3, -1], ['plant', 5, -1],
        ['sawbench', -4, 0], ['ropewalk', -2, 0], ['campfire', -1, 0], ['teahouse', 1, 0], ['tank', 3, 0], ['statue', 5, 0],
        ['press', -3, 1], ['kitchen', 1, 1], ['garden', 3, 1],
        ['smithy', -4, 2], ['plant', 0, 2], ['garden', 2, 2], ['lights', 4, 2],
        ['fishing', -3, 3], ['net', -1, 3], ['fishing', 3, 3],
        ['helm', 0, 0], ['sail', -1, -2], ['sail', 0, 1], ['dock', 5, 1], ['watchtower', -5, 0], ['lab', -2, 2], ['radio', 3, -3],
        ['bell', -1, 2], ['harpoon', 5, 2], ['breakwater', -5, 2], ['infirmary', -3, 0], ['windmill', 1, -3], ['battery', 1, 2], ['purifier', 1, 3], ['solar', 4, 0], ['searchlight', -1, 1],
      ];
      M.fillHp(S);
      for (const l of LAYOUT) M.put(S, l[0], c + l[1], c + l[2]);
      for (const p of [[2, 0], [-1, -1], [4, 1], [-5, 1], [0, -2], [-2, 2]]) TC.people.add(S, c + p[0], c + p[1]);
      Object.assign(S.stock, { wood: 40, plastic: 14, scrap: 9, cloth: 8, kelp: 12, seed: 2, ewaste: 4, plank: 14, sheet: 8, rope: 6, parts: 5, fish: 9, dried: 6, grilled: 10, veg: 5, meal: 4, water: 30, data: 6, medicine: 2 });
      for (const k of ['windmill', 'solar', 'battery', 'purifier', 'searchlight']) S.progress.tech.done[k] = 0;
      for (const k in S.stock) S.seen[k] = 1;
      S.progress.level = 4;
      S.progress.prosperity = 215;
      const hour = params.has('hour') ? Number(params.get('hour')) : 10;
      S.tick = Math.round(((hour - TC.START_HOUR + 24) % 24) * TC.HOUR);
      for (const w of TC.data.wishes) S.progress.done[w.id] = 0;
      const C = TC.sim.rebuild(S);
      TC.voyage.placeSites(S, C);                      // 城变大了，远处的沉船跟着往外挪
      TC.voyage.reveal(S, C);                          // 有瞭望塔：相邻的地点看得清
      return S;
    },

    /* 压力测试：40×40 的平台、几十座建筑、25 个居民，四周撒满漂浮物 */
    stressState(n) {
      const S = TC.sim.newGame(7), kinds = Object.keys(TC.data.floaters), rnd = TC.rng.local(7);
      S.sea.floaters.length = 0;
      for (let y = 4; y < 44; y++) for (let x = 4; x < 44; x++) S.grid.t[y * N + x] = 1 + ((x >> 3) + (y >> 3)) % 3;
      M.fillHp(S);
      const defs = ['campfire', 'rainbarrel', 'stockpile', 'hammock', 'still', 'shack', 'sawbench', 'lights', 'drying', 'cabin', 'ropewalk', 'warehouse'];
      let di = 0;
      for (let y = 6; y < 42; y += 5) for (let x = 6; x < 42; x += 5) M.put(S, defs[di++ % defs.length], x, y);
      S.progress.level = 6;
      for (let x = 6; x < 42; x += 6) M.put(S, 'fishing', x, 43);
      while (S.residents.length < 25) TC.people.add(S, rnd.int(5, 42), rnd.int(5, 42));
      for (const k in S.stock) S.stock[k] = 60;
      for (let i = 0; i < n; i++) {
        let x, y;
        do { x = rnd.int(-12, N + 12); y = rnd.int(-12, N + 12); } while (x >= 3 && x < 45 && y >= 3 && y < 45);
        S.sea.floaters.push({ id: S.nextId++, kind: rnd.pick(kinds), x: x * SUB + rnd.int(0, SUB - 1), y: y * SUB + rnd.int(0, SUB - 1), u: 0, v: 0, tag: 0, claim: 0 });
      }
      S.tick = 4 * TC.HOUR;
      return S;
    },
  };

  function frame(ts) {
    requestAnimationFrame(frame);
    const App = TC.app, S = App.S;
    if (!S) return;
    const dt = Math.min(250, M.last ? ts - M.last : 16);
    M.last = ts;
    const t0 = performance.now();

    App.keyPan(dt);
    const running = App.speed > 0 && !App.blocked && !S.over;
    if (!running) {
      // 暂停时命令照样生效（可以停下来慢慢规划），只是时间不走
      if (!App.blocked && App.queue.length) {
        TC.sim.applyCommands(S, App.C, App.queue, M.out);
        App.queue.length = 0;
        TC.render.afterStep(S, App.C);
        if (M.out.events.length) { App.onEvents(M.out.events); M.out.events.length = 0; }
      }
    } else {
      M.acc += dt * App.speed;
      let n = 0;
      while (M.acc >= TICK_MS && n < 5 && !S.over) { M.stepOnce(); M.acc -= TICK_MS; n++; }
      if (M.acc >= TICK_MS) M.acc = 0;     // 卡顿之后不追帧，丢掉欠下的时间
      M.viewTime += dt / 1000;
      M.playedMs += dt;
      TC.fx.update(dt / 1000);
    }

    M.draw(M.acc / TICK_MS, running ? dt / 1000 : 0);

    M.work[M.wi] = performance.now() - t0;
    M.wi = (M.wi + 1) % 120;
    M.wn++;
    M.fpsN++;
    if (ts - M.fpsT >= 1000) { M.fps = Math.round(M.fpsN * 1000 / (ts - M.fpsT)); M.fpsN = 0; M.fpsT = ts; }
    TC.music.frame(S);
    if (ts - M.hudT >= 200) { M.hudT = ts; App.refreshAll(); }
    if (M.playedMs - M.savedAt >= 60000) M.save('timer');
    if (!M.ready) { M.ready = true; window.__READY__ = true; }
  }

  function start(data) {
    const App = TC.app;
    TC.artBuild();
    if (params.has('nostore')) TC.store.forceOff = true;
    if (params.has('layout')) App.forceLayout = params.get('layout');
    App.init();
    if (TC.store.get('tidalcity.sound') === 0) TC.sfx.on = false;
    if (TC.store.get('tidalcity.music') === 0) TC.music.on = false;
    if (params.has('bot')) M.bot = params.get('bot');

    let S = null, fresh = false;
    if (params.has('sample')) { S = M.sampleState(); App.noSave = true; }
    else if (params.has('stress')) { S = M.stressState(Number(params.get('stress')) || 2000); App.noSave = true; }
    else {
      if (data && data.save) { const un = TC.save.unpack(data.save); if (!un.error) S = un.S; }
      if (!S && !params.has('seed') && !params.has('new')) S = M.load();
      if (!S) { S = TC.sim.newGame(params.has('seed') ? Number(params.get('seed')) >>> 0 : M.newSeed()); fresh = !params.has('nointro') && !params.has('ff') && !params.has('bot'); }
    }
    if (params.has('speed')) App.speed = Math.max(0, Math.min(3, Number(params.get('speed')) | 0));
    App.begin(S, fresh);
    if (params.has('ff')) { M.advance(Math.min(400000, Number(params.get('ff')) | 0)); App.centerOnTown(); }

    document.addEventListener('visibilitychange', () => { if (document.hidden) M.save('hidden'); else M.last = 0; });
    window.addEventListener('pagehide', () => M.save('pagehide'));
    requestAnimationFrame(frame);
  }

  /* 自动测试读取的自检结果 */
  window.__SELFTEST__ = function () {
    const App = TC.app, cam = TC.cam, S = App.S;
    const rect = App.canvas.getBoundingClientRect(), st = M.stats();
    const de = document.documentElement;
    return {
      build: TC.BUILD, layout: App.layout, k: cam.k, dpr: cam.dpr, dev: [cam.devW, cam.devH], buf: [cam.bw, cam.bh],
      integerScale: Number.isInteger(cam.k) && Math.abs(rect.width * cam.dpr - cam.devW) < 1.01 && Math.abs(rect.height * cam.dpr - cam.devH) < 1.01,
      hScroll: de.scrollWidth > window.innerWidth + 1 || document.body.scrollWidth > window.innerWidth + 1,
      fps: st.fps, workMean: st.mean, workP95: st.p95, draws: TC.render.draws,
      tick: S.tick, day: TC.clock.day(S), floaters: S.sea.floaters.length, picked: S.stats.picked, pop: S.residents.length,
      level: S.progress.level, prosperity: S.progress.prosperity,
      at: S.voyage.at, sailing: S.voyage.to >= 0, legs: S.voyage.legs, techs: TC.tech.count(S), chart: !!TC.chartui.el,
      weather: S.weather.kind, alert: S.alert, diff: S.opts.diff, power: [S.power.gen, S.power.use, S.power.e], tilesLost: S.stats.tilesLost,
      buildings: S.buildings.length, tiles: S.stats.tiles, stock: Object.assign({}, S.stock), over: !!S.over,
      hash: TC.sim.hash(S), store: TC.store.available(), speed: App.speed, cam: [Math.round(cam.x), Math.round(cam.y)],
      panel: TC.panel.cur, tool: App.tool, modal: TC.dialog.el ? TC.dialog.el.id : null,
      bad: TC.sim.validate(S),
    };
  };

  /* 页面在 Artifact 里热更新时，把当前这局带到新版本里接着玩 */
  const hot = window.claude && window.claude.hot;
  try {
    if (hot && typeof hot.snapshot === 'function') {
      hot.snapshot(() => (TC.app.S && !TC.app.noSave ? { save: TC.save.pack(TC.app.S, Date.now()) } : {}));
    }
  } catch (e) { /* 忽略 */ }
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})(globalThis.TC = globalThis.TC || {});

</script>
