<script>
/* 时钟、风和天气。一天 3600 步，开局是第 1 天早上 7 点。
 * 天气：clear 晴、cloudy 多云、rain 雨、fog 雾（清晨起，上午散）、storm 风暴（提前定好哪一步来、哪一步走）。
 * 酷热不算一种天气，是晴天上面的一层：S.weather.heat 记着热到哪一步。 */
(function (TC) {
  'use strict';

  const U = TC.util;

  const Clock = TC.clock = {
    abs(S) { return S.tick + TC.START_HOUR * TC.HOUR; },
    day(S) { return Math.floor(Clock.abs(S) / TC.DAY) + 1; },
    hourF(S) { return (Clock.abs(S) % TC.DAY) / TC.HOUR; },   // 0–24 的小数
    tod(S) { return (Clock.abs(S) % TC.DAY) / TC.DAY; },      // 0–1
    hhmm(S) {
      const m = Math.floor((Clock.abs(S) % TC.DAY) * 60 / TC.HOUR);
      return U.pad2(Math.floor(m / 60)) + ':' + U.pad2(Math.floor((m % 60) / 10) * 10);
    },
    /* 现在是不是干活的时间 / 睡觉的时间 */
    workTime(S) { const h = Clock.hourF(S), D = TC.data.balance.day; return h >= D.workFrom && h < D.workTo; },
    sleepTime(S) { const h = Clock.hourF(S), D = TC.data.balance.day; return h >= D.sleepFrom || h < D.sleepTo; },
  };

  TC.sys.world = function (S, C, out) {
    const W = S.weather, R = TC.rng, B = TC.data.balance.weather;

    if (S.tick % 200 === 0) {
      const r = R.next(S, 'weather');
      if (r < 0.3) W.wd = (W.wd + (r < 0.15 ? 1 : 15)) & 15;              // 风向慢慢转
      const r2 = R.next(S, 'weather');
      if (r2 < 0.16) W.ws = U.clamp(W.ws + (r2 < 0.08 ? 1 : -1), 0, 3);   // 风力偶尔增减
    }

    const B2 = TC.data.balance.weather2, BS = TC.data.balance.storm, h = Clock.hourF(S);
    if (S.tick % B.every === 0 && W.kind !== 'storm') {
      const r = R.next(S, 'weather'), was = W.kind;
      if (was === 'fog') { if (h >= B2.fogTo || h < B2.fogFrom) W.kind = 'cloudy'; }       // 雾到上午就散
      else if (was === 'clear') { if (r < B.clearToCloudy) W.kind = 'cloudy'; }
      else if (was === 'cloudy') {
        const reef = TC.hazard.region(S).id === 'reef' ? 1.8 : 1;                          // 礁海多雾
        if (h >= B2.fogFrom && h < B2.fogTo - 2 && R.next(S, 'weather') < B2.fogChance * reef) W.kind = 'fog';
        else if (r < B.cloudyToClear) W.kind = 'clear';
        else if (r < B.cloudyToClear + B.cloudyToRain) W.kind = 'rain';
      } else if (r < B.rainToCloudy) W.kind = 'cloudy';
      if (W.kind !== was) out.events.push({ t: 'weather', kind: W.kind, was });
    }

    // 酷热：晴天的上午掷一次，热到傍晚
    if (S.tick % TC.DAY === 2 * TC.HOUR && W.kind === 'clear' && R.next(S, 'weather') < B2.heatChance) {
      W.heat = S.tick + 9 * TC.HOUR;
      out.events.push({ t: 'heat' });
    }

    // 风暴：每天早上掷一次今天起不起；掷中了定好来去的时间，看得见就先预警
    const st = W.storm;
    if (!st) {
      if (Math.abs(h - BS.rollHour) < 1e-9 && Clock.day(S) > BS.grace) {
        const reg = TC.hazard.region(S);
        if (R.next(S, 'weather') < reg.storm * TC.hazard.diff(S).storm) {
          const at = S.tick + Math.round((BS.lead[0] + R.next(S, 'weather') * (BS.lead[1] - BS.lead[0])) * TC.DAY);
          W.storm = { at, end: at + R.int(S, 'weather', BS.dur[0], BS.dur[1]), sev: R.int(S, 'weather', reg.sev[0], reg.sev[1]), warned: 0 };
        }
      }
    } else if (W.kind !== 'storm') {
      if (!st.warned && (C.n.watchtower > 0 || st.at - S.tick <= BS.warnNear)) {
        st.warned = 1;
        out.events.push({ t: 'stormwarn', eta: st.at - S.tick, sev: st.sev });
      }
      if (S.tick >= st.at) {
        const was = W.kind;
        W.kind = 'storm';
        W.ws = 3;
        W.heat = 0;
        out.events.push({ t: 'weather', kind: 'storm', was, sev: st.sev });
      }
    } else if (S.tick >= st.end) {
      W.kind = 'rain';
      W.ws = 2;
      W.storm = null;
      S.stats.storms++;
      if (TC.story.cur(S) && TC.story.cur(S).id === 'storm') S.story.flags.storm = 1;      // 主线：进了风暴带以后扛过了一场风暴
      if (S.alert && !S.threat.raid) { S.alert = 0; C.jobsDirty = true; }                 // 风暴过去了：警报自己解除
      out.events.push({ t: 'weather', kind: 'rain', was: 'storm' });
      out.events.push({ t: 'stormend' });
    }

    if (S.tick % TC.DAY === 0) out.events.push({ t: 'dawn', day: Clock.day(S) });
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/sys_world.js
</script>
<script>
/* 研究和“值守的差事”。
 * 技术：S.progress.tech = {done: {技术: 完成时的步数}, cur 正在研究的, prog 进度}。
 * 值守的差事：有些建筑不产出东西，但要有人守着才起作用（船舵要人掌舵，研究台要人钻研）。
 *   TC.duty[名字] = { want(S, C, b) 现在要不要人（返回优先级，0 不要）, tick(S, C, b, r, out) 守着的人每步做什么（返回 false 表示可以走了）,
 *                     status(S, C, b) 没人守着时的状况码, verb 干这活叫什么 } */
(function (TC) {
  'use strict';

  const Tech = TC.tech = {
    has(S, id) { return S.progress.tech.done[id] !== undefined; },

    count(S) {
      let n = 0;
      for (const k in S.progress.tech.done) n++;
      return n;
    },

    /* 能不能开始研究这一项；返回 null 表示可以，否则是原因码 */
    can(S, C, id) {
      const def = TC.data.tech[id], T = S.progress.tech;
      if (!def) return 'unknown';
      if (T.done[id] !== undefined) return 'done';
      if (T.cur) return 'busy';
      if (!C.n.lab) return 'nolab';
      if (def.req && T.done[def.req] === undefined) return 'req';
      if ((S.stock.data || 0) < def.cost) return 'cost';
      return null;
    },

    /* 得到一项技术（研究出来的，或者专家带来的）。已经有了就什么都不做 */
    grant(S, C, id, out, how) {
      const T = S.progress.tech;
      if (T.done[id] !== undefined) return false;
      T.done[id] = S.tick;
      if (T.cur === id) {
        // 正研究到一半，别处先得到了：退还资料
        S.stock.data = (S.stock.data || 0) + TC.data.tech[id].cost;
        T.cur = '';
        T.prog = 0;
      }
      C.jobsDirty = true;
      out.events.push({ t: 'tech', id, how: how || 'lab' });
      TC.voyage.reveal(S, C);
      return true;
    },

    /* 技术带来的干活速度倍数 */
    mult(S, skill) { return skill === 'craft' && Tech.has(S, 'tools') ? 1.2 : 1; },
  };

  TC.duty = {
    helm: {
      verb: '掌舵',
      want(S, C, b) { return TC.voyage.sailing(S) && !S.voyage.ev ? TC.data.balance.prio.urgent : 0; },
      tick(S, C, b, r, out) {
        if (!TC.voyage.sailing(S)) return false;
        S.voyage.steer = S.tick;
        return true;
      },
      status(S) { return TC.voyage.sailing(S) ? '' : 'moored'; },
    },
    lab: {
      verb: '做研究',
      want(S) { return S.progress.tech.cur ? 57 : 0; },
      tick(S, C, b, r, out) {
        const T = S.progress.tech;
        if (!T.cur) return false;
        T.prog += TC.people.speed(r) * Tech.mult(S, 'craft') * (b.pw ? TC.data.balance.power.lab : 1);
        if (T.prog < TC.data.tech[T.cur].work) return true;
        const id = T.cur;
        T.cur = '';
        T.prog = 0;
        Tech.grant(S, C, id, out, 'lab');
        return false;
      },
      status(S) { return S.progress.tech.cur ? '' : 'noproject'; },
      frac(S) { const T = S.progress.tech; return T.cur ? T.prog / TC.data.tech[T.cur].work : 0; },
    },
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/tech.js
</script>
<script>
/* 技能点和城务技能。
 *   S.skills = {pts 还没花的点数, got 一共得过多少点, lv: {技能 → 级数}}
 * 各系统用 TC.skill.val(S, id) 取一项技能眼下的加成量（级数 × 每级的量）。 */
(function (TC) {
  'use strict';

  const Sk = TC.skill = {
    lv(S, id) { return (S.skills && S.skills.lv[id]) || 0; },      // 旧存档迁移到一半时还没有 S.skills

    /* 这项技能眼下的加成量 */
    val(S, id) { return Sk.lv(S, id) * TC.data.balance.skill[id]; },

    /* 能不能再学一级：null 可以；gone 没有这项；done 已经满级；cost 没有点数 */
    can(S, id) {
      if (!TC.data.skills[id]) return 'gone';
      if (Sk.lv(S, id) >= TC.data.balance.skill.max) return 'done';
      if (S.skills.pts < 1) return 'cost';
      return null;
    },

    learn(S, C, id, out) {
      S.skills.pts--;
      S.skills.lv[id] = Sk.lv(S, id) + 1;
      if (id === 'store') TC.bld.reindex(S, C);          // 仓储容量变了
      C.jobsDirty = true;
      out.events.push({ t: 'skill', id, lv: S.skills.lv[id] });
    },

    /* 得到技能点。why：level 升级 / chapter 主线走完一章 / boss 打赢了 Boss */
    grant(S, n, why, out) {
      S.skills.pts += n;
      S.skills.got += n;
      out.events.push({ t: 'skillpt', n, why, pts: S.skills.pts });
    },

    /* 已经学了多少级（各项加起来） */
    spent(S) {
      let n = 0;
      for (const k in S.skills.lv) n += S.skills.lv[k];
      return n;
    },
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/skills.js
</script>
<script>
/* 买卖：用旧币在集市上买进卖出。
 *   集市挂在去处上：s.market = {kind, goods: {东西 → 眼下有多少}, max: {东西 → 最多备多少}, purse 今天还能收多少旧币的货, day 上回补货是第几天}
 *   自家贸易站的那一份在 S.post（同样的结构，另有 next：行商下回哪一步上门），没有贸易站就是 null；买卖时用去处编号 -1 指它
 * 价格：基准价 × 这片海域的行情 × 每天的浮动（只取决于种子、地点和日子，不进存档）；买价再加差价，卖价再减差价 */
(function (TC) {
  'use strict';

  const POST = -1;

  const Mk = TC.market = {
    POST,

    /* 按去处编号找集市：返回 {m 集市, node 按哪个地点的行情算, s 去处}；没有返回 null */
    at(S, C, sid) {
      const v = S.voyage, node = S.chart.nodes[v.to >= 0 ? v.to : v.at];
      if (sid === POST) return S.post && C.n.tradepost > 0 ? { m: S.post, node, s: null } : null;
      const s = TC.voyage.site(S, sid);
      return s && s.market ? { m: s.market, node, s } : null;
    },

    /* 这个集市现在开不开张：null 开着；closed 还没开（灯塔要先送过补给） */
    open(S, at) {
      if (at.s && at.s.kind === 'lighthouse' && S.story.step <= Mk.supplyStep()) return 'closed';
      return null;
    },

    supplyStep() {
      if (Mk._supply === undefined) Mk._supply = TC.data.story.steps.findIndex(s => s.id === 'supply');
      return Mk._supply;
    },

    /* 这样东西在这个地点今天的行情价（旧币/份，带小数） */
    mid(S, node, res) {
      const M = TC.data.market, reg = M.regions[node.region], i = TC.data.marketOrder.indexOf(res);
      if (i < 0) return 0;
      const swing = 1 + M.swing * (2 * TC.rng.hash01(S.seed ^ (node.id * 7919), TC.clock.day(S), i) - 1);
      return M.base[res] * reg.all * (reg.k[res] || 1) * swing;
    },

    spread(m) { const K = TC.data.market; return K.kinds[m.kind].spread || K.spread; },

    /* 买进一份要多少旧币 */
    buyPrice(S, at, res) {
      const mid = Mk.mid(S, at.node, res);
      return mid > 0 ? Math.max(2, Math.ceil(mid * (1 + Mk.spread(at.m)) * (1 - TC.skill.val(S, 'barter')) * (1 - TC.faction.discount(S, at)))) : 0;
    },

    /* 卖出一份得多少旧币（总比买价低） */
    sellPrice(S, at, res) {
      const mid = Mk.mid(S, at.node, res);
      if (mid <= 0) return 0;
      return Math.max(1, Math.min(Mk.buyPrice(S, at, res) - 1, Math.floor(mid * (1 - Mk.spread(at.m)) * (1 + TC.skill.val(S, 'barter')) * (1 + TC.faction.discount(S, at)))));
    },

    /* 新开一个集市：从这种集市可能卖的货里挑几样（rnd 是不进存档的本地随机数） */
    make(kind, rnd, day) {
      const def = TC.data.market.kinds[kind], pool = def.sells.slice(), m = { kind, goods: {}, max: {}, purse: def.purse, day: day || 1 };
      for (let i = 0; i < def.n && pool.length; i++) {
        const g = pool.splice(rnd.int(0, pool.length - 1), 1)[0];
        m.max[g[0]] = g[1];
        m.goods[g[0]] = g[1];
      }
      return m;
    },

    /* 过了几天没来：货补回一些，钱匣子重新装满 */
    refresh(S, m) {
      const day = TC.clock.day(S), d = day - m.day;
      if (d <= 0) return;
      const def = TC.data.market.kinds[m.kind];
      for (const k in m.max) m.goods[k] = Math.min(m.max[k], (m.goods[k] || 0) + Math.ceil(m.max[k] * def.restock * d));
      m.purse = def.purse;
      m.day = day;
    },

    /* 能不能买：null 可以；gone 没有这个集市；closed 还没开张；bad 数量不对；sold 货不够；cost 旧币不够；full 放不下 */
    canBuy(S, C, sid, res, n) {
      const at = Mk.at(S, C, sid);
      if (!at) return 'gone';
      if (Mk.open(S, at)) return 'closed';
      if (!Number.isInteger(n) || n < 1 || n > 99 || !TC.data.market.base[res]) return 'bad';
      if ((at.m.goods[res] || 0) < n) return 'sold';
      if ((S.stock.coin || 0) < Mk.buyPrice(S, at, res) * n) return 'cost';
      if (TC.stock.room(S, C, res) < n) return 'full';
      return null;
    },

    /* 能不能卖：null 可以；none 你没有这么多；purse 他们今天收不起了；别的同上 */
    canSell(S, C, sid, res, n) {
      const at = Mk.at(S, C, sid);
      if (!at) return 'gone';
      if (Mk.open(S, at)) return 'closed';
      if (!Number.isInteger(n) || n < 1 || n > 99 || !TC.data.market.base[res]) return 'bad';
      if ((S.stock[res] || 0) < n) return 'none';
      if (at.m.purse < Mk.sellPrice(S, at, res) * n) return 'purse';
      return null;
    },

    buy(S, C, sid, res, n, out) {
      const at = Mk.at(S, C, sid), cost = Mk.buyPrice(S, at, res) * n;
      S.stock.coin -= cost;
      at.m.goods[res] -= n;
      TC.stock.add(S, C, res, n);
      S.stats.bought += n;
      S.stats.coinOut += cost;
      TC.faction.traded(S, at, cost, out);
      C.jobsDirty = true;
      out.events.push({ t: 'bought', sid, res, n, cost });
    },

    sell(S, C, sid, res, n, out) {
      const at = Mk.at(S, C, sid), gain = Mk.sellPrice(S, at, res) * n;
      S.stock[res] -= n;
      S.stock.coin = (S.stock.coin || 0) + gain;
      if (!S.seen.coin) S.seen.coin = 1;
      at.m.purse -= gain;
      S.stats.sold += n;
      S.stats.coinIn += gain;
      TC.faction.traded(S, at, gain, out);
      C.jobsDirty = true;
      out.events.push({ t: 'sold', sid, res, n, gain });
    },

    /* 这片海域什么便宜、什么贵（给海图和集市面板看的）：{cheap: [东西…], dear: [东西…]} */
    lean(region) {
      const k = TC.data.market.regions[region].k, cheap = [], dear = [];
      for (const r in k) (k[r] < 1 ? cheap : dear).push(r);
      cheap.sort((a, b) => k[a] - k[b]);
      dear.sort((a, b) => k[b] - k[a]);
      return { cheap, dear };
    },

    /* 这个地点有没有集市（海图上的标记用） */
    nodeHas(n) { return n.sites.some(s => !!s.market); },
  };

  TC.sys.market = function (S, C, out) {
    if (S.tick % 50 !== 0) return;
    // 眼前的集市：隔天补货
    if (S.voyage.to < 0) {
      const ss = TC.voyage.node(S).sites;
      for (let i = 0; i < ss.length; i++) if (ss[i].market) Mk.refresh(S, ss[i].market);
    }
    // 自家的贸易站：行商隔几天上门一趟，换一批货
    if (C.n.tradepost > 0) {
      const def = TC.data.market.kinds.post;
      if (!S.post) S.post = { kind: 'post', goods: {}, max: {}, purse: 0, day: TC.clock.day(S), next: S.tick + 600 };
      if (S.tick >= S.post.next) {
        const pool = def.sells.slice();
        S.post.goods = {};
        S.post.max = {};
        for (let i = 0; i < def.n && pool.length; i++) {
          const g = pool.splice(TC.rng.int(S, 'event', 0, pool.length - 1), 1)[0];
          S.post.max[g[0]] = g[1];
          S.post.goods[g[0]] = g[1];
        }
        S.post.purse = def.purse;
        S.post.day = TC.clock.day(S);
        S.post.next = S.tick + Math.round(def.every * TC.DAY * (0.8 + TC.rng.next(S, 'event') * 0.5) * (TC.faction.tier(S, 'guild') >= 2 ? 0.7 : 1));      // 行商会的同盟：上门更勤
        out.events.push({ t: 'peddler' });
      }
    }
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/sys_market.js
</script>
<script>
/* 航行：整座浮城在海图上从一个地点驶向相邻的地点。
 * 城在画面上永远不动，动的是海：航行时漂浮物迎面流过，到了地方再把那里的去处（沉船、废墟、小岛……）摆到海面上。
 *   S.voyage = {at 所在（或刚离开）的地点, to 正驶向的地点（-1 表示停泊着）, dist 这一段多远（里）, done 已经走了多远,
 *               head 航向（十六方位）, flow 海面往后流的速度, legs 累计航行了几段, since 到达这里是哪一步, steer 上一次有人掌舵是哪一步,
 *               hold 还要耽搁多少步, evs 这一段路上会遇到的事 [[走到几成, 事件], …], ev 正等着拿主意的事 {id, at}}
 * 小船：居民从船坞划船去某个去处，忙一阵，把东西（或人）带回来。船的位置记在居民的任务里。 */
(function (TC) {
  'use strict';

  const SUB = TC.SUB, DIR = TC.DIR16, N = TC.GRID;
  const NONE = [];
  const ACTS = ['rescue', 'salvage', 'dive', 'fish'];

  const Voy = TC.voyage = {
    node(S) { return S.chart.nodes[S.voyage.at]; },
    sailing(S) { return S.voyage.to >= 0; },

    /* 和某个地点相邻的地点：[[编号, 距离], …] */
    links(S, id) {
      const list = [], E = S.chart.edges;
      for (let i = 0; i < E.length; i++) {
        if (E[i][0] === id) list.push([E[i][1], E[i][2]]);
        else if (E[i][1] === id) list.push([E[i][0], E[i][2]]);
      }
      return list;
    },

    /* 两个地点之间的距离；不相邻返回 -1 */
    dist(S, a, b) {
      const E = S.chart.edges;
      for (let i = 0; i < E.length; i++) if ((E[i][0] === a && E[i][1] === b) || (E[i][0] === b && E[i][1] === a)) return E[i][2];
      return -1;
    },

    /* 现在海面上的去处（航行途中没有） */
    sites(S) { return Voy.sailing(S) ? NONE : Voy.node(S).sites; },

    site(S, sid) {
      const ss = Voy.sites(S);
      for (let i = 0; i < ss.length; i++) if (ss[i].id === sid) return ss[i];
      return null;
    },

    hasSpec(S, id) {
      for (let i = 0; i < S.residents.length; i++) if (S.residents[i].spec === id) return true;
      return false;
    },

    /* 从 a 点朝 b 点是十六方位里的哪一个 */
    heading(ax, ay, bx, by) {
      const dx = bx - ax, dy = by - ay;
      let best = 0, bd = -Infinity;
      for (let i = 0; i < 16; i++) {
        const d = dx * DIR[i][0] + dy * DIR[i][1];
        if (d > bd) { bd = d; best = i; }
      }
      return best;
    },

    /* 帆的效率：看风力，也看风向和航向差多少（顺风、侧风、逆风） */
    windEff(S, head) {
      const V = TC.data.balance.voyage, W = S.weather;
      const diff = Math.min((W.wd - head) & 15, (head - W.wd) & 15);
      return V.wind[W.ws] * (diff <= 2 ? V.tail : diff >= 6 ? V.head : V.cross) * (W.kind === 'storm' ? TC.data.balance.storm.sail : 1);
    },

    /* 各项推力和眼下的航速（里/天）。head 不给就用正在走的航向；manned 不给就看现在有没有人掌舵。
     * 界面也用它解释“为什么这么慢” */
    power(S, C, head, manned) {
      const V = TC.data.balance.voyage, BD = TC.data.buildings;
      if (head === undefined) head = S.voyage.head;
      if (manned === undefined) manned = S.tick - S.voyage.steer <= 2;
      const eff = Voy.windEff(S, head);
      const sail = C.n.sail * BD.sail.thrust * eff * (TC.tech.has(S, 'bigsail') ? 1.3 : 1);
      const engine = (S.stock.fuel || 0) > 0 ? C.n.engine * BD.engine.thrust : 0;
      const mass = V.mass / (V.mass + (C.deckN + C.steelN * 0.5) * (TC.tech.has(S, 'hull') ? 0.7 : 1));      // 钢架平台一格顶一格半
      let speed = (V.row + sail + engine) * mass;
      if (Voy.hasSpec(S, 'pilot')) speed *= V.nav;
      speed *= 1 + TC.skill.val(S, 'sail');
      if (!manned) speed *= V.adrift;
      return { row: V.row, sail, engine, mass, eff, manned, speed };
    },

    /* 把相邻的地点标成“见过”：有瞭望塔看得清，有海图学或领航员能看到两段以外 */
    reveal(S, C) {
      if (!S.chart) return;
      const clear = C.n.watchtower > 0 ? 2 : 1;
      const far = TC.tech.has(S, 'charts') || Voy.hasSpec(S, 'pilot') || (S.factions && TC.faction.tier(S, 'tide') >= 1);
      const near = Voy.links(S, S.voyage.at);
      for (let i = 0; i < near.length; i++) {
        const n = S.chart.nodes[near[i][0]];
        if (n.seen < clear) n.seen = clear;
        if (!far) continue;
        const next = Voy.links(S, n.id);
        for (let j = 0; j < next.length; j++) {
          const m = S.chart.nodes[next[j][0]];
          if (m.seen < clear) m.seen = clear;
        }
      }
    },

    /* 到了一个地点：把那里的去处摆到浮城四周 */
    placeSites(S, C) {
      const A = TC.sea.area(S, C), ss = Voy.node(S).sites;
      for (let i = 0; i < ss.length; i++) {
        const s = ss[i];
        s.x = Math.round(A.cx + DIR[s.dir][0] * (A.hw + s.far * SUB) / 100);
        s.y = Math.round(A.cy + DIR[s.dir][1] * (A.hh + s.far * SUB) / 100);
      }
    },

    /* 这一格水面是不是离某个去处太近（不能往那儿铺平台） */
    nearSite(S, x, y) {
      const ss = Voy.sites(S), near = TC.data.balance.voyage.siteNear * SUB;
      const px = (x + 0.5) * SUB, py = (y + 0.5) * SUB;
      for (let i = 0; i < ss.length; i++) {
        if (Math.abs(ss[i].x - px) < near && Math.abs(ss[i].y - py) < near) return true;
      }
      return false;
    },

    depart(S, C, to, out) {
      const v = S.voyage, R = TC.rng, V = TC.data.balance.voyage, a = S.chart.nodes[v.at], b = S.chart.nodes[to];
      v.to = to;
      v.dist = Voy.dist(S, v.at, to);
      v.done = 0;
      v.hold = 0;
      v.ev = null;
      v.head = Voy.heading(a.x, a.y, b.x, b.y);
      // 这一段路上会遇到的事：一到两件，分散在路上
      const pool = TC.data.eventOrder.slice(), n = R.int(S, 'event', V.events[0], V.events[1]);
      v.evs = [];
      for (let i = 0; i < n; i++) {
        const id = pool.splice(R.int(S, 'event', 0, pool.length - 1), 1)[0];
        v.evs.push([Math.round((i + 0.25 + R.next(S, 'event') * 0.5) / n * 100) / 100, id]);
      }
      C.jobsDirty = true;
      out.events.push({ t: 'depart', to, name: b.name });
    },

    arrive(S, C, out) {
      const v = S.voyage;
      v.at = v.to;
      v.to = -1;
      v.done = 0;
      v.dist = 0;
      v.evs = [];
      v.flow = 0;
      v.legs++;
      v.since = S.tick;
      const node = Voy.node(S);
      node.visited = 1;
      node.seen = 2;
      Voy.placeSites(S, C);
      Voy.reveal(S, C);
      TC.sea.seed(S, C);          // 新的海域：海面上已经漂着一些东西
      C.jobsDirty = true;
      out.events.push({ t: 'arrive', node: node.id, name: node.name, kind: node.kind });
    },

    /* 途中的事拿定主意了 */
    choose(S, C, i, out) {
      const v = S.voyage, R = TC.rng, ev = TC.data.events[v.ev.id], opt = ev.opts[i];
      const res = { t: 'voyres', id: v.ev.id, opt: i, loot: {}, lost: {}, joined: [], fail: false };
      if (opt.hold) v.hold += opt.hold;
      for (const k in opt.loot || {}) {
        const n = TC.stock.add(S, C, k, R.int(S, 'loot', opt.loot[k][0], opt.loot[k][1]));
        if (n > 0) res.loot[k] = n;
      }
      for (let j = 0; j < (opt.join || 0); j++) {
        if (S.residents.length >= TC.data.balance.levels.pop[S.progress.level]) break;
        res.joined.push(TC.sea.join(S, C, (C.bbox.x1 + 1) * SUB, (C.bbox.y0 + C.bbox.y1 + 1) * SUB / 2, '', out).name);
      }
      if (opt.mood || opt.rest) {
        for (const r of S.residents) {
          if (opt.mood) r.mood = TC.util.clamp(r.mood + opt.mood, 0, 10000);
          if (opt.rest) r.rest = TC.util.clamp(r.rest + opt.rest, 0, 10000);
        }
      }
      if (opt.pay) {
        // 交买路钱：每样材料和食物的一小部分
        const d = TC.threat.demand(S, opt.pay);
        for (const k in d) { S.stock[k] -= d[k]; res.lost[k] = d[k]; }
        S.stats.paid++;
      }
      // 硬碰硬：有人能上的鱼叉架越多越有把握（一座三成，两座六成，三座九成）
      const risk = opt.fight ? Math.max(0.1, 1 - 0.3 * C.n.harpoon) : (opt.risk || 0);
      if (risk && R.next(S, 'event') < risk) {
        res.fail = true;
        if (opt.hurt) {
          for (const r of S.residents) if (R.next(S, 'event') < 0.4) r.health = Math.max(Math.min(r.health, 300), r.health - opt.hurt);
        }
        for (const k in S.stock) {
          if (TC.data.res[k].cat !== 'mat') continue;
          const n = Math.floor(S.stock[k] * opt.lose);
          if (n > 0) { S.stock[k] -= n; res.lost[k] = n; }
        }
      }
      v.ev = null;
      C.jobsDirty = true;
      out.events.push(res);
    },

    /* ── 小船 ── */

    /* 这个去处现在有什么可做：rescue 接人、salvage 打捞、dive 潜水、fish 打鱼；没有返回 '' */
    todo(S, C, s, ferrying) {
      const B = TC.data.balance, room = k => TC.stock.room(S, C, k) > 0;
      const pop = S.residents.length + ferrying;
      if (s.surv > 0 && pop < B.levels.pop[S.progress.level] && C.beds > pop) return 'rescue';      // 接人：人口没到上限、有空床位
      for (const k in s.left) if (s.left[k] > 0 && room(k)) return 'salvage';
      if (s.deep && C.n.divingrack > 0) for (const k in s.deep) if (s.deep[k] > 0 && room(k)) return 'dive';
      if (s.fishMax && s.fish >= B.boat.fishMin && TC.stock.room(S, C, 'fish') >= B.boat.fishMin) return 'fish';
      return '';
    },

    /* 这个去处还有没有剩下的东西（不管现在拿不拿得了），界面用 */
    remains(s) {
      let n = s.surv;
      for (const k in s.left) n += s.left[k];
      for (const k in s.deep || {}) n += s.deep[k];
      return n + (s.fishMax ? s.fish : 0);
    },

    /* 小船一趟装多少 */
    boatCap(S) { return Math.round(TC.data.balance.boat.cap * (TC.tech.has(S, 'fastboat') ? 1.5 : 1)); },
    boatSpeed(S) { return Math.round(TC.data.balance.boat.speed * (TC.tech.has(S, 'fastboat') ? 1.4 : 1)); },

    /* 小船的差事：空着的船坞 × 标了“派船去”、眼下有事可做、还没有船在路上的去处 */
    offers(S, C, list) {
      if (!C.n.dock || Voy.sailing(S)) return;
      const ss = Voy.node(S).sites, B = TC.data.balance.boat;
      if (!ss.length) return;
      const busy = new Set();
      let ferrying = 0;
      for (let i = 0; i < S.sea.floaters.length; i++) if (S.sea.floaters[i].kind === 'survivor') ferrying++;
      for (let i = 0; i < S.residents.length; i++) {
        const t = S.residents[i].task;
        if (t && t.k === 'boat') { busy.add(t.sid); if (t.act === 'rescue') ferrying++; }
      }
      const docks = [];
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i];
        if (b.def === 'dock' && b.st === 'on' && b.on && !b.w) docks.push(b);
      }
      if (!docks.length) return;
      for (let i = 0; i < ss.length; i++) {
        const s = ss[i];
        if (!s.order || busy.has(s.id)) continue;
        const act = Voy.todo(S, C, s, ferrying);
        if (!act) continue;
        // 离它最近的空船坞
        let dock = docks[0], bd = Infinity;
        for (let j = 0; j < docks.length; j++) {
          const dx = (docks[j].x + 0.5) * SUB - s.x, dy = (docks[j].y + 0.5) * SUB - s.y, d = dx * dx + dy * dy;
          if (d < bd) { bd = d; dock = docks[j]; }
        }
        list.push({ k: 'boat', bid: dock.id, b: dock, sid: s.id, act, p: act === 'rescue' ? B.rescue : B.prio, pin: dock.pin || 0 });
        if (act === 'rescue') ferrying++;
      }
    },

    /* 小船从船坞的哪一点下水 */
    launch(S, C, b) {
      const side = TC.bld.waterSide(S, C, b.x, b.y), nb = side >= 0 ? TC.bld.NB[side] : [0, 1];
      return [Math.round((b.x + 0.5 + nb[0] * 0.9) * SUB), Math.round((b.y + 0.5 + nb[1] * 0.9) * SUB)];
    },

    /* 到了地方，往船上装：返回 {loot, surv, spec} */
    load(S, C, s, act) {
      const cargo = { loot: {}, surv: 0, spec: '' }, cap = Voy.boatCap(S);
      if (act === 'rescue') {
        if (s.surv > 0) { s.surv--; cargo.surv = 1; if (s.spec) { cargo.spec = s.spec; s.spec = ''; } }
        return cargo;
      }
      if (act === 'fish') {
        const n = Math.min(cap, s.fish);
        s.fish -= n;
        if (n > 0) cargo.loot.fish = n;
        return cargo;
      }
      // 打捞和潜水：每样东西轮流拿一份，直到装满或拿空；仓里放不下的先不拿
      const src = act === 'dive' ? s.deep : s.left;
      if (src.coin > 0) { cargo.loot.coin = src.coin; src.coin = 0; }      // 旧币不占地方，一趟全带上
      let n = 0, any = true;
      while (n < cap && any) {
        any = false;
        for (const k in src) {
          if (n >= cap || src[k] <= 0 || TC.stock.room(S, C, k) <= (cargo.loot[k] || 0)) continue;
          src[k]--;
          cargo.loot[k] = (cargo.loot[k] || 0) + 1;
          n++;
          any = true;
        }
      }
      if (act === 'dive') {
        S.stats.dives++;
        if (s.kind === 'tower') S.story.flags.core = 1;          // 主线：从信号塔的机房里取回了信标的芯子
      }
      return cargo;
    },

    /* 回到船坞，卸货、上人 */
    unload(S, C, r, t, b, out) {
      const cargo = t.cargo || { loot: {}, surv: 0, spec: '' }, loot = {};
      let lost = 0, got = 0;
      for (const k in cargo.loot) {
        const n = TC.stock.add(S, C, k, cargo.loot[k]);
        if (n > 0) { loot[k] = n; got += n; }
        lost += cargo.loot[k] - n;
      }
      S.stats.boat += got;
      const ev = { t: 'boat', act: t.act, x: b.x, y: b.y, loot, lost, joined: '' };
      if (cargo.surv) ev.joined = TC.sea.join(S, C, (b.x + 0.5) * SUB, (b.y + 0.5) * SUB, cargo.spec, out).name;
      out.events.push(ev);
    },

    /* ── 买卖 ── */
    canTrade(S, C, s, i) {
      if (!s || !s.deals || !s.deals[i]) return 'gone';
      const d = s.deals[i];
      if (d.left <= 0) return 'sold';
      if (!TC.stock.has(S, d.give)) return 'cost';
      for (const k in d.get) if (TC.stock.room(S, C, k) < d.get[k]) return 'full';
      return null;
    },
  };

  TC.sys.voyage = function (S, C, out) {
    const v = S.voyage, V = TC.data.balance.voyage, B = TC.data.balance.boat;
    if (v.to < 0) {
      // 停泊着：礁盘里的鱼慢慢长回来；隔一阵看看有没有新看清的地点
      if (S.tick % B.fishRegen === 0) {
        const ss = Voy.node(S).sites;
        for (let i = 0; i < ss.length; i++) if (ss[i].fishMax && ss[i].fish < ss[i].fishMax) ss[i].fish++;
      }
      if (S.tick % 50 === 0) Voy.reveal(S, C);
      return;
    }
    if (v.ev) {
      // 等着拿主意；太久没人管就按稳妥的办
      v.flow = 0;
      if (S.tick - v.ev.at >= V.evWait) Voy.choose(S, C, TC.data.events[v.ev.id].auto, out);
      return;
    }
    if (v.hold > 0) { v.hold--; v.flow = 0; return; }

    const speed = Voy.power(S, C).speed;
    v.done += speed / TC.DAY;
    v.flow = Math.round(V.visBase + speed * V.visGain);     // 海面往后流的速度（位置单位/步），海面系统和画面都用它
    if (C.n.engine > 0 && (S.stock.fuel || 0) > 0 && S.tick % V.engineFuel === 0) S.stock.fuel = Math.max(0, S.stock.fuel - C.n.engine);

    if (v.evs.length && v.done >= v.evs[0][0] * v.dist) {
      const id = v.evs.shift()[1], ev = TC.data.events[id];
      const ok = ev.need === 'room' ? S.residents.length < TC.data.balance.levels.pop[S.progress.level]
        : ev.need === 'pirates' ? TC.hazard.region(S).raid > 0 && TC.clock.day(S) >= TC.data.balance.raid.from : true;
      if (ok) {
        v.ev = { id, at: S.tick };
        C.jobsDirty = true;
        out.events.push({ t: 'voyev', id });
        return;
      }
    }
    if (v.done >= v.dist) Voy.arrive(S, C, out);
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 灾害：风暴打坏边缘的平台、冲走露天的物资、伤到没进屋的人；污染的海域让人生病。
 * 风暴的来去（预警、开始、结束）在 sys_world.js 里，这里只管风暴期间的破坏，以及修补、警报、疾病。
 *   S.weather.storm = {at 哪一步开始, end 哪一步结束, sev 强度 1–3, warned 有没有预警过}
 *   S.alert：敲了钟，大家都进屋躲着（不干活，但风暴和海盗伤不着）
 *   S.grid.hp：每格平台还有多结实；低于一定比例居民会去修 */
(function (TC) {
  'use strict';

  const N = TC.GRID, SUB = TC.SUB;

  const Hz = TC.hazard = {
    diff(S) { return TC.data.balance.diff[S.opts.diff] || TC.data.balance.diff.normal; },

    /* 这片海域（航行途中算目的地）的设定 */
    region(S) {
      const v = S.voyage, n = S.chart.nodes[v.to >= 0 ? v.to : v.at];
      return TC.data.world.regions[n.region];
    },

    storming(S) { return S.weather.kind === 'storm'; },

    /* 这个人现在是不是在屋里（躲着，或者睡在有屋顶的住处） */
    indoors(S, C, r) {
      const t = r.task;
      if (!t) return false;
      if (t.k === 'shelter') return t.ph === 1 && !!t.in;
      if (t.k === 'sleep' && t.ph === 1 && t.bed) {
        const home = r.home ? C.byId.get(r.home) : null;
        return !!home && !!TC.bld.def(home).shelter;
      }
      return false;
    },

    /* 风暴期间每隔一阵打一轮浪 */
    wave(S, C, out) {
      const B = TC.data.balance.storm, R = TC.rng, st = S.weather.storm, sev = st.sev, t = S.grid.t, hp = S.grid.hp;
      const k = (TC.tech.has(S, 'reinforce') ? B.reinforce : 1) * (1 - TC.skill.val(S, 'brace'));
      // 边缘的平台挨打（先记下来再处理，因为打坏一格会改变“边缘”）
      const edge = C.edge.slice();
      for (let i = 0; i < edge.length; i++) {
        const idx = edge[i], kind = t[idx];
        if (!kind || !B.dmg[kind] || R.next(S, 'threat') >= B.hitChance) continue;
        const dmg = Math.max(1, Math.round(B.dmg[kind] * sev * k * (C.cover[idx] ? B.covered : 1)));
        hp[idx] -= dmg;
        C.dmgDirty = true;
        if (hp[idx] <= 0) Hz.breakTile(S, C, idx % N, (idx - idx % N) / N, out);
      }
      // 没进屋的人可能受伤（不会直接要命）
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i];
        if (Hz.indoors(S, C, r) || R.next(S, 'threat') >= B.hurtChance) continue;
        r.health = Math.max(Math.min(r.health, 500), r.health - B.hurt * sev);
        out.events.push({ t: 'hurt', name: r.name, id: r.id, why: 'storm' });
      }
    },

    /* 一格平台被打烂了：上面有建筑就冲掉建筑（平台勉强保住），没有就整格碎掉——除非那样会让浮城断开。
     * 船舵冲不毁（sturdy）：没了舵就走不了，在风暴带里会被活活困死 */
    breakTile(S, C, x, y, out) {
      const idx = y * N + x, kind = S.grid.t[idx], max = TC.grid.TILE_HP[kind];
      const b = TC.bld.at(C, x, y);
      if (b) {
        S.grid.hp[idx] = Math.round(max * 0.3);
        if (!TC.bld.def(b).sturdy) Hz.wreck(S, C, b, out);
        return;
      }
      let busy = false;
      for (let i = 0; i < 4 && !busy; i++) {
        const ax = x + TC.bld.NB[i][0], ay = y + TC.bld.NB[i][1];
        busy = TC.util.inb(ax, ay) && C.siteAt.has(ay * N + ax);        // 旁边有等着盖的平台：留着，不然工地就悬空了
      }
      if (busy || C.deckN <= 6 || !TC.grid.connectedWithout(S, x, y)) { S.grid.hp[idx] = 1; return; }
      S.grid.t[idx] = 0;
      S.grid.hp[idx] = 0;
      TC.grid.rebuild(S, C);
      TC.bld.reindex(S, C);
      // 站在上面的人掉进水里，爬回最近的一格
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i];
        if (!((r.x === x && r.y === y) || (r.px === x && r.py === y))) continue;
        TC.jobs.release(S, C, r);
        const e = TC.grid.nearestDeck(S, (x + 0.5) * SUB, (y + 0.5) * SUB, N);
        r.x = r.px = e.tx;
        r.y = r.py = e.ty;
        r.mn = 0;
        r.health = Math.max(Math.min(r.health, 500), r.health - TC.data.balance.storm.hurt);
        out.events.push({ t: 'hurt', name: r.name, id: r.id, why: 'fall' });
      }
      S.stats.tilesLost++;
      C.jobsDirty = true;
      C.dmgDirty = true;
      out.events.push({ t: 'tilelost', x, y, kind });
    },

    /* 一座建筑被冲毁（什么都不退） */
    wreck(S, C, b, out) {
      S.buildings.splice(S.buildings.indexOf(b), 1);
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i];
        if (r.home === b.id) r.home = 0;
        if (r.task && r.task.bid === b.id) r.task = null;
      }
      TC.bld.reindex(S, C);
      S.stats.wrecked++;
      C.jobsDirty = true;
      out.events.push({ t: 'wrecked', def: b.def, x: b.x, y: b.y });
      // 仓、桶、箱被冲毁了，里面装不下的东西也跟着没了
      if (TC.bld.def(b).cap) {
        const lost = {};
        let any = false;
        for (const k in S.stock) {
          const over = S.stock[k] - TC.stock.cap(C, k);
          if (over > 0) { S.stock[k] -= over; lost[k] = over; S.stats.washed += over; any = true; }
        }
        if (any) out.events.push({ t: 'washed', lost });
      }
    },

    /* 冲走一部分露天的材料和食物（仓库里的不怕）。一场风暴分四次冲 */
    wash(S, C, out) {
      const B = TC.data.balance.storm, sev = S.weather.storm.sev, RES = TC.data.res, lost = {};
      let any = false;
      for (const k in S.stock) {
        const cat = RES[k].cat;
        if (cat !== 'mat' && cat !== 'food') continue;
        const open = C.caps[cat] > 0 ? C.capOpen[cat] / C.caps[cat] : 1;
        const x = S.stock[k] * B.wash * sev * open / 4;
        const n = Math.min(S.stock[k], Math.floor(x) + (TC.rng.next(S, 'threat') < x - Math.floor(x) ? 1 : 0));      // 小数部分按概率进位
        if (n > 0) { S.stock[k] -= n; lost[k] = n; S.stats.washed += n; any = true; }
      }
      if (any) out.events.push({ t: 'washed', lost });
    },

    /* 需要修的平台：[格子下标, …]（有变动才重算） */
    damaged(S, C) {
      if (!C.dmgDirty && C.damaged) return C.damaged;
      const at = TC.data.balance.repair.at, t = S.grid.t, hp = S.grid.hp, HP = TC.grid.TILE_HP, b = C.bbox, list = [];
      for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
        const i = y * N + x;
        if (t[i] && hp[i] < HP[t[i]] * at) list.push(i);
      }
      C.damaged = list;
      C.dmgDirty = false;
      return list;
    },

    /* 修补的差事：最多同时修四格，材料得够 */
    offers(S, C, list) {
      const dm = Hz.damaged(S, C);
      if (!dm.length) return;
      const B = TC.data.balance.repair, busy = new Set(), need = {};
      const keep = m => TC.jobs.reserve(S, m);      // 留给烧水做饭的不动
      for (let i = 0; i < S.residents.length; i++) {
        const t = S.residents[i].task;
        if (t && t.k === 'repair') { busy.add(t.ty * N + t.tx); const m = B.cost[S.grid.t[t.ty * N + t.tx]]; if (m) need[m] = (need[m] || 0) + 1; }
      }
      let n = busy.size;
      for (let i = 0; i < dm.length && n < 4; i++) {
        const idx = dm[i], m = B.cost[S.grid.t[idx]];
        if (busy.has(idx) || (S.stock[m] || 0) - (need[m] || 0) - keep(m) < 1) continue;
        need[m] = (need[m] || 0) + 1;
        list.push({ k: 'repair', x: idx % N, y: (idx - idx % N) / N, p: B.prio });
        n++;
      }
    },

    /* 污染的海域：隔一阵每人掷一次，会不会生病 */
    pollute(S, C, out) {
      const B = TC.data.balance.sick;
      if (S.voyage.to >= 0 || !TC.data.world.kinds[S.chart.nodes[S.voyage.at].kind].polluted || TC.tech.has(S, 'filter')) return;
      const p = B.chance * Hz.diff(S).sick * (TC.voyage.hasSpec(S, 'doctor') ? 0.5 : 1);
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i];
        if (r.sick || TC.rng.next(S, 'threat') >= p) continue;
        r.sick = 1;
        out.events.push({ t: 'sick', name: r.name, id: r.id });
      }
    },
  };

  TC.sys.hazard = function (S, C, out) {
    const B = TC.data.balance, st = S.weather.storm;
    if (st && S.weather.kind === 'storm') {
      const el = S.tick - st.at;
      if (el % B.storm.every === 0) Hz.wave(S, C, out);
      const q = Math.max(1, Math.floor((st.end - st.at) / 4));
      if (el > 0 && el % q === 0) Hz.wash(S, C, out);
    }
    if (S.tick % B.sick.every === 0) Hz.pollute(S, C, out);
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 威胁：鲨鱼和海盗，以及对付它们的鱼叉架。
 *   S.sea.creatures = [{id, kind:'shark', x, y, wp 正游向巡游路线的第几个拐角, hp, cd 咬过之后还要歇多久, until 到哪一步游走}]
 *   S.threat.next：下一次海盗来是哪一步
 *   S.threat.raid = {ph 阶段, at 这个阶段到哪一步, str 强度, demand 开口要的东西, boats, stolen, sunk, n}
 *     ph：warn 发现了，正在靠近 → ask 开口要东西，等回话 → fight 不给，动手抢
 *     boats = [{id, x, y, hp, st 'come' 靠近 / 'loot' 搬东西 / 'flee' 逃走, loot 抢到手的份数, t}] */
(function (TC) {
  'use strict';

  const N = TC.GRID, SUB = TC.SUB, DIR = TC.DIR16;

  const Th = TC.threat = {
    center(C) { const b = C.bbox; return [(b.x0 + b.x1 + 1) * SUB / 2, (b.y0 + b.y1 + 1) * SUB / 2]; },

    /* 鲨鱼绕城巡游的四个拐角 */
    corner(C, i) {
      const b = C.bbox, m = 5;
      const xs = [(b.x0 - m) * SUB, (b.x1 + 1 + m) * SUB], ys = [(b.y0 - m) * SUB, (b.y1 + 1 + m) * SUB];
      return [xs[i === 1 || i === 2 ? 1 : 0], ys[i >= 2 ? 1 : 0]];
    },

    /* 朝 (gx, gy) 挪一步；返回是否到了 */
    step(o, gx, gy, sp) {
      const dx = gx - o.x, dy = gy - o.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d <= sp) { o.x = gx; o.y = gy; return true; }
      o.x += Math.round(dx / d * sp);
      o.y += Math.round(dy / d * sp);
      return false;
    },

    /* 眼下有没有要对付的东西（鱼叉架据此决定要不要人值守） */
    active(S) {
      const r = S.threat.raid;
      return S.sea.creatures.length > 0 || !!S.threat.boss || (!!r && (r.ph === 'fight' || r.ph === 'ask'));      // 攻打据点是在远处打，鱼叉够不着，不算
    },

    spawnShark(S, C, out) {
      const B = TC.data.balance.shark, R = TC.rng, c = Th.center(C), d = DIR[R.int(S, 'threat', 0, 15)], far = (Math.max(C.bbox.x1 - C.bbox.x0, C.bbox.y1 - C.bbox.y0) / 2 + 13) * SUB;
      const sh = { id: S.nextId++, kind: 'shark', x: Math.round(c[0] + d[0] * far / 100), y: Math.round(c[1] + d[1] * far / 100), wp: R.int(S, 'threat', 0, 3), hp: B.hp, cd: 0, until: S.tick + R.int(S, 'threat', B.stay[0], B.stay[1]) };
      S.sea.creatures.push(sh);
      out.events.push({ t: 'shark', id: sh.id });
    },

    sharks(S, C, out) {
      const B = TC.data.balance.shark, cs = S.sea.creatures;
      if (S.voyage.to < 0 && S.tick % B.every === 0 && cs.length < B.max) {
        const reg = TC.hazard.region(S);
        if (reg.shark > 0 && TC.rng.next(S, 'threat') < reg.shark * TC.hazard.diff(S).raid) Th.spawnShark(S, C, out);
      }
      const bite2 = (B.bite * SUB) * (B.bite * SUB);
      for (let i = cs.length - 1; i >= 0; i--) {
        const sh = cs[i];
        if (sh.hp <= 0) {
          // 打死了：浮上来，能捞
          S.sea.floaters.push({ id: S.nextId++, kind: 'sharkmeat', x: sh.x, y: sh.y, u: 0, v: 0, tag: 0, claim: 0 });
          S.stats.sharks++;
          cs.splice(i, 1);
          out.events.push({ t: 'sharkdead', x: sh.x, y: sh.y });
          continue;
        }
        if (S.tick >= sh.until || S.voyage.to >= 0) {
          // 转悠够了（或者浮城起航了）：游走
          const c = Th.center(C);
          const dx = sh.x - c[0], dy = sh.y - c[1], d = Math.sqrt(dx * dx + dy * dy) || 1;
          sh.x += Math.round(dx / d * B.speed * 1.5);
          sh.y += Math.round(dy / d * B.speed * 1.5);
          if (d > 30 * SUB) cs.splice(i, 1);
          continue;
        }
        const w = Th.corner(C, sh.wp);
        if (Th.step(sh, w[0], w[1], B.speed)) sh.wp = (sh.wp + 1) & 3;
        if (sh.cd > 0) { sh.cd--; continue; }
        // 咬离得近的小船
        for (let j = 0; j < S.residents.length; j++) {
          const r = S.residents[j], t = r.task;
          if (!t || t.k !== 'boat' || t.ph < 1) continue;
          const dx = t.bx - sh.x, dy = t.by - sh.y;
          if (dx * dx + dy * dy > bite2) continue;
          r.health = Math.max(Math.min(r.health, 300), r.health - B.hurt);
          if (t.ph < 3) { t.ph = 3; t.cargo = null; }                  // 掉头回去，这一趟白跑
          else if (t.cargo) t.cargo.loot = {};                          // 回程被咬：货掉进海里（接上来的人还在）
          sh.cd = B.cd;
          out.events.push({ t: 'sharkbite', name: r.name, id: r.id, x: t.bx, y: t.by });
          break;
        }
      }
    },

    /* 海盗开口要的东西：每样材料和食物的一小部分 */
    demand(S, frac) {
      const RES = TC.data.res, d = {};
      for (const k in S.stock) {
        const cat = RES[k].cat;
        if (cat !== 'mat' && cat !== 'food') continue;
        const n = Math.floor(S.stock[k] * frac);
        if (n > 0) d[k] = n;
      }
      return d;
    },

    /* 被抢走一份东西：存货越多的越容易被拿 */
    steal(S) {
      const RES = TC.data.res, list = [];
      for (const k in S.stock) if ((RES[k].cat === 'mat' || RES[k].cat === 'food') && S.stock[k] > 0) list.push([k, S.stock[k]]);
      const k = TC.rng.wpick(S, 'threat', list);
      if (!k) return false;
      S.stock[k]--;
      return true;
    },

    /* 下一趟海盗隔多久来 */
    schedule(S) {
      const reg = TC.hazard.region(S), kind = TC.data.world.kinds[S.chart.nodes[S.voyage.at].kind];
      const days = reg.raid > 0 ? reg.raid * (kind.raid || 1) / TC.hazard.diff(S).raid * TC.war.calm(S, S.chart.nodes[S.voyage.at].region) : 4;
      S.threat.next = S.tick + Math.round(days * TC.DAY * (0.8 + TC.rng.next(S, 'threat') * 0.5));
    },

    /* 回话：给，还是不给 */
    answer(S, C, pay, out) {
      const r = S.threat.raid, B = TC.data.balance.raid, R = TC.rng;
      if (pay) {
        for (const k in r.demand) S.stock[k] = Math.max(0, (S.stock[k] || 0) - r.demand[k]);
        S.stats.paid++;
        S.threat.raid = null;
        C.jobsDirty = true;
        out.events.push({ t: 'raidpaid', demand: r.demand });
        return;
      }
      // 不给：几条船从同一侧划过来
      const c = Th.center(C), d0 = R.int(S, 'threat', 0, 15), far = (Math.max(C.bbox.x1 - C.bbox.x0, C.bbox.y1 - C.bbox.y0) / 2 + 12) * SUB;
      r.ph = 'fight';
      r.boats = [];
      for (let i = 0; i < r.n; i++) {
        const d = DIR[(d0 + i - (r.n >> 1)) & 15];
        r.boats.push({ id: S.nextId++, x: Math.round(c[0] + d[0] * far / 100), y: Math.round(c[1] + d[1] * far / 100), hp: B.boatHp, st: 'come', loot: 0, t: 0 });
      }
      C.jobsDirty = true;
      out.events.push({ t: 'raidfight', n: r.n });
    },

    raids(S, C, out) {
      const B = TC.data.balance.raid, T = S.threat, R = TC.rng;
      let r = T.raid;
      if (!r) {
        if (S.tick < T.next) return;
        if (S.threat.boss || S.threat.siege) { T.next = S.tick + 300; return; }      // 正打着别的：这趟海盗晚点再来
        const reg = TC.hazard.region(S);
        if (S.voyage.to >= 0 || reg.raid <= 0 || TC.clock.day(S) < B.from) { T.next = S.tick + 600; return; }
        // 发现海盗：有瞭望塔或者亮着的探照灯就早知道；起雾又没灯，到跟前才看见
        const far = (C.n.watchtower > 0 && S.weather.kind !== 'fog') || S.power.lit;
        const str = Math.min(3, 1 + Math.floor(S.chart.nodes[S.voyage.at].region / 2) + (TC.hazard.diff(S).raid > 1 ? 1 : 0));
        r = T.raid = { ph: 'warn', at: S.tick + (far ? B.lead : B.leadNear), str, n: 1 + str, demand: null, boats: [], stolen: 0, sunk: 0 };
        Th.schedule(S);
        out.events.push({ t: 'raidwarn', eta: r.at - S.tick, far });
        return;
      }
      if (r.ph === 'warn') {
        if (S.tick < r.at) return;
        r.ph = 'ask';
        r.at = S.tick + B.wait;
        r.demand = Th.demand(S, B.ask * r.str);
        C.jobsDirty = true;
        out.events.push({ t: 'raidask', demand: r.demand, n: r.n });
        return;
      }
      if (r.ph === 'ask') {
        if (S.tick >= r.at) Th.answer(S, C, C.n.harpoon < 2, out);       // 没人答话：有两座鱼叉架就硬扛，没有就给
        return;
      }
      // 动手了
      const c = Th.center(C);
      for (let i = r.boats.length - 1; i >= 0; i--) {
        const b = r.boats[i];
        if (b.hp <= 0) {
          // 打沉了：船上抢的东西漂出来
          for (let k = 0; k < Math.ceil(b.loot / 6); k++) S.sea.floaters.push({ id: S.nextId++, kind: 'crate', x: b.x + (k - 1) * 300, y: b.y + k * 120, u: 0, v: 0, tag: 0, claim: 0 });
          r.sunk++;
          TC.faction.both(S, TC.data.balance.war.sink, out);
          r.boats.splice(i, 1);
          out.events.push({ t: 'sunk', x: b.x, y: b.y });
          continue;
        }
        if (b.st === 'come') {
          const e = TC.grid.nearestDeck(S, b.x, b.y, N);
          if (!e) { b.st = 'flee'; continue; }
          if (e.d2 > (1.3 * SUB) * (1.3 * SUB)) { Th.step(b, e.x, e.y, B.speed); continue; }
          b.st = 'loot';
          b.t = 0;
          // 靠上来的时候，离得最近、没躲起来的人挨一下
          let near = null, nd = (5 * SUB) * (5 * SUB);
          for (let j = 0; j < S.residents.length; j++) {
            const p = S.residents[j];
            if (TC.hazard.indoors(S, C, p) || (p.task && p.task.k === 'boat' && p.task.ph > 0)) continue;
            const dx = (p.x + 0.5) * SUB - b.x, dy = (p.y + 0.5) * SUB - b.y, d = dx * dx + dy * dy;
            if (d < nd) { nd = d; near = p; }
          }
          if (near) {
            near.health = Math.max(Math.min(near.health, 300), near.health - B.hurt);
            out.events.push({ t: 'hurt', name: near.name, id: near.id, why: 'raid' });
          }
        } else if (b.st === 'loot') {
          if (++b.t % B.stealEvery !== 0) continue;
          for (let k = 0; k < B.steal && b.loot < B.hold; k++) {
            if (!Th.steal(S)) { b.loot = B.hold; break; }
            b.loot++;
            r.stolen++;
            S.stats.stolen++;
          }
          if (b.loot >= B.hold) b.st = 'flee';
        } else {
          const dx = b.x - c[0], dy = b.y - c[1], d = Math.sqrt(dx * dx + dy * dy) || 1;
          b.x += Math.round(dx / d * B.speed);
          b.y += Math.round(dy / d * B.speed);
          if (d > 30 * SUB) r.boats.splice(i, 1);
        }
      }
      if (!r.boats.length) {
        const clean = r.stolen === 0;
        if (!r.boss) {                                   // Boss 放出来的小船不算一趟海盗
          S.stats.raids++;
          if (clean) { S.stats.repelled++; TC.progress.gain(S, B.repel, out); }
        }
        T.raid = null;
        C.jobsDirty = true;
        out.events.push({ t: 'raidend', stolen: r.stolen, sunk: r.sunk, n: r.n, clean, boss: !!r.boss });
      }
    },

    /* 鱼叉架：有人值守就隔一阵射一次，打射程里最近的 */
    shoot(S, C, out) {
      const B = TC.data.balance.raid;
      if (S.tick % B.shootEvery !== 0) return;
      const r = S.threat.raid, targets = S.sea.creatures.concat(r && r.ph === 'fight' ? r.boats : []);
      if (S.threat.boss) targets.push(S.threat.boss);
      if (!targets.length) return;
      const aim = B.hit + TC.skill.val(S, 'aim');
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i], def = TC.bld.def(b);
        if (def.duty !== 'guard' || !b.w) continue;
        const g = TC.people.byId(S, b.w);
        if (!g || !g.task || g.task.k !== 'duty' || g.task.ph !== 1) continue;
        const bx = (b.x + 0.5) * SUB, by = (b.y + 0.5) * SUB, range2 = (def.range * SUB) * (def.range * SUB);
        let best = null, bd = range2;
        for (let j = 0; j < targets.length; j++) {
          const t = targets[j];
          if (t.hp <= 0) continue;
          const dx = t.x - bx, dy = t.y - by, d = dx * dx + dy * dy;
          if (d < bd) { bd = d; best = t; }
        }
        if (!best) continue;
        const hit = TC.rng.next(S, 'threat') < aim;
        if (hit) best.hp--;
        out.events.push({ t: 'shot', bx: b.x, by: b.y, x: best.x, y: best.y, hit });
      }
    },
  };

  TC.sys.threats = function (S, C, out) {
    Th.sharks(S, C, out);
    Th.raids(S, C, out);
    Th.shoot(S, C, out);
  };

  /* 鱼叉架的值守：有鲨鱼或者海盗的时候才要人 */
  TC.duty.guard = {
    verb: '守着鱼叉',
    want(S) { return Th.active(S) ? TC.data.balance.prio.urgent + 4 : 0; },
    tick(S) { return Th.active(S); },
    status(S) { return Th.active(S) ? '' : 'calm'; },
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* Boss：潜伏在某个地点旁边的大家伙。玩家点“引它出来”才开打，打法还是防守：鱼叉架有人值守就射它。
 *   去处：{kind: 'boss', boss 哪一个, hp 还剩多少血（退走以后会恢复一半）, loot 打赢以后留下的战利品,
 *          dead 打死了没有, cool 退走以后到哪一步才能再引出来, tries 引出来过几回}
 *   S.threat.boss = {id, sid, hp, max, x, y, until 到哪一步它就退走, cd 再过多少步才能出下一招, wave 放过第二拨小船没有,
 *                    ti 盯上了哪一格边缘平台（水下的两个）, tx, ty 正游向哪一点,
 *                    p, tp 在绕城航线上的位置和要去的位置（旗舰，0–1 绕一圈）}（没在打就是 null）
 * 走位：水下的两个（八爪、白脊）盯上一格边缘的平台，直接游过去（可以从城底下穿），到了就出招，再换一格；
 *       旗舰不能穿城，沿着城外一圈的航线来回游弋，隔一阵放一轮箭。 */
(function (TC) {
  'use strict';

  const N = TC.GRID, SUB = TC.SUB, DIR = TC.DIR16;

  const Bo = TC.boss = {
    def(id) { return TC.data.bosses[id]; },

    /* 眼下这个地点的 Boss 去处（没有，或者正在航行，返回 null） */
    site(S) {
      const ss = TC.voyage.sites(S);
      for (let i = 0; i < ss.length; i++) if (ss[i].kind === 'boss') return ss[i];
      return null;
    },

    /* 不管浮城在哪儿，按去处的编号把它找出来 */
    find(S, sid) {
      for (const n of S.chart.nodes) for (const s of n.sites) if (s.id === sid) return s;
      return null;
    },

    /* 打赢过几个 */
    wins(S) { return Object.keys(S.stats.bosses).length; },

    /* 能不能把它引出来：null 可以；gone 没有这个去处；dead 已经打死了；sailing 正在航行；
     * busy 正打着（或者海盗正围着）；cool 它刚退走，还没缓过来 */
    can(S, C, sid) {
      const s = TC.voyage.site(S, sid);
      if (!s || s.kind !== 'boss') return 'gone';
      if (s.dead) return 'dead';
      if (S.voyage.to >= 0) return 'sailing';
      if (S.threat.boss || S.threat.raid) return 'busy';
      if (S.tick < (s.cool || 0)) return 'cool';
      return null;
    },

    /* 绕城一圈的矩形航线（离包围盒 keep 格）：返回 {x0, y0, w, h, len}，单位是位置单位 */
    ring(C, keep) {
      const b = C.bbox, x0 = (b.x0 - keep) * SUB, y0 = (b.y0 - keep) * SUB;
      const w = (b.x1 + 1 - b.x0 + 2 * keep) * SUB, h = (b.y1 + 1 - b.y0 + 2 * keep) * SUB;
      return { x0, y0, w, h, len: 2 * (w + h) };
    },

    /* 航线上参数 p（0–1，从左上角顺时针）对应的点 */
    ringAt(R, p) {
      let d = ((p % 1) + 1) % 1 * R.len;
      if (d < R.w) return [Math.round(R.x0 + d), R.y0];
      d -= R.w;
      if (d < R.h) return [R.x0 + R.w, Math.round(R.y0 + d)];
      d -= R.h;
      if (d < R.w) return [Math.round(R.x0 + R.w - d), R.y0 + R.h];
      return [R.x0, Math.round(R.y0 + R.h - (d - R.w))];
    },

    /* 航线上离 (x, y) 最近的那一点的参数 */
    ringNear(R, x, y) {
      let best = 0, bd = Infinity;
      for (let i = 0; i < 64; i++) {
        const q = Bo.ringAt(R, i / 64), d = (q[0] - x) * (q[0] - x) + (q[1] - y) * (q[1] - y);
        if (d < bd) { bd = d; best = i / 64; }
      }
      return best;
    },

    /* 水下的 Boss 换一格边缘的平台去盯：随便挑一格，游到它外侧半格远的地方 */
    retarget(S, C, b) {
      const edge = C.edge;
      if (!edge.length) return;
      const idx = edge[TC.rng.int(S, 'threat', 0, edge.length - 1)], x = idx % N, y = (idx - x) / N;
      const c = TC.threat.center(C), px = (x + 0.5) * SUB, py = (y + 0.5) * SUB;
      const dx = px - c[0], dy = py - c[1], d = Math.sqrt(dx * dx + dy * dy) || 1;
      b.ti = idx;
      b.tx = Math.round(px + dx / d * SUB * 0.9);
      b.ty = Math.round(py + dy / d * SUB * 0.9);
    },

    /* 从 (x, y) 那边放 n 条小船过来抢（借用海盗动手那一段：r.boss 标着这不是寻常的海盗） */
    launch(S, C, x, y, n) {
      const B = TC.data.balance.raid;
      const r = S.threat.raid = S.threat.raid || { ph: 'fight', at: S.tick, str: 3, n: 0, demand: null, boats: [], stolen: 0, sunk: 0, boss: 1 };
      for (let i = 0; i < n; i++) {
        const d = DIR[(i * 5 + 3) & 15];
        r.boats.push({ id: S.nextId++, x: Math.round(x + d[0] * 6), y: Math.round(y + d[1] * 6), hp: B.boatHp, st: 'come', loot: 0, t: 0 });
      }
      r.n += n;
      C.jobsDirty = true;
    },

    challenge(S, C, sid, out) {
      const s = TC.voyage.site(S, sid), def = Bo.def(s.boss);
      const b = S.threat.boss = { id: s.boss, sid, hp: s.hp, max: def.hp, x: s.x, y: s.y, until: S.tick + def.time, cd: def.cd, wave: 0, ti: -1, tx: s.x, ty: s.y, p: 0, tp: 0 };
      if (def.attack === 'volley') {
        const R = Bo.ring(C, def.keep);
        b.p = b.tp = Bo.ringNear(R, b.x, b.y);
      } else Bo.retarget(S, C, b);
      for (let i = 0; i < (def.sharks || 0); i++) TC.threat.spawnShark(S, C, out);
      if (def.boats) Bo.launch(S, C, b.x, b.y, def.boats);
      s.tries = (s.tries || 0) + 1;
      S.stats.bossTries++;
      C.jobsDirty = true;
      out.events.push({ t: 'bossfight', id: b.id, sid });
    },

    /* 朝城上放一轮箭：离它最近的几个没进屋的人受伤 */
    volley(S, C, b, def, out) {
      const list = [];
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i];
        if (TC.hazard.indoors(S, C, r) || (r.task && r.task.k === 'boat' && r.task.ph > 0)) continue;
        const dx = (r.x + 0.5) * SUB - b.x, dy = (r.y + 0.5) * SUB - b.y;
        list.push([dx * dx + dy * dy, r]);
      }
      list.sort((p, q) => p[0] - q[0] || p[1].id - q[1].id);
      const hit = [];
      for (let i = 0; i < Math.min(def.shots, list.length); i++) {
        const r = list[i][1];
        r.health = Math.max(Math.min(r.health, 300), r.health - def.hurt);
        hit.push([r.x, r.y]);
        out.events.push({ t: 'hurt', name: r.name, id: r.id, why: 'boss' });
      }
      out.events.push({ t: 'bossvolley', id: b.id, bx: b.x, by: b.y, hit });
    },

    /* 缠住或者撞上盯着的那格平台（那格已经没了就算了） */
    strike(S, C, b, def, out) {
      const B = TC.data.balance, idx = b.ti;
      if (idx < 0 || !S.grid.t[idx]) return;
      const kind = S.grid.t[idx], x = idx % N, y = (idx - x) / N;
      const dmg = Math.round(def.dmg * B.boss.tile[kind] * (C.cover[idx] ? B.boss.cover : 1) * (1 - TC.skill.val(S, 'brace')));
      out.events.push({ t: 'bosshit', id: b.id, x, y, bx: b.x, by: b.y, dmg });
      if (dmg <= 0) return;
      S.grid.hp[idx] -= dmg;
      C.dmgDirty = true;
      if (S.grid.hp[idx] <= 0) TC.hazard.breakTile(S, C, x, y, out);
    },

    /* 把跟着它的鲨鱼和小船都打发走 */
    dismiss(S) {
      for (const sh of S.sea.creatures) sh.until = Math.min(sh.until, S.tick);
      const r = S.threat.raid;
      if (r && r.boss) for (const bt of r.boats) if (bt.hp > 0) bt.st = 'flee';
    },

    win(S, C, b, out) {
      const s = Bo.find(S, b.sid), B = TC.data.balance.boss;
      S.threat.boss = null;
      Bo.dismiss(S);
      if (s) {
        s.dead = 1;
        s.hp = 0;
        s.left = Object.assign({}, s.loot);      // 战利品漂在原地，派小船去捞
        s.order = 1;
      }
      S.stats.bosses[b.id] = S.tick;
      if (b.id === 'flagship') TC.faction.both(S, TC.data.balance.war.flagship, out);
      TC.skill.grant(S, 1, 'boss', out);
      TC.progress.gain(S, B.win, out);
      C.jobsDirty = true;
      out.events.push({ t: 'bosswin', id: b.id, x: b.x, y: b.y, loot: s ? Object.assign({}, s.left) : {} });
    },

    /* 没打死：它退走，血恢复一半，过一阵才能再引出来。why：time 时间到了 / left 浮城起航了 */
    away(S, C, b, why, out) {
      const s = Bo.find(S, b.sid), B = TC.data.balance.boss;
      S.threat.boss = null;
      Bo.dismiss(S);
      if (s) {
        s.hp = Math.min(b.max, Math.ceil((Math.max(0, b.hp) + b.max) / 2));
        s.cool = S.tick + B.cool;
      }
      C.jobsDirty = true;
      out.events.push({ t: 'bossaway', id: b.id, why, hp: s ? s.hp : b.max });
    },
  };

  TC.sys.boss = function (S, C, out) {
    const b = S.threat.boss;
    if (!b) return;
    const def = Bo.def(b.id);
    if (b.hp <= 0) { Bo.win(S, C, b, out); return; }
    if (S.voyage.to >= 0) { Bo.away(S, C, b, 'left', out); return; }
    if (S.tick >= b.until) { Bo.away(S, C, b, 'time', out); return; }
    if (b.cd > 0) b.cd--;

    if (def.attack === 'volley') {
      // 旗舰：沿着城外一圈的航线游弋；到了地方就换个去处；隔一阵放一轮箭
      const R = Bo.ring(C, def.keep), step = def.speed / R.len;
      let d = b.tp - b.p;
      if (d > 0.5) d -= 1; else if (d < -0.5) d += 1;                    // 走近的那一边
      if (Math.abs(d) <= step) { b.p = b.tp; b.tp = TC.rng.int(S, 'threat', 0, 63) / 64; }
      else b.p = (b.p + (d > 0 ? step : -step) + 1) % 1;
      const q = Bo.ringAt(R, b.p);
      b.x = q[0];
      b.y = q[1];
      if (def.wave && !b.wave && b.hp * 2 <= b.max) {                    // 血掉到一半：再放一拨小船
        b.wave = 1;
        Bo.launch(S, C, b.x, b.y, def.wave);
        out.events.push({ t: 'bosswave', id: b.id, n: def.wave });
      }
      if (b.cd <= 0) { b.cd = def.cd; Bo.volley(S, C, b, def, out); }
      return;
    }

    // 水下的两个：游向盯着的那格平台，到了就出招，然后换一格
    if (b.ti < 0 || !S.grid.t[b.ti]) Bo.retarget(S, C, b);
    if (TC.threat.step(b, b.tx, b.ty, def.speed) && b.cd <= 0) {
      b.cd = def.cd;
      Bo.strike(S, C, b, def, out);
      Bo.retarget(S, C, b);
    }
  };
})(globalThis.TC = globalThis.TC || {});
