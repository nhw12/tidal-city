</script>
<script>
/* 居民名册、单个居民的详情、建筑详情。三个面板都只更新变化的元素。 */
(function (TC) {
  'use strict';

  const NEEDS = [['hunger', '饱食', 'i_grilled'], ['thirst', '饮水', 'i_water'], ['rest', '精力', 'i_rest'], ['mood', '心情', 'i_mood'], ['health', '健康', 'i_health']];
  const ST = {
    waiting: '等人来盖', paused: '做到一半，等人接手', off: '已停用',
    full: '库存放不下了', enough: '库存够用，暂时不做', night: '收工了，明早继续',
    reserve: '浮木要留着烧水做饭，暂时不动', moored: '停泊中。起航后要有人在这儿掌舵', noproject: '没有在研究的项目', boatin: '小船在港，随时能出发',
    nopower: '没电，停着', calm: '眼下没有要对付的东西。鲨鱼或海盗来了会有人来守', repair: '战船打坏了，正在修。修好才能再出击', peace: '眼下没有仗打。海盗动手、Boss 被引出来、或者你下令攻打据点，就会有人来操船',
  };
  const BOAT = { rescue: '划船去接人', salvage: '划船去打捞', dive: '划船去潜水', fish: '出海打鱼' };
  // 心情构成里各项的说法：[加分时, 扣分时]
  const MOOD = {
    base: ['平常心', '平常心'],
    food: ['吃饱了', '饿着肚子'],
    water: ['喝足了', '口渴'],
    rest: ['精神不错', '累坏了'],
    home: ['有地方睡', '没有床'],
    floor: ['', '昨晚睡地板'],
    meal: ['上一顿吃得香', '上一顿不好吃'],
    variety: ['吃得不重样', ''],
    relax: ['收工后歇过', ''],
    beauty: ['周围好看', ''],
    trait: ['天性乐观', '天性多愁'],
    sick: ['', '生病了'],
    grief: ['', '有人不在了'],
    rain: ['', '淋着雨'],
  };
  const PRIO = [[-1, '低', 'low'], [0, '中', 'mid'], [1, '高', 'high']];

  const Ro = TC.roster = {
    /* 这个人正在做什么 */
    doing(S, C, r) {
      const t = r.task;
      if (!t) return '发呆';
      switch (t.k) {
        case 'hook': return t.rescue ? '救人' : '打捞';
        case 'build': { const b = C.byId.get(t.bid); return '盖' + (b ? TC.bld.def(b).name : '东西'); }
        case 'work': {
          const b = C.byId.get(t.bid);
          if (!b) return '干活';
          return TC.data.recipes[b.rec || TC.bld.def(b).recipes[0]].verb;
        }
        case 'duty': { const b = C.byId.get(t.bid); return b ? TC.duty[TC.bld.def(b).duty].verb : '值守'; }
        case 'boat': return t.ph === 0 ? '去船坞' : t.ph === 3 ? '划船回来' : BOAT[t.act] || '划船';
        case 'repair': return '修平台';
        case 'shelter': return t.ph === 1 ? (t.in ? '躲在屋里' : '没处躲，蹲在原地') : '去躲避';
        case 'treat': return '去用药';
        case 'eat': return '吃饭';
        case 'drink': return '喝水';
        case 'sleep': return t.ph === 1 ? (t.bed ? '睡觉' : '睡在地板上') : '去睡觉';
        case 'relax': return t.lv >= 2 ? '在茶棚歇息' : '在篝火旁歇息';
        default: return '闲逛';
      }
    },

    traitNames(r) { return (r.tr || []).map(k => TC.data.traits[k].name).join('、'); },

    /* 指定给这个人的岗位（建筑），没有返回 null */
    postOf(S, r) {
      for (let i = 0; i < S.buildings.length; i++) if (S.buildings[i].pin === r.id) return S.buildings[i];
      return null;
    },

    barClass(v) { return v < 2500 ? 'bar low' : v < 5000 ? 'bar mid' : 'bar'; },

    setBar(o, v) {
      const w = Math.round(v / 100);
      if (o.w === w) return;
      o.w = w;
      o.fill.style.width = w + '%';
      const cls = Ro.barClass(v);
      if (o.cls !== cls) { o.cls = cls; o.bar.className = cls; }
      if (o.val) o.val.textContent = w;
    },

    makeBar() {
      const fill = TC.dom.el('i'), bar = TC.dom.el('div', { class: 'bar' }, [fill]);
      return { bar, fill, w: -1, cls: 'bar', val: null };
    },

    /* ── 名册 ── */
    list: { rows: new Map(), key: '', body: null },

    openList(body) {
      Ro.list.body = body;
      Ro.list.key = '';
      Ro.list.rows.clear();
    },

    updateList(S, C) {
      const L = Ro.list, D = TC.dom, el = D.el;
      const cap = TC.data.balance.levels.pop[S.progress.level];
      const key = S.residents.map(r => r.id).join(',') + '|' + cap + '|' + C.beds;
      if (key !== L.key) {
        L.key = key;
        L.rows.clear();
        L.body.replaceChildren();
        if (!S.residents.length) L.body.append(el('p', { text: '一个人也没有了。' }));
        else L.body.append(el('p', { class: 'note', id: 'people-cap', text: '现在 ' + S.residents.length + ' 人，这一级最多 ' + cap + ' 人，床位 ' + C.beds + ' 个。吃喝有富余、人数没到上限，海上漂着的人才会出现。' }));
        for (const r of S.residents) {
          const doing = el('span', { class: 'doing' }), bars = NEEDS.map(() => Ro.makeBar());
          const row = el('button', { class: 'person', type: 'button', id: 'person-' + r.id, onclick: () => TC.app.select({ r: r.id }, true) }, [
            el('span', { class: 'pic' }, [D.icon('p' + r.look + '_d0', 2)]),
            el('span', { class: 'top' }, [el('span', { class: 'name' }, [r.name, r.spec ? el('i', { class: 'spec', text: TC.data.specs[r.spec].title }) : null, el('i', { class: 'tr', text: Ro.traitNames(r) })]), doing]),
            el('span', { class: 'bars', title: NEEDS.map(n => n[1]).join('、') }, bars.map(b => b.bar)),
          ]);
          L.rows.set(r.id, { row, doing, bars, sel: null });
          L.body.append(row);
        }
        L.body.append(el('p', { class: 'note', text: '五条短杠依次是：' + NEEDS.map(n => n[1]).join('、') + '。' }));
      }
      const sel = TC.render.view.sel;
      for (const r of S.residents) {
        const o = L.rows.get(r.id);
        D.setText(o.doing, Ro.doing(S, C, r));
        NEEDS.forEach((n, i) => Ro.setBar(o.bars[i], r[n[0]]));
        const s = !!sel && sel.r === r.id;
        if (s !== o.sel) { o.sel = s; o.row.classList.toggle('sel', s); }
      }
    },

    /* ── 单个居民 ── */
    person: null,

    openPerson(body, rid) {
      const D = TC.dom, el = D.el, app = TC.app, r = TC.people.byId(app.S, rid);
      if (!r) { TC.panel.close(); return; }
      const doing = el('span'), home = el('span'), post = el('span'), stats = [];
      const ill = el('p', { class: 'warn', id: 'person-ill', hidden: '' });
      body.append(el('div', { class: 'kv' }, [el('span', { text: '正在' }), doing]), ill);
      let quest = null;
      if (r.spec) {
        // 专家：专长，和个人的小心愿
        const sp = TC.data.specs[r.spec];
        body.append(el('div', { class: 'kv trait' }, [el('span', { class: 'tag spec', text: sp.title }), el('span', { text: sp.desc })]));
        quest = el('p', { class: 'quest', id: 'person-quest' });
        body.append(quest);
      }
      for (const k of r.tr || []) {
        const t = TC.data.traits[k];
        body.append(el('div', { class: 'kv trait' }, [el('span', { class: 'tag', text: t.name }), el('span', { text: t.desc })]));
      }
      for (const n of NEEDS) {
        const b = Ro.makeBar();
        b.val = el('span', { class: 'val' });
        stats.push(b);
        body.append(el('div', { class: 'stat' }, [D.icon(n[2], 1), el('span', { text: n[1] }), b.bar, b.val]));
      }
      const moodTags = el('div', { class: 'tags', id: 'mood-parts' }), moodSum = el('p', { class: 'note' });
      body.append(el('h4', { text: '心情从哪来' }), moodTags, moodSum);
      body.append(el('div', { class: 'kv' }, [el('span', { text: '住处' }), home]));
      body.append(el('div', { class: 'kv' }, [el('span', { text: '岗位' }), post]));
      body.append(el('div', { class: 'rowbtns' }, [
        el('button', { class: 'btn', type: 'button', onclick: () => app.focusResident(rid) }, ['找到这个人']),
        el('button', { class: 'btn', type: 'button', onclick: () => TC.panel.open('people') }, ['回到名册']),
      ]));
      Ro.person = { doing, home, post, stats, moodTags, moodSum, moodKey: '', quest, ill };
    },

    updatePerson(S, C, rid) {
      const r = TC.people.byId(S, rid), P = Ro.person, D = TC.dom, el = D.el;
      if (!r) { TC.app.select(null); return; }
      D.setText(P.doing, Ro.doing(S, C, r));
      NEEDS.forEach((n, i) => Ro.setBar(P.stats[i], r[n[0]]));
      const care = C.n.infirmary ? ((S.stock.medicine || 0) > 0 ? '会去医务棚用药。' : '医务棚没有药了：让人熬药膏，或者跟商船换。') : '搭一座医务棚、备些药才治得了。';
      const illText = r.sick ? '生病了：干活慢，健康慢慢往下掉。' + care : r.health < 5000 ? '伤得不轻。' + care : '';
      if (P.ill.hidden !== !illText) P.ill.hidden = !illText;
      D.setText(P.ill, illText);

      const parts = TC.people.moodParts(S, C, r, TC.people.moodEnv(S, C));
      const key = parts.map(p => p[0] + p[1]).join('|');
      if (key !== P.moodKey) {
        P.moodKey = key;
        P.moodTags.replaceChildren();
        let sum = 0;
        for (const p of parts) {
          sum += p[1];
          const label = (MOOD[p[0]] || ['', ''])[p[1] > 0 ? 0 : 1] || p[0];
          const n = Math.max(1, Math.round(Math.abs(p[1]) / 100));
          P.moodTags.append(el('span', { class: 'tag ' + (p[0] === 'base' ? '' : p[1] > 0 ? 'good' : 'bad'), text: label + (p[1] > 0 ? ' +' : ' −') + n }));
        }
        D.setText(P.moodSum, '合计约 ' + Math.round(TC.util.clamp(sum, 0, 10000) / 100) + '。心情会慢慢往这个数靠；心情好干活快，长期太低会出走。');
      }

      if (P.quest) {
        const sp = TC.data.specs[r.spec], q = S.quests[r.spec];
        if (!q) D.setText(P.quest, '');
        else if (q.done) D.setText(P.quest, '心愿了了：' + Ro.rewardText(sp.reward));
        else {
          const st = sp.quest[q.step], cur = Math.max(0, Math.min(st.need, st.val(S, C) - (st.rel ? q.base : 0)));
          D.setText(P.quest, '心愿（' + (q.step + 1) + '/' + sp.quest.length + '）：' + st.text + '　' + cur + ' / ' + st.need + '。全部做完：' + Ro.rewardText(sp.reward));
        }
      }
      const hb = r.home ? C.byId.get(r.home) : null;
      D.setText(P.home, hb ? TC.bld.def(hb).name : '还没有床，只能睡地板');
      const pb = Ro.postOf(S, r);
      D.setText(P.post, pb ? '专守' + TC.bld.def(pb).name : '没有固定岗位，哪里缺人去哪里');
    },

    rewardText(rw) {
      if (rw.tech) return '带来技术“' + TC.data.tech[rw.tech].name + '”';
      if (rw.data) return '送上 ' + rw.data + ' 份旧世界资料';
      return '繁荣度 +' + (rw.pros || 0);
    },

    /* ── 建筑 ── */
    bld: null,

    recipeText(rec) {
      const side = o => Object.keys(o).map(k => TC.data.res[k].name + ' ×' + o[k]).join(' + ');
      const ins = side(rec.in);
      return (ins ? ins + ' → ' : '') + side(rec.out);
    },

    statusText(S, C, b) {
      const st = TC.jobs.status(S, C, b), def = TC.bld.def(b), RC = TC.data.recipes;
      const who = st.rid ? (TC.people.byId(S, st.rid) || {}).name || '有人' : '';
      const pct = st.frac !== undefined ? ' ' + Math.round(st.frac * 100) + '%' : '';
      switch (st.code) {
        case 'building': return who + ' 正在盖' + pct;
        case 'waiting': return ST.waiting + (st.frac > 0 ? pct : '');
        case 'working': return st.verb ? who + ' 正在' + st.verb + pct : st.rec ? who + ' 正在' + RC[st.rec].verb + pct : who + ' 正赶过来';
        case 'boatout': return who + ' 划着船出去了';
        case 'paused': return ST.paused + pct;
        case 'curing': {
          const hours = Math.max(0, b.wait - S.tick) / TC.HOUR;
          return (st.rec === 'grow' ? '菜正在长' : '正晾着') + pct + (hours >= 1 ? '，还要约 ' + Math.round(hours) + ' 小时' : '，快好了');
        }
        case 'nowater': return def.passive ? '四周没有水了，捞不到鱼' : '四周没有水了，钓不了鱼';
        case 'noinput': {
          const rec = RC[st.rec], miss = [];
          for (const k in rec.in) if ((S.stock[k] || 0) < rec.in[k]) miss.push(TC.data.res[k].name);
          return '缺原料：' + miss.join('、');
        }
        case 'nohands': {
          const pin = b.pin ? TC.people.byId(S, b.pin) : null;
          return pin ? '等 ' + pin.name + ' 忙完手头的事' : '等人手';
        }
        case 'passive': {
          if (def.beds) {
            const names = S.residents.filter(r => r.home === b.id).map(r => r.name);
            if (!names.length) return '空着，谁困了谁来睡';
            return names.join('、') + ' 住在这儿' + (names.length < def.beds ? '，还空 ' + (def.beds - names.length) + ' 个床位' : '');
          }
          if (def.rain) return S.weather.kind === 'rain' ? '正在接雨水' : '等下雨';
          if (def.power && def.passive) return '通着电，正在出水';
          if (def.passive && def.passive.sun) return S.weather.kind === 'clear' && TC.clock.hourF(S) >= 7 && TC.clock.hourF(S) < 18 ? '太阳正晒着，在出水' : '等晴天的白天';
          if (def.passive) return '自己在捞鱼';
          if (def.cover) return '护着周围 ' + def.cover + ' 格以内的边缘平台';
          if (b.def === 'bell') return S.alert ? '警报响着，大家都躲起来了。点右上角的钟解除' : '风暴或海盗来了，点右上角的钟让大家进屋';
          if (def.gen === 'wind') return S.weather.ws ? '转着，正在发电' : '没有风，停着';
          if (def.gen === 'sun') { const hh = TC.clock.hourF(S), day = hh >= 6.5 && hh < 18.5; return !day ? '夜里不发电' : S.weather.kind === 'clear' ? '晒着太阳，正在发电' : S.weather.kind === 'cloudy' ? '多云，只发一半' : '这种天不发电'; }
          if (def.store) return '全城一共存着 ' + S.power.e + ' / ' + TC.power.cap(C) + ' 度电';
          if (b.def === 'searchlight') return b.pw ? '亮着' : '天黑或起雾才开';
          if (def.shelter && !def.beds) return '风暴来时能躲 ' + def.shelter + ' 个人';
          if (def.thrust) return TC.voyage.sailing(S) ? (def.tech ? ((S.stock.fuel || 0) > 0 ? '正推着浮城走' : '没有燃油，转不起来') : '正兜着风') : '停泊中，起航后出力';
          if (b.def === 'watchtower') return '盯着相邻的地点';
          if (b.def === 'radio') return '守着频道，听求救信号';
          if (b.def === 'divingrack') return '小船去沉船时可以潜水了';
          if (def.relax) return '收工后大家来这儿歇息';
          return '';
        }
        default: return ST[st.code] || '';
      }
    },

    openBuilding(body, bid) {
      const D = TC.dom, el = D.el, app = TC.app, b = app.C.byId.get(bid);
      if (!b) { TC.panel.close(); return; }
      const def = TC.bld.def(b), status = el('span'), RES = TC.data.res, RC = TC.data.recipes, site = b.st === 'site';
      const kv = (k, v) => el('div', { class: 'kv' }, [el('span', { text: k }), typeof v === 'string' ? el('span', { text: v }) : v]);
      body.append(el('p', { text: def.desc }));
      body.append(kv('状况', status));
      (def.recipes || []).forEach((id, i) => body.append(kv(i ? '或者' : '配方', Ro.recipeText(RC[id]))));
      if (def.passive) body.append(kv('产出', '约每 ' + Math.round(def.passive.every / TC.HOUR) + ' 小时 1 份' + RES[def.passive.out].name + (def.passive.sun ? '（晴天的白天）' : '')));
      if (def.thrust) body.append(kv('推力', def.thrust + ' 里/天' + (def.tech ? '，烧燃油' : '，看风')));
      if (def.power) body.append(kv('用电', def.power + (def.optional ? '（没电也能用，只是慢）' : '')));
      if (def.gen) body.append(kv('发电', def.gen === 'wind' ? '看风力：' + TC.data.balance.power.wind.slice(1).join(' / ') : '晴天白天 ' + TC.data.balance.power.sun + '，多云减半'));
      if (def.store) body.append(kv('蓄电', '每座 ' + def.store + ' 度'));
      if (def.cap) {
        const names = { mat: '每种材料', food: '每种食物', water: '淡水' };
        body.append(kv('容量', Object.keys(def.cap).map(k => names[k] + ' +' + def.cap[k]).join('、')));
      }
      if (def.beauty) body.append(kv('美观', '+' + def.beauty + '（装饰越多，大家心情越好）'));
      body.append(kv('造价', Object.keys(def.cost).map(k => RES[k].name + ' ×' + def.cost[k]).join('、')));

      const B = Ro.bld = { status, st: b.st, key: '', toggle: null, remove: null, pin: null, pinKey: '', pinVal: -1, prio: null, prioVal: null, targets: [], armed: 0 };
      const manned = def.recipes || def.duty || def.boat;

      // 和这座建筑相关的面板：海图、研究
      if (!site && (def.duty === 'helm' || def.thrust)) body.append(el('div', { class: 'rowbtns' }, [el('button', { class: 'btn', type: 'button', id: 'bld-chart', onclick: () => { TC.sfx.play('click'); TC.chartui.open(); } }, ['打开海图'])]));
      if (!site && def.duty === 'lab') body.append(el('div', { class: 'rowbtns' }, [el('button', { class: 'btn', type: 'button', id: 'bld-research', onclick: () => { TC.sfx.play('click'); TC.panel.open('research'); } }, ['挑研究项目'])]));

      if (!site && b.def === 'tradepost') body.append(el('div', { class: 'rowbtns' }, [el('button', { class: 'btn primary', type: 'button', id: 'bld-market', onclick: () => {
        if (!app.S.post) { TC.sfx.play('deny'); app.toast('行商还没来过，等一等', '', true); return; }
        TC.sfx.play('click');
        TC.panel.open('market', TC.market.POST);
      } }, ['看行商留下的货'])]));

      // 专人：只有要人干活的建筑才有
      if (!site && manned) {
        B.pin = el('select', { class: 'pick', id: 'bld-pin', 'aria-label': '指定专人', onchange: () => {
          app.queue.push({ type: 'setPin', id: bid, rid: Number(B.pin.value) || 0 });
          app.flush();
          TC.sfx.play('click');
          TC.panel.update();
        } });
        body.append(kv('专人', B.pin));
        body.append(el('p', { class: 'note', text: '指定专人后，只有这个人在这儿干活，一个人只能守一处。带 ★ 的人擅长这里的活。' }));
      }
      // 优先级：工地是“先盖哪个”，生产建筑是“先顾哪边”
      if (site || manned) {
        B.prio = PRIO.map(p => el('button', { class: 'btn', type: 'button', id: 'bld-prio-' + p[2], onclick: () => {
          app.queue.push({ type: 'setPrio', id: bid, prio: p[0] });
          app.flush();
          TC.sfx.play('click');
          TC.panel.update();
        } }, [p[1]]));
        body.append(kv(site ? '先盖哪个' : '优先级', el('span', { class: 'seg' }, B.prio)));
      }
      // 库存目标
      if (!site && def.recipes) {
        const seen = {};
        for (const id of def.recipes) {
          if (RC[id].keepN === undefined) continue;
          for (const k in RC[id].out) {
            if (seen[k]) continue;
            seen[k] = 1;
            const st = TC.stockui.stepper(k, 'bld-target');
            B.targets.push([k, st.num]);
            body.append(kv(RES[k].name + '做到', st.el));
          }
        }
      }

      if (!site && (manned || def.passive)) {
        B.toggle = el('button', { class: 'btn', type: 'button', id: 'bld-toggle', onclick: () => {
          const cur = app.C.byId.get(bid);
          if (cur) app.queue.push({ type: 'setOn', id: bid, on: cur.on ? 0 : 1 });
          TC.sfx.play('click');
        } });
      }
      B.remove = el('button', { class: 'btn', type: 'button', id: 'bld-remove' });
      B.remove.addEventListener('click', () => {
        if (!B.armed) {
          B.armed = setTimeout(() => { B.armed = 0; B.remove.classList.remove('danger'); B.key = ''; }, 3000);
          B.remove.classList.add('danger');
          B.remove.textContent = '再点一次确认';
          return;
        }
        clearTimeout(B.armed);
        app.queue.push({ type: 'cancel', id: bid });
        TC.sfx.play('click');
        app.select(null);
      });
      body.append(el('div', { class: 'rowbtns' }, [B.toggle, B.remove]));
    },

    updateBuilding(S, C, bid) {
      const b = C.byId.get(bid), B = Ro.bld, D = TC.dom, el = D.el;
      if (!b) { TC.app.select(null); return; }
      if (b.st !== B.st) { TC.app.select({ b: bid }); return; }      // 工地盖好了：换成建成后的详情
      D.setText(B.status, Ro.statusText(S, C, b) || '正常');
      const key = b.st + ':' + b.on;
      if (key !== B.key && !B.armed) {
        B.key = key;
        if (B.toggle) B.toggle.textContent = b.on ? '停用' : '启用';
        B.remove.textContent = b.st === 'site' ? '取消（全额退还）' : '拆除（退一半材料）';
      }
      if (B.pin) {
        const pk = S.residents.map(r => r.id).join(',');
        if (pk !== B.pinKey) {
          B.pinKey = pk;
          B.pinVal = -1;
          const d0 = TC.bld.def(b), skill = d0.recipes ? TC.data.recipes[d0.recipes[0]].skill : '';
          B.pin.replaceChildren(el('option', { value: '0', text: '不指定，谁有空谁来' }));
          for (const r of S.residents) {
            const tr = Ro.traitNames(r), star = skill && TC.people.skill(r, skill) > 1 ? ' ★' : '';
            B.pin.append(el('option', { value: String(r.id), text: r.name + (tr ? '（' + tr + '）' : '') + star }));
          }
        }
        if (B.pinVal !== (b.pin || 0)) { B.pinVal = b.pin || 0; B.pin.value = String(B.pinVal); }
      }
      if (B.prio && B.prioVal !== (b.prio || 0)) {
        B.prioVal = b.prio || 0;
        PRIO.forEach((p, i) => B.prio[i].classList.toggle('on', p[0] === B.prioVal));
      }
      for (const t of B.targets) D.setText(t[1], TC.stockui.targetOf(S, t[0]) + ' 份');
    },
  };

  TC.panel.register('people', { title: '居民', open: Ro.openList, update: Ro.updateList });
  TC.panel.register('person', {
    title: rid => { const r = TC.people.byId(TC.app.S, rid); return r ? r.name : '居民'; },
    open: Ro.openPerson, update: Ro.updatePerson, close: () => { TC.render.view.sel = null; },
  });
  TC.panel.register('inspect', {
    title: bid => { const b = TC.app.C.byId.get(bid); return b ? TC.bld.def(b).name + (b.st === 'site' ? '（工地）' : '') : '建筑'; },
    open: Ro.openBuilding, update: Ro.updateBuilding, close: () => { TC.render.view.sel = null; },
  });
})(globalThis.TC = globalThis.TC || {});

<script>
/* 海图：一整屏的图，看这片海在哪、下一步能去哪，选好了起航。打开时游戏时间不走。
 * 图画在一张低分辨率的小画布上再放大两倍，图标用的是图集里的像素图；地名和说明用网页文字。 */
(function (TC) {
  'use strict';

  const BW = 560, BH = 172, SCALE = 2;
  const ICON = { start: 'm_junk', junk: 'm_junk', wreck: 'm_wreck', islet: 'm_islet', ruins: 'm_ruins', works: 'm_works', merchant: 'm_merchant', reef: 'm_reef', tower: 'm_tower', lighthouse: 'm_lighthouse', dawn: 'm_dawn', den: 'm_den' };
  const GATE = { tower: 1, lighthouse: 1, dawn: 1 };
  const WIND = ['没有风', '微风', '和风', '大风'];
  const WHY = {
    nohelm: '要先造一座船舵（建造 → 航行）', boats: '小船还在外面，等它回来', sailing: '已经在路上了', notnear: '只能去相邻的地点',
    over: '这一局已经结束了',
  };

  const Ch = TC.chartui = {
    el: null,
    sel: -1,
    cv: null, ctx: null,

    px(n) { return Math.round(30 + n.x * 0.455); },
    py(n) { return Math.round(92 + n.y * 0.62); },

    /* 这个地点在图上显示成什么：看清了的和三处必经之地显示真面目，其余是问号 */
    known(n) { return n.seen >= 2 || !!GATE[n.kind]; },
    title(n) { return Ch.known(n) ? n.name : '还没看清的地点'; },

    open() {
      const app = TC.app, D = TC.dom, el = D.el, S = app.S;
      if (Ch.el || !S) return;
      TC.panel.close();
      app.clearTool();
      Ch.cv = el('canvas', { class: 'px map', id: 'chart-map', width: String(BW), height: String(BH) });
      Ch.cv.style.width = BW * SCALE + 'px';
      Ch.cv.style.height = BH * SCALE + 'px';
      Ch.ctx = Ch.cv.getContext('2d');
      Ch.cv.addEventListener('click', e => {
        const r = Ch.cv.getBoundingClientRect();
        Ch.pick((e.clientX - r.left) / SCALE, (e.clientY - r.top) / SCALE);
      });
      // 海域的名字写在图的上沿
      const names = el('div', { class: 'regions' });
      const W = TC.data.world, first = {}, last = {};
      W.layers.forEach((L, i) => { if (first[L[0]] === undefined) first[L[0]] = i; last[L[0]] = i; });
      W.regions.forEach((rg, i) => {
        const x0 = Ch.bandX(first[i]), x1 = Ch.bandX(last[i] + 1);
        names.append(el('span', { text: rg.name, style: { left: x0 * SCALE + 'px', width: (x1 - x0) * SCALE + 'px' } }));
      });
      Ch.scroll = el('div', { class: 'map-scroll' }, [el('div', { class: 'map-inner', style: { width: BW * SCALE + 'px' } }, [Ch.cv, names])]);
      Ch.info = el('div', { class: 'map-info', id: 'chart-info' });
      const card = el('div', { class: 'card sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': '海图' }, [
        el('div', { class: 'sheet-head' }, [el('span', { text: '海图' }), el('button', { class: 'btn', type: 'button', id: 'chart-close', 'aria-label': '关闭', onclick: () => { TC.sfx.play('click'); Ch.close(); } }, [D.icon('ui_close', 2)])]),
        Ch.scroll, Ch.info,
      ]);
      Ch.el = el('div', { class: 'modal', id: 'chart' }, [card]);
      Ch.el.addEventListener('wheel', e => e.stopPropagation(), { passive: true });
      app.stage.append(Ch.el);
      app.blocked = true;
      Ch.select(S.voyage.to >= 0 ? S.voyage.to : S.voyage.at);
      // 把所在的位置滚到中间
      const here = S.chart.nodes[S.voyage.at];
      Ch.scroll.scrollLeft = Math.max(0, Ch.px(here) * SCALE - Ch.scroll.clientWidth / 2 + 60);
    },

    close() {
      if (!Ch.el) return;
      Ch.el.remove();
      Ch.el = null;
      TC.app.blocked = !!TC.dialog.el;
    },

    toggle() { if (Ch.el) Ch.close(); else Ch.open(); },

    /* 第 i 层左边界在图上的横坐标 */
    bandX(i) { return Math.round(30 + (i * 100 - 50) * 0.455); },

    pick(bx, by) {
      const S = TC.app.S;
      let best = -1, bd = 15 * 15;
      for (const n of S.chart.nodes) {
        if (n.seen < 1) continue;
        const dx = Ch.px(n) - bx, dy = Ch.py(n) - by, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = n.id; }
      }
      if (best >= 0) { TC.sfx.play('click'); Ch.select(best); }
    },

    select(id) {
      Ch.sel = id;
      Ch.render();
      Ch.fill();
    },

    line(ctx, x0, y0, x1, y1, dash) {
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
      for (let i = 0; i <= n; i++) {
        if (dash && (i % dash) >= dash / 2) continue;
        ctx.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1);
      }
    },

    render() {
      const S = TC.app.S, ctx = Ch.ctx, A = TC.atlas, R = TC.render, nodes = S.chart.nodes, v = S.voyage, W = TC.data.world;
      ctx.imageSmoothingEnabled = false;
      // 底：五片海域深浅相间，撒一些波纹
      const first = {};
      W.layers.forEach((L, i) => { if (first[L[0]] === undefined) first[L[0]] = i; });
      for (let i = 0; i < W.regions.length; i++) {
        const x0 = i === 0 ? 0 : Ch.bandX(first[i]), x1 = i + 1 < W.regions.length ? Ch.bandX(first[i + 1]) : BW;
        ctx.fillStyle = i % 2 ? '#124e89' : '#14589c';
        ctx.fillRect(x0, 0, x1 - x0, BH);
      }
      ctx.fillStyle = '#1b6bb1';
      for (let i = 0; i < 260; i++) {
        const x = Math.floor(TC.rng.hash01(i, 3, 91) * BW), y = Math.floor(TC.rng.hash01(i, 7, 92) * BH);
        ctx.fillRect(x, y, 3 + (i % 4), 1);
      }
      // 航线
      const near = new Set(TC.voyage.links(S, v.at).map(l => l[0]));
      for (const e of S.chart.edges) {
        const a = nodes[e[0]], b = nodes[e[1]];
        if (a.seen < 1 || b.seen < 1) continue;
        const sailing = v.to >= 0 && ((e[0] === v.at && e[1] === v.to) || (e[1] === v.at && e[0] === v.to));
        const open = v.to < 0 && ((e[0] === v.at && near.has(e[1])) || (e[1] === v.at && near.has(e[0])));
        ctx.fillStyle = sailing ? '#feae34' : open ? '#ffffff' : a.visited && b.visited ? '#8b9bb4' : '#3a6fa8';
        Ch.line(ctx, Ch.px(a), Ch.py(a), Ch.px(b), Ch.py(b), a.visited && b.visited && !sailing ? 0 : 4);
      }
      // 地点
      for (const n of nodes) {
        if (n.seen < 1) continue;
        const x = Ch.px(n), y = Ch.py(n), icon = Ch.known(n) ? ICON[n.kind] : 'm_unknown', fr = A.f[icon];
        ctx.fillStyle = 'rgba(24, 20, 37, 0.55)';
        ctx.fillRect(x - 8, y - 8, 17, 17);
        if (!n.visited && n.seen < 2) ctx.globalAlpha = 0.75;
        A.draw(ctx, icon, x - (fr.w >> 1), y - (fr.h >> 1));
        ctx.globalAlpha = 1;
        if (n.visited && n.id !== v.at) { ctx.fillStyle = '#63c74d'; ctx.fillRect(x - 5, y + 9, 11, 2); }      // 去过的
        if (n.sites.some(s => s.spec)) A.draw(ctx, 'm_flare', x + 5, y - 13);                                   // 有人求救
        if (n.sites.some(s => s.kind === 'boss' && !s.dead)) A.draw(ctx, 'm_boss', x - 16, y - 14);             // 潜伏着 Boss
        if (n.seen >= 2 && TC.market.nodeHas(n)) A.draw(ctx, 'm_coin', x + 7, y + 6);                          // 有集市
        if (n.sites.some(s => s.kind === 'fort' && !s.dead)) A.draw(ctx, 'm_fort', x - 17, y + 3);              // 海盗的据点
        if (n.id === Ch.sel) R.brackets(ctx, x - 7, y - 7, 15, 15, '#ffffff');
        else if (v.to < 0 && near.has(n.id)) R.brackets(ctx, x - 7, y - 7, 15, 15, '#feae34');
      }
      // 浮城现在在哪
      const a = nodes[v.at];
      let hx = Ch.px(a), hy = Ch.py(a) - 15;
      if (v.to >= 0) {
        const b = nodes[v.to], t = v.dist > 0 ? Math.min(1, v.done / v.dist) : 0;
        hx = Math.round(Ch.px(a) + (Ch.px(b) - Ch.px(a)) * t);
        hy = Math.round(Ch.py(a) + (Ch.py(b) - Ch.py(a)) * t) - 6;
      }
      A.draw(ctx, 'm_here', hx - 5, hy - 5);
    },

    /* 几天几小时的说法 */
    span(days) {
      if (days < 1) return Math.max(1, Math.round(days * 24)) + ' 小时';
      return (Math.round(days * 10) / 10) + ' 天';
    },

    siteSummary(n) {
      const count = {};
      for (const s of n.sites) { const name = s.kind === 'boss' ? (s.dead ? '战利品' : TC.data.bosses[s.boss].short) : s.kind === 'fort' && s.dead ? '烧掉的寨子' : TC.data.world.sites[s.kind].name; count[name] = (count[name] || 0) + 1; }
      return Object.keys(count).map(k => k + (count[k] > 1 ? ' ×' + count[k] : '')).join('、');
    },

    /* 右下的说明：选中的地点是什么、多远、能不能去 */
    fill() {
      const app = TC.app, S = app.S, C = app.C, D = TC.dom, el = D.el, V = TC.voyage, v = S.voyage;
      const n = S.chart.nodes[Ch.sel], box = Ch.info, known = Ch.known(n), kind = TC.data.world.kinds[n.kind];
      box.replaceChildren();
      const kv = (k, t, cls) => el('div', { class: 'kv' + (cls ? ' ' + cls : '') }, [el('span', { text: k }), el('span', { text: t })]);
      box.append(el('h3', { id: 'chart-title' }, [Ch.title(n), known ? el('i', { text: kind.name }) : null]));
      box.append(el('p', { text: known ? kind.desc : '离得太远，看不清那里是什么。' + (C.n.watchtower ? '' : '搭一座瞭望塔就能看清相邻的地点。') }));
      if (n.sites.some(s => s.spec)) box.append(el('p', { class: 'flare', text: '那里有求救的火光：有人等着接。' }));
      for (const s of n.sites) if (s.kind === 'fort' && !s.dead) box.append(el('p', { class: 'flare', text: '黑帆帮在这片海的据点就在那里。有战船坞就能攻打；拔掉它，这片海的海盗少一大半。' }));
      for (const s of n.sites) if (s.kind === 'boss' && !s.dead) box.append(el('p', { class: 'flare', text: '那里潜伏着' + TC.data.bosses[s.boss].name + '。备好鱼叉架再去招惹它；不想打，停在那儿也没事。' }));
      const reg = TC.data.world.regions[n.region];
      if (reg.note) box.append(kv(reg.name, reg.note));
      if (n.seen >= 2 && n.sites.length) box.append(kv('那里有', Ch.siteSummary(n)));
      if (n.seen >= 2 && TC.market.nodeHas(n)) box.append(kv('集市', TC.marketui.leanText(n.region) || '什么都有人换'));

      const here = n.id === v.at && v.to < 0;
      if (here) {
        box.append(kv('浮城', '就停在这里，已经 ' + Ch.span((S.tick - v.since) / TC.DAY)));
        box.append(kv('这片海', '物资还剩 ' + Math.round(TC.sea.richness(S) * 10) + ' 成'));
        for (const s of n.sites) {
          const left = V.remains(s) > 0 || (s.deals && s.deals.some(d => d.left > 0)) || (s.kind === 'boss' && !s.dead);
          box.append(el('div', { class: 'kv' }, [
            el('span', { text: s.kind === 'boss' ? TC.data.bosses[s.boss].short : TC.data.world.sites[s.kind].name }),
            el('span', {}, [s.market ? '有集市　' : s.kind === 'fort' && !s.dead ? '据点还在　' : left ? (s.surv > 0 ? '有人等着接　' : s.kind === 'boss' && !s.dead ? '还潜伏着　' : '还有东西　') : '空了　', el('button', { class: 'btn', type: 'button', onclick: () => { Ch.close(); app.gotoSite(s.id); } }, ['看一看'])]),
          ]));
        }
        return;
      }
      if (v.to >= 0) {
        if (n.id === v.to) {
          const p = V.power(S, C), left = v.dist - v.done;
          box.append(kv('航程', '已经走了 ' + Math.round(100 * v.done / v.dist) + '%，还剩 ' + Math.round(left) + ' 里'));
          box.append(kv('航速', Math.round(p.speed) + ' 里/天' + (p.manned ? '' : '（没人掌舵，只能顺水漂）')));
          box.append(kv('还要', v.ev ? '等你拿主意' : '约 ' + Ch.span(left / Math.max(1, p.speed))));
        } else box.append(el('p', { class: 'note', text: '正在航行途中，到了再说。' }));
        return;
      }
      const dist = V.dist(S, v.at, n.id);
      if (dist < 0) {
        box.append(el('p', { class: 'note', text: n.visited ? '去过了。' : '太远了，一次只能去相邻的地点。' }));
        return;
      }
      // 相邻：算一算要走多久
      const a = S.chart.nodes[v.at], head = V.heading(a.x, a.y, n.x, n.y), p = V.power(S, C, head, true), W = S.weather;
      const diff = Math.min((W.wd - head) & 15, (head - W.wd) & 15);
      const days = dist / p.speed / 0.75;                        // 夜里没人掌舵，大约只有四分之三的时间在全速走
      box.append(kv('航程', dist + ' 里，约 ' + Ch.span(days)));
      box.append(kv('眼下的风', W.ws === 0 ? '没有风，帆使不上劲' : WIND[W.ws] + '，' + (diff <= 2 ? '顺风' : diff >= 6 ? '逆风' : '侧风')));
      box.append(kv('航速', Math.round(p.speed) + ' 里/天：划桨 ' + p.row + (C.n.sail ? '、' + C.n.sail + ' 面帆 ' + Math.round(p.sail) : '、没有帆') + (p.engine ? '、引擎 ' + p.engine : '') + '，' + C.deckN + ' 格的城拖慢 ' + Math.round((1 - p.mass) * 100) + '%'));
      const pop = Math.max(1, S.residents.length), food = TC.stock.foodDays(S) / pop, water = (S.stock.water || 0) / pop / 3.3;
      const tight = food < days + 1 || water < days + 1;
      box.append(kv('粮水', '存粮够吃 ' + Ch.span(food) + '，淡水够喝 ' + Ch.span(water) + (tight ? '——路上可能不够' : ''), tight ? 'warn' : ''));
      const why = TC.sim.check(S, C, { type: 'sail', to: n.id });
      const go = el('button', { class: 'btn primary', type: 'button', id: 'chart-sail', onclick: () => {
        app.queue.push({ type: 'sail', to: n.id });
        app.flush();
        TC.sfx.play('good');
        Ch.close();
      } }, ['起航']);
      if (why) go.disabled = true;
      box.append(el('div', { class: 'rowbtns' }, [go]));
      if (why) box.append(el('p', { class: 'warn', id: 'chart-why', text: WHY[why] || '现在走不了' }));
      else box.append(el('p', { class: 'note', text: '起航后这片海就留在身后了；剩下的东西不会跟着走，也不会长回来。' }));
    },
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 研究面板：花旧世界资料解锁技术。一次研究一项，要有人坐在研究台前钻研。 */
(function (TC) {
  'use strict';

  const WHY = { nolab: '要先搭一座研究台', busy: '正在研究别的', req: '', cost: '旧世界资料不够', done: '已经掌握了' };

  const Rs = TC.researchui = {
    rows: {},
    body: null,
    key: '',

    open(body) {
      Rs.body = body;
      Rs.key = '';
    },

    fill(S, C) {
      const D = TC.dom, el = D.el, T = TC.data.tech, app = TC.app, body = Rs.body;
      Rs.rows = {};
      body.replaceChildren();
      Rs.data = el('span', { class: 'val' });
      body.append(el('div', { class: 'stockrow', id: 'research-data' }, [D.icon('i_data', 1), el('span', { text: '旧世界资料' }), Rs.data]));
      Rs.cur = el('p', { id: 'research-cur' });
      Rs.curFill = el('i');
      Rs.curBar = el('div', { class: 'bar wide' }, [Rs.curFill]);
      body.append(Rs.cur, Rs.curBar);
      for (const [branch, title] of TC.data.techBranches) {
        body.append(el('h4', { text: title }));
        for (const id of TC.data.techOrder) {
          const def = T[id];
          if (def.branch !== branch) continue;
          const state = el('span', { class: 'state' });
          const row = el('button', { class: 'item tech', type: 'button', id: 'tech-' + id, onclick: () => {
            const why = TC.tech.can(app.S, app.C, id);
            if (why) { TC.sfx.play('deny'); app.toast(why === 'req' ? '要先掌握“' + T[def.req].name + '”' : WHY[why] || '现在不行', 'bad', true); return; }
            app.queue.push({ type: 'research', tech: id });
            app.flush();
            TC.sfx.play('click');
            TC.panel.update();
          } }, [
            el('span', { class: 'top' }, [el('span', { class: 'name', text: def.name }), el('span', { class: 'cost' }, [el('span', {}, [D.icon('i_data', 1), String(def.cost)])])]),
            el('span', { class: 'desc', text: def.desc }),
            state,
          ]);
          Rs.rows[id] = { row, state, cls: '' };
          body.append(row);
        }
      }
      body.append(el('p', { class: 'note', text: '旧世界资料在沉船、楼顶废墟、信号塔里，也能跟商船换。有的专家会带来现成的技术。' }));
    },

    update(S, C) {
      const D = TC.dom, T = TC.data.tech, P = S.progress.tech;
      const key = String(TC.data.techOrder.length);
      if (key !== Rs.key) { Rs.key = key; Rs.fill(S, C); }
      D.setText(Rs.data, String(S.stock.data || 0));
      if (P.cur) {
        const lab = S.buildings.find(b => b.def === 'lab' && b.w);
        const who = lab ? (TC.people.byId(S, lab.w) || {}).name : '';
        const pct = Math.round(100 * P.prog / T[P.cur].work);
        D.setText(Rs.cur, '正在研究：' + T[P.cur].name + ' ' + pct + '%' + (who ? '（' + who + ' 在钻研）' : '（等人到研究台前坐下）'));
        Rs.curBar.hidden = false;
        Rs.curFill.style.width = pct + '%';
      } else {
        D.setText(Rs.cur, C.n.lab ? '研究台空着。挑一项开始研究：' : '还没有研究台。升到 3 级后，在“建造 → 加工”里搭一座。');
        Rs.curBar.hidden = true;
      }
      for (const id in Rs.rows) {
        const r = Rs.rows[id], def = T[id], why = TC.tech.can(S, C, id);
        let cls = '', text = '';
        if (P.done[id] !== undefined) { cls = 'done'; text = '已掌握'; }
        else if (P.cur === id) { cls = 'cur'; text = '研究中'; }
        else if (why === 'req') { cls = 'lack'; text = '要先掌握“' + T[def.req].name + '”'; }
        else if (why === 'cost') { cls = 'lack'; text = '资料不够'; }
        else if (why) { cls = 'lack'; text = ''; }
        else text = '点一下开始';
        D.setText(r.state, text);
        if (cls !== r.cls) { r.row.classList.remove('done', 'cur', 'lack'); if (cls) r.row.classList.add(cls); r.cls = cls; }
      }
    },
  };

  TC.panel.register('research', { title: '研究', open: Rs.open, update: Rs.update });
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 技能面板：手里有几点、九项城务技能各到了几级，点一下花 1 点升一级 */
(function (TC) {
  'use strict';

  const WHY = { cost: '没有技能点了。升级、走完主线的一章、打赢 Boss 各得 1 点', done: '已经满级了', gone: '没有这项技能' };

  const Sk = TC.skillsui = {
    rows: {},
    pts: null,

    open(body) {
      const D = TC.dom, el = D.el, app = TC.app, K = TC.data.skills, max = TC.data.balance.skill.max;
      Sk.rows = {};
      Sk.pts = el('span', { class: 'val' });
      body.append(el('div', { class: 'stockrow', id: 'skill-pts' }, [D.icon('ui_skill', 2), el('span', { text: '技能点' }), Sk.pts]));
      body.append(el('p', { class: 'note', text: '城镇每升一级、主线每走完一章、每打赢一个 Boss，各得 1 点。每项最多 ' + max + ' 级，点不满，得挑着学。' }));
      for (const id of TC.data.skillOrder) {
        const def = K[id], lv = el('span', { class: 'pips' }), state = el('span', { class: 'state' });
        const row = el('button', { class: 'item tech', type: 'button', id: 'skill-' + id, onclick: () => {
          const why = TC.sim.check(app.S, app.C, { type: 'skill', id });
          if (why) { TC.sfx.play('deny'); app.toast(WHY[why] || '现在不行', 'bad', true); return; }
          app.queue.push({ type: 'skill', id });
          app.flush();
          app.refreshAll();                 // 底栏按钮上的点数也马上跟着变
        } }, [
          el('span', { class: 'top' }, [el('span', { class: 'name', text: def.name }), lv]),
          el('span', { class: 'desc', text: '每级：' + def.per + '。' + def.desc }),
          state,
        ]);
        Sk.rows[id] = { row, lv, state, key: '' };
        body.append(row);
      }
    },

    update(S) {
      const D = TC.dom, max = TC.data.balance.skill.max;
      D.setText(Sk.pts, S.skills.pts + ' 点可用（一共得过 ' + S.skills.got + ' 点）');
      for (const id in Sk.rows) {
        const r = Sk.rows[id], lv = TC.skill.lv(S, id), why = TC.skill.can(S, id), key = lv + '|' + why;
        if (key === r.key) continue;
        r.key = key;
        D.setText(r.lv, '●'.repeat(lv) + '○'.repeat(max - lv));
        D.setText(r.state, lv >= max ? '满级' : why === 'cost' ? (lv ? '已学 ' + lv + ' 级' : '还没学') : '点一下升到 ' + (lv + 1) + ' 级');
        r.row.classList.toggle('done', lv >= max);
        r.row.classList.toggle('lack', why === 'cost');
        r.row.classList.toggle('cur', !why);
      }
    },
  };

  TC.panel.register('skills', { title: '技能', open: Sk.open, update: Sk.update });
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/ui/skillsui.js
</script>
<script>
/* 集市面板：用旧币买进卖出。从有集市的去处（商船、浮村、灯塔）或者自家的贸易站打开；
 * 面板的参数是去处的编号，-1 指贸易站。 */
(function (TC) {
  'use strict';

  const WHY = {
    gone: '集市不在了', closed: '给守灯人送过补给，他的小铺才对你开张', bad: '这个数不行', sold: '他们没这么多货', cost: '旧币不够',
    full: '放不下', none: '你没有这么多', purse: '他们今天收不起了，明天再来',
  };

  const Mu = TC.marketui = {
    sid: 0,
    key: '',
    nodes: null,

    names(list) { return list.map(k => TC.data.res[k].name).join('、'); },

    /* 这片海域的行情，一句话 */
    leanText(region) {
      const L = TC.market.lean(region), parts = [];
      if (L.cheap.length) parts.push(Mu.names(L.cheap.slice(0, 3)) + '便宜');
      if (L.dear.length) parts.push(Mu.names(L.dear.slice(0, 3)) + '贵');
      return parts.length ? '这一带' + parts.join('，') + '。' : '';
    },

    open(body, sid) {
      Mu.sid = sid;
      Mu.key = '';
      Mu.body = body;
    },

    /* 一行货：图标、名字和数量、价钱、两个按钮 */
    row(kind, res) {
      const D = TC.dom, el = D.el, app = TC.app, sid = Mu.sid;
      const qty = el('span', { class: 'qty' }), price = el('span', { class: 'price' });
      const btn = n => el('button', { class: 'btn', type: 'button', id: kind + '-' + res + '-' + n, onclick: () => {
        const cmd = { type: kind, sid, res, n }, why = TC.sim.check(app.S, app.C, cmd);
        if (why) { TC.sfx.play('deny'); app.toast(WHY[why] || '现在不行', 'bad', true); return; }
        app.queue.push(cmd);
        app.flush();
        app.refreshAll();
      } }, [(kind === 'buy' ? '买 ' : '卖 ') + n]);
      const b1 = btn(1), b5 = btn(5);
      const node = el('div', { class: 'mrow', id: 'mrow-' + kind + '-' + res }, [D.icon('i_' + res, 1), el('span', { class: 'what' }, [el('span', { text: TC.data.res[res].name }), qty]), price, b1, b5]);
      return { res, node, qty, price, b1, b5 };
    },

    fill(S, C, at) {
      const D = TC.dom, el = D.el, body = Mu.body;
      body.replaceChildren();
      const N = Mu.nodes = { buy: [], sell: [], coin: el('span', { class: 'val' }), purse: el('h4'), closed: null, next: null };
      body.append(el('div', { class: 'stockrow', id: 'market-coin' }, [D.icon('i_coin', 1), el('span', { text: '旧币' }), N.coin]));
      body.append(el('p', { class: 'note', text: Mu.leanText(at.node.region) + '价钱天天变；同一处买了马上卖，一定亏。' }));
      const fid = at.m.kind === 'post' ? 'guild' : TC.faction.of(at.s);
      if (fid) { N.faction = el('p', { class: 'note', id: 'market-faction' }); body.append(N.faction); }
      if (TC.market.open(S, at)) { N.closed = el('p', { class: 'warn', id: 'market-closed', text: WHY.closed }); body.append(N.closed); }
      if (at.m.kind === 'post') { N.next = el('p', { class: 'note', id: 'market-next' }); body.append(N.next); }
      body.append(el('h4', { text: '他们卖的' }));
      for (const res of TC.data.marketOrder) if (at.m.max[res]) { const r = Mu.row('buy', res); N.buy.push(r); body.append(r.node); }
      if (!N.buy.length) body.append(el('p', { class: 'note', text: '眼下没有货。' }));
      body.append(N.purse);
      for (const res of TC.data.marketOrder) if ((S.stock[res] || 0) > 0) { const r = Mu.row('sell', res); N.sell.push(r); body.append(r.node); }
      if (!N.sell.length) body.append(el('p', { class: 'note', text: '你手里没有他们收的东西。' }));
    },

    update(S, C, sid) {
      const D = TC.dom, Mk = TC.market, at = Mk.at(S, C, sid);
      if (!at) { TC.panel.close(); return; }
      const key = at.m.kind + '|' + Object.keys(at.m.max).join(',') + '|' + TC.data.marketOrder.filter(k => (S.stock[k] || 0) > 0).join(',') + '|' + (Mk.open(S, at) || '');
      if (key !== Mu.key) { Mu.key = key; Mu.fill(S, C, at); }
      const N = Mu.nodes, coin = S.stock.coin || 0;
      D.setText(N.coin, String(coin));
      if (N.faction) {
        const fid = at.m.kind === 'post' ? 'guild' : TC.faction.of(at.s), off = TC.faction.discount(S, at);
        D.setText(N.faction, TC.factionsui.line(S, fid) + '。在这儿做买卖，好感会涨' + (off ? '；眼下价钱让你 ' + Math.round(off * 100) + '%' : '') + '。');
      }
      D.setText(N.purse, '他们收的（今天还收得起 ' + at.m.purse + ' 旧币的货）');
      if (N.next) D.setText(N.next, '行商下回约 ' + TC.chartui.span(Math.max(0, S.post.next - S.tick) / TC.DAY) + '后上门，到时候换一批货。');
      for (const r of N.buy) {
        const have = at.m.goods[r.res] || 0, p = Mk.buyPrice(S, at, r.res);
        D.setText(r.qty, '有 ' + have);
        D.setText(r.price, String(p));
        r.b1.classList.toggle('lack', Mk.canBuy(S, C, sid, r.res, 1) !== null);
        r.b5.classList.toggle('lack', Mk.canBuy(S, C, sid, r.res, 5) !== null);
      }
      for (const r of N.sell) {
        const have = S.stock[r.res] || 0, p = Mk.sellPrice(S, at, r.res);
        D.setText(r.qty, '你有 ' + have);
        D.setText(r.price, String(p));
        r.b1.classList.toggle('lack', Mk.canSell(S, C, sid, r.res, 1) !== null);
        r.b5.classList.toggle('lack', Mk.canSell(S, C, sid, r.res, 5) !== null);
      }
    },
  };

  TC.panel.register('market', {
    title: sid => { const at = TC.market.at(TC.app.S, TC.app.C, sid); return at ? TC.data.market.kinds[at.m.kind].name : '集市'; },
    open: Mu.open, update: Mu.update, close: () => { TC.render.view.sel = null; },
  });
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/ui/marketui.js
</script>
<script>
/* 势力面板：潮民和行商会的好感度、交好了有什么好处、送礼；黑帆帮各片海的据点还在不在 */
(function (TC) {
  'use strict';

  const WHY = { where: '要停在他们的地方才能送礼', none: '你没有这么多', full: '好感已经到顶了', bad: '这样东西他们不收', gone: '没有这家势力' };
  const REGION = ['', '沉没之城', '礁海', '风暴带'];

  const Fu = TC.factionsui = {
    body: null,
    key: '',
    nodes: null,

    /* 一句话：和这家眼下的交情（给去处面板和集市面板用） */
    line(S, id) {
      const F = TC.faction, t = F.tier(S, id);
      return TC.data.factions[id].name + '：' + F.tierName(t) + '（好感 ' + F.rep(S, id) + '）';
    },

    /* 现在手头拿得出 5 份的东西里挑几样：他们喜欢的排在前面，其余的按值钱的先后 */
    gifts(S, id) {
      const likes = TC.data.factions[id].likes, list = [];
      for (const res of TC.data.marketOrder) {
        if ((S.stock[res] || 0) >= 5) list.push([res, (likes[res] ? 1000 : 0) + TC.faction.giftValue(id, res, 5)]);
      }
      list.sort((a, b) => b[1] - a[1]);
      const out = list.slice(0, 5).map(p => p[0]);
      if ((S.stock.coin || 0) >= TC.data.balance.war.coinGift) out.push('coin');      // 旧币也能送
      return out;
    },

    open(body) {
      Fu.body = body;
      Fu.key = '';
    },

    fill(S) {
      const D = TC.dom, el = D.el, app = TC.app, B = TC.data.balance.war, body = Fu.body;
      body.replaceChildren();
      const N = Fu.nodes = { f: {}, forts: el('p', { id: 'faction-forts' }) };
      for (const id of TC.data.factionOrder) {
        const def = TC.data.factions[id], o = N.f[id] = { tier: el('span', { class: 'num' }), fill: el('i'), perks: [], where: el('p', { class: 'note' }), gifts: [] };
        body.append(el('h4', { text: def.name }));
        body.append(el('p', { text: def.desc }));
        body.append(el('div', { class: 'kv', id: 'faction-' + id }, [el('span', { text: '交情' }), o.tier]));
        body.append(el('div', { class: 'bar wide rep' }, [o.fill, el('b', { style: { left: B.friendly + '%' } }), el('b', { style: { left: B.allied + '%' } })]));
        def.perks.forEach((t, i) => {
          const row = el('div', { class: 'step' }, [el('span', { class: 'mark', text: '·' }), el('span', { class: 'what', text: (i ? '同盟：' : '友好：') + t })]);
          o.perks.push(row);
          body.append(row);
        });
        body.append(o.where);
        for (const res of Fu.gifts(S, id)) {
          const gain = el('span', { class: 'price' }), qty = el('span', { class: 'qty' }), n = res === 'coin' ? B.coinGift : 5;
          const btn = el('button', { class: 'btn', type: 'button', id: 'gift-' + id + '-' + res, onclick: () => {
            const cmd = { type: 'gift', id, res, n }, why = TC.sim.check(app.S, app.C, cmd);
            if (why) { TC.sfx.play('deny'); app.toast(WHY[why] || '现在不行', 'bad', true); return; }
            app.queue.push(cmd);
            app.flush();
            app.refreshAll();
          } }, ['送 ' + n]);
          const row = el('div', { class: 'mrow gift' }, [D.icon('i_' + res, 1), el('span', { class: 'what' }, [el('span', { text: TC.data.res[res].name }), qty]), gain, btn]);
          o.gifts.push({ res, n, gain, qty, btn });
          body.append(row);
        }
      }
      body.append(el('h4', { text: TC.data.pirates.name }));
      body.append(el('p', { text: TC.data.pirates.desc }));
      body.append(N.forts);
      body.append(el('p', { class: 'note', text: '好感怎么涨：在他们的集市上做买卖、送礼（东西和旧币都行）、救起海上的人（潮民）、打沉海盗船、拔掉海盗的据点。' }));
    },

    update(S, C) {
      const D = TC.dom, F = TC.faction, B = TC.data.balance.war;
      const key = TC.data.factionOrder.map(id => Fu.gifts(S, id).join(',')).join('|');
      if (key !== Fu.key) { Fu.key = key; Fu.fill(S); }
      const N = Fu.nodes;
      for (const id of TC.data.factionOrder) {
        const o = N.f[id], t = F.tier(S, id), rep = F.rep(S, id), here = F.here(S, id), def = TC.data.factions[id];
        D.setText(o.tier, F.tierName(t) + '　' + rep + ' / ' + B.max + (t < 2 ? '（' + (t ? '同盟' : '友好') + '要 ' + (t ? B.allied : B.friendly) + '）' : ''));
        o.fill.style.width = rep + '%';
        o.perks.forEach((row, i) => { const got = t > i; row.classList.toggle('done', got); row.firstChild.textContent = got ? '✓' : '·'; });
        D.setText(o.where, here ? '就停在' + TC.data.world.sites[def.home].name + '旁边：可以送礼。他们喜欢的东西，好感涨得多。' : '要停在' + TC.data.world.sites[def.home].name + '旁边才能送礼。');
        for (const g of o.gifts) {
          D.setText(g.qty, '你有 ' + (S.stock[g.res] || 0) + (def.likes[g.res] ? '，他们喜欢' : ''));
          D.setText(g.gain, '+' + (Math.round(F.giftValue(id, g.res, g.n) * 10) / 10));
          g.btn.classList.toggle('lack', F.canGift(S, C, id, g.res, g.n) !== null);
        }
      }
      const parts = [];
      for (let r = 1; r <= 3; r++) {
        const f = TC.war.fortIn(S, r);
        parts.push(REGION[r] + '：' + (!f ? '没有据点' : f.dead ? '据点已经拔掉，太平多了' : '据点还在'));
      }
      D.setText(N.forts, parts.join('；') + '。');
    },
  };

  TC.panel.register('factions', { title: '势力', open: Fu.open, update: Fu.update });
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/ui/factionsui.js
</script>
<script>
/* 去处面板：点海面上的沉船、废墟、小岛、商船时打开。看那里还有什么，要不要派小船去；商船在这里做买卖；
 * 潜伏着 Boss 的地方在这里看它的底细、把它引出来。 */
(function (TC) {
  'use strict';

  const ACT = { rescue: '接人', salvage: '打捞', dive: '潜水', fish: '打鱼' };
  const WHY = { cost: '东西不够', full: '换来的放不下', sold: '这一样换完了', gone: '商船不在了' };
  const WHY_FORT = { busy: '正打着别的，先把眼前的打发了', cool: '上回刚打过，他们还戒备着', sailing: '正在航行', dead: '已经拔掉了', gone: '据点不在这儿', noboat: '没有出得了港的战船（要有战船坞，船没在修）' };
  const WHY_BOSS = { busy: '正打着呢，先把眼前的打发了', cool: '它刚退走，还没缓过来', sailing: '正在航行', dead: '已经打死了', gone: '它不在这儿了' };

  const Si = TC.siteui = {
    cur: null,

    listText(o) {
      const RES = TC.data.res, parts = [];
      for (const k in o) if (o[k] > 0) parts.push(RES[k].name + ' ' + o[k]);
      return parts.join('、');
    },

    open(body, sid) {
      const D = TC.dom, el = D.el, app = TC.app, s = TC.voyage.site(app.S, sid);
      if (!s) { TC.panel.close(); return; }
      const def = TC.data.world.sites[s.kind], RES = TC.data.res;
      const o = Si.cur = { status: el('span'), left: el('span'), deep: null, surv: null, fish: null, order: null, deals: [], boss: null, market: null, fort: null, faction: null };
      const kv = (k, v) => el('div', { class: 'kv' }, [el('span', { text: k }), v]);
      if (s.kind === 'boss' && !s.dead) {
        // 还活着的 Boss：底细、你的防备、引它出来
        const bd = TC.data.bosses[s.boss];
        o.boss = { hp: el('span'), fill: el('i'), def: el('span'), why: el('p', { class: 'warn', id: 'boss-why' }) };
        o.boss.go = el('button', { class: 'btn primary wide', type: 'button', id: 'boss-go', onclick: () => {
          const why = TC.sim.check(app.S, app.C, { type: 'boss', sid });
          if (why) { TC.sfx.play('deny'); app.toast(WHY_BOSS[why] || '现在不行', 'bad', true); return; }
          app.queue.push({ type: 'boss', sid });
          app.flush();
          TC.panel.update();
        } }, ['引它出来']);
        body.append(el('p', { text: bd.desc }), el('p', { text: bd.how }));
        body.append(kv('还要射中', o.boss.hp), el('div', { class: 'bar wide low' }, [o.boss.fill]));
        body.append(kv('你的防备', o.boss.def));
        body.append(kv('打赢了有', el('span', { text: Si.listText(s.loot) + '，技能点 1' })));
        body.append(o.boss.go, o.boss.why);
        body.append(el('p', { class: 'note', text: '鱼叉架要有人守着才会射。时间到了还没打死，它自己会退走，血恢复一半，缓过来可以再引。绕开它也能通关。' }));
        return;
      }
      if (s.kind === 'fort' && !s.dead) {
        // 还在的据点：守军、你的战船、攻打
        o.fort = { hp: el('span'), fill: el('i'), mine: el('span'), why: el('p', { class: 'warn', id: 'fort-why' }) };
        o.fort.go = el('button', { class: 'btn primary wide', type: 'button', id: 'fort-go', onclick: () => {
          const why = TC.sim.check(app.S, app.C, { type: 'assault', sid });
          if (why) { TC.sfx.play('deny'); app.toast(WHY_FORT[why] || '现在不行', 'bad', true); return; }
          app.queue.push({ type: 'assault', sid });
          app.flush();
          TC.panel.update();
        } }, ['攻打据点']);
        body.append(el('p', { text: def.desc }));
        body.append(kv('寨子还要打', o.fort.hp), el('div', { class: 'bar wide low' }, [o.fort.fill]));
        body.append(kv('守军', el('span', { text: TC.data.balance.war.fortBoats + ' 条船挡在寨子前面' })));
        body.append(kv('你的战船', o.fort.mine));
        body.append(kv('打下来有', el('span', { text: Si.listText(s.loot) + '；潮民和行商会的好感大涨' })));
        body.append(o.fort.go, o.fort.why);
        body.append(el('p', { class: 'note', text: '战船自己划过去打，不用操作；打坏了回港修一阵。没打下来就收兵，寨子会修好一半。和潮民结了同盟、又有电台，他们会来两条船帮忙。' }));
        return;
      }
      body.append(el('p', { text: s.kind === 'boss' ? TC.data.bosses[s.boss].short + '翻了肚皮，战利品漂在原地，派小船去捞。' : s.kind === 'fort' ? '寨子烧了，东西散在水面上，派小船去捞。' : def.desc }));
      const fid = TC.faction.of(s);
      if (fid) {
        o.faction = el('span');
        body.append(el('div', { class: 'kv' }, [o.faction, el('button', { class: 'btn', type: 'button', id: 'site-faction', onclick: () => { TC.sfx.play('click'); TC.panel.open('factions'); } }, ['送礼'])]));
      }
      if (s.market) {
        o.market = el('p', { class: 'note', id: 'site-market-note' });
        body.append(el('button', { class: 'btn primary wide', type: 'button', id: 'site-market', onclick: () => { TC.sfx.play('click'); TC.panel.open('market', sid); } }, ['进集市做买卖']), o.market);
        if (s.kind === 'village') return;                 // 浮村没有可捞的东西，只有集市
      }
      if (s.deals) {
        body.append(el('h4', { text: '以物易物的特惠' }));
        s.deals.forEach((d, i) => {
          const left = el('span', { class: 'state' });
          const row = el('button', { class: 'item deal', type: 'button', id: 'deal-' + i, onclick: () => {
            const why = TC.voyage.canTrade(app.S, app.C, TC.voyage.site(app.S, sid), i);
            if (why) { TC.sfx.play('deny'); app.toast(WHY[why] || '换不了', 'bad', true); return; }
            app.queue.push({ type: 'trade', sid, deal: i });
            app.flush();
            TC.panel.update();
          } }, [
            el('span', { class: 'top' }, [
              el('span', { class: 'cost' }, Object.keys(d.give).map(k => el('span', { title: RES[k].name }, [D.icon('i_' + k, 1), RES[k].name + ' ' + d.give[k]]))),
              el('span', { class: 'arrow', text: '换' }),
              el('span', { class: 'cost' }, Object.keys(d.get).map(k => el('span', { title: RES[k].name }, [D.icon('i_' + k, 1), RES[k].name + ' ' + d.get[k]]))),
            ]),
            left,
          ]);
          o.deals.push({ row, left, cls: '' });
          body.append(row);
        });
        body.append(el('p', { class: 'note', text: '商船就靠在旁边，不用划船过去。每样特惠只能换几次。' }));
        return;
      }
      body.append(kv('状况', o.status));
      body.append(kv('还有', o.left));
      if (s.deep) { o.deep = el('span'); body.append(kv('深处', o.deep)); }
      if (def.surv) { o.surv = el('span'); body.append(kv('等着接的人', o.surv)); }
      if (s.fishMax) { o.fish = el('span'); body.append(kv('鱼', o.fish)); }
      o.order = el('button', { class: 'btn', type: 'button', id: 'site-order', onclick: () => {
        const cur = TC.voyage.site(app.S, sid);
        if (cur) app.queue.push({ type: 'siteOrder', sid, on: cur.order ? 0 : 1 });
        app.flush();
        TC.sfx.play('click');
        TC.panel.update();
      } });
      body.append(el('div', { class: 'rowbtns' }, [o.order]));
      body.append(el('p', { class: 'note', text: '小船每趟装 ' + TC.voyage.boatCap(app.S) + ' 份，白天有空着的船和人手就会自己去。' }));
    },

    update(S, C, sid) {
      const s = TC.voyage.site(S, sid), o = Si.cur, D = TC.dom, V = TC.voyage;
      if (!s) { TC.app.select(null); return; }
      if (o.boss) {
        if (s.dead) { TC.panel.open('site', sid); return; }                 // 打死了：换成寻常去处的样子
        const b = S.threat.boss && S.threat.boss.sid === sid ? S.threat.boss : null, bd = TC.data.bosses[s.boss];
        const hp = b ? Math.max(0, b.hp) : s.hp, why = TC.boss.can(S, C, sid), span = n => TC.chartui.span(Math.max(0, n) / TC.DAY);
        D.setText(o.boss.hp, hp + ' 下（共 ' + bd.hp + '）');
        o.boss.fill.style.width = Math.round(100 * hp / bd.hp) + '%';
        D.setText(o.boss.def, '鱼叉架 ' + C.n.harpoon + ' 座' + (C.n.bell ? '，有警钟' : '，没有警钟') + (C.n.breakwater ? '，防浪板 ' + C.n.breakwater + ' 块' : ''));
        D.setText(o.boss.why, b ? '正打着！再过约 ' + span(b.until - S.tick) + '它就退走' : why === 'cool' ? '它刚退走，约 ' + span(s.cool - S.tick) + '后缓过来' : why ? WHY_BOSS[why] : C.n.harpoon ? '' : '一座鱼叉架都没有：引出来也伤不着它');
        o.boss.go.classList.toggle('lack', !!why);
        return;
      }
      if (o.fort) {
        if (s.dead) { TC.panel.open('site', sid); return; }
        const sg = S.threat.siege && S.threat.siege.sid === sid ? S.threat.siege : null, why = TC.war.canAssault(S, C, sid), B = TC.data.balance.war;
        const hp = sg ? Math.max(0, sg.hp) : s.hp, ready = TC.war.docksReady(S).length, span = n => TC.chartui.span(Math.max(0, n) / TC.DAY);
        D.setText(o.fort.hp, hp + ' 下（共 ' + s.max + '）' + (sg ? '，守军还剩 ' + sg.boats.length + ' 条船' : ''));
        o.fort.fill.style.width = Math.round(100 * hp / s.max) + '%';
        D.setText(o.fort.mine, C.n.wardock ? ready + ' 条能出港（共 ' + C.n.wardock + ' 座战船坞）' + (TC.faction.tier(S, 'tide') >= 2 ? (C.n.radio ? '；潮民会来 ' + B.allyBoats + ' 条船' : '；有电台潮民才会来帮忙') : '') : '还没有战船坞（建造 → 防御）');
        D.setText(o.fort.why, sg ? '正在攻打！再过约 ' + span(sg.until - S.tick) + '收兵' : why === 'cool' ? '上回刚打过，约 ' + span(s.cool - S.tick) + '后他们才松懈' : why ? WHY_FORT[why] : ready < 3 && TC.faction.tier(S, 'tide') < 2 ? '只有 ' + ready + ' 条战船，多半打不下来：再添战船坞，或者找潮民结盟' : !TC.clock.workTime(S) ? '大家都歇下了，这会儿下令没人操船；天亮再打更稳妥' : '');
        o.fort.go.classList.toggle('lack', !!why);
        return;
      }
      if (o.faction) D.setText(o.faction, TC.factionsui.line(S, TC.faction.of(s)));
      if (o.market) {
        const at = TC.market.at(S, C, sid);
        D.setText(o.market, TC.market.open(S, at) ? '给守灯人送过补给，他的小铺才对你开张。' : TC.marketui.leanText(at.node.region) + '你有 ' + (S.stock.coin || 0) + ' 旧币。');
        if (s.kind === 'village') return;
      }
      if (s.deals) {
        s.deals.forEach((d, i) => {
          const r = o.deals[i], why = V.canTrade(S, C, s, i);
          D.setText(r.left, d.left > 0 ? '还能换 ' + d.left + ' 次' + (why === 'cost' ? '（东西不够）' : why === 'full' ? '（放不下）' : '') : '换完了');
          const cls = why ? 'lack' : '';
          if (cls !== r.cls) { r.row.classList.toggle('lack', !!why); r.cls = cls; }
        });
        return;
      }
      let rower = null;
      for (const r of S.residents) if (r.task && r.task.k === 'boat' && r.task.sid === sid) rower = r;
      const todo = V.todo(S, C, s, 0), left = V.remains(s);
      let st;
      if (rower) st = rower.name + (rower.task.ph === 3 ? ' 正划船回来' : rower.task.ph === 2 ? ' 正在' + ACT[rower.task.act] : ' 正划船过去');
      else if (!left) st = '空了';
      else if (!C.n.dock) st = '要有小船坞才去得了';
      else if (!s.order) st = '你说了先不去';
      else if (!todo) {
        if (s.surv > 0) st = S.residents.length >= TC.data.balance.levels.pop[S.progress.level] ? '人口到上限了，接不了人' : '没有空床位，接不了人';
        else if (s.deep && V.remains({ surv: 0, left: s.deep }) === left) st = '剩下的在深处，要有潜水架';
        else if (s.fishMax && s.fish < TC.data.balance.boat.fishMin && left === s.fish) st = '鱼太少了，等它们长回来';
        else st = '仓里放不下了';
      } else st = TC.clock.workTime(S) ? '等空着的小船和人手（要去' + ACT[todo] + '）' : '收工了，明早再去';
      D.setText(o.status, st);
      D.setText(o.left, Si.listText(s.left) || '没有了');
      if (o.deep) D.setText(o.deep, (Si.listText(s.deep) || '没有了') + (C.n.divingrack ? '' : '（要潜水架）'));
      if (o.surv) D.setText(o.surv, s.surv > 0 ? s.surv + ' 人' + (s.spec ? '，其中有一位' + TC.data.specs[s.spec].title : '') : '没有了');
      if (o.fish) D.setText(o.fish, s.fish + ' / ' + s.fishMax + '（会慢慢长回来）');
      D.setText(o.order, s.order ? '先不派船去' : '派小船去');
    },
  };

  TC.panel.register('site', {
    title: sid => { const s = TC.voyage.site(TC.app.S, sid); return !s ? '去处' : s.kind === 'boss' ? TC.data.bosses[s.boss].name : TC.data.world.sites[s.kind].name; },
    open: Si.open, update: Si.update, close: () => { TC.render.view.sel = null; },
  });
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 弹窗：开场白、升级、到达、剧情、结局、游戏结束。弹窗开着的时候游戏时间不走。
 * 同一时间只显示一个。带 queue 的弹窗（剧情、升级、到达这类“告诉你一声”的）遇上别的弹窗开着，就排队等着；
 * 不带 queue 的（要玩家拿主意的）直接顶替眼前这个。 */
(function (TC) {
  'use strict';

  const Dg = TC.dialog = {
    el: null,
    pending: [],

    /* opt：{id, title, lines:[段落…], rows:[[名称, 数值]…], buttons:[{label, note 按钮下的小字, primary, disabled, onclick}],
     *       stack 按钮竖着排, queue 有别的弹窗开着就排队, wide 宽一些（结局、统计）} */
    show(opt) {
      if (Dg.el && opt.queue) { Dg.pending.push(opt); return; }
      Dg.remove();
      const el = TC.dom.el, app = TC.app;
      const card = el('div', { class: 'card' + (opt.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': opt.title });
      card.append(el('h2', { text: opt.title }));
      for (const line of opt.lines || []) card.append(el('p', { text: line }));
      for (const row of opt.rows || []) card.append(el('div', { class: 'kv' }, [el('span', { text: row[0] }), el('span', { text: String(row[1]) })]));
      const btns = el('div', { class: 'rowbtns' + (opt.stack ? ' stack' : '') });
      for (const b of opt.buttons || []) {
        const btn = el('button', {
          class: 'btn' + (b.primary ? ' primary' : ''), type: 'button', id: b.id,
          onclick: () => {
            app.wake();
            TC.sfx.play('click');
            Dg.remove();
            if (b.onclick) b.onclick();
            Dg.next();                 // 这个按钮没有再开别的弹窗：轮到排队的
          },
        }, [el('span', { text: b.label }), b.note ? el('small', { text: b.note }) : null]);
        if (b.disabled) btn.disabled = true;
        btns.append(btn);
      }
      card.append(btns);
      Dg.el = el('div', { class: 'modal', id: opt.id || 'modal' }, [card]);
      app.stage.append(Dg.el);
      app.blocked = true;
      const first = btns.querySelector('.primary:not(:disabled)') || btns.querySelector('button:not(:disabled)');
      if (first) { try { first.focus({ preventScroll: true }); } catch (e) { /* 忽略 */ } }
    },

    /* 把眼前这个拿掉，不动排队的 */
    remove() {
      if (!Dg.el) return;
      Dg.el.remove();
      Dg.el = null;
      TC.app.blocked = !!(TC.chartui && TC.chartui.el);
    },

    /* 眼前没有弹窗了：轮到排队的下一个 */
    next() {
      if (!Dg.el && Dg.pending.length) Dg.show(Dg.pending.shift());
    },

    /* 关掉眼前这个，接着放排队的 */
    close() {
      Dg.remove();
      Dg.next();
    },

    /* 全部关掉（换了一局） */
    clear() {
      Dg.pending.length = 0;
      Dg.remove();
    },
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/ui/dialog.js
</script>
<script>
/* 主线的界面：主线面板（五章、每一步、眼下该做什么）、走完一步时的那段话、
 * 到了拂晓的抉择、结局画面，以及“这一局”的统计。 */
(function (TC) {
  'use strict';

  const NUM = ['', '一', '二', '三', '四', '五'];

  const Su = TC.storyui = {
    body: null,
    key: '',
    nodes: null,

    chapterTitle(ch) { return '第' + NUM[ch] + '章 · ' + TC.data.story.chapters[ch]; },

    /* 心愿栏上“主线”那一行的字：{head, text, ready 现在就能动手} */
    line(S, C) {
      const s = TC.story.cur(S);
      if (!s) return { head: '主线 · 完', text: '结局：' + TC.data.story.endings[S.story.ending].name, ready: false };
      return { head: '主线 · ' + Su.chapterTitle(s.ch), text: s.text, ready: !!s.act && TC.story.canAct(S, C) === null };
    },

    /* 要动手的那一步现在为什么做不了 */
    whyText(S, why) {
      const s = TC.story.cur(S);
      if (why === 'where' && s && s.act && s.act.where) return '要停在“' + TC.data.world.kinds[s.act.where].name + '”才能做';
      if (why === 'cost') return '东西还不够';
      return '现在做不了';
    },

    /* ── 主线面板 ── */
    open(body) {
      Su.body = body;
      Su.key = '';
    },

    fill(S) {
      const D = TC.dom, el = D.el, ST = TC.data.story, RES = TC.data.res, app = TC.app, body = Su.body;
      const cur = TC.story.cur(S), curCh = cur ? cur.ch : 6;
      body.replaceChildren();
      Su.nodes = { cost: [] };
      if (!cur) {
        const e = ST.endings[S.story.ending];
        body.append(el('div', { class: 'step cur', id: 'story-ending' }, [el('span', { class: 'mark', text: '★' }), el('span', { class: 'what', text: '结局：' + e.name })]));
        for (const line of e.say) body.append(el('p', { class: 'say', text: line }));
        body.append(el('button', { class: 'btn wide', type: 'button', id: 'story-stats', onclick: () => { TC.sfx.play('click'); Su.showStats(); } }, ['看这一局的统计']));
        body.append(el('p', { class: 'note', text: '故事讲完了，日子还在继续：这座浮城可以一直经营下去。' }));
      }
      for (let ch = 1; ch <= 5; ch++) {
        const later = ch > curCh;
        body.append(el('h4', { class: later ? 'dim' : ch < curCh ? 'past' : '', id: 'chapter-' + ch, text: Su.chapterTitle(ch) + (ch < curCh ? '　✓' : '') }));
        if (ch !== curCh) continue;                             // 走完的章节只留一行，后面的章节只露个名字
        for (let i = 0; i < ST.steps.length; i++) {
          const s = ST.steps[i];
          if (s.ch !== ch) continue;
          const done = i < S.story.step, now = s === cur;
          body.append(el('div', { class: 'step' + (done ? ' done' : now ? ' cur' : ''), id: 'step-' + s.id }, [
            el('span', { class: 'mark', text: done ? '✓' : now ? '▶' : '·' }),
            el('span', { class: 'what', text: s.text }),
          ]));
          if (!now) continue;
          if (s.hint) body.append(el('p', { class: 'note', text: s.hint }));
          if (!s.act) continue;
          for (const k in s.act.cost || {}) {
            const val = el('span', { class: 'val' });
            body.append(el('div', { class: 'stockrow', id: 'story-cost-' + k }, [D.icon('i_' + k, 1), el('span', { text: RES[k].name }), val]));
            Su.nodes.cost.push({ k, need: s.act.cost[k], val, cls: '' });
          }
          Su.nodes.why = el('p', { class: 'warn', id: 'story-why' });
          Su.nodes.act = el('button', { class: 'btn primary wide', type: 'button', id: 'story-act', onclick: () => {
            const why = s.act.ending ? TC.story.canAct(app.S, app.C) : TC.sim.check(app.S, app.C, { type: 'story' });
            if (why) { TC.sfx.play('deny'); app.toast(Su.whyText(app.S, why), 'bad', true); return; }
            TC.sfx.play('click');
            if (s.act.ending) { Su.showChoice(); return; }
            app.queue.push({ type: 'story' });
            app.flush();
            TC.panel.update();
          } }, [s.act.label]);
          body.append(Su.nodes.act, Su.nodes.why);
        }
      }
      if (cur) body.append(el('p', { class: 'note', text: '主线不催人：先把日子过稳，再往东走。' }));
    },

    update(S, C) {
      const D = TC.dom, key = S.story.step + '|' + S.story.ending;
      if (key !== Su.key) { Su.key = key; Su.fill(S); }
      const N = Su.nodes;
      for (const c of N.cost) {
        const have = S.stock[c.k] || 0, cls = have < c.need ? 'lack' : '';
        D.setText(c.val, have + ' / ' + c.need);
        if (cls !== c.cls) { c.cls = cls; c.val.classList.toggle('lack', !!cls); }
      }
      if (N.act) {
        const why = TC.story.canAct(S, C);
        N.act.classList.toggle('lack', !!why);
        D.setText(N.why, why ? Su.whyText(S, why) : '');
      }
    },

    /* ── 主线走完了一步：念一段话。自动快进和脚本玩家操作时只飘一行字 ── */
    onStep(e) {
      const ST = TC.data.story, app = TC.app, S = app.S;
      const idx = ST.steps.findIndex(x => x.id === e.id), s = ST.steps[idx], next = ST.steps[idx + 1];
      TC.sfx.play('good');
      if (app.quiet || TC.main.bot) { app.toast('主线：' + s.text + ' ✓', 'good'); return; }
      app.remember('主线：' + s.text + ' ✓', 'good');
      const rows = [];
      if (next && e.chapterDone) rows.push(['接下来', Su.chapterTitle(next.ch)]);
      if (next) rows.push(['下一步', next.text]);
      const choose = next && next.act && next.act.ending && S.story.step === idx + 1;       // 到了拂晓：可以直接去选
      TC.dialog.show({
        id: 'story',
        queue: true,
        title: e.chapterDone ? Su.chapterTitle(s.ch) + '　完' : '主线',
        lines: s.say ? [s.say] : [],
        rows,
        buttons: choose
          ? [{ label: '做出选择', primary: true, id: 'story-choose', onclick: () => Su.showChoice() }, { label: '先看看', id: 'story-ok' }]
          : [{ label: '好', primary: true, id: 'story-ok' }],
      });
    },

    /* ── 到了拂晓：三种结局里选一种 ── */
    showChoice() {
      const ST = TC.data.story, app = TC.app, S = app.S, C = app.C;
      const s = TC.story.cur(S);
      if (!s || !s.act || !s.act.ending) return;
      const why = TC.story.canAct(S, C);
      if (why) { TC.sfx.play('deny'); app.toast(Su.whyText(S, why), 'bad', true); return; }
      const buttons = ST.endingOrder.map(id => {
        const e = ST.endings[id], miss = e.ok(S, C);
        return {
          label: e.name, note: miss ? e.desc + '（' + miss + '）' : e.desc, disabled: !!miss, id: 'ending-' + id,
          onclick: () => { app.queue.push({ type: 'ending', id }); app.flush(); },
        };
      });
      buttons.push({ label: '再想想', id: 'ending-later' });
      TC.dialog.show({
        id: 'choice',
        title: '拂晓',
        lines: ['浮城停在拂晓的外海。岸上的人在招手，船上的人都看着你：往后怎么办？', '选了就定了。选完以后这座浮城还可以接着经营。'],
        stack: true,
        buttons,
      });
    },

    /* 这一局的数字：[[名称, 数值]…] */
    statRows(S, C) {
      const st = S.stats, rows = [];
      let built = 0;
      for (const k in st.built) built += st.built[k];
      rows.push(['历时', TC.clock.day(S) + ' 天']);
      rows.push(['城镇等级', S.progress.level + ' 级 · ' + TC.progress.levelName(S) + '（繁荣 ' + S.progress.prosperity + '）']);
      rows.push(['居民', S.residents.length + ' 人（收留 ' + (st.rescued || 0) + ' 人' + (st.specs ? '，其中专家 ' + st.specs + ' 位' : '') + '）']);
      rows.push(['航行', S.voyage.legs + ' 段']);
      rows.push(['打捞', st.picked + ' 件' + (st.boat ? '，小船带回 ' + st.boat + ' 份' : '')]);
      rows.push(['浮城', C.deckN + ' 格平台，建成 ' + built + ' 座建筑']);
      if (TC.tech.count(S)) rows.push(['技术', '掌握 ' + TC.tech.count(S) + ' 项']);
      if (st.storms) rows.push(['风暴', '扛过 ' + st.storms + ' 场' + (st.tilesLost ? '，碎了 ' + st.tilesLost + ' 格平台' : '，一格没碎')]);
      if (st.raids || st.paid) rows.push(['海盗', '来过 ' + (st.raids + st.paid) + ' 回' + (st.repelled ? '，打跑 ' + st.repelled + ' 回' : '')]);
      if (st.sharks) rows.push(['鲨鱼', '射死 ' + st.sharks + ' 条']);
      if (st.bought || st.sold) rows.push(['买卖', '买进 ' + st.bought + ' 份，卖出 ' + st.sold + ' 份；经手 ' + (st.coinIn + st.coinOut) + ' 旧币']);
      if (st.gifts || st.sieges || TC.faction.tier(S, 'tide') || TC.faction.tier(S, 'guild')) rows.push(['势力', TC.data.factionOrder.map(k => TC.data.factions[k].name + ' ' + TC.faction.tierName(TC.faction.tier(S, k))).join('，') + (st.sieges ? '；攻打据点 ' + st.sieges + ' 回，拔掉 ' + st.forts + ' 处' : '')]);
      if (st.bossTries) rows.push(['Boss', TC.boss.wins(S) ? '打赢 ' + TC.data.bossOrder.filter(k => st.bosses[k] !== undefined).map(k => TC.data.bosses[k].short).join('、') : '引出来 ' + st.bossTries + ' 回，还没打赢过']);
      if (S.skills.got) rows.push(['技能', '学了 ' + TC.skill.spent(S) + ' 级（得过 ' + S.skills.got + ' 点）']);
      if (st.deaths || st.left) rows.push(['离开的人', (st.deaths ? '逝去 ' + st.deaths + ' 人' : '') + (st.deaths && st.left ? '，' : '') + (st.left ? '出走 ' + st.left + ' 人' : '')]);
      rows.push(['难度', TC.data.balance.diff[S.opts.diff].name]);
      return rows;
    },

    /* ── 结局画面 ── */
    showEnding(id) {
      const e = TC.data.story.endings[id], app = TC.app;
      TC.sfx.play('good');
      if (app.quiet || TC.main.bot) { app.toast('结局：' + e.name, 'good'); return; }
      app.remember('结局：' + e.name, 'good');
      TC.chartui.close();
      TC.dialog.show({
        id: 'ending',
        wide: true,
        title: '结局 · ' + e.name,
        lines: e.say,
        rows: Su.statRows(app.S, app.C),
        stack: true,
        buttons: [
          { label: '接着经营', note: '当沙盒玩下去', primary: true, id: 'ending-continue' },
          { label: '新开一局', note: '换一片海重新来', id: 'ending-new', onclick: () => app.newGame() },
        ],
      });
    },

    showStats() {
      const app = TC.app, S = app.S;
      TC.dialog.show({
        id: 'stats',
        wide: true,
        title: '这一局',
        lines: [S.story.ending ? '结局：' + TC.data.story.endings[S.story.ending].name : '主线走到了“' + Su.chapterTitle(TC.story.chapter(S)) + '”'],
        rows: Su.statRows(S, app.C),
        buttons: [{ label: '好', primary: true, id: 'stats-ok' }],
      });
    },
  };

  TC.panel.register('story', { title: '主线', open: Su.open, update: Su.update });
})(globalThis.TC = globalThis.TC || {});

<script>
/* 帮助面板（怎么玩，分几小节，每节两三句话）和消息记录面板（飘过的提示都留在这儿，新的在上） */
(function (TC) {
  'use strict';

  const SECTIONS = [
    ['怎么开始', [
      '点一下漂到附近的东西，居民会把它钩回来。左上角的心愿告诉你下一步做什么；照着做，浮城会一级一级升上去，解锁更多建筑。',
      '飘过去的提示没看清？菜单里的“消息记录”都留着。',
    ]],
    ['吃、喝、睡', [
      '每个人都要吃饭、喝水、睡觉。先搭雨水桶、钓鱼台、篝火灶和蒸馏器，再给每人一张床；人多了就多搭几座。',
      '顶栏的数字变红，就是那样东西告急了。',
    ]],
    ['居民', [
      '居民自己找活干，有活就不会闲着。点一个人，看他的状态、特质和心情从哪来；点一座建筑，可以指定专人、调高调低它的优先级。',
      '吃得好、住得好、有装饰、收工后有地方歇息，心情就好；心情长期太低的人会离开。',
    ]],
    ['加工和仓储', [
      '锯木台、编绳架、压塑机、铁匠炉把捞来的东西做成材料。点顶栏的物资打开仓储，可以调每样加工品做到多少就停手。',
      '东西放不下会丢掉：多搭物资堆和仓库。露天的物资堆风暴里会被冲走，仓库不怕。',
    ]],
    ['航行', [
      '这片海迟早会捞空。造好船舵和风帆，打开海图，选一个相邻的地点起航。城越大越慢，帆越多越快；逆风慢，没风时帆使不上劲。',
      '到了新地方，沉船、废墟、小岛要划小船过去：搭一座小船坞，点一下远处的去处，看小船在忙什么。',
    ]],
    ['研究和专家', [
      '旧世界资料在沉船、废墟、信号塔里，也能跟商船换。在研究台上用它解锁新技术。',
      '海图上有求救火光的地方能接回专家，他们各有专长，还各有一桩心愿。',
    ]],
    ['风暴、鲨鱼和海盗', [
      '风暴会打碎边上的木筏板、冲走露天的物资、伤到没进屋的人。瞭望塔能提早知道；防浪板护住边缘；敲警钟让大家进屋。打坏的平台要留些材料修补。',
      '鱼叉架有人值守就会射鲨鱼和海盗船。海盗开口要东西时，给不给由你。',
    ]],
    ['买卖', [
      '商船、浮村、送过补给以后的灯塔都有集市，海图上带一枚铜钱的就是。把多余的东西卖成旧币，再买紧缺的。',
      '各片海贵贱不同：垃圾海浮木便宜，城区电子废件便宜，礁海鱼和海藻便宜；价钱天天变。4 级以后可以搭贸易站，行商隔两三天上门一趟。',
    ]],
    ['技能点和 Boss', [
      '城镇每升一级、主线每走完一章、每打赢一个 Boss，各得 1 点技能点。点底栏的“技能”，把它加在全城的加成上；点不满，得挑。',
      '沉没之城、礁海、风暴带各潜伏着一个大家伙，海图上有骷髅标记。到了那儿点它看底细，备好鱼叉架再“引它出来”；打不过它自己会退走。不想打，绕开就是。',
    ]],
    ['势力和战船', [
      '海上有三家：潮民（住浮村）、行商会（商船和上门的行商）、黑帆帮（海盗）。在他们的集市做买卖、停在他们旁边送礼（东西和旧币都行）、救人、打沉海盗船，好感都会涨；到 30 是友好，到 60 结成同盟，各有好处。点底栏的“势力”看眼下的交情。',
      '4 级以后可以搭战船坞，每座一条战船。海盗、Boss 来了，有人操船它就自己出港迎战，不用操作；打坏了回港修一阵。',
      '沉没之城、礁海、风暴带各有一处海盗的据点，海图上有黑旗标记。停到旁边点它，“攻打据点”：三条战船差不多够，或者两条再加潮民助战。拔掉以后，那片海的海盗少一大半。不理它也能通关。',
    ]],
    ['主线', [
      '修好电台，循着信标一路向东：垃圾海、沉没之城、礁海、风暴带，最后是拂晓。点左上角“主线”那一行，看眼下该做什么。',
      '到了拂晓有三种结局。选完以后，这座浮城还可以接着经营。',
    ]],
  ];

  const KEYS = '快捷键：空格暂停，1、2、3 变速；B 建造，P 居民，C 仓储，R 研究，K 技能，F 势力，T 集市，M 海图，J 主线，L 消息记录；H 回到浮城，+ 和 − 缩放，Esc 关闭面板或取消放置。';

  TC.helpui = {
    open(body) {
      const el = TC.dom.el, phone = TC.app.layout === 'phone';
      for (const [title, paras] of SECTIONS) {
        body.append(el('h4', { text: title }));
        for (const p of paras) body.append(el('p', { text: p }));
      }
      body.append(el('h4', { text: '操作' }));
      body.append(el('p', { text: phone
        ? '轻触漂浮物把它捞上来；单指拖动移动视野，双指捏合缩放；点建筑或居民看详情。放建筑时点哪儿虚影就移到哪儿，再按“确认”。'
        : '点击漂浮物把它捞上来；拖动或 WASD 移动视野，滚轮缩放；点建筑或居民看详情。拿着木筏板按住左键拖，可以一路铺过去。' }));
      if (!phone) body.append(el('p', { class: 'note', text: KEYS }));
      body.append(el('h4', { text: '存档' }));
      body.append(el('p', { text: '每分钟、每天清晨、到达新地点和切到后台时自动保存在这个浏览器里。换设备，或者想保险一点，用菜单里的“导出存档”。' }));
    },
  };

  TC.panel.register('help', { title: '帮助', open: TC.helpui.open });

  const Lg = TC.logui = {
    body: null,
    ver: -1,

    open(body) {
      Lg.body = body;
      Lg.ver = -1;
    },

    update() {
      const app = TC.app, el = TC.dom.el;
      if (Lg.ver === app.logVer) return;
      Lg.ver = app.logVer;
      Lg.body.replaceChildren();
      if (!app.log.length) { Lg.body.append(el('p', { class: 'note', text: '还没有消息。飘过的提示都会留在这里，方便回头看。' })); return; }
      let day = -1;
      for (let i = app.log.length - 1; i >= 0; i--) {
        const m = app.log[i];
        if (m.day !== day) { day = m.day; Lg.body.append(el('h4', { text: '第 ' + day + ' 天' })); }
        Lg.body.append(el('div', { class: 'logrow' + (m.kind ? ' ' + m.kind : '') }, [el('span', { class: 'at', text: m.at }), el('span', { text: m.text })]));
      }
    },
  };

  TC.panel.register('log', { title: '消息记录', open: Lg.open, update: Lg.update });
})(globalThis.TC = globalThis.TC || {});
