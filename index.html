<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>潮汐浮城</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="像素风海上生存经营游戏：从一块木筏起步，打捞漂浮物、扩建、航行，把它变成一座浮城。">
<style>
/* 布局：全屏像素海面画布铺满视口；界面浮在画布上，电脑是顶栏加右侧栏，手机是顶栏加底部抽屉。
   只有一套深色外观（夜航的船舱配色），所以不分明暗主题。 */
:root {
  --ink: #181425;      /* 描边、最深的底 */
  --panel: #262b44;    /* 面板底色 */
  --panel2: #3a4466;   /* 按钮、凸起的面 */
  --line: #5a6988;     /* 分隔线、次要描边 */
  --text: #ead4aa;     /* 正文：旧纸色 */
  --text2: #c0cbdc;    /* 次要文字 */
  --mute: #8b9bb4;     /* 说明、禁用 */
  --accent: #feae34;   /* 强调：灯火的琥珀色 */
  --good: #63c74d;
  --warn: #f77622;
  --bad: #e43b44;
  --sea: #124e89;      /* 画布还没画出来时的海色 */
  --font: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --num: ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--sea);
}

body {
  color: var(--text);
  font: 14px/1.45 var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* 舞台固定铺满视口，页面本身永不滚动 */
#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--sea);
  touch-action: none;
}

#world {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  outline: none;
}

/* 界面层：自身不接收指针，子元素接收；四边让出安全区和侧边留白 */
#ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}

#ui > * { pointer-events: auto; }

.px { image-rendering: pixelated; image-rendering: crisp-edges; }

button {
  font: inherit;
  color: inherit;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
  margin: 0;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* 顶栏（物资、时钟、变速）、底栏（建造、居民、菜单）、心愿栏、飘字提示 */
.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 4px 10px;
  padding-top: 8px;
}

.res, .ctl {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  min-width: 0;
}

.ctl { margin-left: auto; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 28px;
  padding: 0 7px 0 3px;
  box-sizing: border-box;
  background: rgba(24, 20, 37, 0.86);
  border: 2px solid var(--ink);
  box-shadow: inset 0 0 0 1px rgba(90, 105, 136, 0.55);
  color: var(--text);
  font-weight: 700;
  font-family: var(--num);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.chip img { flex: none; }
.res .chip { cursor: pointer; }
.chip.plain { padding: 0 8px 0 4px; font-family: var(--font); font-weight: 600; }
.chip.full b { color: var(--accent); }
.chip.low b { color: var(--bad); }
.chip.sep { margin-left: 6px; }
.chip.gain { animation: chip-gain 0.35s steps(3); }
@keyframes chip-gain {
  0% { background: var(--accent); color: var(--ink); }
  100% { background: rgba(24, 20, 37, 0.86); }
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 34px;
  height: 28px;
  padding: 0 8px;
  box-sizing: border-box;
  background: var(--panel2);
  border: 2px solid var(--ink);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.14), inset 0 -3px 0 rgba(0, 0, 0, 0.28);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.btn:active { transform: translateY(1px); box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.25); }
.btn.on { background: var(--accent); color: var(--ink); }
.btn.on img { filter: brightness(0.12); }
.btn.off img { opacity: 0.35; }
.btn.primary { background: var(--accent); color: var(--ink); }
.btn.danger { background: #7a2632; }
.btn[disabled] { color: var(--mute); cursor: default; filter: saturate(0.4) brightness(0.8); }
.btn.wide { width: 100%; height: 36px; justify-content: flex-start; padding: 0 10px; }

.speed { display: inline-flex; }
.speed .btn + .btn { margin-left: -2px; }

/* 顶栏下面的中间区域：心愿栏、面板、放置提示都浮在这里 */
.mid {
  position: relative;
  flex: 1;
  min-height: 0;
  pointer-events: none !important;
}

.mid > * { pointer-events: auto; }

/* 心愿栏 */
.tracker {
  position: absolute;
  left: 0;
  top: 8px;
  width: min(300px, 78%);
  display: flex;
  flex-direction: column;
  gap: 4px;
  pointer-events: none !important;
}

.wish {
  padding: 5px 8px 6px;
  background: rgba(24, 20, 37, 0.82);
  border: 2px solid var(--ink);
  box-shadow: inset 3px 0 0 var(--accent);
  color: var(--text);
}

.wish .row { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
.wish.level {
  display: block;
  width: 100%;
  box-sizing: border-box;
  box-shadow: inset 3px 0 0 var(--good);
  font: inherit;
  text-align: left;
  border-radius: 0;
  cursor: pointer;
  pointer-events: auto;
}
.wish.level .track, .wish.level .fill { display: block; }
.tracker.folded .wishes { display: none; }
.tracker.folded .wish.level .num::after { content: ' ▸'; }
.wish.level .fill { background: var(--good); }
.wish.danger { box-shadow: inset 3px 0 0 #e43b44; color: #ffb3b6; animation: danger 1s steps(2) infinite; }
@keyframes danger { 0% { background: rgba(60, 14, 30, 0.9); } 100% { background: rgba(24, 20, 37, 0.82); } }
.wish.voyage { box-shadow: inset 3px 0 0 #2ce8f5; }
.wish.voyage .fill { background: #2ce8f5; }
.wish.voyage .num { color: #2ce8f5; }
.wish.level .num { color: var(--good); }
.wishes { display: flex; flex-direction: column; gap: 4px; }
.wish .num { font-family: var(--num); font-variant-numeric: tabular-nums; color: var(--accent); flex: none; }
.wish .hint2 { margin-top: 2px; color: var(--text2); font-size: 12px; line-height: 1.35; }
.wish .track { margin-top: 4px; height: 4px; background: var(--panel2); }
.wish .fill { height: 100%; background: var(--accent); width: 0; }
.wish.done { animation: wish-done 0.6s steps(4); }
@keyframes wish-done { 0% { background: var(--good); } 100% { background: rgba(24, 20, 37, 0.82); } }

/* 底栏 */
.bottombar {
  display: flex;
  gap: 6px;
  padding: 6px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  margin-bottom: calc(0px - env(safe-area-inset-bottom, 0px));
}

.bottombar .btn { height: 36px; min-width: 84px; }
[data-layout="phone"] .bottombar .btn { flex: 1; height: 44px; min-width: 0; padding: 0 4px; gap: 4px; }

/* 放置建筑时的提示条 */
.placebar {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  box-sizing: border-box;
  padding: 6px 8px;
  background: rgba(24, 20, 37, 0.92);
  border: 2px solid var(--ink);
  box-shadow: inset 0 0 0 1px var(--line);
}

.placebar .msg { min-width: 0; line-height: 1.3; }
.placebar .msg b { color: var(--accent); }
.placebar .msg .bad { color: var(--bad); }
.placebar .btn { flex: none; height: 36px; }

/* 手机：按钮够一个指头大，顶栏更紧凑 */
[data-layout="phone"] .btn { height: 36px; min-width: 38px; }
[data-layout="phone"] .chip { height: 26px; padding: 0 5px 0 2px; font-size: 13px; }
[data-layout="phone"] .chip img { width: 20px; height: 20px; }
[data-layout="phone"] .chip.plain { height: 36px; padding: 0 7px 0 4px; }
[data-layout="phone"] .chip.plain img { width: 24px; height: 24px; }
[data-layout="phone"] .ctl { width: 100%; justify-content: space-between; flex-wrap: nowrap; }
[data-layout="phone"] .ctl .btn { min-width: 34px; padding: 0 5px; }
[data-layout="phone"] .ctl .chip.plain { padding: 0 5px 0 3px; }
[data-layout="phone"] #btn-sound { display: none; }
[data-layout="phone"] .tracker { width: min(260px, 70%); }
[data-layout="phone"] .wish .hint2 { display: none; }
[data-layout="phone"] .wish:first-child .hint2 { display: block; }

/* 飘字提示 */
.toasts {
  position: absolute;
  left: 50%;
  bottom: 56px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  gap: 4px;
  width: min(100%, 420px);
  pointer-events: none !important;
}

.toast {
  padding: 5px 10px;
  background: rgba(24, 20, 37, 0.92);
  border: 2px solid var(--ink);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--text);
  text-align: center;
  animation: toast-in 0.18s steps(3);
}

.toast.bad { color: #ff8a8f; }
.toast.good { color: var(--good); }
@keyframes toast-in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

/* 心愿栏上“主线”那一行：点一下打开主线面板 */
.wish.story {
  display: block;
  width: 100%;
  box-sizing: border-box;
  box-shadow: inset 3px 0 0 #f77622;
  font: inherit;
  text-align: left;
  border-radius: 0;
  cursor: pointer;
  pointer-events: auto;
}
.wish.story .head { color: #f9a05c; font-size: 12px; letter-spacing: 0.04em; }
.wish.story .num { color: #f9a05c; }
.wish.story .goal { display: block; margin-top: 1px; font-weight: 700; line-height: 1.35; }
.wish.story.ready { animation: story-ready 1.2s steps(2) infinite; }
@keyframes story-ready { 0% { background: rgba(92, 48, 18, 0.92); } 100% { background: rgba(24, 20, 37, 0.82); } }
[data-layout="phone"] .wish.story .row { display: none; }
[data-layout="phone"] .wish.story .goal { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[data-layout="phone"] .wish.story .goal::before { content: '主线 ▸ '; color: #f9a05c; font-weight: 400; }

/* 心愿栏再长也不盖住底栏 */
.tracker { max-height: calc(100% - 10px); overflow: hidden; }

/* 矮屏（横着拿的手机）：心愿栏收紧，只留两条心愿、不带说明，主线压成一行；面板尽量高一些 */
[data-short="1"] .tracker { width: min(250px, 46%); gap: 3px; top: 4px; max-height: calc(100% - 6px); }
[data-short="1"] .wish { padding: 3px 8px 4px; }
[data-short="1"] .wish .hint2 { display: none; }
[data-short="1"] .wishes .wish:nth-child(n+3) { display: none; }
[data-short="1"] .wish.story .row { display: none; }
[data-short="1"] .wish.story .goal { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[data-short="1"] .wish.story .goal::before { content: '主线 ▸ '; color: #f9a05c; font-weight: 400; }
[data-short="1"] .topbar { padding-top: 4px; }
[data-short="1"] .bottombar { padding-top: 4px; }
[data-short="1"][data-layout="desktop"] .panel { top: 2px; max-height: calc(100% - 4px); width: 300px; }

/* 小屏手机：心愿只摆两条，给画面多留些地方 */
@media (max-height: 640px) {
  [data-layout="phone"] .wishes .wish:nth-child(n+3) { display: none; }
}

/* 底栏按钮上的小数字（没花的技能点） */
.btn .badge { min-width: 16px; height: 16px; padding: 0 3px; box-sizing: border-box; background: var(--accent); color: var(--ink); font-family: var(--num); font-size: 11px; line-height: 16px; text-align: center; }
[data-layout="phone"] .bottombar .btn { font-size: 13px; position: relative; }
/* 手机上六个按钮挤在一排：数字挂在按钮右上角，不占字的地方；再窄的屏幕就不画图标 */
[data-layout="phone"] .bottombar .btn .badge { position: absolute; top: -5px; right: 0; }
@media (max-width: 379px) { [data-layout="phone"] .bottombar .btn img, [data-layout="phone"] .bottombar .btn canvas { display: none; } }

/* 面板：电脑上是右侧栏，手机上是从底部升起的抽屉。同一套内容，两种摆法。 */
.panel {
  position: absolute;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  background: var(--panel);
  border: 2px solid var(--ink);
  box-shadow: inset 0 0 0 2px var(--panel2), 0 3px 0 rgba(0, 0, 0, 0.35);
  color: var(--text);
}

[data-layout="desktop"] .panel {
  right: 0;
  top: 8px;
  width: 330px;
  max-height: calc(100% - 16px);
}

[data-layout="phone"] .panel {
  left: -8px;
  right: -8px;
  bottom: 0;
  max-height: 58%;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex: none;
  padding: 6px 6px 6px 10px;
  background: var(--panel2);
  border-bottom: 2px solid var(--ink);
  font-weight: 700;
}

.panel-head .btn { min-width: 32px; height: 28px; padding: 0 6px; }

.panel-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  padding: 8px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.panel p { margin: 0; color: var(--text2); line-height: 1.5; }
.panel h4 { margin: 6px 0 0; font-size: 13px; color: var(--mute); font-weight: 700; letter-spacing: 0.06em; }
.panel .note { color: var(--mute); font-size: 12px; }
.panel .warn { color: #ff8a8f; }

/* 建造菜单里的一行 */
.item {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 2px 8px;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
  padding: 6px 8px;
  text-align: left;
  background: rgba(24, 20, 37, 0.5);
  border: 2px solid var(--ink);
  color: var(--text);
  cursor: pointer;
}

.item:hover { background: rgba(58, 68, 102, 0.6); }
.item.sel { border-color: var(--accent); background: rgba(58, 68, 102, 0.75); }
.item.lack { cursor: default; }
.item.lack .name, .item.lack .desc { color: var(--mute); }
.item .pic { grid-row: 1 / span 2; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.item .top { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.item .name { font-weight: 700; }
.item .desc { color: var(--text2); font-size: 12px; line-height: 1.35; }

.cost { display: inline-flex; flex-wrap: wrap; gap: 2px 6px; justify-content: flex-end; }
.cost span { display: inline-flex; align-items: center; gap: 1px; font-family: var(--num); font-weight: 700; font-size: 13px; }
.cost img { width: 18px; height: 18px; }
.cost .lack { color: #ff8a8f; }

/* 居民名册 */
.person {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 2px 8px;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
  padding: 6px 8px;
  text-align: left;
  background: rgba(24, 20, 37, 0.5);
  border: 2px solid var(--ink);
  color: var(--text);
  cursor: pointer;
}

.person.sel { border-color: var(--accent); }
.person .pic { grid-row: 1 / span 2; display: flex; justify-content: center; }
.person .top { display: flex; justify-content: space-between; gap: 6px; }
.person .name { font-weight: 700; }
.person .name .tr { margin-left: 6px; color: var(--mute); font-size: 12px; font-weight: 400; font-style: normal; }
.person .doing { color: var(--text2); font-size: 12px; }
.bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.bar { height: 6px; background: var(--ink); position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); }
.bar.mid i { background: var(--accent); }
.bar.low i { background: var(--bad); }

/* 详情面板里“名称 数值”的行 */
.kv { display: flex; justify-content: space-between; gap: 10px; }
.kv span:first-child { color: var(--mute); flex: none; }
.kv span:last-child { text-align: right; min-width: 0; }
.stat { display: grid; grid-template-columns: 22px 44px 1fr 40px; gap: 6px; align-items: center; }
.stat img { width: 18px; height: 18px; }
.stat .bar { height: 8px; }
.stat .val { font-family: var(--num); font-variant-numeric: tabular-nums; text-align: right; }

.rowbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.rowbtns .btn { flex: 1; height: 36px; }

textarea.savebox {
  width: 100%;
  min-height: 84px;
  box-sizing: border-box;
  resize: vertical;
  background: var(--ink);
  color: var(--text2);
  border: 2px solid var(--line);
  border-radius: 0;
  font: 12px/1.4 var(--num);
  padding: 6px;
  -webkit-user-select: text;
  user-select: text;
  word-break: break-all;
}

.info {
  color: var(--text2);
  font: 12px/1.6 var(--num);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  -webkit-user-select: text;
  user-select: text;
}

/* 弹窗：开场、结束 */
.modal {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(10, 14, 30, 0.62);
  pointer-events: auto;
  z-index: 5;
}

.modal .card {
  width: min(100%, 420px);
  max-height: 100%;
  overflow-y: auto;
  box-sizing: border-box;
  padding: 16px 18px 18px;
  background: var(--panel);
  border: 2px solid var(--ink);
  box-shadow: inset 0 0 0 2px var(--panel2), 0 4px 0 rgba(0, 0, 0, 0.4);
}

.modal h2 { margin: 0 0 10px; font-size: 20px; color: var(--accent); letter-spacing: 0.08em; text-wrap: balance; }
.modal p { margin: 0 0 8px; color: var(--text); line-height: 1.6; }
.modal .kv { color: var(--text2); }
.modal .rowbtns { margin-top: 14px; }
.modal .rowbtns .btn { height: 40px; }

/* 仓储面板的一行：图标、名字、数量，（加工品）库存目标的加减 */
.stockrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; min-height: 28px; }
.stockrow.has-target { grid-template-columns: 22px 1fr auto auto; }
.stockrow img { width: 18px; height: 18px; }
.stockrow .val { font-family: var(--num); font-variant-numeric: tabular-nums; text-align: right; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper .btn { min-width: 30px; height: 28px; padding: 0; }
.stepper .tnum { min-width: 52px; text-align: center; color: var(--text2); font-size: 12px; font-family: var(--num); }

.item .new { margin-left: 6px; padding: 0 4px; background: var(--accent); color: var(--ink); font-style: normal; font-size: 11px; font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { padding: 1px 6px; background: var(--panel2); border: 2px solid var(--ink); font-size: 12px; white-space: nowrap; }
.tag.good { color: var(--good); }
.tag.bad { color: #ff8a8f; }

<script>
/* 随机数：几条带种子的随机流，状态存在 S.rng 里（会进存档）。
 * 同一种子加同一串命令，结果完全一致。 */
(function (TC) {
  'use strict';

  const STREAMS = ['sea', 'weather', 'ai', 'event', 'threat', 'loot'];

  function hash32(a, b) {
    let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return h >>> 0;
  }

  const R = TC.rng = {
    STREAMS,
    hash32,

    /* 无状态噪声：同样的输入永远得到同样的 [0,1) */
    hash01(x, y, s) { return hash32(hash32(x, y), s | 0) / 4294967296; },

    seed(seed) {
      const o = {};
      for (let i = 0; i < STREAMS.length; i++) o[STREAMS[i]] = hash32(seed, i + 1) | 0;
      return o;
    },

    /* 从 S.rng[st] 这条流取下一个 [0,1) */
    next(S, st) {
      const a = (S.rng[st] + 0x6D2B79F5) | 0;
      S.rng[st] = a;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },

    int(S, st, a, b) { return a + Math.floor(R.next(S, st) * (b - a + 1)); },
    chance(S, st, p) { return R.next(S, st) < p; },
    pick(S, st, arr) { return arr[Math.floor(R.next(S, st) * arr.length)]; },

    /* list: [[值, 权重], ...] */
    wpick(S, st, list) {
      let total = 0;
      for (let i = 0; i < list.length; i++) total += list[i][1] > 0 ? list[i][1] : 0;
      if (total <= 0) return null;
      let r = R.next(S, st) * total;
      for (let i = 0; i < list.length; i++) {
        const w = list[i][1] > 0 ? list[i][1] : 0;
        r -= w;
        if (r < 0) return list[i][0];
      }
      return list[list.length - 1][0];
    },

    shuffle(S, st, arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(R.next(S, st) * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    },

    /* 不进存档的本地随机数（海图生成等一次性用途） */
    local(seed) {
      const box = { rng: { x: hash32(seed, 977) | 0 } };
      const f = () => R.next(box, 'x');
      f.int = (a, b) => a + Math.floor(f() * (b - a + 1));
      f.pick = arr => arr[Math.floor(f() * arr.length)];
      f.chance = p => f() < p;
      return f;
    },
  };

/* 配方：in 投入、out 产出、work 一批需要人干的工作量（步）。
 *   wait   ：人干完之后还要自己放着等多少步才出成品（晾晒、生长）
 *   skill  ：哪一类手艺（fish 钓鱼、cook 烹饪、craft 加工、farm 种植），有相应特质的人干得快
 *   needsWater：建筑必须挨着水
 * 居民会根据库存自己判断要不要做：

<script>
/* 主线：五章，一步一步来。每一步要么是“做到了自动算数”，要么是“玩家在主线面板里点一下去做”。
 *   val / need：做到这个数就算完成；at(S, C)：到过某个地方就算完成（去过就算，不必还停在那儿）；flag：别的系统立了这面旗就算完成；
 *   act：要玩家动手的一步（cost 要交的东西；where 要在哪种地点才能做；ending 表示这是最后的抉择）
 *   say：完成时的一段话；pros：完成时得到的繁荣度 */
(function (TC) {
  'use strict';

  const here = S => S.chart.nodes[S.voyage.at];
  const moored = S => S.voyage.to < 0;
  /* 到过这样的地点没有 */
  const been = (S, f) => {
    const ns = S.chart.nodes;
    for (let i = 0; i < ns.length; i++) if (ns[i].visited && f(ns[i])) return true;
    return false;
  };

  TC.data.story = {
    chapters: ['', '起航', '沉没之城', '守灯人', '风暴带', '拂晓'],

    steps: [
      // ── 第一章：起航
      {
        id: 'radio', ch: 1, text: '修好手摇电台', hint: '木筏上有一台泡过水的手摇电台。修好它要电子废件 3、废铁 2',
        act: { cost: { ewaste: 3, scrap: 2 }, label: '动手修' },
        say: '摇了半天，电台里先是一阵沙沙声，接着断断续续传来一个声音：“……这里是拂晓……一直向东……这里的地是干的……”　原来东边还有没被淹掉的地方。',
      },
      { id: 'helm', ch: 1, text: '造一座船舵', hint: '建造 → 航行。要升到 2 级', val: S => S.stats.built.helm || 0, need: 1, say: '舵装上了。这块木筏头一回像一条船。' },
      { id: 'sail', ch: 1, text: '竖一根风帆桅杆', hint: '没有帆只能慢慢划', val: S => S.stats.built.sail || 0, need: 1, say: '帆升起来的时候，所有人都仰着头看了很久。' },
      {
        id: 'leave', ch: 1, text: '驶离垃圾海', hint: '打开海图，一路向东，驶进“沉没之城”', at: S => been(S, n => n.region >= 1),
        say: '垃圾海落在了身后。水面上开始冒出楼顶：一整座城市沉在脚下。电台里的信标声清楚了一些，像是从哪座高塔上发出来的。',

      {
        id: 'core', ch: 2, text: '潜进机房，取回信标的芯子', hint: '要有小船坞和潜水架。潜水架要先研究“潜水”，或者救回潜水员', flag: 'core',
        say: '芯子捞上来了，巴掌大的一块，还带着水。机修的人看了半天说：这东西记着拂晓的位置，可要过礁海、穿风暴带——得先找到认路的人。',
      },
      // ── 第三章：守灯人
      { id: 'lighthouse', ch: 3, text: '穿过礁海，找到孤岛灯塔', hint: '海图上礁海尽头的那座灯塔', at: S => been(S, n => n.kind === 'lighthouse'), say: '灯塔里真的还有人。守灯的老人隔着水喊：我认得去拂晓的路！可我的粮和水都见底了，你们先帮我一把。' },
      {
        id: 'supply', ch: 3, text: '给守灯人送去补给', hint: '鱼干 15、淡水 30、蔬菜 8。要停在孤岛灯塔',

        say: '老人把一卷发黄的海图塞过来：风暴带里哪里能停、哪里是海盗的窝，上面都标着。他还教了一手加固船体的法子，说：风暴带里没有小风暴，把边上护好，备足吃的喝的再进去。',

      { id: 'storm', ch: 4, text: '在风暴带里扛过一场大风暴', hint: '敲钟让大家进屋；边上的平台靠防浪板护着', flag: 'storm', say: '风停的时候天已经亮了。数了数人，一个不少。' },

      // ── 第五章：拂晓
      { id: 'ending', ch: 5, text: '决定这座浮城的去向', hint: '留下来、接着远航，还是点亮拂晓？三种去向各有各的条件', act: { ending: true, where: 'dawn', label: '做出选择' }, say: '' },
    ],

    /* 三种结局。ok(S, C) 返回 null 表示可以选，否则是还差什么 */
    endings: {
      settle: {
        name: '留下来', desc: '把浮城拴在岸边，上岸去，重新学着在土地上过日子。',
        ok: () => null,
        say: ['浮城最后一次收起了帆。大家踩上泥土的时候，有人蹲下来抓了一把，攥了很久。', '那块三格见方的木筏还留在城的正中间。孩子们后来管它叫“老家”。'],
      },
      voyage: {
        name: '带着种子继续远航', desc: '海上还有没找到路的人。装满种子和淡水，掉头再出发。要有种子 8 份、每人三天的存粮。',
        ok: S => ((S.stock.seed || 0) < 8 ? '种子还差 ' + (8 - (S.stock.seed || 0)) + ' 份' : TC.stock.foodDays(S) < S.residents.length * 3 ? '存粮不够每人吃三天' : null),
        say: ['在拂晓歇了三天，装满了种子、淡水和岸上的人送的树苗。第四天清晨，帆又升了起来。', '这一回不是逃难。浮城沿着来路往回走，每到一处就留下一箱种子和一张海图。'],
      },
      beacon: {
        name: '点亮拂晓', desc: '把浮城停在外海，架起灯，让每一个漂流的人都能循着光找过来。要繁荣度 420、亮着的探照灯和蓄电池。',
        ok: (S, C) => (S.progress.prosperity < 420 ? '繁荣度还差 ' + (420 - S.progress.prosperity) : !C.n.searchlight ? '要有一座探照灯' : !C.n.battery ? '要有一座蓄电池' : null),
        say: ['浮城没有靠岸。它停在风暴带的出口，把所有的灯都朝着西边打开。', '第一个夜晚，海平线上亮起了一点回应的火光。然后是第二点、第三点。'],
      },
    },
    endingOrder: ['settle', 'voyage', 'beacon'],
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/data/story.js
</script>

<script>
/* 海图生成：按种子生成一张分层的节点图，自西向东五片海域。
 * 每一层有 1–3 个地点，只和相邻两层的地点相连，所以怎么走都是一路向东，也总能走到头；
 * 信号塔、孤岛灯塔、拂晓各自独占一层，是必经之地。
 * 生成用的是不进存档的本地随机数，结果只取决于种子。
 *   地点：{id, kind, region, layer, x, y 海图上的坐标（里）, name, seen 0 没见过 / 1 只知道有 / 2 看清了,
 *          visited, budget 这片海各类物资还剩多少, total 初始总量, sites 这里的去处}
 *   去处：{id, kind, dir 在浮城的哪个方向（十六方位）, far 离浮城多远（格）, x, y 到了以后算出来的位置,
 *          left 划船能带回的东西还剩多少, deep 要潜水才拿得到的, surv 等人来接的人数, spec 其中的专家,
 *          fish / fishMax 礁盘里的鱼, deals 商船的买卖 [{give, get, left}], order 要不要派小船去；
 *          Boss 的去处另有 boss、hp、loot、dead、cool（见 sys_boss.js）} */
(function (TC) {
  'use strict';

  const W = TC.worldgen = {
    roll(rnd, range) { return rnd.int(range[0], range[1]); },

    rollMap(rnd, spec) {
      const o = {};
      for (const k in spec) { const n = W.roll(rnd, spec[k]); if (n > 0) o[k] = n; }
      return o;
    },

    site(rnd, node, kind, used) {
      const D = TC.data.world, def = D.sites[kind], far = TC.data.balance.voyage.siteFar;
      // 方向：十六方位里挑一个，和这个地点别的去处至少隔开两档
      let dir = 0;
      for (let tries = 0; tries < 40; tries++) {
        dir = rnd.int(0, 15);
        if (!used.some(u => Math.min((u - dir) & 15, (dir - u) & 15) < 3)) break;
      }
      used.push(dir);
      const s = { id: node.id * 10 + node.sites.length + 1, kind, dir, far: W.roll(rnd, far), x: 0, y: 0, left: W.rollMap(rnd, def.loot || {}), surv: def.surv ? W.roll(rnd, def.surv) : 0, spec: '', order: 1 };
      if (def.deep) s.deep = W.rollMap(rnd, def.deep);
      if (def.fish) { s.fishMax = W.roll(rnd, def.fish); s.fish = s.fishMax; }
      if (def.trade) {
        const pool = D.deals.slice(), n = W.roll(rnd, def.trade);
        s.deals = [];
        for (let i = 0; i < n && pool.length; i++) {
          const d = pool.splice(rnd.int(0, pool.length - 1), 1)[0];
          s.deals.push({ give: Object.assign({}, d.give), get: Object.assign({}, d.get), left: rnd.int(2, 3) });
        }
      }
      return s;
    },

    /* 在这个地点挑一个方向放新的去处：十六方位里离别的去处最远的那个（从 turn 数起，一样远就取先碰到的） */
    freeDir(node, turn) {
      let dir = turn, gap = -1;
      for (let k = 0; k < 16; k++) {
        const d = (turn + k) & 15;
        let near = 16;
        for (const s of node.sites) near = Math.min(near, (s.dir - d) & 15, (d - s.dir) & 15);
        if (near > gap) { gap = near; dir = d; }
      }
      return dir;
    },

    /* 海盗的据点：沉没之城、礁海、风暴带各一处。同样用单独的随机数；ok(node) 排除不能放的地点 */
    forts(seed, nodes, ok) {
      const rf = TC.rng.local((seed ^ 0xf0127) >>> 0), B = TC.data.balance.war, FIXED = { start: 1, tower: 1, lighthouse: 1, dawn: 1, merchant: 1 };
      for (let region = 1; region <= 3; region++) {
        const all = nodes.filter(n => n.region === region && !FIXED[n.kind] && n.sites.length < 6 && !n.sites.some(s => s.kind === 'fort' || s.kind === 'village') && (!ok || ok(n)));
        const den = all.filter(n => n.kind === 'den'), clear = all.filter(n => !n.sites.some(s => s.kind === 'boss'));
        const free = den.length ? den : clear.length ? clear : all;          // 有海盗窝点就安在窝点旁边；尽量不和 Boss 挤在一处
        const pick = rf.int(0, 999), turn = rf.int(0, 15), loot = W.rollMap(rf, B.fortLoot);
        if (!free.length) continue;
        const node = free[pick % free.length];
        node.sites.push({ id: node.id * 10 + node.sites.length + 1, kind: 'fort', dir: W.freeDir(node, turn), far: 12, x: 0, y: 0, left: {}, surv: 0, spec: '', order: 1,
          hp: B.fortHp, max: B.fortHp, loot, dead: 0, cool: 0 });
      }
    },

    /* 浮村：垃圾海、沉没之城、礁海各一处，靠在一个寻常的地点旁边。同样用单独的随机数；ok(node) 排除不能放的地点 */
    villages(seed, nodes, ok) {
      const rv = TC.rng.local((seed ^ 0x7ade5) >>> 0), FIXED = { start: 1, tower: 1, lighthouse: 1, dawn: 1, merchant: 1 }, ROUGH = { den: 1, works: 1 };
      for (let region = 0; region <= 2; region++) {
        const all = nodes.filter(n => n.region === region && !FIXED[n.kind] && n.sites.length < 6 && !n.sites.some(s => s.kind === 'village') && (!ok || ok(n)));
        // 先挑清静的地方；实在没有，才挨着工厂、海盗窝或者 Boss
        const calm = all.filter(n => !ROUGH[n.kind] && !n.sites.some(s => s.kind === 'boss')), free = calm.length ? calm : all;
        const pick = rv.int(0, 999), turn = rv.int(0, 15);
        if (!free.length) continue;
        const node = free[pick % free.length];
        node.sites.push({ id: node.id * 10 + node.sites.length + 1, kind: 'village', dir: W.freeDir(node, turn), far: 9, x: 0, y: 0, left: {}, surv: 0, spec: '', order: 0 });
      }
    },

    /* 集市和旧币：商船、灯塔、浮村各开一个集市；沉船的深舱和海盗的货堆里有些旧币。ok(node) 排除已经去过的地点（旧存档迁移时用） */
    markets(seed, nodes, ok) {
      const rm = TC.rng.local((seed ^ 0xc01d) >>> 0), KIND = { merchant: 'merchant', lighthouse: 'lighthouse', village: 'village' };
      for (const n of nodes) for (const s of n.sites) {
        if (KIND[s.kind] && !s.market) s.market = TC.market.make(KIND[s.kind], rm, 1);
        const coin = rm.int(8, 16), more = rm.int(30, 50);          // 不管用不用得上都掷，免得各处互相牵连
        if (ok && !ok(n)) continue;
        if (s.kind === 'wreck' && s.deep) s.deep.coin = coin;
        if (s.kind === 'den') s.left.coin = more;
      }
    },

    /* Boss：三片海域各一处，放在那片海域里一个寻常的地点旁边（优先它爱待的那几种）。
     * 用单独的随机数，不打乱原来的海图；ok(node) 用来排除不能放的地点（旧存档迁移时排除已经去过的） */
    bosses(seed, nodes, ok) {
      const rb = TC.rng.local((seed ^ 0xb055e5) >>> 0), D = TC.data, FIXED = { start: 1, tower: 1, lighthouse: 1, dawn: 1, merchant: 1 };
      for (const id of D.bossOrder) {
        const def = D.bosses[id];
        const free = nodes.filter(n => n.region === def.region && !FIXED[n.kind] && n.sites.length < 6 && !n.sites.some(s => s.kind === 'boss') && (!ok || ok(n)));
        const liked = free.filter(n => def.haunt.includes(n.kind)), cands = liked.length ? liked : free;
        const pick = rb.int(0, 999), turn = rb.int(0, 15);          // 不管有没有地方放都掷这两次，各个 Boss 的位置互不牵连
        if (!cands.length) continue;
        const node = cands[pick % cands.length], dir = W.freeDir(node, turn);
        node.sites.push({ id: node.id * 10 + node.sites.length + 1, kind: 'boss', boss: id, dir, far: 11, x: 0, y: 0, left: {}, surv: 0, spec: '', order: 1,
          hp: def.hp, loot: Object.assign(W.rollMap(rb, def.loot), def.coin ? { coin: def.coin } : {}), dead: 0, cool: 0 });
      }
    },

    make(seed) {
      const D = TC.data.world, rnd = TC.rng.local((seed ^ 0x5eac0de) >>> 0);
      const nodes = [], edges = [], layers = [];

      for (let li = 0; li < D.layers.length; li++) {
        const L = D.layers[li], region = L[0], n = rnd.int(L[2], L[3]), ids = [];
        const pool = D.regions[region].pool.slice();
        for (let s = 0; s < n; s++) {
          let kind = L[1];
          if (kind === 'pool') kind = pool.length ? pool.splice(rnd.int(0, pool.length - 1), 1)[0] : D.regions[region].pool[0];   // 同一层尽量不重样
          const def = D.kinds[kind];
          const node = {
            id: nodes.length, kind, region, layer: li,
            x: li * 100 + (n > 1 ? rnd.int(-16, 16) : 0),
            y: Math.round((s - (n - 1) / 2) * 66) + (n > 1 ? rnd.int(-12, 12) : 0),
            name: '', seen: 0, visited: 0,
            budget: W.rollMap(rnd, def.budget), total: null, sites: [],
          };
          node.total = Object.assign({}, node.budget);
          const used = [];
          for (const sp of def.sites) {
            const k = rnd.int(sp[1], sp[2]);
            for (let i = 0; i < k; i++) node.sites.push(W.site(rnd, node, sp[0], used));
          }
          node.used = used;
          nodes.push(node);
          ids.push(node.id);
        }
        layers.push(ids);
      }

      // 名字：同一种地点的名字不重复用
      const names = {};
      for (const node of nodes) {
        const def = D.kinds[node.kind];
        const list = names[node.kind] || (names[node.kind] = def.names.slice());
        node.name = list.length ? list.splice(rnd.int(0, list.length - 1), 1)[0] : def.name;
      }

      // 相邻两层连线：按上下位置对应着连，保证每个地点都有来路也有去路
      const link = (a, b) => {
        if (edges.some(e => e[0] === a && e[1] === b)) return;
        const dx = nodes[a].x - nodes[b].x, dy = nodes[a].y - nodes[b].y;
        edges.push([a, b, Math.round(Math.sqrt(dx * dx + dy * dy))]);
      };
      for (let li = 0; li + 1 < layers.length; li++) {
        const A = layers[li], B = layers[li + 1], pairs = [];
        const add = (i, j) => { pairs.push([i, j]); link(A[i], B[j]); };
        const crosses = (i, j) => pairs.some(p => (p[0] - i) * (p[1] - j) < 0);      // 和已有的航线交叉：海图上不好看
        for (let i = 0; i < A.length; i++) {
          if (A.length === 1) { for (let k = 0; k < B.length; k++) add(0, k); break; }
          add(i, Math.round(i * (B.length - 1) / (A.length - 1)));
        }
        for (let j = 0; j < B.length; j++) {
          if (pairs.some(p => p[1] === j)) continue;
          add(Math.round(j * (A.length - 1) / (B.length - 1)), j);
        }
        // 再随机添几条岔路
        for (let i = 0; i < A.length && A.length > 1 && B.length > 1; i++) {
          const base = Math.round(i * (B.length - 1) / (A.length - 1)), j = base + (rnd() < 0.5 ? 1 : -1);
          if (j < 0 || j >= B.length || rnd() > 0.6 || crosses(i, j) || pairs.some(p => p[0] === i && p[1] === j)) continue;
          add(i, j);
        }
      }

      // 专家：各自在指定的海域里等人来救（不放在起点，也尽量不挤在同一个地点）
      for (const id of TC.data.specOrder) {
        const sp = TC.data.specs[id];
        let cands = nodes.filter(n => n.region === sp.region && n.id !== 0 && !n.sites.some(s => s.spec));
        if (!cands.length) cands = nodes.filter(n => n.region === sp.region && n.id !== 0);
        const node = cands[rnd.int(0, cands.length - 1)];
        const s = W.site(rnd, node, 'camp', node.used);
        s.spec = id;
        node.sites.push(s);
      }
      for (const node of nodes) delete node.used;
      W.bosses(seed, nodes);
      W.villages(seed, nodes);
      W.markets(seed, nodes);
      W.forts(seed, nodes);

      // 起点和三处必经之地一开始就知道
      nodes[0].seen = 2;
      nodes[0].visited = 1;
      for (const node of nodes) if (node.kind === 'tower' || node.kind === 'lighthouse' || node.kind === 'dawn') node.seen = 1;
      return { nodes, edges };
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 城区网格：地块、边缘、连通。坐标 (x, y) 以格为单位，原点在左上。 */
(function (TC) {
  'use strict';

  const N = TC.GRID, SUB = TC.SUB, U = TC.util;
  const TILE_HP = [0, 100, 160, 260];

  const G = TC.grid = {
    TILE_HP,

    tile(S, x, y) { return U.inb(x, y) ? S.grid.t[y * N + x] : 0; },
    isDeck(S, x, y) { return U.inb(x, y) && S.grid.t[y * N + x] > 0; },

    /* 这一格能不能铺平台；返回 null 表示可以，否则是原因码 */
    canAddTile(S, x, y, extra) {
      if (!U.inb(x, y)) return 'oob';
      if (S.grid.t[y * N + x]) return 'occupied';
      const has = (ax, ay) => G.isDeck(S, ax, ay) || (extra && extra.has(ay * N + ax));
      if (!(has(x - 1, y) || has(x + 1, y) || has(x, y - 1) || has(x, y + 1))) return 'detached';
      return null;
    },

    setTile(S, C, x, y, t) {
      const i = y * N + x;
      S.grid.t[i] = t;
      S.grid.hp[i] = TILE_HP[t];
      G.rebuild(S, C);
    },

    /* 拆掉 (x, y) 这一格之后，剩下的平台是否还连成一片 */
    connectedWithout(S, x, y) {
      const t = S.grid.t, skip = y * N + x, seen = new Uint8Array(N * N), stack = [];
      let total = 0, start = -1;
      for (let i = 0; i < t.length; i++) if (t[i] && i !== skip) { total++; if (start < 0) start = i; }
      if (!total) return false;
      seen[start] = 1;
      stack.push(start);
      let n = 0;
      while (stack.length) {
        const i = stack.pop(), cx = i % N;
        n++;
        if (cx > 0 && t[i - 1] && i - 1 !== skip && !seen[i - 1]) { seen[i - 1] = 1; stack.push(i - 1); }
        if (cx < N - 1 && t[i + 1] && i + 1 !== skip && !seen[i + 1]) { seen[i + 1] = 1; stack.push(i + 1); }
        if (i >= N && t[i - N] && i - N !== skip && !seen[i - N]) { seen[i - N] = 1; stack.push(i - N); }
        if (i < N * (N - 1) && t[i + N] && i + N !== skip && !seen[i + N]) { seen[i + N] = 1; stack.push(i + N); }
      }
      return n === total;
    },

    /* 重建由地块推导出来的缓存：边缘格列表、包围盒、地块数 */
    rebuild(S, C) {
      const t = S.grid.t;
      const edge = [];
      let x0 = N, y0 = N, x1 = -1, y1 = -1, n = 0, steel = 0;
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const i = y * N + x;
          if (!t[i]) continue;
          n++;
          if (t[i] === 3) steel++;
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
          if (x === 0 || y === 0 || x === N - 1 || y === N - 1 || !t[i - 1] || !t[i + 1] || !t[i - N] || !t[i + N]) edge.push(i);
        }
      }
      if (!n) { x0 = x1 = y0 = y1 = N >> 1; }
      C.edge = edge;
      C.bbox = { x0, y0, x1, y1 };
      C.deckN = n;
      C.steelN = steel;
      C.dmgDirty = true;
      C.topoVer = (C.topoVer || 0) + 1;
    },

    /* 海面上一点到平台的最近距离的平方，只看周围 r 格以内；找不到返回 Infinity。
     * (px, py) 以 1/1024 格为单位。最近点的坐标留在 G.hit 里（避免每次都新建对象）。 */
    deckDist2(S, px, py, r) {
      const t = S.grid.t, tx = Math.floor(px / SUB), ty = Math.floor(py / SUB);
      const x0 = Math.max(0, tx - r), x1 = Math.min(N - 1, tx + r);
      const y0 = Math.max(0, ty - r), y1 = Math.min(N - 1, ty + r);
      let bd = Infinity;
      for (let y = y0; y <= y1; y++) {
        const row = y * N;
        const ey = py < y * SUB ? y * SUB : py > (y + 1) * SUB ? (y + 1) * SUB : py;
        const dy = py - ey;
        for (let x = x0; x <= x1; x++) {
          if (!t[row + x]) continue;
          const ex = px < x * SUB ? x * SUB : px > (x + 1) * SUB ? (x + 1) * SUB : px;
          const dx = px - ex;
          const d2 = dx * dx + dy * dy;
          if (d2 < bd) { bd = d2; G.hit.x = ex; G.hit.y = ey; G.hit.tx = x; G.hit.ty = y; }
        }
      }
      return bd;
    },
    hit: { x: 0, y: 0, tx: 0, ty: 0 },

    /* 同上，返回最近点 {x, y, tx, ty, d2}；周围 r 格内没有平台则返回 null */
    nearestDeck(S, px, py, r) {
      const d2 = G.deckDist2(S, px, py, r);
      return d2 === Infinity ? null : { x: G.hit.x, y: G.hit.y, tx: G.hit.tx, ty: G.hit.ty, d2 };
    },
  };
})(globalThis.TC = globalThis.TC || {});

</script>
<script>
/* 库存：全城共用一份物资，按类别有容量上限（上限来自物资堆、雨水桶等建筑）。 */
(function (TC) {
  'use strict';

  const St = TC.stock = {
    cap(C, res) { return C.caps[TC.data.res[res].cat]; },
    room(S, C, res) { return Math.max(0, St.cap(C, res) - (S.stock[res] || 0)); },

    /* 放进 n 份，放不下的丢掉；返回实际放进去的数量 */
    add(S, C, res, n) {
      const k = Math.min(n, St.room(S, C, res));
      if (k > 0) {
        S.stock[res] = (S.stock[res] || 0) + k;
        if (!S.seen[res]) S.seen[res] = 1;
      }
      return k;
    },

    has(S, cost) {
      for (const k in cost) if ((S.stock[k] || 0) < cost[k]) return false;
      return true;
    },

    pay(S, cost) { for (const k in cost) S.stock[k] -= cost[k]; },

    /* 退还造价的一部分（向下取整），不受容量限制，免得拆了东西材料凭空消失 */
    refund(S, cost, frac) {
      for (const k in cost) {
        const n = Math.floor(cost[k] * frac);
        if (n > 0) { S.stock[k] = (S.stock[k] || 0) + n; if (!S.seen[k]) S.seen[k] = 1; }
      }
    },

    /* 现有食物里最好的一种；没有吃的返回 null */
    bestFood(S) {
      const order = TC.data.foodOrder;
      for (let i = 0; i < order.length; i++) if ((S.stock[order[i]] || 0) > 0) return order[i];
      return null;
    },

    /* 所有食物折合成“够一个人吃几天”的总量 */
    foodDays(S) {
      let fill = 0;
      for (const k of TC.data.foodOrder) fill += (S.stock[k] || 0) * TC.data.res[k].food.fill;
      return fill / (TC.data.balance.needs.hunger * TC.DAY / TC.data.balance.needs.every);
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 建筑：放置规则、索引、建成、拆除、干活时站哪。
 * 建筑记录：{id, def, x, y, st:'site'|'on', work 已完成的建造量, on 是否启用,
 *            w 正在这里干活的居民 id（0 表示没人）, batch 这一批的状态（0 没有、1 要人干、2 放着等）, rec 这一批的配方,
 *            prog 这一批的进度, wait 放着等到哪一步, pin 指定的专人, prio 优先级（-1 低、0 中、1 高）} */
(function (TC) {
  'use strict';

  const N = TC.GRID, SUB = TC.SUB, U = TC.util;
  const NB = [[0, 1], [1, 0], [-1, 0], [0, -1]];   // 南、东、西、北（优先朝南，面向镜头）

  const Bld = TC.bld = {
    NB,

    def(b) { return TC.data.buildings[b.def]; },

    /* 重建由建筑推导出来的缓存：占格表、按编号查找、容量、床位、接雨的桶数 */
    reindex(S, C) {
      const occ = new Int32Array(N * N), byId = new Map(), siteAt = new Map();
      const caps = Object.assign({}, TC.data.balance.cap);
      const passive = [];
      const n = { helm: 0, sail: 0, engine: 0, dock: 0, watchtower: 0, radio: 0, lab: 0, divingrack: 0,
        bell: 0, harpoon: 0, breakwater: 0, infirmary: 0, windmill: 0, solar: 0, battery: 0, purifier: 0, searchlight: 0, tradepost: 0, wardock: 0 };   // 这几种建筑各有几座建成且启用的
      const cover = new Uint8Array(N * N);                    // 有防浪板护着的格子
      const capOpen = { mat: caps.mat, food: caps.food };     // 露天的仓储容量（风暴会冲走这部分里的东西）
      let beds = 0, rain = 0, beauty = 0;
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i], def = Bld.def(b);
        byId.set(b.id, b);
        if (def.place === 'water') { siteAt.set(b.y * N + b.x, b.id); continue; }
        occ[b.y * N + b.x] = b.id;
        if (b.st !== 'on') continue;
        if (b.on && n[b.def] !== undefined) n[b.def]++;
        if (def.cap) for (const k in def.cap) { caps[k] += def.cap[k]; if (!def.roofed && capOpen[k] !== undefined) capOpen[k] += def.cap[k]; }
        if (def.cover && b.on) {
          for (let dy = -def.cover; dy <= def.cover; dy++) for (let dx = -def.cover; dx <= def.cover; dx++) {
            if (U.inb(b.x + dx, b.y + dy)) cover[(b.y + dy) * N + b.x + dx] = 1;
          }
        }
        if (def.beds) beds += def.beds;
        if (def.rain && b.on) rain += def.rain;
        if (def.beauty) beauty += def.beauty;
        if (def.passive && b.on) passive.push(b);
      }
      // 城务技能“善藏”：材料、食物、淡水的容量按比例放大
      const more = 1 + TC.skill.val(S, 'store');
      for (const k of ['mat', 'food', 'water']) caps[k] = Math.round(caps[k] * more);
      for (const k in capOpen) capOpen[k] = Math.round(capOpen[k] * more);
      C.occ = occ;
      C.byId = byId;
      C.siteAt = siteAt;
      C.caps = caps;
      C.beds = beds;
      C.rain = rain;
      C.beauty = beauty;
      C.passive = passive;
      C.n = n;
      C.cover = cover;
      C.capOpen = capOpen;
      C.bver = (C.bver || 0) + 1;
    },

    at(C, x, y) { return U.inb(x, y) && C.occ[y * N + x] ? C.byId.get(C.occ[y * N + x]) : null; },

    /* 这一格的哪一侧是水（NB 的下标）；四面都不是水返回 -1 */
    waterSide(S, C, x, y) {
      for (let i = 0; i < 4; i++) {
        const ax = x + NB[i][0], ay = y + NB[i][1];
        if (!TC.grid.isDeck(S, ax, ay) && !(U.inb(ax, ay) && C.siteAt.has(ay * N + ax))) return i;
      }
      return -1;
    },

    /* 能不能在 (x, y) 放这种建筑；返回 null 表示可以，否则是原因码 */
    canPlace(S, C, defId, x, y) {
      const def = TC.data.buildings[defId];
      if (!def) return 'unknown';
      if (def.level > S.progress.level) return 'locked';
      if (def.tech && !TC.tech.has(S, def.tech)) return 'locked';
      if (!U.inb(x, y)) return 'oob';
      const i = y * N + x;
      if (def.place === 'water') {
        if (S.grid.t[i]) return 'occupied';
        if (C.siteAt.has(i)) return 'occupied';
        let near = false;
        for (let k = 0; k < 4 && !near; k++) {
          const ax = x + NB[k][0], ay = y + NB[k][1];
          near = TC.grid.isDeck(S, ax, ay) || (U.inb(ax, ay) && C.siteAt.has(ay * N + ax));
        }
        if (!near) return 'detached';
        if (TC.voyage.nearSite(S, x, y)) return 'site';
        if (C.deckN + C.siteAt.size >= TC.data.balance.levels.tiles[S.progress.level]) return 'limit';
        // 旁边要是有靠水吃饭的建筑（钓鱼台、渔网架），不能把它最后一面水堵死
        for (let k = 0; k < 4; k++) {
          const nb = Bld.at(C, x + NB[k][0], y + NB[k][1]);
          if (!nb || Bld.def(nb).place !== 'edge') continue;
          let open = 0;
          for (let j = 0; j < 4; j++) {
            const ax = nb.x + NB[j][0], ay = nb.y + NB[j][1];
            if (ax === x && ay === y) continue;
            if (!TC.grid.isDeck(S, ax, ay) && !(U.inb(ax, ay) && C.siteAt.has(ay * N + ax))) open++;
          }
          if (!open) return 'blocks';
        }
      } else {
        if (!S.grid.t[i]) return 'nodeck';
        if (C.occ[i]) return 'occupied';
        if (def.place === 'edge' && Bld.waterSide(S, C, x, y) < 0) return 'noedge';
      }
      if (!TC.stock.has(S, def.cost)) return 'cost';
      return null;
    },

    /* 下单：扣材料，生成工地 */
    place(S, C, defId, x, y, out) {
      const def = TC.data.buildings[defId];
      TC.stock.pay(S, def.cost);
      const b = { id: S.nextId++, def: defId, x, y, st: 'site', work: 0, on: 1, w: 0, batch: 0, rec: '', prog: 0, wait: 0, pin: 0, prio: 0 };
      S.buildings.push(b);
      Bld.reindex(S, C);
      C.jobsDirty = true;
      out.events.push({ t: 'placed', id: b.id, def: defId, x, y });
      return b;
    },

    /* 取消工地（全额退还）或拆除建筑（退一半） */
    remove(S, C, b, out) {
      const def = Bld.def(b);
      TC.stock.refund(S, def.cost, b.st === 'site' ? 1 : 0.5);
      if (b.batch) TC.stock.refund(S, TC.data.recipes[b.rec].in, 1);     // 做到一半的那一批，原料还回去
      S.buildings.splice(S.buildings.indexOf(b), 1);
      for (let i = 0; i < S.residents.length; i++) {
        const r = S.residents[i];
        if (r.home === b.id) r.home = 0;
        if (r.task && r.task.bid === b.id) r.task = null;
      }
      Bld.reindex(S, C);
      C.jobsDirty = true;
      out.events.push({ t: 'removed', id: b.id, def: b.def, x: b.x, y: b.y, site: b.st === 'site' });
    },

    /* 工地完工 */
    complete(S, C, b, out) {
      const def = Bld.def(b);
      if (def.tile) {
        // 平台地块：变成真正的地面，工地记录删掉
        S.buildings.splice(S.buildings.indexOf(b), 1);
        C.dmgDirty = true;
        S.grid.t[b.y * N + b.x] = def.tile;
        S.grid.hp[b.y * N + b.x] = TC.grid.TILE_HP[def.tile];
        TC.grid.rebuild(S, C);
        Bld.reindex(S, C);
        S.stats.tiles++;
        if (def.tile === 2) S.stats.pontoons++;
        // 正好漂在这一格上的东西，顺手捞上来
        const fs = S.sea.floaters;
        for (let i = fs.length - 1; i >= 0; i--) {
          if (TC.sea.blocked(S, fs[i].x, fs[i].y)) { TC.sea.release(S, fs[i]); TC.sea.collect(S, C, fs[i], out); fs.splice(i, 1); }
        }
      } else {
        b.st = 'on';
        b.work = 0;
        Bld.reindex(S, C);
        S.stats.built[b.def] = (S.stats.built[b.def] || 0) + 1;
      }
      C.jobsDirty = true;
      out.events.push({ t: 'built', id: b.id, def: b.def, x: b.x, y: b.y });
    },

    /* 给建筑干活（或盖它）的人该站在哪一格。(fx, fy) 是这个人现在的位置，挑最近的 */
    stand(S, C, b, fx, fy) {
      const def = Bld.def(b);
      if (def.stand === 'self' && def.place !== 'water' && b.st === 'on') return [b.x, b.y];
      let best = null, bd = 1e9, fall = null, fd = 1e9;
      for (let i = 0; i < 4; i++) {
        const ax = b.x + NB[i][0], ay = b.y + NB[i][1];
        if (!TC.grid.isDeck(S, ax, ay)) continue;
        const d = Math.abs(ax - fx) + Math.abs(ay - fy);
        if (!C.occ[ay * N + ax]) { if (d < bd) { bd = d; best = [ax, ay]; } }
        else if (d < fd) { fd = d; fall = [ax, ay]; }
      }
      if (best) return best;
      if (fall) return fall;
      return def.place === 'water' ? null : [b.x, b.y];
    },

    count(S, defId) {
      let n = 0;
      for (let i = 0; i < S.buildings.length; i++) if (S.buildings[i].def === defId && S.buildings[i].st === 'on') n++;
      return n;
    },

    /* 离 (x, y) 最近的、满足条件的已建成建筑 */
    nearest(S, x, y, pred) {
      let best = null, bd = 1e9;
      for (let i = 0; i < S.buildings.length; i++) {
        const b = S.buildings[i];
        if (b.st !== 'on' || !pred(Bld.def(b), b)) continue;
        const d = Math.abs(b.x - x) + Math.abs(b.y - y);
        if (d < bd) { bd = d; best = b; }
      }
      return best;
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 寻路：从目标格出发在平台上做一次广度优先搜索，得到“每一格离目标还有几步”的距离场。
 * 居民每走一步就挑一个离目标更近的邻格。距离场按目标缓存，地形变了才作废。
 * 城区最大 48×48，算一次只要几微秒，所以不需要更复杂的算法。 */
(function (TC) {
  'use strict';

  const N = TC.GRID;
  const QUEUE = new Int32Array(N * N);

  const P = TC.path = {
    field(S, C, gx, gy) {
      if (C.fieldVer !== C.topoVer) { C.fields = new Map(); C.fieldVer = C.topoVer; }
      const key = gy * N + gx;
      let f = C.fields.get(key);
      if (f) return f;
      if (C.fields.size > 160) C.fields.clear();
      f = new Int16Array(N * N).fill(-1);
      const t = S.grid.t;
      if (gx >= 0 && gy >= 0 && gx < N && gy < N && t[key]) {
        let head = 0, tail = 0;
        f[key] = 0;
        QUEUE[tail++] = key;
        while (head < tail) {
          const i = QUEUE[head++], d = f[i] + 1, x = i % N;
          if (x > 0 && t[i - 1] && f[i - 1] < 0) { f[i - 1] = d; QUEUE[tail++] = i - 1; }
          if (x < N - 1 && t[i + 1] && f[i + 1] < 0) { f[i + 1] = d; QUEUE[tail++] = i + 1; }
          if (i >= N && t[i - N] && f[i - N] < 0) { f[i - N] = d; QUEUE[tail++] = i - N; }
          if (i < N * (N - 1) && t[i + N] && f[i + N] < 0) { f[i + N] = d; QUEUE[tail++] = i + N; }
        }
      }
      C.fields.set(key, f);
      return f;
    },

    /* 从 (x, y) 走到 (gx, gy) 要几步；走不到返回 -1 */
    dist(S, C, x, y, gx, gy) {
      if (x < 0 || y < 0 || x >= N || y >= N) return -1;
      return P.field(S, C, gx, gy)[y * N + x];
    },

    /* 下一步该走到哪一格；已经到了或者走不到返回 null */
    next(S, C, x, y, gx, gy) {
      const f = P.field(S, C, gx, gy), i = y * N + x, d = f[i];
      if (d <= 0) return null;
      if (x < N - 1 && f[i + 1] === d - 1) return [x + 1, y];
      if (x > 0 && f[i - 1] === d - 1) return [x - 1, y];
      if (y < N - 1 && f[i + N] === d - 1) return [x, y + 1];
      if (y > 0 && f[i - N] === d - 1) return [x, y - 1];
      return null;
    },
  };
})(globalThis.TC = globalThis.TC || {});

<script>
/* 游戏状态：新开一局、状态自检。状态 S 是纯 JSON，可以直接存档。 */
(function (TC) {
  'use strict';

  const N = TC.GRID;

  TC.sim.newGame = function (seed, opts) {
    seed = seed >>> 0;
    const B = TC.data.balance;
    const S = {
      v: TC.SAVE_VERSION,
      seed,
      tick: 0,
      nextId: 1,
      opts: { diff: opts && TC.data.balance.diff[opts.diff] ? opts.diff : 'normal' },
      rng: TC.rng.seed(seed),
      // kind：clear 晴、cloudy 多云、rain 雨；wd/ws：风向（十六方位下标）和风力 0–3；cd/cs：海流方向和强度
      weather: { kind: 'clear', wd: 0, ws: 1, cd: 0, cs: 1, storm: null, heat: 0 },    // storm、heat 见 sys_world.js
      grid: { t: new Array(N * N).fill(0), hp: new Array(N * N).fill(0) },
      buildings: [],
      residents: [],
      stock: Object.assign({}, B.start.stock),
      seen: {},              // 见过的资源（顶栏只显示见过的）
      targets: {},           // 玩家调过的库存目标：资源 → 数量
      sea: {
        floaters: [],
        creatures: [],                               // 鲨鱼（见 sys_threats.js）
        surv: B.survivor.first,                      // 再过多少步（只算条件满足的时间）漂来下一个人
      },
      threat: { next: B.raid.from * TC.DAY, raid: null, boss: null, fleet: [], siege: null },   // 海盗（sys_threats.js）、正在打的 Boss（sys_boss.js）、出了港的战船和正在攻打的据点（sys_war.js）
      power: { e: 0, gen: 0, use: 0, lit: 0 },       // 电力（见 sys_power.js）
      alert: 0,                                      // 敲了钟：大家都进屋躲着
      chart: TC.worldgen.make(seed),                 // 海图：各个地点和它们之间的航线（每个地点自己记着那片海还剩多少物资）
      voyage: { at: 0, to: -1, dist: 0, done: 0, head: 0, flow: 0, legs: 0, since: 0, steer: -10, hold: 0, evs: [], ev: null },   // 见 sys_voyage.js
      // done：已完成的心愿 → 完成时的步数；gen：正在进行的可重复心愿；tech：研究（见 tech.js）
      progress: { level: 1, prosperity: 0, done: {}, gen: null, tech: { done: {}, cur: '', prog: 0 } },
      quests: {},                                    // 专家的个人心愿：专家 → {step 做到第几步, base 这一步开始时的数, done}
      story: { step: 0, flags: {}, ending: '', endAt: 0, log: [] },   // 主线（见 sys_story.js）
      skills: { pts: 0, got: 0, lv: {} },            // 技能点和城务技能（见 skills.js）
      factions: { tide: { rep: B.war.rep0 }, guild: { rep: B.war.rep0 } },      // 潮民和行商会的好感度（见 sys_war.js）
      post: null,                                    // 自家贸易站里行商留下的货（见 sys_market.js）；没有贸易站就是 null
      stats: { picked: 0, manual: 0, tiles: 0, pontoons: 0, built: {}, made: {}, batches: {}, eaten: 0, deaths: 0, left: 0, rescued: 0, boat: 0, dives: 0, specs: 0, trades: 0,
        storms: 0, tilesLost: 0, wrecked: 0, washed: 0, repaired: 0, sharks: 0, raids: 0, repelled: 0, paid: 0, stolen: 0, cured: 0,
        bosses: {}, bossTries: 0,        // bosses：打赢的 Boss → 打赢时的步数
        bought: 0, sold: 0, coinIn: 0, coinOut: 0,        // 在集市上买进、卖出了多少份，进出了多少旧币
        forts: 0, sieges: 0, gifts: 0 },                  // 拔掉了几处据点、攻打过几回、送出去多少份礼
      grief: -1000000,     // 上一次有人死去的步数（之后两天大家心情低落）
      over: null,          // 结束了就是 {tick, why}
    };
    for (const k in S.stock) if (S.stock[k] > 0) S.seen[k] = 1;
    S.weather.cd = TC.rng.int(S, 'weather', 0, 15);
    S.weather.wd = (S.weather.cd + TC.rng.int(S, 'weather', -2, 2) + 16) & 15;

    const c = N >> 1;
    for (let y = c - 1; y <= c + 1; y++) {
      for (let x = c - 1; x <= c + 1; x++) {
        S.grid.t[y * N + x] = TC.T_RAFT;
        S.grid.hp[y * N + x] = TC.grid.TILE_HP[TC.T_RAFT];
      }
    }
    const spots = [[c - 1, c], [c + 1, c], [c, c + 1], [c, c - 1], [c - 1, c - 1], [c + 1, c + 1]];
    for (let i = 0; i < B.start.pop; i++) TC.people.add(S, spots[i % spots.length][0], spots[i % spots.length][1]);
    const C = TC.sim.rebuild(S);
    TC.voyage.placeSites(S, C);
    TC.voyage.reveal(S, C);
    TC.sea.seed(S, C);
    return S;
  };

  /* 状态自检：返回问题列表，空数组表示没问题。读档和乱点测试都用它。 */
  TC.sim.validate = function (S) {
    const bad = [];
    const int = v => typeof v === 'number' && Number.isInteger(v);
    const fin = v => typeof v === 'number' && Number.isFinite(v);
    if (!S || typeof S !== 'object') return ['状态不是对象'];
    if (!int(S.tick) || S.tick < 0) bad.push('tick 非法');
    if (!int(S.nextId) || S.nextId < 1) bad.push('nextId 非法');
    if (!S.rng) bad.push('缺少随机流');
    else for (const st of TC.rng.STREAMS) if (!int(S.rng[st])) bad.push('随机流 ' + st + ' 非法');
    if (!S.grid || !Array.isArray(S.grid.t) || S.grid.t.length !== N * N) return bad.concat('网格大小不对');
    if (!S.weather || !S.progress || !S.stats || !S.seen || !S.targets) return bad.concat('缺少天气、进度、统计或库存目标');
    if (!S.chart || !Array.isArray(S.chart.nodes) || !Array.isArray(S.chart.edges) || !S.voyage || !S.progress.tech || !S.quests) return bad.concat('缺少海图、航行或研究的记录');
    const V = S.voyage;
    if (!int(V.at) || !S.chart.nodes[V.at]) bad.push('所在的地点非法');
    if (!int(V.to) || (V.to >= 0 && TC.voyage.dist(S, V.at, V.to) < 0)) bad.push('航行的目的地非法');
    if (!fin(V.done) || !fin(V.dist) || !int(V.legs) || !int(V.hold) || !int(V.flow) || !Array.isArray(V.evs)) bad.push('航行进度非法');
    if (V.ev && !TC.data.events[V.ev.id]) bad.push('途中的事件非法');
    if (!S.threat || !S.power || !Array.isArray(S.sea.creatures)) return bad.concat('缺少威胁或电力的记录');
    if (!int(S.threat.next) || !int(S.power.e) || S.power.e < 0) bad.push('海盗的时间或蓄电量非法');
    for (const c of S.sea.creatures) if (!int(c.x) || !int(c.y) || !int(c.hp)) { bad.push('海里的东西位置非法'); break; }
    const raid = S.threat.raid;
    if (raid) {
      if (!['warn', 'ask', 'fight'].includes(raid.ph) || !int(raid.at) || !Array.isArray(raid.boats)) bad.push('海盗的状态非法');
      else for (const b of raid.boats) if (!int(b.x) || !int(b.y) || !int(b.hp)) { bad.push('海盗船位置非法'); break; }
    }
    const boss = S.threat.boss;
    if (boss && (!TC.data.bosses[boss.id] || !int(boss.x) || !int(boss.y) || !int(boss.hp) || !int(boss.until) || !int(boss.cd) || !fin(boss.p) || !fin(boss.tp))) bad.push('Boss 的状态非法');
    const sk = S.skills;
    if (!sk || !int(sk.pts) || sk.pts < 0 || !int(sk.got) || !sk.lv) bad.push('技能点非法');
    else {
      let spent = 0;
      for (const k in sk.lv) {
        if (!TC.data.skills[k] || !int(sk.lv[k]) || sk.lv[k] < 0 || sk.lv[k] > TC.data.balance.skill.max) bad.push('技能 ' + k + ' 非法');
        else spent += sk.lv[k];
      }
      if (spent + sk.pts !== sk.got) bad.push('技能点的账对不上');
    }
    if (!S.factions) bad.push('缺少势力的记录');
    else for (const id of TC.data.factionOrder) {
      const f = S.factions[id];
      if (!f || !int(f.rep) || f.rep < 0 || f.rep > TC.data.balance.war.max) bad.push('势力 ' + id + ' 的好感度非法');
    }
    if (!Array.isArray(S.threat.fleet)) bad.push('缺少战船的记录');
    else for (const f of S.threat.fleet) if (!int(f.x) || !int(f.y) || !int(f.hp) || (f.kind !== 'war' && f.kind !== 'ally')) { bad.push('战船的状态非法'); break; }
    const sg = S.threat.siege;
    if (sg && (!int(sg.hp) || !int(sg.until) || !Array.isArray(sg.boats) || sg.boats.some(x => !int(x.x) || !int(x.y) || !int(x.hp)))) bad.push('攻打据点的状态非法');
    if (!int(S.stats.forts) || !int(S.stats.sieges) || !int(S.stats.gifts)) bad.push('军事的统计非法');
    if (S.post && (S.post.kind !== 'post' || !S.post.goods || !int(S.post.purse) || !int(S.post.next))) bad.push('贸易站的状态非法');
    if (!int(S.stats.bought) || !int(S.stats.sold) || !int(S.stats.coinIn) || !int(S.stats.coinOut)) bad.push('买卖的统计非法');
    if (!S.stats.bosses) bad.push('缺少 Boss 的记录');
    else for (const k in S.stats.bosses) if (!TC.data.bosses[k]) bad.push('未知的 Boss ' + k);
    const st = S.weather.storm;
    if (st && (!int(st.at) || !int(st.end) || st.end <= st.at || !(st.sev >= 1 && st.sev <= 3))) bad.push('风暴的时间非法');
    if (!TC.data.balance.diff[S.opts.diff]) bad.push('难度非法');
    if (!S.story || !Number.isInteger(S.story.step) || S.story.step < 0 || S.story.step > TC.data.story.steps.length || !S.story.flags || !Array.isArray(S.story.log)) bad.push('主线进度非法');
    else if (S.story.ending && !TC.data.story.endings[S.story.ending]) bad.push('未知的结局');
    for (const k in S.progress.tech.done) if (!TC.data.tech[k]) bad.push('未知技术 ' + k);
    if (S.progress.tech.cur && !TC.data.tech[S.progress.tech.cur]) bad.push('正在研究一项不存在的技术');
    for (const n of S.chart.nodes) {
      if (!TC.data.world.kinds[n.kind] || !Array.isArray(n.sites)) { bad.push('地点 ' + n.id + ' 非法'); continue; }
      for (const k in n.budget) if (!int(n.budget[k]) || n.budget[k] < 0) bad.push(n.name + ' 的储量 ' + k + ' 非法');
      for (const s of n.sites) {
        if (!TC.data.world.sites[s.kind] || !int(s.x) || !int(s.y) || !int(s.surv) || s.surv < 0) { bad.push(n.name + ' 的去处非法'); continue; }
        for (const k in s.left) if (!int(s.left[k]) || s.left[k] < 0) bad.push(n.name + ' 的去处存量非法');
        for (const k in s.deep || {}) if (!int(s.deep[k]) || s.deep[k] < 0) bad.push(n.name + ' 的去处存量非法');
        if (s.spec && !TC.data.specs[s.spec]) bad.push('未知专家 ' + s.spec);
        if (s.market) {
          const m = s.market;
          if (!TC.data.market.kinds[m.kind] || !m.goods || !m.max || !int(m.purse) || m.purse < 0 || !int(m.day)) bad.push(n.name + ' 的集市非法');
          else for (const k in m.goods) if (!TC.data.market.base[k] || !int(m.goods[k]) || m.goods[k] < 0) bad.push(n.name + ' 的集市存货非法');
        }
        if (s.kind === 'fort' && (!int(s.hp) || s.hp < 0 || !int(s.max) || !s.loot)) bad.push(n.name + ' 的据点非法');
        if (s.kind === 'boss' && (!TC.data.bosses[s.boss] || !int(s.hp) || s.hp < 0 || !s.loot)) bad.push(n.name + ' 的 Boss 非法');
      }
    }
    if (!int(S.progress.level) || S.progress.level < 1 || S.progress.level >= TC.data.balance.levels.need.length) bad.push('城镇等级非法');

    if (!S.stock) bad.push('缺少库存');
    else for (const k in S.stock) {
      if (!TC.data.res[k]) bad.push('未知资源 ' + k);
      else if (!int(S.stock[k]) || S.stock[k] < 0) bad.push('库存 ' + k + ' 非法：' + S.stock[k]);
    }

    for (let i = 0; i < S.grid.t.length; i++) {
      const t = S.grid.t[i], hp = S.grid.hp[i];
      if (t ? !(hp >= 1 && hp <= TC.grid.TILE_HP[t]) : hp !== 0) { bad.push('第 ' + i + ' 格平台的结实程度不对：' + hp); break; }
    }
    if (!S.sea || !Array.isArray(S.sea.floaters)) bad.push('缺少海面');
    else {
      if (!int(S.sea.surv)) bad.push('漂流者计时非法');
      for (const f of S.sea.floaters) {
        if (!int(f.id) || !int(f.x) || !int(f.y)) { bad.push('漂浮物位置非法'); break; }
        if (!TC.data.floaters[f.kind]) { bad.push('未知漂浮物 ' + f.kind); break; }
      }
    }

    if (!Array.isArray(S.buildings)) bad.push('缺少建筑表');
    else {
      const seen = new Set();
      for (const b of S.buildings) {
        const def = TC.data.buildings[b.def];
        if (!def) { bad.push('未知建筑 ' + b.def); continue; }
        if (!int(b.id) || !int(b.x) || !int(b.y) || !TC.util.inb(b.x, b.y)) { bad.push('建筑位置非法'); continue; }
        if (!fin(b.work) || !fin(b.prog)) bad.push('建筑进度非法');
        if (b.batch && !TC.data.recipes[b.rec]) bad.push(def.name + ' 在做一个不存在的配方');
        const i = b.y * N + b.x;
        if (def.place === 'water' ? S.grid.t[i] !== 0 : S.grid.t[i] === 0) bad.push(def.name + ' 的位置和地形不符');
        if (seen.has(i)) bad.push('两座建筑叠在同一格');
        seen.add(i);
      }
    }

    if (!Array.isArray(S.residents)) bad.push('缺少居民表');
    else for (const r of S.residents) {
      if (!int(r.id) || !int(r.x) || !int(r.y)) { bad.push('居民位置非法'); continue; }
      if (!TC.util.inb(r.x, r.y) || !S.grid.t[r.y * N + r.x]) bad.push(r.name + ' 没站在平台上');
      if (!Array.isArray(r.tr) || r.tr.some(t => !TC.data.traits[t])) bad.push(r.name + ' 的特质非法');
      if (!Array.isArray(r.diet)) bad.push(r.name + ' 缺少饮食记录');
      if (r.spec && !TC.data.specs[r.spec]) bad.push(r.name + ' 的专长非法');
      if (!int(r.sick) || r.sick < 0) bad.push(r.name + ' 的病情非法');
      for (const k of ['hunger', 'thirst', 'rest', 'mood', 'health']) {
        if (!fin(r[k]) || r[k] < 0 || r[k] > 10000) bad.push(r.name + ' 的 ' + k + ' 非法：' + r[k]);
      }
    }
    return bad;
  };
})(globalThis.TC = globalThis.TC || {});

//# sourceURL=tc/sim/state.js
</script>
<script>
/* 命令：界面和脚本玩家改动模拟的唯一入口。
 * 每条命令先 check（返回 null 表示合法，否则是原因码），合法才 apply。
 *   {type:'hook', id}                 点名打捞一个漂浮物
 *   {type:'build', def, x, y}         下单造一座建筑（包括铺一格平台）
 *   {type:'buildTiles', tiles:[[x,y]…]}  一次铺多格木筏板
 *   {type:'cancel', id}               取消工地（全额退还）或拆除建筑（退一半）
 *   {type:'setOn', id, on}            启用或停用一座建筑
 *   {type:'setPin', id, rid}          给建筑指定专人（rid 为 0 表示不指定）
 *   {type:'setPrio', id, prio}        调整建筑的优先级：-1 低、0 中、1 高
 *   {type:'setTarget', res, n}        调整某种加工品的库存目标
 *   {type:'removeTile', x, y}         拆掉一格平台（退一半材料）
 *   {type:'sail', to}                 起航，驶向相邻的地点
 *   {type:'choose', opt}              航行途中遇到的事，选第几个办法
 *   {type:'siteOrder', sid, on}       要不要派小船去某个去处
 *   {type:'research', tech}           开始研究一项技术（先付旧世界资料）
 *   {type:'trade', sid, deal}         和商船做一笔买卖
 *   {type:'alert', on}                敲钟让大家进屋躲避 / 解除
 *   {type:'raidAnswer', pay}          回海盗的话：给（1）还是不给（0）
 *   {type:'story'}                    做主线里要玩家动手的那一步（修电台、送补给）
 *   {type:'ending', id}               到了拂晓，选一种结局
 *   {type:'skill', id}                花 1 点技能点，把一项城务技能升一级
 *   {type:'boss', sid}                把潜伏在这个地点的 Boss 引出来开打
 *   {type:'buy', sid, res, n}         在集市上买进 n 份（sid 为 -1 指自家的贸易站）
 *   {type:'sell', sid, res, n}        在集市上卖出 n 份
 *   {type:'gift', id, res, n}         给一家势力送礼（要停在他们的地方；res 可以是 coin）
 *   {type:'assault', sid}             派战船攻打这个地点的海盗据点 */
(function (TC) {
  'use strict';

  const N = TC.GRID;

  const CMD = TC.commands = {
    hook: {
      check(S, C, c) {
        const f = TC.sea.byId(S, c.id);
        if (!f) return 'gone';
        if (f.claim || f.tag) return 'claimed';
        if (!TC.sea.inReach(S, f, C)) return 'far';
        return null;
      },
      apply(S, C, c, out) {
        TC.sea.byId(S, c.id).tag = 1;     // 由任务系统派最近的居民去钩
      },
    },

    build: {
      check(S, C, c) { return TC.bld.canPlace(S, C, c.def, c.x | 0, c.y | 0); },
      apply(S, C, c, out) { TC.bld.place(S, C, c.def, c.x | 0, c.y | 0, out); },
    },

    buildTiles: {
      check(S, C, c) {
        if (!Array.isArray(c.tiles) || !c.tiles.length || c.tiles.length > 64) return 'empty';
        const def = TC.data.buildings.raft, U = TC.util;
        for (const k in def.cost) if ((S.stock[k] || 0) < def.cost[k] * c.tiles.length) return 'cost';
        if (C.deckN + C.siteAt.size + c.tiles.length > TC.data.balance.levels.tiles[S.progress.level]) return 'limit';
        const added = new Set();
        for (let i = 0; i < c.tiles.length; i++) {
          const x = c.tiles[i][0], y = c.tiles[i][1];
          if (!Number.isInteger(x) || !Number.isInteger(y) || !U.inb(x, y)) return 'oob';
          const idx = y * N + x;
          if (S.grid.t[idx] || C.siteAt.has(idx) || added.has(idx)) return 'occupied';
          let near = false;
          for (let k = 0; k < 4 && !near; k++) {
            const ax = x + TC.bld.NB[k][0], ay = y + TC.bld.NB[k][1];
            if (!U.inb(ax, ay)) continue;
            near = S.grid.t[ay * N + ax] > 0 || C.siteAt.has(ay * N + ax) || added.has(ay * N + ax);
          }
          if (!near) return 'detached';
          added.add(idx);
        }
        // 逐格再按完整的规则查一遍（上限、会不会堵死钓鱼台的水面）；挨着本次别的格子的那种“不相邻”不算数
        for (let i = 0; i < c.tiles.length; i++) {
          const why = TC.bld.canPlace(S, C, 'raft', c.tiles[i][0], c.tiles[i][1]);
          if (why && why !== 'detached') return why;
        }
        return null;
      },
      apply(S, C, c, out) {
        for (let i = 0; i < c.tiles.length; i++) TC.bld.place(S, C, 'raft', c.tiles[i][0], c.tiles[i][1], out);
      },
    },

    cancel: {
      check(S, C, c) { return C.byId.has(c.id) ? null : 'gone'; },
      apply(S, C, c, out) { TC.bld.remove(S, C, C.byId.get(c.id), out); },
    },

    setOn: {
      check(S, C, c) {
        const b = C.byId.get(c.id);
        return b && b.st === 'on' ? null : 'gone';
      },
      apply(S, C, c, out) {
        const b = C.byId.get(c.id);
        b.on = c.on ? 1 : 0;
        if (!b.on && b.w) {
          const r = TC.people.byId(S, b.w);
          if (r) r.task = null;
          b.w = 0;
        }
        TC.bld.reindex(S, C);
        C.jobsDirty = true;
      },
    },
  };

  CMD.setPin = {
    check(S, C, c) {
      const b = C.byId.get(c.id);
      if (!b || !(TC.bld.def(b).recipes || TC.bld.def(b).duty || TC.bld.def(b).boat)) return 'gone';
      if (c.rid && !TC.people.byId(S, c.rid)) return 'gone';
      return null;
    },
    apply(S, C, c, out) {
      const b = C.byId.get(c.id);
      if (c.rid) for (const o of S.buildings) if (o.pin === c.rid) o.pin = 0;     // 一个人只守一处
      b.pin = c.rid || 0;
      if (b.w && b.pin && b.w !== b.pin) {
        const r = TC.people.byId(S, b.w);                                       // 正在这儿干活的不是专人：让位
        if (r) TC.jobs.release(S, C, r);
      }
      C.jobsDirty = true;
    },
  };

  CMD.setPrio = {
    check(S, C, c) { return !C.byId.has(c.id) ? 'gone' : c.prio === -1 || c.prio === 0 || c.prio === 1 ? null : 'bad'; },
    apply(S, C, c, out) { C.byId.get(c.id).prio = c.prio; C.jobsDirty = true; },
  };

  CMD.setTarget = {
    check(S, C, c) {
      if (!Number.isInteger(c.n) || c.n < 0 || c.n > 300) return 'bad';
      for (const id in TC.data.recipes) {
        const rec = TC.data.recipes[id];
        if (rec.keepN !== undefined && rec.out[c.res] !== undefined) return null;
      }
      return 'bad';
    },
    apply(S, C, c, out) { S.targets[c.res] = c.n; C.jobsDirty = true; },
  };

  CMD.removeTile = {
    check(S, C, c) {
      const x = c.x | 0, y = c.y | 0, i = y * N + x;
      if (!TC.util.inb(x, y) || !S.grid.t[i]) return 'nodeck';
      if (C.occ[i]) return 'occupied';
      if (C.deckN <= 1) return 'last';
      for (const r of S.residents) {
        if (r.x === x && r.y === y) return 'busy';                                              // 有人站在上面
        if (r.px === x && r.py === y && r.mn && S.tick < r.mt + r.mn) return 'busy';             // 有人正从这格走开
      }
      for (const d of TC.bld.NB) {
        const ax = x + d[0], ay = y + d[1];
        if (TC.util.inb(ax, ay) && C.siteAt.has(ay * N + ax)) return 'busy';                    // 旁边有等着盖的平台
      }
      if (!TC.grid.connectedWithout(S, x, y)) return 'split';
      return null;
    },
    apply(S, C, c, out) {
      const x = c.x | 0, y = c.y | 0, i = y * N + x, kind = S.grid.t[i];
      for (const id in TC.data.buildings) {
        const def = TC.data.buildings[id];
        if (def.tile === kind) TC.stock.refund(S, def.cost, 0.5);
      }
      S.grid.t[i] = 0;
      S.grid.hp[i] = 0;
      TC.grid.rebuild(S, C);
      TC.bld.reindex(S, C);
      C.jobsDirty = true;
      out.events.push({ t: 'untile', x, y });
    },
  };

  CMD.sail = {
    check(S, C, c) {
      if (TC.voyage.sailing(S)) return 'sailing';
      if (!C.n.helm) return 'nohelm';
      if (!Number.isInteger(c.to) || TC.voyage.dist(S, S.voyage.at, c.to) < 0) return 'notnear';
      for (const r of S.residents) if (r.task && r.task.k === 'boat' && r.task.ph > 0) return 'boats';      // 小船还在外面
      return null;
    },
    apply(S, C, c, out) {
      for (const r of S.residents) if (r.task && r.task.k === 'boat') TC.jobs.release(S, C, r);          // 正往船坞走的：不去了
      TC.voyage.depart(S, C, c.to, out);
    },
  };

  CMD.choose = {
    check(S, C, c) {
      if (!S.voyage.ev) return 'gone';
      return Number.isInteger(c.opt) && TC.data.events[S.voyage.ev.id].opts[c.opt] ? null : 'bad';
    },
    apply(S, C, c, out) { TC.voyage.choose(S, C, c.opt, out); },
  };

  CMD.siteOrder = {
    check(S, C, c) { return TC.voyage.site(S, c.sid) ? null : 'gone'; },
    apply(S, C, c, out) { TC.voyage.site(S, c.sid).order = c.on ? 1 : 0; C.jobsDirty = true; },
  };

  CMD.research = {
    check(S, C, c) { return TC.tech.can(S, C, c.tech); },
    apply(S, C, c, out) {
      const T = S.progress.tech;
      S.stock.data -= TC.data.tech[c.tech].cost;
      T.cur = c.tech;
      T.prog = 0;
      C.jobsDirty = true;
    },
  };

  CMD.trade = {
    check(S, C, c) { return TC.voyage.canTrade(S, C, TC.voyage.site(S, c.sid), c.deal); },
    apply(S, C, c, out) {
      const d = TC.voyage.site(S, c.sid).deals[c.deal], got = {};
      TC.stock.pay(S, d.give);
      for (const k in d.get) got[k] = TC.stock.add(S, C, k, d.get[k]);
      d.left--;
      S.stats.trades++;
      TC.faction.add(S, 'guild', TC.data.balance.war.barter, out);
      C.jobsDirty = true;
      out.events.push({ t: 'trade', give: d.give, got });
    },
  };

  CMD.alert = {
    check(S, C, c) { return c.on && !C.n.bell ? 'nobell' : null; },
    apply(S, C, c, out) {
      S.alert = c.on ? 1 : 0;
      C.jobsDirty = true;
      out.events.push({ t: 'alert', on: S.alert });
    },
  };

  CMD.raidAnswer = {
    check(S, C, c) { const r = S.threat.raid; return r && r.ph === 'ask' ? null : 'gone'; },
    apply(S, C, c, out) { TC.threat.answer(S, C, !!c.pay, out); },
  };

  CMD.story = {
    check(S, C, c) {
      const s = TC.story.cur(S);
      if (s && s.act && s.act.ending) return 'gone';              // 结局要用 ending 命令选
      return TC.story.canAct(S, C);
    },
    apply(S, C, c, out) {
      const s = TC.story.cur(S);
      if (s.act.cost) TC.stock.pay(S, s.act.cost);
      TC.story.advance(S, C, s, out);
    },
  };

  CMD.ending = {
    check(S, C, c) {
      const s = TC.story.cur(S), e = TC.data.story.endings[c.id];
      if (!s || !s.act || !s.act.ending || !e) return 'gone';
      if (TC.story.canAct(S, C)) return 'where';
      return e.ok(S, C) ? 'need' : null;
    },
    apply(S, C, c, out) { TC.story.end(S, C, c.id, out); },
  };

  CMD.skill = {
    check(S, C, c) { return TC.skill.can(S, c.id); },
    apply(S, C, c, out) { TC.skill.learn(S, C, c.id, out); },
  };

  CMD.buy = {
    check(S, C, c) { return TC.market.canBuy(S, C, c.sid, c.res, c.n); },
    apply(S, C, c, out) { TC.market.buy(S, C, c.sid, c.res, c.n, out); },
  };

  CMD.sell = {
    check(S, C, c) { return TC.market.canSell(S, C, c.sid, c.res, c.n); },
    apply(S, C, c, out) { TC.market.sell(S, C, c.sid, c.res, c.n, out); },
  };

  CMD.gift = {
    check(S, C, c) { return TC.faction.canGift(S, C, c.id, c.res, c.n); },
    apply(S, C, c, out) { TC.faction.gift(S, C, c.id, c.res, c.n, out); },
  };

  CMD.assault = {
    check(S, C, c) { return TC.war.canAssault(S, C, c.sid); },
    apply(S, C, c, out) { TC.war.assault(S, C, c.sid, out); },
  };

  CMD.boss = {
    check(S, C, c) { return TC.boss.can(S, C, c.sid); },
    apply(S, C, c, out) { TC.boss.challenge(S, C, c.sid, out); },
  };

  TC.sim.check = function (S, C, c) {
    if (S.over) return 'over';
    const def = c && CMD[c.type];
    return def ? def.check(S, C, c) : 'unknown';
  };

  TC.sim.applyCommands = function (S, C, cmds, out) {
    for (let i = 0; i < cmds.length; i++) {
      const c = cmds[i];
      const why = TC.sim.check(S, C, c);
      if (why) { out.events.push({ t: 'reject', cmd: c && c.type, why }); continue; }
      CMD[c.type].apply(S, C, c, out);
    }
  };
})(globalThis.TC = globalThis.TC || {});
